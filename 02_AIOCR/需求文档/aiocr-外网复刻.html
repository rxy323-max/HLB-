<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credios — AIOCR Documents (外网复刻)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --blue:#2563eb; --blue-d:#1d4ed8; --blue-l:#e8f0fe;
  --bg:#eef0f3; --card:#ffffff; --bd:#e5e7eb; --bd2:#eceef1;
  --tx:#1f2937; --mut:#6b7280; --lt:#9ca3af;
  --green:#16a34a; --amber:#d97706; --red:#dc2626;
}
body{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:13px;}
svg{width:15px;height:15px;flex-shrink:0;vertical-align:-2px;}
button{font-family:inherit;cursor:pointer;}
.btn svg{width:15px;height:15px;}
.btn{border:1px solid var(--bd);background:#fff;color:var(--tx);border-radius:6px;padding:7px 14px;font-size:13px;}
.btn:hover{background:#f8f9fa;}
.btn-pri{background:var(--blue);color:#fff;border-color:var(--blue);}
.btn-pri:hover{background:var(--blue-d);}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:5px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:4px;background:#eef1f4;color:#4b5563;font-weight:600;letter-spacing:.3px;}
.pill-appr{background:#eef1f4;color:#4b5563;}
.req{color:var(--red);}
.muted{color:var(--mut);}
.dot-g{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);}
.dot-r{display:inline-block;width:7px;height:7px;border-radius:50%;background:#e23b3b;}
a.lnk{color:var(--blue);cursor:pointer;text-decoration:none;}
a.lnk:hover{text-decoration:underline;}

/* ── Global chrome ── */
.shell{display:flex;height:100vh;overflow:hidden;}
.rail{width:48px;background:#fff;border-right:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:4px;flex-shrink:0;}
.rail-logo{width:30px;height:30px;border-radius:6px;background:#ed1c24;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;margin-bottom:8px;}
.rail-ic{width:34px;height:34px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#8b94a3;}
.rail-ic:hover{background:#f1f3f5;color:var(--blue);}
.rail-ic svg{width:18px;height:18px;}
.rail-foot{margin-top:auto;margin-bottom:10px;width:30px;height:30px;border-radius:50%;background:#f1f3f5;display:flex;align-items:center;justify-content:center;color:#8b94a3;font-size:10px;}

.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{height:42px;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:flex-end;padding:0 14px;gap:4px;flex-shrink:0;}
.toptab{padding:8px 16px;font-size:13px;color:var(--mut);border-radius:6px 6px 0 0;cursor:pointer;}
.toptab.active{color:var(--blue);background:#eaf1fe;font-weight:600;}

.body{flex:1;display:grid;grid-template-columns:236px 1fr 304px;gap:14px;padding:14px;overflow:hidden;}
.col{overflow:auto;}

/* ── Left nav ── */
.nav{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:8px;height:100%;}
.nav-hd{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:8px 8px 12px;}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;font-size:13px;color:#374151;cursor:pointer;}
.nav-item:hover{background:#f5f7f9;}
.nav-item.active{background:var(--blue-l);color:var(--blue);font-weight:600;}
.nav-item.dis{color:#c2c8d0;cursor:default;}
.nav-sub{padding-left:18px;}
.nav-sub .nav-item{font-size:12.5px;padding:6px 10px;color:#5b6470;}
.nav-grp{font-size:11px;color:var(--lt);text-transform:uppercase;letter-spacing:.5px;padding:12px 10px 4px;font-weight:700;}
.ck{color:var(--green);display:inline-flex;margin-left:auto;}
.ck svg{width:15px;height:15px;}

/* ── Center cards ── */
.card{background:#fff;border:1px solid var(--bd);border-radius:8px;margin-bottom:14px;}
.card-hd{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--bd2);font-weight:700;font-size:14px;}
.card-bd{padding:18px;}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 24px;}
.kv2{display:grid;grid-template-columns:1fr 1fr;gap:20px 28px;}
.kv-item label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px;}
.kv-item .v{font-size:14px;color:#111827;font-weight:500;}
.kv-item .v.big{font-weight:600;}
.divider{height:1px;background:var(--bd2);margin:4px 0 16px;}

/* ── Right column ── */
.qa-hd{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;padding:14px 16px 12px;}
.memo{background:#fff8e1;border:1px solid #ffe6a0;border-radius:7px;padding:10px 12px;font-size:12px;line-height:1.6;color:#5b4a17;}
.memo .who{font-weight:600;color:#7a6516;}
.sum-row{display:flex;justify-content:space-between;font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--bd2);gap:10px;}
.sum-row label{color:var(--mut);}
.sum-row .v{font-weight:600;color:#111827;text-align:right;}

/* ── floating proceed ── */
.proceed{position:absolute;right:330px;bottom:24px;}

/* ── Overlay / modal ── */
.ov{position:fixed;inset:0;background:rgba(17,24,39,.45);display:flex;z-index:50;}
.ov-full{padding:18px;}
.docs{background:#fff;border-radius:10px;flex:1;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.docs-tabs{display:flex;align-items:center;border-bottom:1px solid var(--bd);padding:0 8px;}
.docs-tab{padding:14px 18px;font-size:14px;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;}
.docs-tab.active{color:var(--blue);font-weight:700;border-bottom-color:var(--blue);}
.docs-x{margin-left:auto;width:34px;height:34px;border:none;background:none;color:var(--mut);font-size:18px;border-radius:6px;}
.docs-x:hover{background:#f1f3f5;}
.docs-bd{padding:16px 18px;overflow:auto;flex:1;}

/* ── Upload area ── */
.up-wrap{background:#f7f8fa;border:1px solid var(--bd);border-radius:8px;padding:12px;}
.up-hd{font-size:13px;font-weight:700;margin-bottom:10px;}
.up-hd span{font-weight:400;color:var(--mut);font-size:12px;margin-left:8px;}
.up-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
.up-box{border:1px dashed #cfd5dd;border-radius:8px;background:#fff;padding:12px 10px;text-align:center;min-height:118px;display:flex;flex-direction:column;}
.up-cat{font-size:12.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px;margin-bottom:8px;color:#374151;}
.up-cat .i{color:var(--lt);}
.up-ic{color:#c7ccd4;margin:4px auto 8px;}
.up-ic svg{width:26px;height:26px;}
.up-act{font-size:12px;color:#374151;margin-bottom:4px;}
.up-act a{color:var(--blue);}
.up-hint{font-size:10.5px;color:var(--lt);line-height:1.4;margin-top:auto;}
.up-other{border:1.5px dashed #f0c14b;background:#fffdf3;border-radius:8px;padding:18px;text-align:center;margin-top:10px;}
.up-other .ttl{font-size:13px;font-weight:600;margin-bottom:8px;color:#374151;display:flex;gap:6px;justify-content:flex-start;}
.up-other .warn{color:#e0a107;}

/* ── Issue 1: OCR Processing banner + stage pills ── */
.ocr-banner{display:flex;align-items:flex-start;gap:12px;background:#f0f4ff;border:1px solid #c5d3f6;border-radius:8px;padding:12px 16px;margin-bottom:14px;}
.ocr-banner-icon{font-size:20px;flex-shrink:0;margin-top:1px;}
.ocr-banner-body{flex:1;}
.ocr-banner-title{font-size:13px;font-weight:700;color:#1e3a8a;margin-bottom:3px;}
.ocr-banner-sub{font-size:12px;color:#3b5bdb;line-height:1.6;}
.ocr-banner-hint{font-size:11.5px;color:#5b6470;margin-top:4px;line-height:1.5;}
.ocr-pipeline{display:flex;align-items:center;gap:0;margin-top:8px;}
.ocr-stage{display:flex;align-items:center;gap:5px;font-size:11px;padding:3px 10px;border-radius:4px;}
.ocr-stage.done{background:#e6f4ea;color:#1a7a43;}
.ocr-stage.active{background:#e8f0fe;color:#1d4ed8;font-weight:700;}
.ocr-stage.pend{background:#f1f3f5;color:#9aa1ab;}
.ocr-stage-arrow{color:#c5d3f6;font-size:13px;padding:0 2px;}
/* per-row status stages */
.stage-pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:3px 9px;border-radius:5px;white-space:nowrap;}
.sp-queued{background:#f1f3f5;color:#6b7280;}
.sp-extracting{background:#e8f0fe;color:#1d4ed8;}
.sp-validating{background:#fef9ec;color:#b45309;}
.sp-complete{background:#e6f4ea;color:#1a7a43;}
.sp-failed{background:#fdeceb;color:#c0392b;}
.sp-spin{display:inline-block;animation:spin 1.2s linear infinite;font-size:11px;}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

/* ── Issue 2: Semantic status chips with icons ── */
.status-chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:3px 9px;border-radius:5px;font-weight:500;}
.sc-blue{background:#e8f0fe;color:#1d4ed8;}    /* processing */
.sc-green{background:#e6f4ea;color:#1a7a43;}   /* success */
.sc-amber{background:#fef9ec;color:#b45309;}   /* warning / in-progress */
.sc-red{background:#fdeceb;color:#c0392b;}     /* failed */
.sc-grey{background:#f1f3f5;color:#6b7280;}    /* neutral / uploaded */

/* ── Issue 3: Verify terminology + confidence ── */
/* Confidence dot only — no % for high-confidence, red for 0 */
.conf-dot{display:inline-flex;align-items:center;gap:4px;font-size:11px;}
.conf-dot .pct{color:#9aa1ab;}  /* only show if < 100% */
/* Verify button replaces Check */
.verify-btn{border:1px solid #d4a820;background:#fff;color:#a87c0a;border-radius:5px;padding:4px 12px;font-size:11.5px;white-space:nowrap;}
.verify-btn:hover{background:#fdf3d6;border-color:#a87c0a;}
.verified-tag{background:#1a7a43;color:#fff;border-radius:5px;padding:4px 12px;font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;gap:4px;}
/* Field layout: separate verify from confidence */
.fd-f{display:flex;align-items:center;gap:10px;padding:11px 18px;border-bottom:1px solid #f3f4f6;flex-wrap:wrap;}
.fd-f .lbl{font-size:12px;color:#6b7280;min-width:155px;flex-shrink:0;}
.fd-f .val-wrap{flex:1;min-width:100px;}
.fd-f .fd-right-ctrl{display:flex;align-items:center;gap:8px;margin-left:auto;flex-shrink:0;}

/* ── list tabs + filter + table ── */
.lt-tabs{display:flex;gap:0;border-bottom:1px solid var(--bd);margin:18px 0 12px;}
.lt-tab{padding:10px 14px;font-size:13px;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;}
.lt-tab.active{color:var(--blue);font-weight:700;border-bottom-color:var(--blue);}
.filters{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
.inp,.sel{border:1px solid var(--bd);border-radius:6px;padding:7px 10px;font-size:12.5px;background:#fff;color:var(--tx);}
.inp{min-width:180px;}
.sel{min-width:150px;color:var(--mut);}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
thead th{text-align:left;padding:10px 10px;color:#6b7280;font-weight:600;border-bottom:1px solid var(--bd);background:#fafbfc;white-space:nowrap;font-size:11.5px;}
tbody td{padding:11px 10px;border-bottom:1px solid var(--bd2);vertical-align:middle;color:#374151;}
.fn{color:#1f2937;font-weight:500;}
.st-ok{color:#15803d;}
.acts{display:flex;gap:4px;}
.aic{width:26px;height:26px;border:1px solid var(--bd);border-radius:6px;background:#fff;display:inline-flex;align-items:center;justify-content:center;color:#8b94a3;}
.aic:hover{border-color:var(--blue);color:var(--blue);background:#f5f9ff;}
.aic svg{width:14px;height:14px;}
.aic.dis{opacity:.4;pointer-events:none;}
.pager{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--mut);}
.pg-num{width:26px;height:26px;border:1px solid var(--blue);color:var(--blue);border-radius:5px;display:inline-flex;align-items:center;justify-content:center;}

/* ── File detail ── */
.fd{background:#fff;border-radius:10px;flex:1;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.fd-top{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--bd);}
.fd-back{width:30px;height:30px;border:1px solid var(--bd);border-radius:6px;background:#fff;color:var(--mut);}
.fd-title{font-size:14px;font-weight:700;}
.fd-crumb{font-size:11.5px;color:var(--mut);margin-top:2px;}
.fd-top .sp{margin-left:auto;}
/* ── Alert action center (top, prominent) ── */
.ac{background:#fffaf3;border-bottom:1px solid #f0dcc0;flex-shrink:0;}
.ac.ac-clear{background:#f1faf3;border-bottom-color:#cfe8d6;}
.ac-bar{display:flex;align-items:center;gap:9px;padding:10px 16px;flex-wrap:wrap;}
.ac-ic{display:inline-flex;}.ac-ic svg{width:17px;height:17px;}
.ac-ttl{font-size:13px;font-weight:700;color:#5a4300;}
.ac.ac-clear .ac-ttl{color:#1a5c2e;}
.ac-chip{font-size:11.5px;font-weight:700;padding:2px 10px;border-radius:11px;cursor:pointer;border:1px solid transparent;}
.ac-chip:hover{filter:brightness(.95);}
.ac-chip.red{background:#fdeceb;color:#c0392b;border-color:#f3c4be;} .ac-chip.org{background:#fff4e0;color:#b8860b;border-color:#f3d98f;} .ac-chip.blue{background:#e8f0fe;color:#2563eb;border-color:#cfe0fb;}
.ac-next{margin-left:auto;font-size:12px;font-weight:700;color:#fff;background:var(--blue);border-radius:7px;padding:5px 13px;cursor:pointer;}
.ac-next:hover{background:var(--blue-d);}
.ac-cards{padding:0 14px 12px;}
.ac-cards .al-card .al-expand{max-height:340px;opacity:1;margin-top:9px;}
/* ── Pipeline step bar (top, compact, state-machine driven) ── */
.psbar{background:#fff;border-bottom:1px solid var(--bd);padding:9px 14px;flex-shrink:0;}
.psbar.ps-clear{background:#f4fbf6;border-bottom-color:#cfe8d6;}
.ps-steps{display:flex;align-items:stretch;gap:2px;}
.ps-step{display:flex;align-items:center;gap:9px;padding:6px 12px;border-radius:8px;cursor:pointer;flex:1;border:1px solid transparent;transition:background .12s;min-width:0;}
.ps-step:hover{background:#f5f8fc;border-color:#e6ebf2;}
.ps-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;background:#cbd2dc;box-shadow:0 0 0 3px #eef1f5;}
.ps-txt{min-width:0;}
.ps-name{font-size:12.5px;font-weight:700;color:#1f2937;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ps-meta{font-size:11px;font-weight:600;color:#9aa1ab;display:block;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ps-arrow{display:flex;align-items:center;color:#d2d8e0;font-size:14px;flex-shrink:0;}
.ps-todo{background:#fffaf0;}.ps-todo .ps-dot{background:#e8a300;box-shadow:0 0 0 3px #fbedcf;}.ps-todo .ps-meta{color:#b07d09;}
.ps-error{background:#fef5f4;}.ps-error .ps-dot{background:#dc2626;box-shadow:0 0 0 3px #f9dcd9;}.ps-error .ps-meta{color:#c0392b;}
.ps-done .ps-dot{background:#1f9d57;box-shadow:0 0 0 3px #d4eddd;}.ps-done .ps-meta{color:#1a7a43;}
.ps-wait .ps-dot{background:#c2c8d2;box-shadow:0 0 0 3px #eceff3;}.ps-wait .ps-meta{color:#9aa1ab;}
.ps-none{opacity:.6;}
.ps-next{display:flex;align-items:center;gap:9px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--bd2);font-size:12px;}
.ps-next-lbl{font-weight:700;color:#6b7280;}
.ps-next-cta{color:#fff;background:var(--blue);border-radius:7px;padding:4px 12px;cursor:pointer;font-weight:700;}
.ps-next-cta:hover{background:var(--blue-d);}
.ps-next-cta.role-sales{background:#7c3aed;}.ps-next-cta.role-sales:hover{background:#6d28d9;}
.ps-next-cta.role-ced{background:var(--blue);}
.ps-next-cta.role-esc{background:#dc2626;}.ps-next-cta.role-esc:hover{background:#b91c1c;}
.ps-next-done{font-weight:700;color:#1a7a43;}
/* ── Work area: left workspace + right preview ── */
.fd-work{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(330px,420px);overflow:hidden;}
.fd-wleft{overflow:auto;padding:12px 14px;background:#f6f7f9;}
.fdq-preview{border-left:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden;background:#fafbfc;}
.fd-fields-head{display:flex;align-items:center;gap:14px;padding:7px 14px;background:#fafbfc;border-bottom:1px solid var(--bd);font-size:10px;font-weight:700;color:#9aa1ab;text-transform:uppercase;letter-spacing:.4px;}
.fd-fields-head .h-lbl{min-width:160px;}.fd-fields-head .h-val{flex:1;}
.fd-fields-head .h-rule{min-width:200px;color:#d97706;}.fd-fields-head .h-conf{width:46px;text-align:right;margin-left:auto;}
/* ── Collapsible section cards ── */
.sec{background:#fff;border:1px solid var(--bd);border-radius:9px;margin-bottom:12px;overflow:hidden;}
.sec-hd{display:flex;align-items:center;gap:9px;padding:11px 14px;cursor:pointer;user-select:none;}
.sec-hd:hover{background:#fafbfc;}
.sec.open>.sec-hd{border-bottom:1px solid var(--bd2);}
.sec-num{width:20px;height:20px;border-radius:50%;background:#1e3a8a;color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.sec-ttl{font-size:13px;font-weight:700;color:#1f2937;}
.sec-sub{font-size:11px;color:#9aa1ab;}
.sec-badge{font-size:10px;font-weight:700;padding:2px 9px;border-radius:10px;}
.sec-badge.org{background:#fff4e0;color:#b8860b;}.sec-badge.red{background:#fdeceb;color:#c0392b;}.sec-badge.green{background:#e6f4ea;color:#1a7a43;}
.sec-chev{margin-left:auto;color:#9aa1ab;font-size:11px;transition:transform .15s;}
.sec.open .sec-chev{transform:rotate(180deg);}
.sec-bd{}
.sec-hl{box-shadow:0 0 0 2px #2563eb;}
/* ── locate icon (subtle, replaces red pin) ── */
.li2-loc,.rc-loc{display:inline-flex;color:#c2c8d2;cursor:pointer;flex-shrink:0;}
.li2-loc svg,.rc-loc svg{width:14px;height:14px;}
.li2-loc:hover,.rc-loc:hover{color:var(--blue);}
.li2-row.lit .li2-loc,.rc-row.hot .rc-loc{color:#e0a107;}
/* ── inline section alerts / banners ── */
.sec-alerts{padding:10px 12px 4px;border-bottom:1px solid var(--bd2);background:#fcfcfd;}
.sec-banner{font-size:11.5px;line-height:1.5;padding:8px 14px;border-bottom:1px solid var(--bd2);}
.sec-banner.org{background:#fff4e0;color:#7a5c00;}
.sec-banner.red{background:#fdeceb;color:#9c2c20;}
.sec-banner.grey{background:#f4f6f9;color:#6b7280;}
.sec-banner.green{background:#eef8f1;color:#1a6b3c;}
.sec-badge.blue{background:#e8f0fe;color:#2563eb;}
.sec-badge.grey{background:#eef1f5;color:#7a828e;}
.sec-alerts-wrap{padding:10px 12px 2px;background:#fffaf3;border-bottom:1px solid var(--bd2);}
.sec-alerts-wrap .ac-cards{padding:0;}
/* Step-1 Sales verify bar (replaces disconnected alert cards) */
.vf-bar{margin:10px 12px;border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.5;}
.vf-todo{background:#fff8ec;border:1px solid #f0dcc0;}
.vf-bounce{background:#fdeceb;border:1px solid #f3c4be;color:#9c2c20;}
.vf-done{background:#eef8f1;border:1px solid #cfe8d6;color:#1a6b3c;font-weight:600;}
.vf-hd{font-weight:700;color:#7a5c00;margin-bottom:5px;}
.vf-list{margin:0 0 4px;padding-left:18px;color:#5a4a2a;}
.vf-list li{margin:2px 0;}
.vf-desc{color:#8a7a5a;font-weight:400;}
.vf-acts{display:flex;gap:8px;margin-top:7px;}
/* 补录 custom line (Step 1 data gap fill) */
.li2-new{display:inline-block;margin-left:7px;font-size:9.5px;font-weight:700;color:#7c3aed;background:#f3edff;border:1px solid #e0d3fb;border-radius:8px;padding:1px 6px;vertical-align:middle;}
.li2-cust{background:#fbf9ff;}
.li2-rm{margin-left:6px;color:#c2c8d2;cursor:pointer;font-size:14px;font-weight:700;}

.li2-mhd{font-size:11px;font-weight:700;color:#374151;background:#f3f5f8;padding:6px 14px;}

.li2-name{flex:1;font-size:12.5px;color:#1f2937;min-width:0;display:flex;align-items:baseline;gap:8px;}

/* ── ③④ computed fields ── */
.cp-month{border-bottom:1px solid var(--bd2);padding-bottom:6px;}
.cp-month:last-child{border-bottom:none;}
.cp-row{display:flex;align-items:baseline;gap:10px;padding:5px 14px;font-size:12.5px;}
.cp-lbl{flex:1;color:#374151;display:flex;flex-direction:column;}
.cp-proc{font-size:10.5px;color:#9aa1ab;font-family:ui-monospace,Menlo,Consolas,monospace;margin-top:1px;}
.cp-val{font-weight:600;color:#111827;font-family:ui-monospace,Menlo,Consolas,monospace;}
.cp-recon{margin:6px 14px 4px;background:#f8f9fb;border:1px solid #eef0f3;border-radius:7px;padding:4px 0;}
.cp-val-row{padding:5px 12px;font-size:11.5px;}
.cp-val-row .cp-lbl{flex:1;color:#5b6470;}
.cp-calc{font-weight:700;color:#1e3a8a;font-family:ui-monospace,Menlo,Consolas,monospace;}
.cp-vs{font-size:10px;color:#b6bcc6;}
.cp-ocr{color:#374151;font-family:ui-monospace,Menlo,Consolas,monospace;}
.cp-ok{color:#1f9d57;font-weight:700;}
.cp-bad{color:#c0392b;font-weight:700;font-size:11px;}
.cp-income{font-size:11.5px;color:#1a5c2e;background:#eef7f0;border-top:1px solid #d6ead9;padding:6px 14px;}

/* ── Collapsible alerts header ── */
.fd-alert-strip{display:flex;align-items:center;gap:8px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--bd);cursor:pointer;flex-shrink:0;}
.fd-alert-strip:hover{background:#fafbfc;}
.fd-alert-strip .al-hd-ic{display:inline-flex;}.fd-alert-strip .al-hd-ic svg{width:15px;height:15px;}
.al-hd-ttl{font-size:11.5px;font-weight:800;letter-spacing:.5px;color:#374151;}
.al-hd-cnt{font-size:11px;color:#9aa1ab;font-weight:600;}
.fd-alert-strip .chev{color:var(--mut);font-size:11px;transition:transform .15s;}
.fd-alert-strip.open .chev{transform:rotate(180deg);}
.fd-alert-body{flex-shrink:0;max-height:48%;overflow:auto;padding:8px 14px;border-bottom:1px solid var(--bd);background:#fcfcfd;}
/* ── Compact alert card (hover-expands) ── */
.al-card{border:1px solid var(--bd);border-left-width:3px;border-radius:8px;padding:10px 12px;margin-bottom:7px;background:#fff;transition:box-shadow .12s;}
.al-card.al-hard{border-left-color:#dc2626;}
.al-card.al-warn{border-left-color:#e0a107;}
.al-card.al-check{border-left-color:#9aa1ab;}
.al-card:hover{box-shadow:0 3px 12px rgba(40,60,120,.10);border-color:#bcd0f5;}
.al-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.al-ic{display:inline-flex;flex-shrink:0;}.al-ic svg{width:15px;height:15px;}
.al-ttl{font-size:13px;font-weight:700;color:#2a2f37;}
.al-chips{display:inline-flex;gap:5px;flex-wrap:wrap;}
.al-fld{font-size:11px;color:#2563eb;background:#f0f6ff;border:1px solid #d3e2fb;border-radius:4px;padding:1px 7px;cursor:pointer;white-space:nowrap;}
.al-fld:hover{background:#2563eb;color:#fff;border-color:#2563eb;}
.al-desc{font-size:11.5px;color:#6b7280;margin-top:5px;line-height:1.5;}
/* expand-on-hover region */
.al-expand{max-height:0;overflow:hidden;opacity:0;transition:max-height .18s ease,opacity .18s ease;}
.al-card:hover .al-expand{max-height:260px;opacity:1;margin-top:9px;}
.al-cmp{margin-bottom:9px;}
.cmp2{display:flex;align-items:stretch;gap:0;border:1px solid #e3e7ee;border-radius:7px;overflow:hidden;background:#f9fafc;}
.cmp2-c{flex:1;display:flex;flex-direction:column;gap:3px;padding:8px 12px;}
.cmp2-l{font-size:9.5px;font-weight:700;letter-spacing:.4px;color:#9aa1ab;}
.cmp2-v{font-size:13px;font-weight:700;color:#374151;font-family:ui-monospace,Menlo,Consolas,monospace;}
.cmp2-v.bad{color:#dc2626;}
.cmp2-arr{display:flex;align-items:center;padding:0 6px;color:#9aa1ab;font-size:16px;background:#eef1f6;}
.al-acts{display:flex;gap:7px;flex-wrap:wrap;}
.al-btn{display:inline-flex;align-items:center;gap:5px;border:1px solid #d6dae0;background:#fff;color:#374151;border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;}
.al-btn:hover{border-color:var(--blue);color:var(--blue);}
.al-btn svg{width:13px;height:13px;}
/* the primary action (fd-abtn-rec reused) shows blue */
.al-acts .fd-abtn{display:inline-flex;align-items:center;gap:5px;border:1px solid #d6dae0;background:#fff;color:#374151;border-radius:6px;padding:6px 12px;font-size:12px;}
.al-acts .fd-abtn-rec{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600;}
.al-acts .fd-abtn-rec:hover{background:var(--blue-d);}
/* ── Field row hover-highlight from alert chip ── */
.fd-f.xhl{background:#eaf2ff;box-shadow:inset 3px 0 0 #2563eb;}
/* badge kept for income-file cards reuse */
.fd-ltab-badge{min-width:17px;height:17px;border-radius:9px;background:#dc2626;color:#fff;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 4px;}
.fd-ltab-badge.ok{background:#1f9d57;}
/* ── Fields column header ── */
.fd-fields-head{display:flex;align-items:center;gap:14px;padding:7px 18px;background:#fafbfc;border-bottom:1px solid var(--bd);font-size:10px;font-weight:700;color:#9aa1ab;text-transform:uppercase;letter-spacing:.4px;position:sticky;top:0;z-index:2;}
.fd-fields-head .h-lbl{min-width:165px;flex-shrink:0;}
.fd-fields-head .h-val{flex:1;}
.fd-fields-head .h-rule{min-width:200px;flex-shrink:0;color:#d97706;}
.fd-fields-head .h-conf{width:46px;text-align:right;flex-shrink:0;margin-left:auto;}
/* ── Fields scroll area ── */
.fd-left-body{flex:1;overflow:auto;padding:0 0 16px;}
/* ── Preview hidden: thin vertical tab ── */
.fd-preview-tab{display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;background:#fafbfc;border-left:1px solid var(--bd);cursor:pointer;color:var(--blue);font-size:12px;font-weight:600;width:38px;}
.fd-preview-tab:hover{background:#eef4ff;}
/* ── Old stack-style section headers (now unused, keeping for compat) ── */
.fd-sec{padding:13px 18px 9px;font-size:12px;font-weight:700;color:#b91c1c;display:flex;align-items:center;gap:7px;}
.fd-sec .rd{width:7px;height:7px;border-radius:50%;background:var(--red);}
.fd-grp{font-size:12px;font-weight:700;color:#374151;background:#f6f7f9;padding:8px 18px;border-top:1px solid var(--bd2);border-bottom:1px solid var(--bd2);margin-top:2px;}
.fd-grp .del{float:right;color:var(--red);font-weight:500;cursor:pointer;font-size:11.5px;}
.fd-f{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid #f3f4f6;}
.fd-f .lbl{color:#6b7280;font-size:12px;min-width:165px;line-height:1.4;}
.fd-f .val{flex:1;font-size:12.5px;color:#111827;font-weight:500;line-height:1.4;}
.fd-f .conf{font-size:11px;color:#374151;display:flex;align-items:center;gap:5px;}
/* ── 0% OCR failure banner (inside fields tab) ── */
.fd-zero-banner{margin:12px 16px 6px;background:#fff4e0;border:1px solid #f3d98f;border-radius:7px;padding:10px 13px;font-size:12px;color:#7a5c00;line-height:1.6;}
.fd-zero-banner strong{color:#5a4300;}
.fd-zero-banner .fd-z-act{display:flex;gap:8px;margin-top:8px;}
/* ── Reclassify warning in preview header ── */
.fd-reclassify-warn{background:#fff4e0;border-bottom:1px solid #f3d98f;padding:7px 14px;font-size:11.5px;color:#7a5c00;display:flex;align-items:center;gap:6px;}
.fd-reclassify-warn strong{color:#5a4300;}
/* ── Right preview panel ── */
.fd-right{display:flex;flex-direction:column;overflow:hidden;background:#fafbfc;}
.fd-rtop{display:flex;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--bd);flex-wrap:wrap;}
.fd-pdftb{display:flex;gap:6px;align-items:center;padding:7px 14px;border-bottom:1px solid var(--bd);font-size:12px;color:#374151;background:#fff;}
.fd-pdftb .mini{width:26px;height:26px;border:1px solid var(--bd);border-radius:5px;background:#fff;}
.fd-doc{flex:1;overflow:auto;padding:18px;display:flex;justify-content:center;}
.fd-bottom{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:10px 16px;border-top:1px solid var(--bd);background:#fff;}
/* ── Alert card: more compact + clearer hierarchy ── */
.fd-alert{border:1px solid #e5e7eb;border-left-width:4px;border-radius:7px;padding:10px 13px;margin-bottom:8px;background:#fff;}
/* ── Justify btn: tertiary text-link style ── */
.justify-btn{border:none;background:none;color:#9aa1ab;font-size:11.5px;padding:5px 4px;cursor:pointer;text-decoration:underline;text-decoration-style:dotted;font-family:inherit;}
.justify-btn:hover{color:#374151;}

/* ── VALIDATION ALERTS cards (B-2 optimized) ── */
.fd-alerts{padding:8px 16px 6px;}
/* summary header */
.fd-sum{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.fd-sum-chip{font-size:11px;font-weight:700;padding:3px 10px;border-radius:11px;}
.fd-sum-chip.red{background:#fdeceb;color:#c0392b;} .fd-sum-chip.org{background:#fff4e0;color:#b8860b;} .fd-sum-chip.blue{background:#e8f0fe;color:#2563eb;}
.fd-sum-block{font-size:11.5px;font-weight:700;color:#c0392b;margin-left:auto;}
.fd-sum-ok{font-size:11.5px;font-weight:700;color:#1f9d57;margin-left:auto;}
.fd-sum-soft{font-size:11.5px;color:#b8860b;margin-left:auto;}
/* card */
.fd-alert{border:1px solid #e5e7eb;border-left-width:4px;border-radius:8px;padding:13px 15px;margin-bottom:12px;background:#fff;}
.fd-alert.sevbox-hard{border-left-color:#dc2626;background:#fffafa;border-color:#f3c4be;}
.fd-alert.sevbox-warn{border-left-color:#e0a107;background:#fffdf6;border-color:#f3d98f;}
.fd-alert.sevbox-check{border-left-color:#2563eb;background:#f7faff;border-color:#cfe0fb;}
.fd-alert.resolved{border-left-color:#1f9d57;border-color:#9bd5ab;background:#f1faf3;}
.fd-alert-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.sevtag{font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:2px 8px;border-radius:4px;}
.sev-hard{background:#fdeceb;color:#c0392b;} .sev-warn{background:#fff4e0;color:#b8860b;} .sev-check{background:#e8f0fe;color:#2563eb;} .sev-ok{background:#e6f4ea;color:#1f9d57;}
.dimtag{font-size:10px;color:#5b6470;background:#eef1f4;padding:2px 8px;border-radius:9px;font-weight:600;}
.systag{margin-left:auto;font-size:10px;color:#9aa1ab;background:#f4f5f7;padding:2px 8px;border-radius:9px;}
.fd-alert-ttl{font-size:13px;font-weight:700;color:#2a2f37;}
.fd-rtag{margin-left:auto;font-size:13px;font-weight:800;color:#1f9d57;}
.fd-cmp{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:#4b5563;background:#f8f9fb;border:1px solid #eef0f3;border-radius:6px;padding:7px 10px;margin:8px 0;line-height:1.6;}
.fd-cmp .bad{color:#dc2626;font-weight:700;}
.fd-locate-row{margin-bottom:8px;}
.fd-locate{display:inline-block;font-size:11px;color:#2563eb;cursor:pointer;border:1px solid #cfe0fb;background:#f0f6ff;border-radius:6px;padding:3px 9px;font-weight:600;}
.fd-locate:hover{background:#2563eb;color:#fff;border-color:#2563eb;}
.fd-guide{font-size:11px;color:#7b828c;line-height:1.6;margin-bottom:10px;}
.fd-guide b{color:#4b5563;}
.fd-alert-acts{display:flex;gap:8px;flex-wrap:wrap;}
.fd-abtn{border:1px solid #d6dae0;background:#fff;color:#374151;border-radius:6px;padding:7px 13px;font-size:12px;}
.fd-abtn:hover{border-color:var(--blue);color:var(--blue);}
.fd-abtn-rec{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600;}
.fd-abtn-rec:hover{background:var(--blue-d);color:#fff;}
.fd-noalert{padding:10px 16px 16px;font-size:12px;color:var(--lt);}
.need{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.4px;color:#b8860b;background:#fdf3d6;border-radius:3px;padding:1px 6px;vertical-align:1px;}
.fd-f.need-row{background:#fffaf0;}
.fd-f.hl{background:#fff6cc;box-shadow:inset 3px 0 0 #e0a107;}
.checked{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.4px;color:#1f9d57;background:#e6f4ea;border-radius:3px;padding:1px 6px;vertical-align:1px;}
.check-btn{border:1px solid #cfd6df;background:#fff;color:#2563eb;border-radius:5px;padding:4px 13px;font-size:11.5px;}
.check-btn:hover{background:#eef4ff;border-color:var(--blue);}
.done-btn{background:#1f9d57;color:#fff;border-radius:5px;padding:4px 13px;font-size:11.5px;font-weight:600;}
.add-item{text-align:center;padding:12px;font-size:12.5px;color:#5b6470;background:#f6f7f9;border-bottom:1px solid #f3f4f6;cursor:pointer;}
.add-item:hover{background:#eef1f4;color:var(--blue);}
/* ── Cross-Validation Results table ── */
.xv-table th,.xv-table td{white-space:nowrap;}
.xv-row-bad{background:#fffbfb;}
.alert-cnt{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#e23b3b;color:#fff;font-size:11px;font-weight:700;}
.alert-rules{color:#dc2626;font-size:11.5px;line-height:1.7;white-space:normal;min-width:240px;}
.ocr-fail{color:#c0392b;font-weight:600;}
.qmark{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border:1px solid #cbd2da;border-radius:50%;color:#9aa1ab;font-size:11px;cursor:help;}
.xv-foot{display:flex;align-items:center;gap:12px;margin-top:14px;padding-top:6px;}
.xv-issues{font-size:12px;color:#5b6470;background:#eef1f4;border-radius:6px;padding:4px 12px;}
.xv-issues.bad{color:#c0392b;background:#fdeceb;}

/* ── Line-item classification panel (payslip) ── */
.li-sec{margin:0 0 6px;}
.li-sec-hd{display:flex;align-items:baseline;gap:10px;padding:10px 18px 6px;flex-wrap:wrap;}
.li-sec-hd>span:first-child{font-size:11px;font-weight:800;letter-spacing:.5px;color:#374151;}
.li-sec-sub{font-size:11px;color:#9aa1ab;}
.li-head{display:flex;align-items:center;padding:5px 18px;background:#fafbfc;border-top:1px solid var(--bd2);border-bottom:1px solid var(--bd2);font-size:10px;font-weight:700;color:#9aa1ab;text-transform:uppercase;letter-spacing:.3px;}

.li-en{font-size:10.5px;color:#9aa1ab;margin-left:7px;white-space:nowrap;}
.li-amt{width:96px;text-align:right;font-size:12.5px;font-weight:600;color:#111827;flex-shrink:0;}

.agg-row.excl{opacity:.6;}
.agg-lbl{flex:1;font-size:12.5px;font-weight:600;color:#1f2937;display:flex;flex-direction:column;gap:2px;}
.agg-from{font-size:10.5px;color:#9aa1ab;font-weight:400;line-height:1.4;}
.agg-sum{width:110px;text-align:right;font-size:12.5px;font-weight:700;color:#111827;flex-shrink:0;}
.agg-note{width:130px;font-size:10.5px;color:#1a7a43;flex-shrink:0;line-height:1.4;}

.agg-total .agg-sum{color:#1e3a8a;font-size:13px;}

.agg-total.final .agg-lbl,.agg-total.final .agg-sum{font-weight:800;font-size:14px;}
/* ── Rule Configuration panel (no amounts) ── */
.rc-panel{border-bottom:6px solid #f1f3f5;}
.rc-hd{display:flex;align-items:baseline;gap:10px;padding:11px 18px 7px;flex-wrap:wrap;background:#fbfcfe;}
.rc-hd>span:first-child{font-size:11.5px;font-weight:800;letter-spacing:.5px;color:#1e3a8a;}
.rc-sub{font-size:11px;color:#9aa1ab;}
.rc-grp{font-size:10px;font-weight:800;letter-spacing:.5px;color:#9aa1ab;background:#fafbfc;padding:5px 18px;border-top:1px solid var(--bd2);border-bottom:1px solid var(--bd2);}
.rc-row{display:flex;align-items:center;padding:7px 16px;border-bottom:1px solid #f3f4f6;gap:9px;}
.rc-row.hot{background:#fff8e1;box-shadow:inset 3px 0 0 #e0a107;}
.rc-row.pending{background:#fffaf0;}
.rc-name{flex:1;display:flex;align-items:baseline;gap:8px;font-size:12.5px;font-weight:600;color:#1f2937;min-width:0;}

.rc-log .li-log{padding:5px 0;border-bottom:1px solid #f3f4f6;}
/* pending-changes apply bar */
.li-row.pending{background:#fffaf0;}
.li-apply{display:flex;align-items:center;gap:12px;margin:8px 18px;padding:9px 13px;background:#fff8e6;border:1px solid #f3d98f;border-radius:8px;}
.li-apply-txt{font-size:12px;color:#7a5c00;flex:1;line-height:1.4;}
.li-apply-txt b{color:#5a4300;}
/* change log */
.li-log{display:flex;align-items:center;gap:12px;padding:6px 18px;border-bottom:1px solid #f3f4f6;font-size:11.5px;}
.li-log-t{color:#9aa1ab;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;flex-shrink:0;}
.li-log-raw{font-weight:600;color:#374151;min-width:150px;}
.li-log-chg{color:#6b7280;}
.li-log-chg b{color:#1a7a43;}
/* ── CED rule-category column in field rows ── */
.ced-rule-cell{min-width:200px;flex-shrink:0;padding-right:8px;}
.ced-rule-sel{border:1px solid #d6dae0;border-radius:5px;padding:4px 7px;font-size:11.5px;background:#fff;color:#374151;cursor:pointer;width:100%;max-width:220px;}
.ced-rule-sel:hover{border-color:var(--blue);}
.ced-rule-sel:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px #c3d5fb;}
.ced-rule-sel.modified{border-color:#d97706;background:#fffdf0;color:#7a5c00;font-weight:600;}
.ced-rule-tag{font-size:11px;color:#9aa1ab;font-style:italic;} /* formula/auto fields */
.ced-rule-modified-dot{width:6px;height:6px;border-radius:50%;background:#d97706;display:inline-block;margin-right:4px;vertical-align:2px;flex-shrink:0;}
/* ── CED recalculated income banner (inside Fields tab) ── */
.ced-income-bar{margin:10px 16px 0;border:1px solid #c3d5fb;border-radius:7px;overflow:hidden;}
.ced-income-bar-hd{display:flex;align-items:center;padding:8px 14px;background:#e8f0fe;font-size:12.5px;font-weight:700;color:#1e3a8a;gap:8px;}
.ced-income-bar-hd .pending{color:#b45309;background:#fff4e0;border:1px solid #f3d98f;border-radius:4px;font-size:10.5px;padding:1px 8px;font-weight:600;}
.ced-income-items{padding:8px 14px 10px;display:flex;flex-direction:column;gap:4px;}
.ced-income-row{display:flex;justify-content:space-between;font-size:12px;color:#374151;}
.ced-income-row .lbl{color:#6b7280;}
.ced-income-row .val{font-weight:600;}
.ced-income-row.total{border-top:1px solid #c3d5fb;padding-top:5px;margin-top:3px;font-size:13px;color:#1e3a8a;}
.ced-recalc-btn{border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:6px;padding:5px 14px;font-size:12px;font-weight:600;cursor:pointer;}
.ced-recalc-btn:hover{background:var(--blue);color:#fff;}
/* ── CED File List tab ── */
.fl-foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:8px;border-top:1px solid var(--bd2);}
.ced-up-zone{background:#fffdf0;border:1.5px dashed #f0c14b;border-radius:8px;padding:22px;text-align:center;margin-bottom:14px;}
.ced-up-zone .cu-title{font-size:13px;font-weight:600;color:#374151;margin-bottom:4px;}
.ced-up-zone .cu-sub{font-size:11.5px;color:var(--mut);}
.ced-up-zone .cu-sub a{color:var(--blue);}
.ced-fl-tbl td{padding:10px 10px;border-bottom:1px solid var(--bd2);font-size:12.5px;vertical-align:middle;}
.ced-fl-tbl th{padding:9px 10px;font-size:11.5px;color:#6b7280;font-weight:600;border-bottom:1px solid var(--bd);background:#fafbfc;text-align:left;}

/* ── Income Verification tab ── */
.iv-summary-bar{display:flex;align-items:stretch;gap:0;border:1px solid var(--bd);border-radius:8px;overflow:hidden;margin-bottom:16px;}
.iv-sum-cell{flex:1;padding:12px 18px;border-right:1px solid var(--bd);display:flex;flex-direction:column;gap:3px;}
.iv-sum-cell:last-child{border-right:none;}
.iv-sum-label{font-size:11px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.3px;}
.iv-sum-val{font-size:17px;font-weight:700;color:#111827;}
.iv-sum-sub{font-size:11px;color:var(--mut);}
.iv-file-card{border:1px solid var(--bd);border-radius:8px;margin-bottom:12px;overflow:hidden;}
.iv-file-hd{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fafbfc;border-bottom:1px solid var(--bd);}
.iv-file-badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:4px;background:#e8f0fe;color:#2563eb;}
.iv-file-name{font-size:13px;font-weight:600;color:#1f2937;flex:1;}
.iv-item{display:flex;align-items:center;gap:0;padding:10px 16px;border-bottom:1px solid #f3f4f6;font-size:12.5px;}
.iv-item:last-child{border-bottom:none;}
.iv-item-label{flex:2;color:#374151;font-weight:500;}
.iv-item-cat{flex:1.2;font-size:11px;color:#6b7280;}
.iv-item-val{flex:1.5;font-weight:600;color:#111827;}
.iv-item-val.empty{color:#c0392b;font-weight:400;font-style:italic;}
.iv-conf-wrap{flex:1;display:flex;align-items:center;gap:6px;}
.iv-conf-bar{height:4px;border-radius:2px;background:#e5e7eb;flex:1;overflow:hidden;}
.iv-conf-fill{height:100%;border-radius:2px;}
.iv-conf-fill.hi{background:#16a34a;}
.iv-conf-fill.mid{background:#d97706;}
.iv-conf-fill.lo{background:#dc2626;}
.iv-conf-pct{font-size:11px;color:#6b7280;width:28px;text-align:right;}
.iv-status{flex:1;display:flex;align-items:center;justify-content:center;}
.iv-badge-auto{font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;background:#e6f4ea;color:#1a7a43;}
.iv-badge-pending{font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;background:#fef9ec;color:#b45309;}
.iv-badge-counted{font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;background:#e8f0fe;color:#2563eb;}
.iv-badge-excluded{font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;background:#f1f3f5;color:#6b7280;text-decoration:line-through;}
.iv-acts{flex:1.5;display:flex;gap:4px;justify-content:flex-end;}
.iv-btn{border:1px solid var(--bd);background:#fff;color:#374151;border-radius:5px;padding:3px 10px;font-size:11.5px;cursor:pointer;}
.iv-btn:hover{border-color:var(--blue);color:var(--blue);}
.iv-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.iv-btn.excl{border-color:#f3bcb9;color:#c0392b;}
.iv-btn.excl:hover{background:#fdeceb;}
.iv-notice{font-size:11.5px;color:#7a5c00;background:#fff4e0;border:1px solid #f3d98f;border-radius:7px;padding:8px 13px;margin-bottom:12px;line-height:1.6;}
.iv-footer{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding-top:12px;border-top:1px solid var(--bd);}

/* ── Add Rule button + custom rule card ── */
.add-rule-btn{border:1px dashed #2563eb;background:#f0f6ff;color:#2563eb;border-radius:6px;padding:5px 13px;font-size:12px;font-weight:600;margin-left:auto;cursor:pointer;}
.add-rule-btn:hover{background:#2563eb;color:#fff;}
.custom-rule{border-style:dashed !important;}
.customtag{font-size:10px;color:#7c3aed;background:#f3efff;padding:2px 8px;border-radius:9px;font-weight:600;}
.custom-rule-foot{display:flex;gap:8px;margin-top:9px;padding-top:9px;border-top:1px dashed #e0dbf5;}
.cr-edit{border:1px solid #d6dae0;background:#fff;color:#5b6470;border-radius:5px;padding:4px 12px;font-size:11.5px;}
.cr-edit:hover{border-color:var(--blue);color:var(--blue);}
.cr-del{border:1px solid #f3bcb9;background:#fff;color:#c0392b;border-radius:5px;padding:4px 12px;font-size:11.5px;}
.cr-del:hover{background:#fdeceb;}
/* ── Add Rule modal ── */
.add-rule-modal{background:#fff;border-radius:10px;width:500px;max-width:96vw;max-height:88vh;display:flex;flex-direction:column;margin:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.arm-hdr{display:flex;align-items:center;padding:16px 20px 10px;border-bottom:1px solid var(--bd);}
.arm-hdr h3{font-size:16px;font-weight:700;flex:1;}
.arm-body{padding:14px 20px;overflow:auto;display:flex;flex-direction:column;gap:14px;}
.arm-note{font-size:11.5px;color:#5b6470;background:#f7f8fa;border:1px solid #eef0f3;border-radius:7px;padding:9px 12px;line-height:1.6;}
.arm-row{display:flex;flex-direction:column;gap:5px;}
.arm-lbl{font-size:12px;font-weight:600;color:#374151;}
.arm-hint{font-size:11px;color:#9aa1ab;}
.arm-sevs{display:flex;gap:14px;align-items:center;}
.arm-sev-opt{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12.5px;}
.arm-foot{display:flex;justify-content:flex-end;gap:10px;padding:12px 20px;border-top:1px solid var(--bd);}
/* ── Mykad ID card mock ── */
.idcard{width:420px;max-width:100%;background:linear-gradient(135deg,#ece4d3,#e7dcc4);border:1px solid #cbb98f;border-radius:10px;padding:14px 16px;box-shadow:0 2px 8px rgba(0,0,0,.12);}
.idc-band{background:#7c92b5;color:#fff;font-weight:800;font-size:13px;text-align:center;border-radius:5px;padding:5px;letter-spacing:.5px;}
.idc-row{display:flex;gap:14px;margin-top:12px;}
.idc-no{font-size:18px;font-weight:800;color:#33425e;letter-spacing:1px;}
.idc-nm{font-size:12px;font-weight:700;margin-top:8px;color:#2a2a2a;}
.idc-ad{font-size:10px;color:#3a3a3a;margin-top:6px;line-height:1.5;}
.idc-tags{font-size:11px;font-weight:700;color:#2a2a2a;margin-top:8px;}
.idc-photo{width:96px;height:120px;background:#c9bfa6;border:1px solid #b3a784;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#8a7f63;font-size:11px;flex-shrink:0;}

/* ── EC form mock ── */
.ec{width:620px;max-width:100%;background:#fff;border:1px solid #d7dbe0;box-shadow:0 1px 6px rgba(0,0,0,.08);padding:22px 26px;font-size:11px;color:#222;line-height:1.7;font-family:'Times New Roman',serif;}
.ec-hd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #222;padding-bottom:6px;}
.ec-hd .ec-big{font-size:22px;font-weight:800;letter-spacing:1px;}
.ec-title{text-align:center;font-weight:700;margin:8px 0;}
.ec-band{background:#e9ecef;text-align:center;font-size:10px;padding:3px;border:1px solid #c9ced4;margin:6px 0;}
.ec-row{display:flex;justify-content:space-between;gap:14px;}
.ec-u{border-bottom:1px solid #555;display:inline-block;min-width:120px;font-weight:700;}
.ec-sec{font-weight:700;margin-top:10px;}

/* ── OCR Data Sync modal ── */
.sync{background:#fff;border-radius:10px;width:860px;max-width:96vw;max-height:88vh;display:flex;flex-direction:column;margin:auto;box-shadow:0 20px 60px rgba(0,0,0,.35);}
.sync-hd{padding:18px 22px 10px;}
.sync-hd h3{font-size:18px;}
.sync-hd .sub{color:var(--mut);font-size:12.5px;margin-top:4px;}
.sync-hd .note{color:var(--red);font-size:12px;margin-top:6px;}
.sync-bd{padding:6px 22px;overflow:auto;}
.sync-bd h4{font-size:13px;margin:8px 0;}
.sync table thead th{background:#f6f7f9;}
.sync-st-ok{color:#3b6cb3;font-weight:600;}
.sync-st-cf{color:var(--amber);font-weight:700;}
.cbx{width:18px;height:18px;accent-color:var(--blue);cursor:pointer;}
.sync-ft{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--bd);}

.replica-tag{position:fixed;left:54px;bottom:8px;font-size:10px;color:#fff;background:#6b7280;padding:2px 8px;border-radius:10px;z-index:60;opacity:.8;}

/* ── File type pills (multi-doc) ── */
.type-pills-cell{vertical-align:top;padding-top:10px !important;}
.type-pill{display:inline-block;background:#e6f4ea;color:#1a7a43;border-radius:6px;padding:3px 8px;font-size:11px;font-weight:600;margin:2px 2px 2px 0;line-height:1.3;text-align:center;}
.type-conf{color:#1a7a43;font-size:10px;font-weight:400;}
.st-proc{color:#2563eb;font-weight:600;}
.st-fail{color:#c0392b;font-weight:600;}
/* File list footer */
.fl-foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:6px;}
/* Cross-val passed badge */
.alert-ok-badge{display:inline-flex;align-items:center;justify-content:center;color:#1a7a43;}
.alert-ok-badge svg{width:20px;height:20px;}

/* ── Unified field interaction ── */
.fd-f .val-wrap{flex:1;min-width:0;}
.field-val{cursor:pointer;display:inline-block;max-width:100%;word-break:break-all;line-height:1.5;border-radius:3px;padding:1px 4px;margin:-1px -4px;}
.field-val:hover{background:#f0f6ff;text-decoration:underline;text-decoration-style:dotted;color:#2563eb;}
.field-empty{color:#9aa1ab;font-style:italic;font-size:11px;}
.field-inp{width:100%;border:1.5px solid var(--blue);border-radius:5px;padding:5px 8px;font-size:12.5px;outline:none;font-family:inherit;background:#fff;}
.fd-f.editing{background:#f5f9ff;}
.field-amended{font-size:12px;line-height:1.5;}
.old-val{color:#9aa1ab;text-decoration:line-through;margin-right:4px;}
.new-val{color:#1a7a43;font-weight:600;}
/* Cleaned Check/Done — no badge, just control */
.need-row{background:#fffaf0;}
.check-btn{border:1px solid #d4a820;background:#fff;color:#a87c0a;border-radius:5px;padding:4px 12px;font-size:11.5px;white-space:nowrap;}
.check-btn:hover{background:#fdf3d6;border-color:#a87c0a;}
.done-tag{background:#1a7a43;color:#fff;border-radius:5px;padding:4px 12px;font-size:11.5px;font-weight:600;display:inline-block;}

/* ── Action button hierarchy (3 levels) ── */
/* L1 Corrective — filled blue (primary / recommended) */
.fd-abtn-rec{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:600;}
.fd-abtn-rec:hover{background:var(--blue-d);color:#fff;}
/* L2 Replacement — outlined normal */
.fd-abtn{border:1px solid #d0d5dd;background:#fff;color:#374151;border-radius:6px;padding:7px 14px;font-size:12px;}
.fd-abtn:hover{border-color:#9aa1ab;background:#f9fafb;}
/* L3 Justify & proceed — text-level, always last */
.justify-btn{border:none;background:none;color:#9aa1ab;font-size:11.5px;padding:6px 10px;cursor:pointer;border-left:1px solid #e5e7eb;margin-left:6px;font-family:inherit;}
.justify-btn:hover{color:#b45309;}
/* Hard Fail justify gets a slightly stronger treatment */
.sevbox-hard .justify-btn{color:#b45309;}
/* Justify & proceed — amber card state */
.fd-alert.justified{background:#fffbf0;border-color:#f0d080;border-left-color:#e0a800;opacity:.92;}
.sev-just{background:#fff4e0;color:#b45309;}
.just-note{font-size:11.5px;color:#7a5c0a;font-style:italic;margin:5px 0 2px;padding:5px 9px;background:#fef9ec;border-radius:5px;border-left:3px solid #e0b800;}
/* Resolved (actually fixed) stays green */
.fd-alert.resolved{background:#f1faf3;border-color:#9bd5ab;border-left-color:#1a7a43;}
.fd-resolved-how{font-size:11.5px;color:#1a7a43;margin:4px 0;}
/* Full button set spacing */
.fd-alert-acts{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:10px;}

/* ── NEEDS CHECK removed from label — only row highlight + Verify button ── */
.need,.checked{display:none;}
.done-btn{display:none;}

/* ── Classification modal ── */
.cls-modal{background:#fff;border-radius:10px;width:1100px;max-width:96vw;height:88vh;display:flex;flex-direction:column;margin:auto;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden;}
.cls-hdr{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--bd);gap:4px;}
.cls-blur-bar{display:flex;align-items:center;gap:10px;padding:10px 18px;font-size:12.5px;line-height:1.5;}
.cls-blur-bar.fail{background:#fdeceb;color:#8b3a3a;border-bottom:1px solid #f3bcb9;}
.cls-blur-bar.warn{background:#fef9ec;color:#7a5c0a;border-bottom:1px solid #f0d080;}
.cls-blur-bar > span{flex:1;}
.cls-body{flex:1;display:grid;grid-template-columns:1fr 380px;overflow:hidden;}
.cls-thumbs-panel{overflow:auto;padding:14px 18px;border-right:1px solid var(--bd);}
.cls-thumbs-hdr{font-size:13px;font-weight:600;color:#374151;margin-bottom:10px;}
.cls-thumbs-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;}
.cls-thumb{position:relative;border:2px solid #cfd5dd;border-radius:5px;background:#fff;cursor:pointer;overflow:hidden;aspect-ratio:1/1.3;transition:transform .12s;}
.cls-thumb:hover{transform:translateY(-1px);}
.cls-thumb.selected{border-width:3px;box-shadow:0 0 0 1px #fff inset;}
.cls-thumb.has-blur{box-shadow:0 0 0 1px #dc2626 inset;}
.thumb-mock{width:100%;height:calc(100% - 18px);padding:6px;display:flex;flex-direction:column;}
.thumb-lines{flex:1;display:flex;flex-direction:column;gap:3px;}
.thumb-lines > div{height:2px;background:rgba(0,0,0,.18);border-radius:1px;}
.thumb-lines > div:nth-child(1){width:80%;}
.thumb-lines > div:nth-child(2){width:60%;}
.thumb-lines > div:nth-child(3){width:90%;}
.thumb-lines > div:nth-child(4){width:50%;}
.thumb-lines > div:nth-child(5){width:75%;}
.cls-thumb-n{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:11px;color:#5b6470;background:#fff;padding:2px 0;border-top:1px solid #f1f3f5;}
.cls-thumb-n.active{color:#2563eb;border-bottom:2px solid #2563eb;font-weight:600;}
.thumb-blur-badge{position:absolute;top:3px;right:3px;font-size:9px;font-weight:700;padding:2px 5px;border-radius:3px;letter-spacing:.3px;}
.thumb-blur-badge.fail{background:#dc2626;color:#fff;}
.thumb-blur-badge.warn{background:#e0a800;color:#fff;}
.cls-results-panel{padding:14px 18px;background:#fafbfc;overflow:auto;}
.cls-results-hdr{font-size:13px;font-weight:700;color:#374151;margin-bottom:10px;}
.cls-cards{display:flex;flex-direction:column;gap:10px;}
.cls-card{border:2px solid #cfd5dd;border-radius:8px;padding:12px 14px;background:#fff;cursor:pointer;transition:transform .12s;}
.cls-card:hover{transform:translateY(-1px);}
.cls-card.selected{box-shadow:0 0 0 1px rgba(0,0,0,.04);}
.cls-card-row{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.cls-card-type{font-size:13px;font-weight:700;color:#202124;}
.cls-card-conf{font-size:13px;font-weight:700;}
.cls-card-range{font-size:11.5px;color:#5b6470;display:flex;align-items:center;gap:6px;}
.cls-card-acts{font-size:11.5px;}
.cls-card-acts .lnk{color:#5b6470;}
.cls-card-acts .lnk:first-child{color:#2563eb;}
.cls-card-blur{font-size:11px;line-height:1.5;margin-top:8px;padding:5px 8px;border-radius:4px;}
.cls-card-blur.fail{background:#fdeceb;color:#8b3a3a;}
.cls-card-blur.warn{background:#fef9ec;color:#7a5c0a;}
.cls-add-btn{margin-top:10px;width:100%;border:1.5px dashed #2563eb;background:#f0f6ff;color:#2563eb;border-radius:7px;padding:11px;font-size:12.5px;font-weight:600;cursor:pointer;}
.cls-add-btn:hover{background:#2563eb;color:#fff;}
.cls-add-panel{margin-top:10px;border:1.5px dashed #2563eb;background:#f0f6ff;border-radius:7px;padding:14px;}
.cls-add-hdr{font-size:12.5px;font-weight:700;color:#2563eb;}
.cls-add-actions{display:flex;gap:8px;margin-top:14px;}
.cls-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 18px;border-top:1px solid var(--bd);background:#fff;}

/* ── 3-tier summary bar at top of classify modal ── */
.cls-tier-bar{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--bd);background:#fbfcfd;flex-wrap:wrap;}
.tier-chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:4px 11px;border-radius:11px;font-weight:600;}
.tier-pass{background:#e6f4ea;color:#1a7a43;}
.tier-warn{background:#fef9ec;color:#b45309;}
.tier-fail{background:#fdeceb;color:#c0392b;}
.tier-skipped{background:#eef0f3;color:#5b6470;}
.oc-dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.oc-dot.pass{background:#1a7a43;} .oc-dot.warn{background:#e0a800;} .oc-dot.fail{background:#dc2626;} .oc-dot.neutral{background:#9aa1ab;}

/* ── Per-segment OCR outcome line ── */
.cls-outcome{font-size:11.5px;line-height:1.5;margin-top:8px;padding:6px 10px;border-radius:5px;display:flex;flex-direction:column;gap:3px;}
.cls-outcome.pass{background:#f1faf3;color:#1a7a43;flex-direction:row;align-items:center;gap:6px;}
.cls-outcome.warn{background:#fef9ec;color:#7a5c0a;}

.cls-outcome .oc-help{font-size:10.5px;opacity:.85;padding-left:14px;}

/* Always-visible per-page action chips on segment cards */
.oc-page-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;padding-left:14px;}
.oc-page-chip{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1px solid currentColor;border-radius:5px;padding:2px 4px 2px 8px;font-size:11px;font-weight:600;line-height:1.4;}
.oc-page-chip.fail{color:#c0392b;}
.oc-page-chip.warn{color:#b45309;}
.oc-page-chip.skipped{color:#5b6470;}
.oc-act{border:none;background:transparent;color:inherit;font-size:10.5px;padding:2px 6px;border-radius:3px;cursor:pointer;font-weight:600;border-left:1px solid rgba(0,0,0,.1);}
.oc-act:hover{background:rgba(0,0,0,.06);}

/* Persistent corner button on problem thumbnails */
.thumb-corner-btn{position:absolute;bottom:22px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;color:#1d4ed8;border:1px solid #1d4ed8;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.18);z-index:2;}
.thumb-corner-btn:hover{background:#1d4ed8;color:#fff;}

/* ── Thumb hover actions + tier visuals ── */
.cls-thumb.tier-warn{box-shadow:0 0 0 1px #e0a800 inset;}
.cls-thumb.is-skipped{opacity:.55;filter:grayscale(.4);}
.thumb-blur-badge.skipped{background:#5b6470;color:#fff;}
.thumb-actions{position:absolute;top:0;left:0;right:0;bottom:18px;background:rgba(15,23,42,.78);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;opacity:0;transition:opacity .12s;}
.cls-thumb:hover .thumb-actions{opacity:1;}
.thumb-act{background:#fff;color:#1d4ed8;border:none;border-radius:4px;padding:3px 10px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;}
.thumb-act:hover{background:#e8f0fe;}

/* ── Replace-page mini panel ── */
.rep-drop{margin-top:12px;border:1.5px dashed #c5d3f6;background:#f7fbff;border-radius:8px;padding:24px;text-align:center;}
.rep-drop-icon{font-size:24px;color:#1d4ed8;margin-bottom:8px;}

// APPLIED / DRAFT bucket for a rule type
function ruleApplied(fileId,id){var ov=(S.ruleMap[fileId]||{})[id];var it=ruleItemF(fileId,id);return ov||(it?it.ai:'exclude');}
function ruleDraft(fileId,id){var d=(S.ruleDraft[fileId]||{})[id];return d||ruleApplied(fileId,id);}
function setRule(fileId,id,bucket){if(!S.ruleDraft[fileId])S.ruleDraft[fileId]={};S.ruleDraft[fileId][id]=bucket;render();}
function pendingRules(fileId){
  var d=S.ruleDraft[fileId]||{},out=[];
  Object.keys(d).forEach(function(id){if(d[id]!==ruleApplied(fileId,id))out.push(id);});
  // Sales-补录 new types not yet committed to a rule are pending CED confirmation (even at AI default)
  newTypeGaps(fileId).forEach(function(c){if(out.indexOf(c.id)===-1)out.push(c.id);});
  return out;
}
function confirmRuleChanges(fileId){
  var pend=pendingRules(fileId);
  if(!pend.length)return;
  if(!S.ruleMap[fileId])S.ruleMap[fileId]={};
  if(!S.incomeLog[fileId])S.incomeLog[fileId]=[];
  var now=new Date();var ts=('0'+now.getHours()).slice(-2)+':'+('0'+now.getMinutes()).slice(-2);
  pend.forEach(function(id){
    var it=ruleItemF(fileId,id);
    var to=bucketLabel(it.kind,ruleDraft(fileId,id));
    var from=it.custom&&!(S.ruleMap[fileId]||{})[id]?'(新补录)':bucketLabel(it.kind,ruleApplied(fileId,id));
    S.incomeLog[fileId].unshift({t:ts,raw:it.type,from:from,to:to});
    S.ruleMap[fileId][id]=ruleDraft(fileId,id);
  });
  S.ruleDraft[fileId]={};
  render();
}
// Recompute one month from the APPLIED rule mapping.
//   buckets        = income-classified sums (exclude dropped)
//   grossAll/dedAll= sum of ALL captured lines (for OCR reconciliation, step ④)
//   incomeGross    = sum of income buckets (exclude dropped) → verifiable income
function computeMonth(fileId,mIdx){
  var m=PAYSLIP_MONTHS[mIdx];var out={};
  EARNING_BUCKETS.forEach(function(b){out[b.key]=0;});
  DEDUCTION_BUCKETS.forEach(function(b){out[b.key]=0;});
  var grossAll=0,dedAll=0;
  lineItemsAll(fileId).forEach(function(it){
    var ov=(S.lineAmt[fileId]||{})[mIdx+'|'+it.type];
    var amt;
    if(it.custom){ if(ov==null)return; amt=ov; }        // 补录 line: amount comes ONLY from Sales entry, per month
    else { var base=(it.kind==='earning'?m.earn:m.ded)[it.type]; if(base==null)return; amt=(ov!=null?ov:base); }
    if(it.kind==='earning')grossAll+=amt;else dedAll+=amt;
    var bucket=ruleApplied(fileId,it.id);
    if(bucket==='exclude')return;
    out[bucket]=(out[bucket]||0)+amt;
  });
  var incomeGross=EARNING_BUCKETS.reduce(function(s,b){return b.key==='exclude'?s:s+(out[b.key]||0);},0);
  out.gross_salary=grossAll;                 // printed gross = all earnings
  out.deduction_total_deductions=dedAll;     // printed total deductions = all deductions
  out.net_pay_amount=grossAll-dedAll;        // printed net
  out.grossAll=grossAll; out.dedAll=dedAll; out.incomeGross=incomeGross;
  out.ocrGross=m.ocrGross; out.ocrDed=m.ocrDed; out.ocrNet=m.ocrNet;
  // validation flags (computed vs OCR printed)
  out.okGross=Math.abs(grossAll-m.ocrGross)<0.01;
  out.okDed=Math.abs(dedAll-m.ocrDed)<0.01;
  out.okNet=Math.abs((grossAll-dedAll)-m.ocrNet)<0.01;
  return out;
}
// Average verifiable (income) monthly income across the 3 months
function payslipAvgIncome(fileId){
  var sum=0;for(var i=0;i<PAYSLIP_MONTHS.length;i++)sum+=computeMonth(fileId,i).incomeGross;
  return sum/PAYSLIP_MONTHS.length;
}
// Collect step-② (missing required field) + step-④ (validation mismatch) issues
function payslipIssues(fileId){
  var missing=[],mismatch=[];
  // ② required income buckets that received no line item
  var required=['earning_basic_salary'];
  var c0=computeMonth(fileId,0);
  required.forEach(function(k){if(!c0[k])missing.push(k);});
  // ④ per-month reconciliation
  PAYSLIP_MONTHS.forEach(function(m,i){
    var c=computeMonth(fileId,i);
    if(!c.okGross)mismatch.push({month:m.month,what:'Gross',calc:c.grossAll,ocr:c.ocrGross});
    if(!c.okDed)mismatch.push({month:m.month,what:'Total Deductions',calc:c.dedAll,ocr:c.ocrDed});
    if(!c.okNet)mismatch.push({month:m.month,what:'Net Pay',calc:c.grossAll-c.dedAll,ocr:c.ocrNet});
  });
  return {missing:missing,mismatch:mismatch};
}

function setLineAmt(fileId,mIdx,type,val){var n=parseFloat((''+val).replace(/[^0-9.]/g,''));if(isNaN(n))return;if(!S.lineAmt[fileId])S.lineAmt[fileId]={};S.lineAmt[fileId][mIdx+'|'+type]=n;render();}

// ── QUALITY DATA — attached to FILES directly, surfaced inside the file list ──
// File quality property: pass | warn | fail; issues = [{msg,tip}]; score; override note in S.qcOverrides
// ── CLASSIFICATIONS (replaces FILE_QC) ────────────────────────────
// Classification happens FIRST. Each file has segments by page range.
// Blur detection runs PER PAGE after classification confirmed.
// Per-page blur lets us flag specific pages even within a clean segment.
var CLASSIFICATION_COLORS={
  Mykad:'#2563eb','Driving License':'#1a7a43',Payslip:'#e0a800',
  'Individual Bank Statement':'#7c3aed','EPF Statement':'#7c3aed',
  VSO:'#e0a800','EC Form':'#7c3aed',Passport:'#dc2626','Form B':'#7c3aed'
};
function classifColor(t){return CLASSIFICATION_COLORS[t]||'#5b6470';}
var CLASSIFICATIONS={
  multidoc:{confirmed:true,totalPages:19,segments:[
    {type:'Mykad',range:'1-2',conf:99},
    {type:'Driving License',range:'3',conf:99},
    {type:'Payslip',range:'4-6',conf:50},
    {type:'Individual Bank Statement',range:'7-19',conf:50}
  ],pageBlur:{4:'warn',15:'fail'}}, // page 4 marginal, page 15 fail — shows all 3 tiers
  vso:{confirmed:false,totalPages:1,segments:[{type:'VSO',range:'1',conf:50}],pageBlur:{1:'fail'}},
  mykad:{confirmed:true,totalPages:2,segments:[{type:'Mykad',range:'1-2',conf:99}],pageBlur:{2:'warn'}}, // page 2 marginal
  epf:{confirmed:true,totalPages:1,segments:[{type:'EPF Statement',range:'1',conf:99}],pageBlur:{}},
  ec:{confirmed:true,totalPages:1,segments:[{type:'EC Form',range:'1',conf:99}],pageBlur:{}}
};
if(!S.qcOverrides)S.qcOverrides={};      // {fileId: noteText} — overrides blur block for a whole file

// Parse "1-3" or "5" into [start,end]
function parseRange(r){
  if(!r)return [0,0];
  var p=String(r).split('-');
  return [parseInt(p[0])||0, parseInt(p[1]||p[0])||0];
}
// Aggregate per-page blur to file-level summary, accounting for user actions.
// 'skipped' pages are subtracted from fail/warn (the user accepted the loss).
function fileBlurSummary(fileId){
  var c=CLASSIFICATIONS[fileId];
  if(!c)return {failPages:[],warnPages:[],skippedPages:[],overridden:false};
  var pb=c.pageBlur||{},skips=(S.pageSkipped||{})[fileId]||{};
  var fail=[],warn=[],skipped=[];
  Object.keys(pb).forEach(function(k){
    var p=parseInt(k);
    if(skips[p]){skipped.push(p);return;}
    if(pb[k]==='fail')fail.push(p);
    else if(pb[k]==='warn')warn.push(p);
  });
  [fail,warn,skipped].forEach(function(a){a.sort(function(x,y){return x-y;});});
  return {failPages:fail,warnPages:warn,skippedPages:skipped,overridden:!!(S.qcOverrides||{})[fileId]};
}
// Per-segment blur status (any blurry page in range → segment is flagged)
function segmentBlur(fileId,range){
  var c=CLASSIFICATIONS[fileId];if(!c||!c.pageBlur)return {status:'pass',pages:[]};
  var r=parseRange(range),fail=[],warn=[];
  for(var p=r[0];p<=r[1];p++){
    if(c.pageBlur[p]==='fail')fail.push(p);
    else if(c.pageBlur[p]==='warn')warn.push(p);
  }
  return {status:fail.length?'fail':warn.length?'warn':'pass',pages:fail.concat(warn)};
}

// ── Compat shim: fileQcStatus drives the existing detail modal / overrides flow ──
function fileQcStatus(fileId){
  var c=CLASSIFICATIONS[fileId];if(!c||!c.confirmed)return null;
  var blur=fileBlurSummary(fileId);
  if(blur.overridden)return {status:'override',score:32,issues:buildBlurIssues(blur)};
  if(blur.failPages.length)return {status:'fail',score:32,issues:buildBlurIssues(blur)};
  if(blur.warnPages.length)return {status:'warn',score:72,issues:buildBlurIssues(blur)};
  return {status:'pass',score:95};
}
function buildBlurIssues(blur){
  var iss=[];
  if(blur.failPages.length){
    iss.push({msg:'Page '+blur.failPages.join(', ')+(blur.failPages.length>1?' are':' is')+' blurry — text is not readable',
      tip:'Replace just these page(s), or re-scan the whole document at 300 DPI'});
  }
  if(blur.warnPages.length){
    iss.push({msg:'Page '+blur.warnPages.join(', ')+' marginal — OCR accuracy may be reduced',
      tip:'Retake with steady hands and even lighting if possible'});
  }
  return iss;
}
function qcStatusChip(fileId){
  var c=CLASSIFICATIONS[fileId];
  if(!c)return '';
  if(!c.confirmed)return '<span class="stage-pill sp-extracting" style="cursor:pointer;" onclick="openClassify(\''+fileId+'\')"><span class="sp-spin">⟳</span> Classifying…</span>';
  var blur=fileBlurSummary(fileId);
  if(blur.overridden)return '<span class="stage-pill" style="background:#fffbf0;color:#b45309;cursor:pointer;" onclick="openClassify(\''+fileId+'\')">&#9888; Quality overridden</span>';
  if(blur.failPages.length)return '<span class="stage-pill sp-failed" style="cursor:pointer;" onclick="openClassify(\''+fileId+'\')">&#10007; Page '+blur.failPages.join(',')+' blurry</span>';
  if(blur.warnPages.length)return '<span class="stage-pill" style="background:#fef9ec;color:#b45309;cursor:pointer;" onclick="openClassify(\''+fileId+'\')">&#9888; '+blur.warnPages.length+' marginal page'+(blur.warnPages.length>1?'s':'')+'</span>';
  return '';
}
function qcDescSummary(fileId){
  var c=CLASSIFICATIONS[fileId];if(!c)return '';
  if(!c.confirmed)return '<span style="font-size:11px;color:#1d4ed8;" onclick="openClassify(\''+fileId+'\')" class="lnk">Awaiting classification…</span>';
  var blur=fileBlurSummary(fileId);
  if(blur.overridden)return '<span class="muted" style="font-size:11px;">Overridden by user</span>';
  if(blur.failPages.length)return '<span style="font-size:11px;color:#c0392b;" onclick="openClassify(\''+fileId+'\')" class="lnk">Page '+blur.failPages.join(',')+' blurry &mdash; OCR skipped for these</span>';
  if(blur.warnPages.length)return '<span style="font-size:11px;color:#b45309;" onclick="openClassify(\''+fileId+'\')" class="lnk">Page '+blur.warnPages.join(',')+' marginal quality</span>';
  return '';
}

function renderClassifyModal(){
  var fileId=S.classifyFileId;
  if(!fileId)return '';
  var c=CLASSIFICATIONS[fileId];
  var file=FILES.find(function(f){return f.id===fileId;})||{name:fileId};
  if(!c)return '';

  // Build page → segment-index map for coloring
  var pageSeg={};
  c.segments.forEach(function(s,i){
    var r=parseRange(s.range);
    for(var p=r[0];p<=r[1];p++)pageSeg[p]=i;
  });

  // Page thumbnails — 3-tier visual + hover actions for blurry pages
  var skips=(S.pageSkipped||{})[fileId]||{};
  var thumbs='';
  for(var p=1;p<=c.totalPages;p++){
    var segIdx=pageSeg[p];
    var seg=segIdx!=null?c.segments[segIdx]:null;
    var color=seg?classifColor(seg.type):'#cfd5dd';
    var isSel=segIdx===S.classifSelectedSeg;
    var blur=(c.pageBlur||{})[p];
    var isSkipped=skips[p];
    // Tier badge
    var tierCls=isSkipped?'skipped':blur==='fail'?'fail':blur==='warn'?'warn':'';
    var blurBadge=isSkipped?'<div class="thumb-blur-badge skipped">Skipped</div>'
                  :blur==='fail'?'<div class="thumb-blur-badge fail">&#9888; Blurry</div>'
                  :blur==='warn'?'<div class="thumb-blur-badge warn">&#9888; Marginal</div>':'';
    // Persistent corner button (always visible) + larger hover panel for problem pages
    var pageActions='';
    if(blur||isSkipped){
      pageActions='<button class="thumb-corner-btn" title="Replace page '+p+'" onclick="openReplacePage(event,\''+fileId+'\','+p+')">&#8634;</button>'
        +'<div class="thumb-actions">'
          +'<button class="thumb-act" title="Replace this page" onclick="openReplacePage(event,\''+fileId+'\','+p+')">&#8634; Replace</button>'
          +(isSkipped
            ?'<button class="thumb-act" title="Un-skip" onclick="event.stopPropagation();unSkipPage(\''+fileId+'\','+p+')">Un-skip</button>'
            :'<button class="thumb-act" title="Skip this page" onclick="event.stopPropagation();skipPage(\''+fileId+'\','+p+')">Skip</button>')
        +'</div>';
    }
    thumbs+='<div class="cls-thumb tier-'+tierCls+(isSel?' selected':'')+(blur==='fail'&&!isSkipped?' has-blur':'')+(isSkipped?' is-skipped':'')+'" onclick="selectSegment('+(segIdx!=null?segIdx:0)+')" style="border-color:'+color+';">'
      +pageThumbMock(seg?seg.type:'',p)
      +blurBadge
      +pageActions
      +'<div class="cls-thumb-n'+(isSel?' active':'')+'">'+p+'</div>'
    +'</div>';
  }

  // Classification cards with 3-tier OCR outcome
  var cards=c.segments.map(function(s,i){
    var color=classifColor(s.type);
    var isSel=i===S.classifSelectedSeg;
    var conf=s.conf===null?'Manual':s.conf+'%';
    var confCol=s.conf===null?'#5b6470':s.conf>=90?'#1a7a43':'#e0a800';
    // Build tier-aware OCR-outcome line per segment, accounting for skipped pages
    var r=parseRange(s.range);
    var fail=[],warn=[],skipped=[];
    var segSkips=(S.pageSkipped||{})[fileId]||{};
    for(var pg=r[0];pg<=r[1];pg++){
      var b=(c.pageBlur||{})[pg];

      else if(b==='warn')warn.push(pg);

        +'</span>'
      +'</div>'
      +outcomeHtml
    +'</div>';
  }).join('');

  // Add panel (dashed) or button
  var typeOpts=Object.keys(CLASSIFICATION_COLORS).map(function(t){return '<option value="'+t+'">'+t+'</option>';}).join('');
  var addBlock=S.classifAddOpen
    ?'<div class="cls-add-panel">'
      +'<div class="cls-add-hdr">&#43; Add Manual Classification / Split Point</div>'
      +'<div style="margin:10px 0 4px;font-size:12px;color:#374151;">File Type</div>'

  // 3-tier summary bar — counts of Pass / Marginal / Fail (+ Skipped) at the top

// Semantic status chip — color = meaning, not decoration
function stChip(fst,ost){
  var fstChip='<span class="muted">&mdash;</span>';
  if(fst){var m={'OCR Processed':{c:'sc-green',i:'✓'},'Upload Succeeded':{c:'sc-green',i:'✓'},'OCR Processing':{c:'sc-blue',i:'⟳'},'Queued':{c:'sc-grey',i:'·'}};var x=m[fst]||{c:'sc-grey',i:''};fstChip='<span class="status-chip '+x.c+'">'+x.i+' '+fst+'</span>';}
  var ostChip='<span class="muted">&mdash;</span>';
  if(ost){var n={'Validation Succeeded':{c:'sc-green',i:'✓'},'OCR Succeeded':{c:'sc-green',i:'✓'},'Validation Failed':{c:'sc-red',i:'✗'},'Validation passed':{c:'sc-green',i:'✓'},'Validation failed':{c:'sc-red',i:'✗'},'Validating':{c:'sc-amber',i:'⟳'},'Extracting text...':{c:'sc-blue',i:'⟳'}};var y=n[ost]||{c:'sc-amber',i:'⟳'};ostChip='<span class="status-chip '+y.c+'">'+y.i+' '+ost+'</span>';}
  return {fst:fstChip,ost:ostChip};
}
function renderOcrBanner(){
  // Count pending classifications & blocked-by-blur files
  var classifPending=Object.keys(CLASSIFICATIONS).filter(function(k){return !CLASSIFICATIONS[k].confirmed;}).length;
  var qcBlocked=Object.keys(CLASSIFICATIONS).filter(function(k){
    var c=CLASSIFICATIONS[k];if(!c.confirmed)return false;
    var b=fileBlurSummary(k);return b.failPages.length&&!b.overridden;
  }).length;
  if(S.ocrView!=='processing'){
    // Done state: if there are still blocks, show a slim banner; otherwise nothing
    if(qcBlocked){
      return '<div class="ocr-banner" style="background:#fdeceb;border-color:#f3bcb9;">'
        +'<div class="ocr-banner-icon">&#10007;</div>'
        +'<div class="ocr-banner-body">'
          +'<div class="ocr-banner-title" style="color:#c0392b;">'+qcBlocked+' file'+(qcBlocked>1?'s':'')+' blocked at quality check &mdash; AI recognition skipped</div>'
          +'<div class="ocr-banner-sub" style="color:#8b3a3a;">Open the file row to replace with a clearer copy, or proceed with a documented override (audit-logged).</div>'
        +'</div>'
      +'</div>';
    }
    return '';
  }
  // Processing state: 5-stage pipeline — Upload → Classify → Quality → OCR → Cross-Val
  var classifStageHtml=classifPending
    ?'<span class="ocr-stage active"><span class="sp-spin">⟳</span> Classifying &mdash; '+classifPending+' pending</span>'
    :'<span class="ocr-stage done">&#10003; Classified</span>';
  var qcStageHtml=classifPending
    ?'<span class="ocr-stage pend">Quality check</span>'
    :qcBlocked
    ?'<span class="ocr-stage" style="background:#fdeceb;color:#c0392b;font-weight:700;">&#10007; Quality &mdash; '+qcBlocked+' blocked</span>'
    :'<span class="ocr-stage done">&#10003; Quality check</span>';
  var ocrActive=!classifPending&&!qcBlocked;
  return '<div class="ocr-banner'+(qcBlocked?' ocr-banner-warn':'')+'">'
    +'<div class="ocr-banner-icon">'+(qcBlocked?'&#9888;':'⏳')+'</div>'
    +'<div class="ocr-banner-body">'
      +'<div class="ocr-banner-title">'+(qcBlocked?'Processing — some files need attention':classifPending?'Processing — '+classifPending+' file'+(classifPending>1?'s':'')+' awaiting classification':'Processing files in background — this usually takes 10–30 minutes')+'</div>'
      +'<div class="ocr-banner-sub">You can leave this page and return at any time. Processing will continue automatically.</div>'
      +'<div class="ocr-pipeline">'
        +'<span class="ocr-stage done">&#10003; Upload</span>'
        +'<span class="ocr-stage-arrow">›</span>'
        +classifStageHtml
        +'<span class="ocr-stage-arrow">›</span>'
        +qcStageHtml
        +'<span class="ocr-stage-arrow">›</span>'
        +'<span class="ocr-stage '+(ocrActive?'active':'pend')+'">'+(ocrActive?'<span class="sp-spin">⟳</span> ':'')+'OCR extraction</span>'
        +'<span class="ocr-stage-arrow">›</span>'
        +'<span class="ocr-stage pend">Cross-validation</span>'
      +'</div>'
      +'<div class="ocr-banner-hint">Started at 14:22 &nbsp;·&nbsp; <button class="btn btn-sm" style="padding:2px 8px;font-size:11px;" onclick="S.ocrView=\'done\';render();">Refresh status</button> &nbsp;·&nbsp; <a class="lnk" onclick="S.ocrView=\'done\';render();">Preview: jump to completed state</a></div>'
    +'</div>'
  +'</div>';
}
function renderFileList(){
  var rows=FILES.map(function(f){
    var typeCell='';
    if(f.typePills&&f.typePills.length){
      typeCell=f.typePills.map(function(p){
        return '<span class="type-pill">'+p.label+' ('+p.pages+')</span>';
      }).join('');
    } else if(f.type){
      typeCell='<span class="pill" style="background:#eef3fb;color:#2c5fa8;">'+f.type+'</span>';
    }
    // Pipeline stages: File Status = upstream stage (Quality / OCR), File OCR Status = downstream (Validation)
    var sc=stChip(f.fileStatus,f.ocrStatus);
    var classif=CLASSIFICATIONS[f.id];
    var pending=classif&&!classif.confirmed;
    var qcSt=fileQcStatus(f.id);
    var qcBlocked=qcSt&&qcSt.status==='fail';
    var qcOverridden=qcSt&&qcSt.status==='override';
    var qcWarn=qcSt&&qcSt.status==='warn';

    if(pending){
      // Step 1: classification not yet confirmed — block everything downstream
      sc.fst='<span class="stage-pill sp-extracting" style="cursor:pointer;" onclick="openClassify(\''+f.id+'\')"><span class="sp-spin">⟳</span> Classifying…</span>';
      sc.ost='<span class="muted">&mdash; pending classification</span>';
    } else if(S.ocrView==='processing'){
      if(qcBlocked){
        sc.fst='<span class="stage-pill sp-complete">&#10003; Classified</span><br>'+qcStatusChip(f.id);
        sc.ost='<span class="muted">&mdash; OCR skipped on blurry pages</span>';
      } else if(qcOverridden){
        sc.fst='<span class="stage-pill sp-extracting"><span class="sp-spin">⟳</span> Extracting text…</span><br>'+qcStatusChip(f.id);
        sc.ost='<span class="muted">&mdash;</span>';
      } else {
        var stages={'multidoc':'extracting','vso':'queued','mykad':'complete','epf':'complete','ec':'complete','xlsx':'complete','consent':'complete'};
        var st=stages[f.id]||'complete';
        var stChip2=st==='extracting'?'<span class="stage-pill sp-extracting"><span class="sp-spin">⟳</span> Extracting text…</span>'
                :st==='queued'?'<span class="stage-pill sp-queued">· Queued</span>'
                :'<span class="stage-pill sp-complete">✓ OCR done</span>';
        sc.fst=qcWarn?(stChip2+'<br>'+qcStatusChip(f.id)):stChip2;
        sc.ost=st==='complete'?'<span class="stage-pill sp-validating">⟳ Validating…</span>':'<span class="muted">&mdash;</span>';
      }
    } else {
      if(qcBlocked){
        sc.fst='<span class="stage-pill sp-complete">&#10003; Classified</span><br>'+qcStatusChip(f.id);
        sc.ost='<span class="muted">&mdash; OCR skipped on blurry pages</span>';
      } else if(qcOverridden||qcWarn){
        sc.fst=(sc.fst||'')+'<br>'+qcStatusChip(f.id);
      }
    }
    // Description cell now carries Quality info when it matters
    var qcSummary=qcDescSummary(f.id);
    var descCell=qcSummary||'<span class="aic" title="Add justification note" style="cursor:pointer;">'+IC.edit+'</span>';
    return '<tr>'
      +'<td><input type="checkbox" class="cbx"></td>'
      +'<td><div class="fn">'+f.name+'</div><div class="muted" style="font-size:10.5px;">('+f.size+')</div></td>'
      +'<td>'+f.subject+'</td>'
      +'<td><a class="lnk">'+f.cat+'</a></td>'  // blue = clickable only
      +'<td class="type-pills-cell">'+typeCell+'</td>'
      +'<td style="text-align:center;font-size:12px;color:#5b6470;">'+f.ocr+'</td>'
      +'<td>'+sc.fst+'</td>'
      +'<td>'+sc.ost+'</td>'
      +'<td style="text-align:center;">'+descCell+'</td>'
      +'<td class="muted" style="font-size:11px;">'+f.time+'</td>'
      +'<td class="muted" style="font-size:11px;">'+f.src+'</td>'
      +'<td>'+actIcons(f)+'</td>'
    +'</tr>';
  }).join('');
  return renderOcrBanner()
    +'<div class="filters">'
      +'<input class="inp" placeholder="Search values">'
      +'<select class="sel"><option>Subject</option></select>'
      +'<select class="sel"><option>Category</option></select>'
      +'<select class="sel"><option>File Status</option></select>'
      +'<button class="btn btn-pri btn-sm">'+IC.search+' Search</button>'
      +'<button class="btn btn-sm">'+IC.refresh+' Reset Filters</button>'
      +'<button class="btn btn-sm" disabled>'+IC.dl+' Download</button>'
      +'<button class="btn btn-sm">'+IC.refresh+' Refresh</button>'
    +'</div>'
    +'<table>'
      +'<thead><tr>'
        +'<th><input type="checkbox" class="cbx"></th><th>File Name</th><th>Subject</th><th>Category</th><th>File Type</th><th>OCR Flag</th><th>File Status</th><th>File OCR Status</th><th>Description</th><th>Upload Time &#8645;</th><th>Source</th><th>Action</th>'
      +'</tr></thead>'
      +'<tbody>'+rows+'</tbody>'
    +'</table>'
    +'<div class="fl-foot">'
      +'<div class="pager"><span>&lsaquo;</span><span class="pg-num">1</span><span>&rsaquo;</span><span>10 / page &#9662;</span></div>'
      +'<div style="display:flex;gap:10px;">'
        +'<button class="btn" onclick="closeDocs()">Back To List</button>'
        +'<button class="btn btn-pri" '+(S.ocrView==='processing'?'disabled title="Wait for processing to complete"':'')+'>'
          +(S.ocrView==='processing'?'⏳ Processing…':'Submit for Verification (Application)')

        +'<span class="aic" title="Download">'+IC.dl+'</span>'
        +'<span class="aic" title="Delete" style="color:#c0392b;">&#215;</span>'
      +'</div></td>'
