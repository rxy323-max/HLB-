/* ── ① Source line items (raw OCR, bilingual, editable) — flat groups by pay period ── */
function renderLineItems(fileId){
  var lv=S.lineVerified[fileId]||{};
  var ev=S.eyeVerified[fileId]||{};
  var flash=S.flash||{};
  var clean=(S.role==='ced');   // CED receives a file Sales has already verified — present it clean
  var issues=payslipIssues(fileId);
  var justMap=S.justifiedAlerts[fileId]||{};
  var missingKeys=clean?[]:issues.missing.filter(function(k){return !justMap['miss:'+k];});
  var missingLabels={'earning_basic_salary':'Basic Salary','earning_overtime_pay':'Overtime Pay','earning_total_allowances':'Total Allowances','earning_bonus_commission':'Bonus / Commission','deduction_epf_employee':'EPF (Employee)','deduction_pcb_tax':'Tax (PCB)'};

  // Unified verify cell: a button while pending, a quiet "✓ Verified" mark once done.
  function vcell(verified,onclick){
    if(verified)return '<span class="li2-vcol"><span class="li2-vmark"><span class="ck">&#10003;</span> Verified</span></span>';
    return '<span class="li2-vcol"><button class="li2-vbtn" onclick="'+onclick+'">Verify</button></span>';
  }

  // A standard line-item row: [locate] [name+marker] [amount] [verify]
  function row(it,mIdx){
    var rowKey=mIdx+'|'+it.type;
    var draft=(S.lineAmtDraft[fileId]||{})[rowKey];
    var applied=(S.lineAmt[fileId]||{})[rowKey];
    var base=it.custom?null:baseAmt(mIdx,it.type);
    var effApplied=(applied!=null?applied:base);
    var dispVal=(draft!=null?draft:effApplied);
    var isPending=(draft!=null&&draft!==effApplied);                       // typed, not applied yet
    var isEdited=(!isPending&&applied!=null&&base!=null&&applied!==base);  // committed change from OCR
    var inpCls=isPending?'pending':(isEdited?'edited':'');
    var marker=isPending?'<span class="li2-edit-tag pend">Pending</span>'
      :(isEdited?'<span class="li2-edit-tag">Edited</span>':'');
    var tag=it.custom?'<span class="li2-new">Added</span>':'';
    var rm=it.custom?'<span class="li2-rm" onclick="removeCustomLine(\''+fileId+'\',\''+it.id+'\')" title="Remove">&times;</span>':'';
    var flagged=it.eyeCheck&&!it.custom&&mIdx===0;   // eyeball-check the most recent period only; older months are reference
    var verified=clean||(flagged&&lv[rowKey]);
    var vcol=flagged?vcell(verified,'verifyLineRow(\''+fileId+'\','+mIdx+',\''+it.type+'\')'):'<span class="li2-vcol"></span>';
    var rowCls='li2-row'+(it.custom?' li2-cust':'')+((flagged&&!verified)?' needs-check':'')+(flash[rowKey]?' li2-flash':'');
    return '<div class="'+rowCls+'" id="li-'+it.id+'-'+mIdx+'">'
      +'<span class="li2-name">'+it.ms+'<span class="li2-en">'+it.en+'</span>'+tag+marker+'</span>'
      +'<span class="li2-amt">'
        +'<span class="li2-cur">RM</span>'
        +'<input value="'+(dispVal!=null?money(dispVal):'')+'"'+(dispVal==null?' placeholder="Enter amount"':'')+' onchange="setLineAmt(\''+fileId+'\','+mIdx+',\''+it.type+'\',this.value)" class="'+inpCls+'">'
        +rm
      +'</span>'
      +vcol
    +'</div>';
  }

  // A document-information row (employer, IC, commission, EPF): [name] [value] [verify]
  function docRow(ei){
    var verified=clean||!!ev[ei.id];
    var key='doc|'+ei.id;
    var vcol=vcell(verified,'verifyEyeItem(\''+fileId+'\',\''+ei.id+'\')');
    return '<div class="li2-row'+((!verified)?' needs-check':'')+(flash[key]?' li2-flash':'')+'" id="doc-'+ei.id+'">'
      +'<span class="li2-name">'+ei.label+'</span>'
      +'<span class="li2-docval">'+ei.val+'</span>'
      +vcol
    +'</div>';
  }

  // Missing field placeholder row (group 1 only): prompts Add or Skip inline
  function missingRow(k){
    var label=missingLabels[k]||k.replace(/earning_|deduction_/g,'').replace(/_/g,' ');
    return '<div class="li2-row li2-missing">'
      +'<span class="li2-name">'+label+'<span class="li2-misstag">NOT DETECTED</span></span>'
      +'<span class="li2-amt"><button class="li2-vbtn" onclick="openAddLine(\''+fileId+'\',\''+k+'\',0)">Add Item</button></span>'
      +'<span class="li2-vcol"><button class="li2-vbtn skip" onclick="openJustify(\''+fileId+'\',\'miss:'+k+'\')">Skip</button></span>'
    +'</div>';
  }

  var all=lineItemsAll(fileId);
  var periodLabels=['Most recent payslip','Previous month','Earlier payslip'];

  // Region 1 — Document Information (same heading level as each Pay Period, not a separate card)
  var docPending=eyeItems().filter(function(ei){return !(clean||ev[ei.id]);}).length;
  var docGroup='<div class="li2-group">'
    +'<div class="li2-ghd">'
      +'<span class="li2-gnum">Document Information</span>'
      +'<span class="li2-gtag'+(docPending?'':' done')+'">'+(docPending?docPending+' to verify':'&#10003; All verified')+'</span>'
    +'</div>'
    +eyeItems().map(docRow).join('')
  +'</div>';

  // Regions 2..n — one per pay period
  var groupsHtml=PAYSLIP_MONTHS.map(function(m,mIdx){
    var hasEdit=all.some(function(it){var k=mIdx+'|'+it.type;return (S.lineAmt[fileId]||{})[k]!=null||(S.lineAmtDraft[fileId]||{})[k]!=null;});
    // Custom (Added) lines are scoped to the period they were added from; RULE_ITEMS recur every period.
    var earn=all.filter(function(x){return x.kind==='earning'&&(!x.custom||x.mIdx===mIdx);}).map(function(it){return row(it,mIdx);}).join('');
    var ded=all.filter(function(x){return x.kind==='deduction'&&(!x.custom||x.mIdx===mIdx);}).map(function(it){return row(it,mIdx);}).join('');
    var period=periodLabels[mIdx]||('Pay Period '+(mIdx+1));
    var missingRowsHtml=(mIdx===0)?missingKeys.map(missingRow).join(''):'';
    return '<div class="li2-group">'
      +'<div class="li2-ghd">'
        +'<span class="li2-gnum">Pay Period '+(mIdx+1)+(hasEdit?' <span style="color:#d97706;font-size:9px;">&#9679;</span>':'')+'</span>'
        +'<span class="li2-gperiod">'+m.month+' &middot; '+period+'</span>'
      +'</div>'
      +'<div class="li2-cap">EARNINGS</div>'+earn+missingRowsHtml
      +'<div class="li2-cap">DEDUCTIONS</div>'+ded
      +'<div class="li2-gadd">'
        +'<button class="li2-gadd-btn" onclick="openAddLine(\''+fileId+'\',null,'+mIdx+')">+ Add item to this period</button>'
      +'</div>'
    +'</div>';
  }).join('');

  var addGroupBtn='<div class="li2-add">'
    +'<button class="btn btn-sm" onclick="addPayslipMonth(\''+fileId+'\')">+ Add Pay Period</button>'
  +'</div>';

  var hint='<div class="li2-hint">Malay text with <span class="li2-en-key">grey English translation</span>. Edit any amount directly. '
    +(clean?'This file was verified by Sales before routing — you can still adjust any value.':'Orange rows need a manual check against the source document — click <b>Verify</b> on each, or use <b>Mark All Verified</b> above.')
    +'</div>';
  // Sticky apply bar — staged amount edits don't reach Step-3 totals until saved
  var pend=pendingAmounts(fileId);
  var applyBar=pend.length
    ?'<div class="li-apply li-apply-sticky"><span class="li-apply-txt">&#9998; <b>'+pend.length+' amount change'+(pend.length>1?'s':'')+' staged</b> — Step 3 totals refresh after you save.</span>'
      +'<button class="btn btn-pri btn-sm" onclick="applyAmountChanges(\''+fileId+'\')">&#10003; Save &amp; refresh totals</button></div>'
    :'';
  return applyBar+hint+docGroup+groupsHtml+addGroupBtn;
}
/* ── Step 2 · Income Computation ──
   Rows = pay periods (different months); columns = income/deduction CATEGORIES (the sum of the
   line items mapped to each) — same orientation as the real Income Calculator. Step-2 mapping
   decided which line item belongs to which category; each category column sums same-category items.
   Click a category column (its header OR any amount cell) to open its breakdown panel below the
   grid — there you edit the line-item amounts AND re-map their category, no separate step needed.
   Edits stage as drafts; "Apply & refresh" commits them and recomputes. Single panel open at a time. */
function toggleCompCat(fileId,key){
  if(!S.compExpand)S.compExpand={};
  S.compExpand[fileId]=(S.compExpand[fileId]===key)?null:key;
  render();
}
function applyComputeChanges(fileId){
  var pa=pendingAmounts(fileId), pr=pendingRules(fileId);
  if(!pa.length&&!pr.length)return;
  S.flash=S.flash||{};
  if(pa.length){ if(!S.lineAmt[fileId])S.lineAmt[fileId]={}; pa.forEach(function(k){S.lineAmt[fileId][k]=(S.lineAmtDraft[fileId]||{})[k];S.flash[k]=true;}); S.lineAmtDraft[fileId]={}; }
  if(pr.length){
    if(!S.ruleMap[fileId])S.ruleMap[fileId]={}; if(!S.incomeLog[fileId])S.incomeLog[fileId]=[];
    var now=new Date(); var ts=('0'+now.getHours()).slice(-2)+':'+('0'+now.getMinutes()).slice(-2);
    pr.forEach(function(id){
      var it=ruleItemF(fileId,id);
      var to=bucketLabel(it.kind,ruleDraft(fileId,id));
      var from=it.custom&&!(S.ruleMap[fileId]||{})[id]?'(New item)':bucketLabel(it.kind,ruleApplied(fileId,id));
      S.incomeLog[fileId].unshift({t:ts,raw:it.type,from:from,to:to});
      S.ruleMap[fileId][id]=ruleDraft(fileId,id);
    });
    S.ruleDraft[fileId]={};
  }
  S.compFlash=true;render();
  setTimeout(function(){S.compFlash=false;S.flash={};render();},950);
  showToast('Applied &mdash; totals recalculated.','ok');
}
function renderComputed(fileId){
  var months=PAYSLIP_MONTHS.map(function(m,mIdx){return {label:m.month,mIdx:mIdx,c:computeMonth(fileId,mIdx)};});
  var n=months.length;
  var sel=(S.compExpand||{})[fileId]||null;
  function money2(v){v=(typeof v==='number')?v:(parseFloat(v)||0);return v?('RM '+money(v)):'<span class="cp-dash">&mdash;</span>';}
  function avgOf(get){var s=0;months.forEach(function(mo){var v=get(mo.c);s+=(typeof v==='number'?v:parseFloat(v)||0);});return s/(n||1);}
  function itemsIn(bucketKey,kind){return lineItemsAll(fileId).filter(function(it){return it.kind===kind && ruleApplied(fileId,it.id)===bucketKey;});}

  // ── column model: category columns (clickable → breakdown) + summary columns (read-only) ──
  var earnCats=EARNING_BUCKETS.filter(function(b){return b.key!=='exclude';});
  var dedCats=DEDUCTION_BUCKETS.filter(function(b){return b.key!=='exclude';});
  var cols=[];
  earnCats.forEach(function(b){cols.push({t:'cat',key:b.key,label:b.label,kind:'earning'});});
  cols.push({t:'sum',key:'__gross',label:'Gross',get:function(c){return c.grossAll;},pr:function(c){return c.ocrGross;}});
  dedCats.forEach(function(b){cols.push({t:'cat',key:b.key,label:b.label,kind:'deduction'});});
  cols.push({t:'sum',key:'__dedtot',label:'Total Ded.',get:function(c){return c.dedAll;},pr:function(c){return c.ocrDed;}});
  cols.push({t:'sum',key:'__net',label:'Net Pay',get:function(c){return c.grossAll-c.dedAll;},pr:function(c){return c.ocrNet;}});
  cols.push({t:'sum',key:'__inc',label:'Verifiable',get:function(c){return c.incomeGross;}});
  function colVal(c,col){return col.t==='cat'?c[col.key]:col.get(c);}

  // ── two-tier header: group band + category columns ──
  var grpHead='<tr class="cc-grphead"><th></th>'
    +'<th colspan="'+(earnCats.length+1)+'" class="cc-band-e">EARNINGS</th>'
    +'<th colspan="'+(dedCats.length+1)+'" class="cc-band-d">DEDUCTIONS</th>'
    +'<th colspan="2" class="cc-band-s">NET / INCOME</th></tr>';
  var head='<tr><th class="cc-name cc-period">Pay Period</th>'
    +cols.map(function(col){
      var clk=(col.t==='cat');
      var cls=(clk?'cc-cath':'cc-sumh')+(sel===col.key?' sel':'');
      return '<th class="'+cls+'"'+(clk?' onclick="toggleCompCat(\''+fileId+'\',\''+col.key+'\')" title="Filter the breakdown below to this category"':'')+'>'+col.label+(clk?'<span class="cc-h-chev">&#9662;</span>':'')+'</th>';
    }).join('')+'</tr>';

  // ── body: one row per pay period, plus an Average row ──
  function periodRow(label,c,flash,isAvg){
    return '<tr'+(flash?' class="cp-flash"':'')+(isAvg?' class="cc-avgrow"':'')+'><td class="cc-name cc-period">'+label+'</td>'
      +cols.map(function(col){
        var clk=(col.t==='cat');
        var pr=(col.pr&&c)?col.pr(c):null;
        var v=isAvg?avgOf(function(cc){return colVal(cc,col);}):colVal(c,col);
        var cls='cc-val'+(clk?' cc-catcell':'')+(sel===col.key?' sel':'');
        return '<td class="'+cls+'"'+(clk?' onclick="toggleCompCat(\''+fileId+'\',\''+col.key+'\')"':'')+'>'+money2(v)+(pr!=null&&!isAvg?'<span class="cc-print">'+money(pr)+'</span>':'')+'</td>';
      }).join('')
    +'</tr>';
  }
  var body=months.map(function(mo){return periodRow(mo.label,mo.c,S.compFlash,false);}).join('')
    +periodRow('Average',null,false,true);

  // ── Breakdown below the grid (0625 review): every category's line items are shown BY DEFAULT so
  //    the reviewer scans the whole picture in one screen — no clicking needed. Clicking a category
  //    column up top FILTERS this to just that one. Category dropdown sits in the 2nd column for quick
  //    re-classification; amounts editable; custom items get an × ; "+ Add line item" per category. ──
  var ncolp=months.length+2;
  function itemRow(it){
    var buckets=it.kind==='earning'?EARNING_BUCKETS:DEDUCTION_BUCKETS;
    var draft=ruleDraft(fileId,it.id);
    var opts=buckets.map(function(b){return '<option value="'+b.key+'"'+(draft===b.key?' selected':'')+'>'+b.label+'</option>';}).join('');
    var rulePend=pendingRules(fileId).indexOf(it.id)!==-1;
    var rm=it.custom?'<button class="cc-pi-rm" title="Remove this added item" onclick="removeCustomLine(\''+fileId+'\',\''+it.id+'\')">&times;</button>':'';
    var amtCells=months.map(function(mo){
      var disp=lineDispAmt(fileId,mo.mIdx,it.type), applied=effectiveApplied(fileId,mo.mIdx,it.type);
      var amtPend=(S.lineAmtDraft[fileId]||{})[mo.mIdx+'|'+it.type]!=null && disp!==applied;
      return '<td class="cc-sub-amt"><span class="cc-rm">RM</span><input class="cc-amt-inp'+(amtPend?' pending':'')+'" value="'+(disp!=null?money(disp):'')+'" onchange="setLineAmt(\''+fileId+'\','+mo.mIdx+',\''+it.type+'\',this.value)"></td>';
    }).join('');
    return '<tr'+(rulePend?' class="pending"':'')+' id="rc-'+it.id+'">'
      +'<td class="cc-pi-name">'+it.ms+'<span class="cc-en">'+it.en+'</span>'+(it.custom?'<span class="cc-pi-added">added</span>':'')+'</td>'
      +'<td class="cc-pi-map"><select class="cc-map-sel'+(rulePend?' modified':'')+'" onchange="setRule(\''+fileId+'\',\''+it.id+'\',this.value)">'+opts+'</select>'+rm+'</td>'
      +amtCells
    +'</tr>';
  }
  function groupBody(g){
    var ghd='<tr class="cc-grp-row"'+(g.key?' onclick="toggleCompCat(\''+fileId+'\',\''+g.key+'\')"':'')+'><td colspan="'+ncolp+'">'+g.label+(g.items.length?'<span class="cc-cnt">'+g.items.length+'</span>':'')+'</td></tr>';
    var rows=g.items.map(itemRow).join('');
    var emptyRow=g.items.length?'':'<tr><td class="cc-pi-empty" colspan="'+ncolp+'">No line items here yet.</td></tr>';
    var addRow=g.addBucket?'<tr class="cc-pi-addrow"><td colspan="'+ncolp+'"><button class="cc-addbtn" onclick="openAddToCat(\''+fileId+'\',\''+g.addBucket+'\',\''+g.addKind+'\')">+ Add line item</button></td></tr>':'';
    return ghd+rows+emptyRow+addRow;
  }
  // which category groups to render: filtered to one when a column is selected, else all (non-empty) + excluded
  var groups=[];
  if(sel==='__excluded'){
    groups.push({label:'Excluded — not counted',key:'__excluded',items:lineItemsAll(fileId).filter(function(it){return ruleApplied(fileId,it.id)==='exclude';}),addBucket:null});
  } else if(sel){
    var scol=null;cols.forEach(function(c){if(c.key===sel)scol=c;});
    if(scol&&scol.t==='cat')groups.push({label:scol.label,key:scol.key,items:itemsIn(scol.key,scol.kind),addBucket:scol.key,addKind:scol.kind});
  } else {
    earnCats.forEach(function(b){var its=itemsIn(b.key,'earning');if(its.length)groups.push({label:b.label,key:b.key,items:its,addBucket:b.key,addKind:'earning'});});
    dedCats.forEach(function(b){var its=itemsIn(b.key,'deduction');if(its.length)groups.push({label:b.label,key:b.key,items:its,addBucket:b.key,addKind:'deduction'});});
    var exc=lineItemsAll(fileId).filter(function(it){return ruleApplied(fileId,it.id)==='exclude';});
    if(exc.length)groups.push({label:'Excluded — not counted',key:'__excluded',items:exc,addBucket:null});
  }
  var bdHead='<tr><th class="cc-pi-name">Line item</th><th class="cc-pi-map">Category</th>'+months.map(function(mo){return '<th>'+mo.label+'</th>';}).join('')+'</tr>';
  var selLabel='';cols.forEach(function(c){if(c.key===sel)selLabel=c.label;});if(sel==='__excluded')selLabel='Excluded';
  var filterBar=sel
    ?'<div class="cc-filterbar">Filtered to <b>'+selLabel+'</b><button class="cc-showall" onclick="toggleCompCat(\''+fileId+'\',\''+sel+'\')">&#8592; Show all categories</button></div>'
    :'';
  var breakdown='<div class="cc-bd-hd">Line-item breakdown'+(sel?'':' &mdash; all categories')+'</div>'
    +filterBar
    +'<div class="cp-tablewrap cc-bd-wrap"><table class="cp-table cc-pi-table"><thead>'+bdHead+'</thead><tbody>'+groups.map(groupBody).join('')+'</tbody></table></div>';

  var draftPend=pendingAmounts(fileId).length+pendingRules(fileId).length;
  var applyBar=draftPend
    ? '<div class="li-apply li-apply-sticky"><span class="li-apply-txt">&#9998; <b>'+draftPend+' change'+(draftPend>1?'s':'')+' pending</b> &mdash; totals refresh after you apply.</span>'
        +'<button class="btn btn-pri btn-sm" onclick="applyComputeChanges(\''+fileId+'\')">&#8635; Apply &amp; refresh</button></div>'
    : '';
  var log=S.incomeLog[fileId]||[];
  var logSec=log.length
    ? '<details class="rc-log"><summary>Change log ('+log.length+') &mdash; audit-recorded</summary>'
        +log.map(function(e){return '<div class="li-log"><span class="li-log-t">'+e.t+'</span><span class="li-log-raw">'+e.raw+'</span><span class="li-log-chg">'+e.from+' &rarr; <b>'+e.to+'</b></span></div>';}).join('')
      +'</details>'
    : '';

  return applyBar
    +'<div class="cc-hint">Totals up top; every category&#39;s line items are listed below. Click a category column to filter the breakdown to just that one.</div>'
    +'<div class="cp-tablewrap"><table class="cp-table cc-table cc-tcols"><thead>'+grpHead+head+'</thead><tbody>'+body+'</tbody></table></div>'
    +'<div class="cp-income">'+n+'-period average verifiable income (excl. policy items): <b>RM '+money(payslipAvgIncome(fileId))+'</b></div>'
    +breakdown
    +logSec;
}
// Intentional navigation to a step: open it, then scroll the workspace to it.
// Synchronous direct assignment right after render() (render already restored the
// prior scroll; this overrides it). Smooth behavior is unreliable on the fresh DOM.
function scrollToSec(key){
  S.secOpen[key]=true;render();
  var el=document.getElementById('sec-'+key);
  var wl=document.querySelector('.fd-wleft');
  if(!el||!wl){if(el&&el.scrollIntoView)el.scrollIntoView({block:'start'});return;}
  var top=Math.max(0,el.getBoundingClientRect().top-wl.getBoundingClientRect().top+wl.scrollTop-8);
  wl.scrollTop=top;
  el.classList.add('sec-land');
  setTimeout(function(){var c=document.getElementById('sec-'+key);if(c)c.classList.remove('sec-land');},1100);
}

function renderFileDetail(){
  var d=FILE_DETAIL[S.fileId]||FILE_DETAIL.ec;
  var resMap=S.alertResolved[S.fileId]||{};
  var sevRank={hard:0,warn:1,check:2};
  var custom=(S.customRules[S.fileId]||[]).map(function(r){return Object.assign({},r,{isCustom:true});});

  // Auto-inject Marginal Page Quality alert when this file has warn pages
  var blur=fileBlurSummary(S.fileId);
  var marginalAlerts=[];
  if(blur.warnPages.length){
    marginalAlerts.push({id:'marginal-quality',title:'Marginal page quality — Verify required',
      sev:'check',dim:'Image Quality',kind:'eyeball',
      cmp:'Page '+blur.warnPages.join(', ')+' had marginal sharpness. AI extracted values but accuracy is not guaranteed — every field must be human-verified before submission.',
      acts:['verifyall'],rec:'verifyall'});
  }
  var allAlerts=marginalAlerts.concat(d.alerts).concat(custom);
  var sorted=allAlerts.slice().sort(function(x,y){
    return ((resMap[x.id]?10:0)+(sevRank[x.sev]==null?3:sevRank[x.sev])) - ((resMap[y.id]?10:0)+(sevRank[y.sev]==null?3:sevRank[y.sev]));
  });
  var justMap=S.justifiedAlerts[S.fileId]||{};
  var nh=0,nw=0,nc=0,nj=0;
  allAlerts.forEach(function(a){
    if(resMap[a.id])return;
    if(justMap[a.id]){nj++;return;}
    if(a.sev==='hard')nh++;else if(a.sev==='warn')nw++;else nc++;
  });
  var unresolvedCount=nh+nw+nc;

  // ── Alerts summary chips (shown inside the collapsible alert body) ──
  var statusMsg=nh?'<span class="fd-sum-block">&#9940; Cannot submit — resolve or justify Hard Fails first</span>'
    :(nh===0&&nw===0&&nc===0&&allAlerts.length?'<span class="fd-sum-ok">&#10003; All alerts cleared</span>':'<span class="fd-sum-soft">Resolve or justify remaining items</span>');
  var summary='<div class="fd-sum">'
    +(nh?'<span class="fd-sum-chip red">'+nh+' Hard Fail</span>':'')
    +(nw?'<span class="fd-sum-chip org">'+nw+' Warning</span>':'')
    +(nc?'<span class="fd-sum-chip blue">'+nc+' Needs Check</span>':'')
    +(nj?'<span class="fd-sum-chip" style="background:#fff4e0;color:#b45309;">'+nj+' Justified</span>':'')
    +statusMsg
  +'</div>';

  // ── Fields content
  var locPage=(S.locate&&S.locate.file===S.fileId)?S.locate.page:1;
  // Check if OCR extracted almost nothing (>70% of fields are 0% confidence)
  var totalFields=0,zeroFields=0;
  d.groups.forEach(function(g){g.fields.forEach(function(f){totalFields++;if((f.c==null?99:f.c)===0)zeroFields++;});});
  var zeroBanner='';
  if(totalFields>2&&zeroFields/totalFields>0.6){
    zeroBanner='<div class="fd-zero-banner">'
      +'<strong>⚠ OCR could not extract this document</strong> — '+(zeroFields)+' of '+totalFields+' fields returned no data. '
      +'This may indicate the file is misclassified, the scan quality is too low, or the document type is unsupported.<br>'
      +'<div class="fd-z-act">'
        +'<button class="btn btn-sm" style="font-size:11.5px;">↺ Replace File</button>'
        +'<button class="btn btn-sm" style="font-size:11.5px;" onclick="switchFdTab(\'alerts\')">&#8593; Review Alerts</button>'
      +'</div>'
    +'</div>';
  }
  var lineMode=!!d.lineItemMode;
  var isIncomeFile=INCOME_FILE_IDS.indexOf(S.fileId)!==-1;
  var aEmpty=(allAlerts.length===0);

  // ── Alert ACTION CENTER (top, prominent): counts → routing + next-step + cards ──
  var issues=lineMode?payslipIssues(S.fileId):{missing:[]};
  var nVerify=allAlerts.filter(function(a){return a.kind==='eyeball'&&!resMap[a.id]&&!justMap[a.id];}).length;
  var nCheck=nw+nc-nVerify;            // remaining warnings / checks (non-eyeball)
  var nMissing=issues.missing.length;
  var totalIssues=nh+nVerify+nCheck+nMissing;
  function aChip(n,label,cls,target){
    if(!n)return '';
    return '<span class="ac-chip '+cls+'" onclick="scrollToSec(\''+target+'\')">'+n+' '+label+'</span>';
  }
  var itemsSec=lineMode?'items':'fields';
  // next-step priority: Hard → Missing → Verify → Check (Step 3 is pure display, no alert of its own)
  var next= nh?{t:'Resolve '+nh+' hard fail'+(nh>1?'s':''),s:itemsSec}
    : nMissing?{t:'Map '+nMissing+' missing required field'+(nMissing>1?'s':''),s:'map'}
    : nVerify?{t:'Verify '+nVerify+' flagged field'+(nVerify>1?'s':''),s:itemsSec}
    : nCheck?{t:'Check '+nCheck+' field'+(nCheck>1?'s':''),s:itemsSec}
    : null;
  // Only show alerts that still need action — resolved/justified ones disappear from the page
  var activeAlerts=sorted.filter(function(a){return !resMap[a.id]&&!justMap[a.id];});
  var alertCards=activeAlerts.length?'<div class="ac-cards">'+activeAlerts.map(function(a){return fdAlertCard(a,S.fileId);}).join('')+'</div>':'';

  // ── 2-step income flow. lineMode has NO top nav — the two vertical "Step N" cards carry everything.
  //    Step 2 (income computation) holds the rule mapping inline; no separate mapping step. ──
  // CED always receives a clean, Sales-verified file → no Step-1 alerts for the CED view
  var roleClean=(lineMode&&S.role==='ced');

  // non-lineMode files keep the compact action center (no 3-step model)
  var actionCenter='<div class="ac'+(totalIssues?'':' ac-clear')+'">'
    +'<div class="ac-bar">'
      +'<span class="ac-ic" style="color:'+(totalIssues?(nh?'#c0392b':'#d97706'):'#1f9d57')+';">'+IC.warn+'</span>'
      +'<span class="ac-ttl">'+(totalIssues?totalIssues+' item'+(totalIssues>1?'s':'')+' need attention':'All validation checks passed')+'</span>'
      +(nh?'<span class="ac-chip red" onclick="scrollToSec(\''+itemsSec+'\')">'+nh+' Hard Fail</span>':'')
      +aChip(nVerify,'Verify','blue',itemsSec)
      +aChip(nCheck,'Check','org',itemsSec)
      +(next?'<span class="ac-next" onclick="scrollToSec(\''+next.s+'\')">&#9654; Next: '+next.t+'</span>':'')
    +'</div>'
    +alertCards
  +'</div>';
  var topBar=lineMode?'':actionCenter;   // lineMode: no top nav, step cards carry everything

  // ── Preview (right column) ──
  var qPreview='<div class="fdq-preview">'
    +'<div class="fd-rtop">'
      +'<select class="sel" style="flex:1;min-width:80px;"><option>category</option><option>Applicant Income</option></select>'
      +'<select class="sel" style="flex:1;min-width:80px;"><option>File type</option><option>Payslip</option></select>'
      +'<button class="btn btn-pri btn-sm">Confirm</button>'
    +'</div>'
    +'<div class="fd-pdftb">'
      +'<input class="inp" style="width:38px;min-width:0;padding:3px 4px;text-align:center;" value="'+locPage+'"> <span class="muted" style="font-size:11.5px;">/ 3</span>'
      +'<button class="mini">&minus;</button><button class="mini">+</button>'
      +'<button class="mini" title="Rotate">&#8635;</button>'
      +'<span style="margin-left:auto;font-size:11.5px;color:var(--mut);">Fit page</span>'
    +'</div>'
    +'<div class="fd-doc">'+docMock(d.doc)+'</div>'
  +'</div>';

  // ── Left workspace ──
  var workspace;
  if(lineMode){
    // ── §1 Step-1 (Sales): full line items + one verify action. CED receives this already clean. ──
    var salesItems=roleClean?[]:sorted.filter(function(a){return a.kind==='eyeball'&&!resMap[a.id]&&!justMap[a.id];});
    // completeness: required field with no source line → Sales to add or skip with note
    var missLeft=roleClean?[]:issues.missing.filter(function(k){return !justMap['miss:'+k];});
    var s1Done=!salesItems.length&&!missLeft.length;
    var s1Badge=(salesItems.length||missLeft.length)?'<span class="sec-badge org">'+(salesItems.length+missLeft.length)+' Pending</span>':'<span class="sec-badge green">Verified</span>';
    var verifyBar='';
    if(roleClean){
      verifyBar='<div class="vf-note">Verified by Sales. You can adjust any value before approving.</div>';
    } else {
      // TWO separate orange alerts — they are two different operations, kept distinct.
      var evNow=S.eyeVerified[S.fileId]||{},lvNow=S.lineVerified[S.fileId]||{};
      var pendDoc=eyeItems().filter(function(ei){return !evNow[ei.id];}).length;
      var pendLine=0;RULE_ITEMS.forEach(function(it){if(it.eyeCheck&&!lvNow['0|'+it.type])pendLine++;});
      var pendCheck=pendDoc+pendLine;
      // Alert A — Eyeball check (verify AI-extracted fields against the document)
      if(pendCheck){
        verifyBar+='<div class="vf-bar vf-todo">'
          +'<div class="vf-hd">&#128065; Eyeball check &mdash; '+pendCheck+' field'+(pendCheck>1?'s':'')+' need a manual check against the source document.</div>'
          +'<div class="vf-acts">'
            +'<button class="btn btn-pri btn-sm" onclick="verifyAllSales(\''+S.fileId+'\')">&#10003; Mark All Verified</button>'
            +'<button class="btn btn-sm" onclick="openJustify(\''+S.fileId+'\',\''+(salesItems.length?salesItems[0].id:'pseye')+'\')">Skip with Note</button>'
          +'</div>'
        +'</div>';
      }
      // Alert B — Missing required field (OCR did not detect it) — a distinct task
      if(missLeft.length){
        verifyBar+='<div class="vf-bar vf-todo">'
          +'<div class="vf-hd">&#9888; Missing field &mdash; '+missLeft.length+' required field'+(missLeft.length>1?'s':'')+' not detected by OCR. Add the line item or skip with a note.</div>'
          +'<div class="vf-acts">'
            +'<button class="btn btn-pri btn-sm" onclick="openAddLine(\''+S.fileId+'\',\''+missLeft[0]+'\',0)">+ Add Missing Item</button>'
            +'<button class="btn btn-sm" onclick="openJustify(\''+S.fileId+'\',\'miss:'+missLeft[0]+'\')">Skip with Note</button>'
          +'</div>'
        +'</div>';
      }
      // When everything is done both bars disappear — the section badge + per-row marks carry the state.
    }
    var s1Body=verifyBar+renderLineItems(S.fileId);
    // ── Step 2 · Income Computation: result + editable mapping merged into one. The old separate "Step 2 ·
    //    Field Mapping" is gone — its dropdowns now live inside the income breakdown here, so you
    //    classify and see the result in the same place (client feedback: drop the extra layer).
    //    Changing a category stages a draft; "Apply & refresh" (confirmRuleChanges) recomputes. ──
    var compPend=pendingAmounts(S.fileId).length+pendingRules(S.fileId).length;
    var compBadge=compPend?'<span class="sec-badge org">'+compPend+' Pending</span>':'<span class="sec-badge green">Computed</span>';
    var cItems=secCard('items','1','Step 1 · Verify','Confirm OCR line items against the document',s1Badge, s1Body);
    var cComp=secCard('comp','2','Step 2 · Income Computation','Categorised totals — click any amount to adjust mapping or value',compBadge, renderComputed(S.fileId));
    // Option 1: Verify→Compute (data-first); Option 2: Compute→Verify (result-first) — ordering only.
    workspace=(curScheme()==='1')?(cItems+cComp):(cComp+cItems);
  } else {
    var renderGroups=d.groups;
    var groupsHtml=renderGroups.map(function(g){
      var hdr=(g.name&&g.name.length)?'<div class="fd-grp">'+g.name+(g.del?'<span class="del">Delete</span>':'')+'</div>':'';
      var rows=g.fields.map(function(f){return fdRow(f,S.fileId);}).join('');
      var add=g.addNew?'<div class="add-item">+ Add New Item</div>':'';
      return hdr+rows+add;
    }).join('');
    var fieldsHead='<div class="fd-fields-head"><span class="h-lbl">Field</span><span class="h-val">OCR Value</span>'
      +(isIncomeFile?'<span class="h-rule">Rule Classification &#9656;</span>':'')+'<span class="h-conf">Conf.</span></div>';
    workspace=secCard('fields','&#9707;','Fields','OCR-extracted values','', zeroBanner+fieldsHead+groupsHtml);
  }

  // ── Income total for footer ──
  var overrideCount=lineMode?Object.keys(S.ruleMap[S.fileId]||{}).length:Object.keys(S.cedRuleOverrides[S.fileId]||{}).length;
  var totalMonthly;
  if(lineMode){totalMonthly=payslipAvgIncome(S.fileId);}
  else{var calcLines=isIncomeFile?cedCalcIncome(S.fileId):null;totalMonthly=calcLines?calcLines.reduce(function(s,l){return s+l.monthly;},0):0;}

  return '<div class="ov ov-full"><div class="fd">'
    +'<div class="fd-top">'
      +'<button class="fd-back" onclick="closeFile()">&#8249;</button>'
      +'<div><div class="fd-title">'+d.name+'</div><div class="fd-crumb">'+d.crumb+'</div></div>'
      +'<div class="sp"></div>'
      +(lineMode?'<div class="role-tog" title="Two step-order options — pick either regardless of role">'
        +'<button class="role-btn'+(curScheme()==='1'?' on':'')+'" onclick="setScheme(\'1\')">Option 1 (1&rarr;2)</button>'
        +'<button class="role-btn'+(curScheme()==='2'?' on':'')+'" onclick="setScheme(\'2\')">Option 2 (2&rarr;1)</button>'
      +'</div>':'')
      +'<button class="btn btn-sm" onclick="toggleFdPreview()" title="Collapse the document to give the table full width">'+(S.fdPreviewOpen?'&#9707; Hide document':'&#9707; Show document')+'</button>'
      +'<button class="btn btn-sm">&#8249; Previous</button>'
      +'<button class="btn btn-sm">Next &#8250;</button>'
      +'<button class="btn btn-pri btn-sm" onclick="showToast(\'Saved.\',\'ok\')">Save</button>'
    +'</div>'
    +topBar
    +'<div class="fd-work'+(S.fdPreviewOpen?'':' solo')+'">'
      +'<div class="fd-wleft">'+workspace+'</div>'
      +(S.fdPreviewOpen?qPreview:'')
    +'</div>'
    // ── Footer: income summary only (read-only). Save / Submit / Save-as-Draft live in the global
    //    application-level button bar; rule confirmation lives inside Step 2 — no duplicates here. ──
    +(isIncomeFile
      ? '<div class="fd-bottom">'
          +'<span style="margin-left:auto;font-size:12px;color:#374151;">'+(lineMode?'Avg verifiable income (3 mo)':'Verifiable income')+': <b style="color:#1e3a8a;font-size:13px;">RM '+totalMonthly.toFixed(2)+'/mo</b>'
            +(overrideCount?' <span style="color:#1f9d57;font-size:11px;">('+overrideCount+' confirmed rule'+(overrideCount>1?'s':'')+')</span>':'')
          +'</span>'
        +'</div>'
      : '')
  +'</div></div>';
}

/* ════════════════ OCR DATA SYNC ════════════════ */
function renderSync(){
  var rows=SYNC_ROWS.map(function(r){
    var st=r.st==='ok'?'<span class="sync-st-ok">SYNC OK</span>':'<span class="sync-st-cf">CONFLICT</span>';
    return '<tr>'
      +'<td><input type="checkbox" class="cbx" checked></td>'
      +'<td>'+r.f+'</td>'
      +'<td>'+r.cur+'</td>'
      +'<td>'+r.ocr+'</td>'
      +'<td style="text-align:right;">'+st+'</td>'
    +'</tr>';
  }).join('');
  return '<div class="ov" style="z-index:60;"><div class="sync">'
    +'<div class="sync-hd">'
      +'<div style="display:flex;align-items:flex-start;"><h3>OCR Data Sync</h3><button class="docs-x" style="margin-left:auto;" onclick="closeSync()">&times;</button></div>'
      +'<div class="sub">Comparing current value with detected document data.</div>'
      +'<div class="note">Selecting a checkbox means applying the OCR value to replace the current manual value.</div>'
    +'</div>'
    +'<div class="sync-bd">'
      +'<h4>Application Details</h4>'
      +'<table><thead><tr><th><input type="checkbox" class="cbx" checked></th><th>Field Name</th><th>Current Value</th><th>OCR Value</th><th style="text-align:right;">Status</th></tr></thead>'
      +'<tbody>'+rows+'</tbody></table>'
    +'</div>'
    +'<div class="sync-ft"><button class="btn" onclick="closeSync()">Cancel</button><button class="btn btn-pri" onclick="closeSync()">Merge Selected Fields</button></div>'
  +'</div></div>';
}

/* ════════════════ ADD RULE MODAL ════════════════ */
function renderAddRule(){
  var editing=!!S.addRuleEditId;
  var typeOpts=RULE_TYPES.map(function(r){return '<option value="'+r.key+'">'+r.label+'</option>';}).join('');
  return '<div class="ov" style="z-index:70;"><div class="add-rule-modal">'
    +'<div class="arm-hdr"><h3>'+(editing?'Edit Custom Rule':'Add Rule / Check')+'</h3><button class="docs-x" onclick="closeAddRule()">&times;</button></div>'
    +'<div class="arm-body">'
      +'<div class="arm-note">Custom rules are attached to <strong>this file only</strong> and visible to all reviewers. They run alongside system rules. You can edit or remove them at any time.</div>'
      +'<div class="arm-row">'
        +'<label class="arm-lbl">Rule Type</label>'
        +'<select id="ar-type" class="sel" style="width:100%;" onchange="updateRuleTypeUI()">'+typeOpts+'</select>'
        +'<div id="ar-hint" class="arm-hint">Field or document must be present</div>'
      +'</div>'
      +'<div class="arm-row" id="ar-field-row">'
        +'<label class="arm-lbl">Target Field</label>'
        +'<input id="ar-field" class="inp" style="width:100%;" placeholder="e.g. total_sales_price, customer_name">'
      +'</div>'
      +'<div class="arm-row" id="ar-param-row" style="display:none;">'
        +'<label id="ar-param-lbl" class="arm-lbl">Compare field / value</label>'
        +'<input id="ar-param" class="inp" style="width:100%;" placeholder="e.g. 3  /  id_no  /  application.customer_name">'
      +'</div>'
      +'<div class="arm-row" id="ar-sev-row">'
        +'<label class="arm-lbl">Severity</label>'
        +'<div class="arm-sevs">'
          +'<label class="arm-sev-opt"><input type="radio" name="ar-sev" value="hard"> <span class="sevtag sev-hard">Hard Fail</span></label>'
          +'<label class="arm-sev-opt"><input type="radio" name="ar-sev" value="warn" checked> <span class="sevtag sev-warn">Warning</span></label>'
        +'</div>'
        +'<div style="font-size:11px;color:#9aa1ab;margin-top:4px;">Hard Fail blocks submission. Warning allows justification.</div>'
      +'</div>'
      +'<div class="arm-row" id="ar-note-row" style="display:none;">'
        +'<label class="arm-lbl">Note (shown as alert message)</label>'
        +'<textarea id="ar-note" class="inp" style="width:100%;min-height:60px;resize:vertical;" placeholder="e.g. Please confirm the guarantor signature on page 3"></textarea>'
      +'</div>'
    +'</div>'
    +'<div class="arm-foot"><button class="btn" onclick="closeAddRule()">Cancel</button><button class="btn btn-pri" onclick="saveCustomRule()">'+(editing?'Save Changes':'Add Rule')+'</button></div>'
  +'</div></div>';
}

/* ════════════════ RENDER + ACTIONS ════════════════ */
function render(){
  var html;
  if(S.screen==='cedlist')html=renderCedList();
  else if(S.screen==='ceddetail')html=renderCedDetail();
  else if(S.screen==='saleslist')html=renderSalesList();
  else if(S.screen==='salesdetail')html=renderSalesDetail();
  else html=renderRoleMenu();
  if(S.docsOpen&&!S.fileOpen)html+=renderDocs();
  if(S.fileOpen)html+=renderFileDetail();
  if(S.syncOpen)html+=renderSync();
  if(S.addRuleOpen)html+=renderAddRule();
  if(S.justifyTarget)html+=renderJustifyModal();
  if(S.addLineTarget)html+=renderAddLineModal();
  if(S.qcOverrideTarget)html+=renderQcOverrideModal();
  if(S.qcDetailFor)html+=renderQcDetailModal();
  if(S.classifyOpen)html+=renderClassifyModal();
  if(S.replaceTarget)html+=renderReplacePagePanel();
  // Preserve scroll position across the full re-render so verifying a row, editing an
  // amount, or expanding a step doesn't snap the view back to the top.
  var keepSel=['.fd-wleft','.fdq-preview','.fd-doc','.docs-bd'];
  var snap={};keepSel.forEach(function(sel){var el=document.querySelector(sel);if(el)snap[sel]=el.scrollTop;});
  var winY=window.scrollY;
  document.getElementById('app').innerHTML=html;
  keepSel.forEach(function(sel){var el=document.querySelector(sel);if(el&&snap[sel]!=null)el.scrollTop=snap[sel];});
  if(winY)window.scrollTo(0,winY);
}
function openDocs(){S.docsOpen=true;render();}
function closeDocs(){S.docsOpen=false;render();}
function setDocsTab(t){S.docsTab=t;render();}
function setInnerTab(t){S.innerTab=t;render();}
function openFile(id){if(id){S.fileId=id;S.locate=null;S.locateLine=null;S.secOpen={};S.cedRecalcDone=false;if(S.ruleDraft)S.ruleDraft[id]={};
  // Income-computation files open with the document collapsed so the wide table gets full width;
  // simpler files keep the doc shown for side-by-side eyeball checks. Locating a field reopens it.
  S.fdPreviewOpen=!isRuleModeFile(id);}S.fileOpen=true;render();}
function closeFile(){S.fileOpen=false;render();}
function openSync(){S.syncOpen=true;render();}
function closeSync(){S.syncOpen=false;render();}

render();
</script>
