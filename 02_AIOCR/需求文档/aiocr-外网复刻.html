  }).join('');
  return '<div class="ced-up-zone">'
      +'<div class="cu-title">Credit Related Documents <span style="font-weight:400;color:var(--mut);font-size:11.5px;">(Non AI Scanning — Requires manual check)</span></div>'
      +'<div class="cu-sub" style="margin-top:6px;">&#9888; <span style="color:var(--mut);">Drag &amp; drop, or</span> <a class="lnk">browse</a></div>'
    +'</div>'
    +'<table class="ced-fl-tbl" style="width:100%;">'
      +'<thead><tr><th>File Name</th><th>Category</th><th>Description</th><th>Upload Time</th><th>File Size</th><th>Source</th><th>Action</th></tr></thead>'
      +'<tbody>'+rows+'</tbody>'
    +'</table>'
    +'<div class="pager" style="margin-top:10px;"><span>&lsaquo;</span><span class="pg-num">1</span><span>&rsaquo;</span><span>10 / page &#9662;</span></div>';
}

/* ── Income Verification: CED's income classification workspace ── */
function setIncomeDecision(fileId,label,decision){
  if(!S.incomeDecisions[fileId])S.incomeDecisions[fileId]={};
  if(S.incomeDecisions[fileId][label]===decision){
    delete S.incomeDecisions[fileId][label]; // toggle off
  } else {
    S.incomeDecisions[fileId][label]=decision;
  }
  render();
}
function renderIncomeVerification(){
  // Tally totals
  var autoPassed=0, pending=0, counted=0, excluded=0;
  INCOME_VERIFY_FILES.forEach(function(f){
    f.items.forEach(function(it){
      var dec=(S.incomeDecisions[f.fileId]||{})[it.label]||(it.decision);
      if(dec==='auto')autoPassed++;
      else if(dec==='count')counted++;
      else if(dec==='exclude')excluded++;
      else pending++;
    });
  });
  var totalItems=autoPassed+pending+counted+excluded;
  var verifiedItems=autoPassed+counted+excluded;
  var summaryBar='<div class="iv-summary-bar">'
    +'<div class="iv-sum-cell"><div class="iv-sum-label">Income Files</div><div class="iv-sum-val">'+INCOME_VERIFY_FILES.length+'</div><div class="iv-sum-sub">Applicant Income type</div></div>'
    +'<div class="iv-sum-cell"><div class="iv-sum-label">Auto-Verified</div><div class="iv-sum-val" style="color:#1a7a43;">'+autoPassed+'</div><div class="iv-sum-sub">AI confidence ≥ 90%</div></div>'
    +'<div class="iv-sum-cell"><div class="iv-sum-label">Pending Review</div><div class="iv-sum-val" style="color:'+(pending?'#b45309':'#1a7a43')+';">'+pending+'</div><div class="iv-sum-sub">'+(pending?'CED action required':'All reviewed')+'</div></div>'
    +'<div class="iv-sum-cell"><div class="iv-sum-label">Verified by CED</div><div class="iv-sum-val">'+verifiedItems+' / '+totalItems+'</div><div class="iv-sum-sub">items reviewed</div></div>'
  +'</div>';
  var notice=pending
    ? '<div class="iv-notice">&#9888; <strong>'+pending+' item(s) need CED review</strong> — these income fields had low AI confidence or no extracted value. Click <strong>Count</strong> to include in verifiable income, or <strong>Exclude</strong> if not applicable per CED policy. The Proceed button is locked until all items are reviewed.</div>'
    : '<div class="iv-notice" style="background:#e6f4ea;border-color:#9bd5ab;color:#1a5c2e;">&#10003; <strong>All income items reviewed.</strong> Proceed to approve or request additional documents.</div>';

  var fileCards=INCOME_VERIFY_FILES.map(function(f){
    var pendingInFile=f.items.filter(function(it){
      var dec=(S.incomeDecisions[f.fileId]||{})[it.label]||(it.decision);
      return !dec||dec==='null'||dec===null;
    }).length;
    var hd='<div class="iv-file-hd">'
      +'<span class="iv-file-badge">'+f.fileType+'</span>'
      +'<span class="iv-file-name">'+f.fileName+'</span>'
      +'<span style="font-size:11.5px;color:var(--mut);">'+f.subject+'</span>'
      +(pendingInFile?'<span class="fd-ltab-badge" style="margin-left:8px;">'+pendingInFile+' pending</span>':'<span class="fd-ltab-badge ok" style="margin-left:8px;">&#10003;</span>')
    +'</div>';
    var headerRow='<div class="iv-item" style="background:#fafbfc;font-size:11px;font-weight:700;color:#6b7280;padding:6px 16px;">'
      +'<div style="flex:2;">Field</div>'
      +'<div style="flex:1.2;">Category</div>'
      +'<div style="flex:1.5;">OCR Value</div>'
      +'<div style="flex:1;">Confidence</div>'
      +'<div style="flex:1;text-align:center;">Status</div>'
      +'<div style="flex:1.5;text-align:right;">CED Decision</div>'
    +'</div>';
    var itemRows=f.items.map(function(it){
      var dec=(S.incomeDecisions[f.fileId]||{})[it.label]||(it.decision);
      var isPending=!dec||dec===null;
      // Confidence bar
      var pct=it.aiConf;
      var fillCls=pct>=90?'hi':pct>=60?'mid':'lo';
      var confHtml=pct>0
        ?('<div class="iv-conf-wrap"><div class="iv-conf-bar"><div class="iv-conf-fill '+fillCls+'" style="width:'+pct+'%;"></div></div><span class="iv-conf-pct">'+pct+'%</span></div>')
        :'<span class="muted" style="font-size:11px;">No data</span>';
      // Status badge
      var badge=dec==='auto'?'<span class="iv-badge-auto">Auto ✓</span>'
        :dec==='count'?'<span class="iv-badge-counted">Counted</span>'
        :dec==='exclude'?'<span class="iv-badge-excluded">Excluded</span>'
        :'<span class="iv-badge-pending">Pending</span>';
      // Action buttons
      var btnCount='<button class="iv-btn'+(dec==='count'?' active':'')+'" onclick="setIncomeDecision(\''+f.fileId+'\',\''+it.label+'\',\'count\')">Count</button>';
      var btnExcl='<button class="iv-btn excl'+(dec==='exclude'?' active':'')+'" onclick="setIncomeDecision(\''+f.fileId+'\',\''+it.label+'\',\'exclude\')">Exclude</button>';
      var acts=dec==='auto'
        ?('<button class="iv-btn" onclick="setIncomeDecision(\''+f.fileId+'\',\''+it.label+'\',\'exclude\')">Override</button>')
        :btnCount+btnExcl;
      return '<div class="iv-item'+(isPending?' need-row':'')+'">'
        +'<div class="iv-item-label">'+it.label+'</div>'
        +'<div class="iv-item-cat">'+it.cat+'</div>'
        +'<div class="iv-item-val'+(it.aiVal?'':' empty')+'">'+(it.aiVal||'Not extracted')+'</div>'
        +'<div class="iv-conf-wrap" style="flex:1;">'+confHtml+'</div>'
        +'<div class="iv-status">'+badge+'</div>'
        +'<div class="iv-acts">'+acts+'</div>'
      +'</div>';
    }).join('');
    return '<div class="iv-file-card">'+hd+headerRow+itemRows+'</div>';
  }).join('');

  var footer='<div class="iv-footer">'
    +'<span class="muted" style="font-size:12px;">Income Verification is recorded under your CED ID and audit-logged.</span>'
    +'<div style="display:flex;gap:8px;">'
      +'<button class="btn btn-sm">Request Additional Docs</button>'
      +'<button class="btn btn-pri btn-sm" '+(pending?'disabled title="Review all pending items first"':'')+'>&#10003; Confirm Income &amp; Proceed</button>'
    +'</div>'
  +'</div>';
  return summaryBar+notice+fileCards+footer;
}

function renderDocs(){

    +'<div class="lt-tab '+(t==='filelist'?'active':'')+'" onclick="setInnerTab(\'filelist\')">File List</div>'

/* ════════════════ FILE DETAIL ════════════════ */
function actBtn(key,fileId,alertId,rec){
  var label=ACT_LABEL[key],isRec=key===rec;
  // Replace Document is always primary blue (destructive but intended action)
  // Verify All is also always primary
  var forceRec=(key==='replace'||key==='verifyall');
  var cls='fd-abtn'+((isRec||forceRec)?' fd-abtn-rec':'');
  if(key==='verifyall')return '<button class="'+cls+'" onclick="verifyAll(\''+fileId+'\',\''+alertId+'\')">'+label+'</button>';
  return '<button class="'+cls+'">'+label+'</button>';
}
function sevMeta(s){return s==='hard'?{t:'Hard Fail',c:'sev-hard'}:s==='warn'?{t:'Warning',c:'sev-warn'}:{t:'Needs Check',c:'sev-check'};}
function guidanceLine(a){
  if(a.kind==='eyeball')return '<strong>Verify All</strong> — manually confirm the flagged fields against the physical document. AI cannot verify these automatically. If verification is not possible, use <strong>Justify &amp; proceed</strong>.';
  if(a.kind==='exist')return 'OCR did not detect this field. Open the source document to check &mdash; if it exists, <strong>Amend</strong> to enter the value manually. If genuinely absent, <strong>Justify &amp; proceed</strong>.';
  return 'AI misread the value → <strong>Amend</strong> to correct. Document non-compliant → <strong>Replace Document</strong>. Issue acceptable with a reason → <strong>Justify &amp; proceed</strong>.';
}
function fdAlertCard(a,fileId){
  // ── Justified state ──
  var justified=(S.justifiedAlerts[fileId]||{})[a.id];
  if(justified!==undefined){
    return '<div class="fd-alert justified">'
      +'<div class="fd-alert-top"><span class="sevtag sev-just">Justified</span><span class="dimtag">'+a.dim+'</span>'+(a.isCustom?'<span class="customtag">&#9998; Custom</span>':'<span class="systag">System</span>')+'</div>'
      +'<div class="fd-alert-ttl">'+a.title+'</div>'
      +(justified?'<div class="just-note">&#128221; '+justified+'</div>':'<div class="just-note" style="color:#9aa1ab;font-style:italic;">No note provided.</div>')
      +'<div class="fd-alert-acts"><button class="fd-abtn" onclick="undoJustify(\''+fileId+'\',\''+a.id+'\')">&#8635; Undo</button></div>'
    +'</div>';
  }
  // ── Resolved state ──
  var resolved=(S.alertResolved[fileId]||{})[a.id];
  var sm=sevMeta(a.sev);
  var acts=a.acts.map(function(k){return actBtn(k,fileId,a.id,a.rec);}).join('');
  // Justify — always tertiary (text-link style)
  var justifyBtn='<button class="justify-btn" onclick="openJustify(\''+fileId+'\',\''+a.id+'\')">'+(a.sev==='hard'?'Justify (note required)':'Justify &amp; proceed')+'</button>';
  if(resolved){
    var how=resolved.how==='adopt'?('Adopted reference <b>'+resolved.note+'</b>'):
      resolved.how==='replace'?'Replacement requested':
      resolved.note?('Corrected: '+resolved.note):'Resolved';
    return '<div class="fd-alert resolved">'
      +'<div class="fd-alert-top"><span class="sevtag sev-ok">&#10003; Resolved</span><span class="dimtag">'+a.dim+'</span></div>'
      +'<div class="fd-alert-ttl">'+a.title+'</div>'
      +'<div class="fd-resolved-how">'+how+'</div>'
      +'<div class="fd-alert-acts"><button class="fd-abtn" onclick="reopenAlert(\''+fileId+'\',\''+a.id+'\')">&#8635; Undo</button></div>'
    +'</div>';
  }
  // ── Active state — compact card, expands on hover ──
  // Linked fields: chips that highlight the field rows on hover + locate on click
  var linkedFields=a.fields||(a.locate?[a.locate]:[]);
  var chips=linkedFields.length
    ? linkedFields.map(function(k){
        return '<span class="al-fld" onmouseenter="hlFields(\''+k+'\')" onmouseleave="unhlFields()" onclick="locateField(\''+fileId+'\',\''+k+'\','+(a.page||1)+')">&rarr; '+k+'</span>';
      }).join('')
    : (a.locateLine?'<span class="al-fld" onclick="locateLine(\''+a.locateLine+'\')">&rarr; show in document</span>':'');
  var alIcon=a.kind==='eyeball'?IC.eye:IC.warn;
  var iconColor=a.sev==='hard'?'#c0392b':a.sev==='warn'?'#d97706':'#2563eb';
  var desc=a.desc||(a.kind==='eyeball'?'The following fields require manual verification against the original document.'
    :a.kind==='exist'?'OCR did not detect this field in the document.'
    :'The value extracted by OCR does not match the reference.');
  // Expanded actions: primary + Note + Flag Rule
  var noteBtn='<button class="al-btn" onclick="openJustify(\''+fileId+'\',\''+a.id+'\')">'+IC.doc+' Note</button>';
  var flagBtn='<button class="al-btn" onclick="openAddRule(\''+fileId+'\',null)">'+IC.warn+' Flag Rule</button>';
  return '<div class="al-card al-'+a.sev+'">'
    +'<div class="al-head">'
      +'<span class="al-ic" style="color:'+iconColor+';">'+alIcon+'</span>'
      +'<span class="al-ttl">'+a.title+'</span>'
      +'<span class="al-chips">'+chips+'</span>'
    +'</div>'
    +'<div class="al-desc">'+desc+'</div>'
    +'<div class="al-expand">'
      +(a.cmp?'<div class="al-cmp">'+a.cmp+'</div>':'')
      +'<div class="al-acts">'+acts+noteBtn+flagBtn+'</div>'
    +'</div>'
  +'</div>';
}
function reopenAlert(fileId,alertId){
  if(S.alertResolved[fileId])delete S.alertResolved[fileId][alertId];
  render();
}
function locateField(fileId,key,page){
  S.locate={file:fileId,key:key,page:page||1};render();
  var el=document.querySelector('.fd-f.hl');
  if(el&&el.scrollIntoView)el.scrollIntoView({block:'center'});
}
// Hover-highlight linked field rows (all months) — direct DOM, no re-render
function hlFields(keys){
  (keys||'').split(',').forEach(function(k){
    var els=document.querySelectorAll('.fk-'+k.trim());
    for(var i=0;i<els.length;i++)els[i].classList.add('xhl');
  });
}
function unhlFields(){
  var els=document.querySelectorAll('.fd-f.xhl');
  for(var i=0;i<els.length;i++)els[i].classList.remove('xhl');
}
// Rule-row hover: highlight its mapped field in the (uncovered) Fields quadrant + source doc line
function ruleHover(fileId,id){
  hlDoc(id);
  var b=ruleDraft(fileId,id);
  if(b&&b!=='exclude')hlFields(b);
}
function ruleUnhover(id){unhlDoc(id);unhlFields();}
// Hover-highlight the source document line for a rule (direct DOM, no re-render)
function hlDoc(id){
  var e=document.getElementById('psdoc-'+id);
  if(e){e.style.background='#fff3c4';e.style.outline='2px solid #e0a107';}
  var r=document.getElementById('rc-'+id);if(r)r.classList.add('hot');
}
function unhlDoc(id){
  var e=document.getElementById('psdoc-'+id);
  if(e){e.style.background='';e.style.outline='';}
  var r=document.getElementById('rc-'+id);if(r)r.classList.remove('hot');
}
// Click a rule → open preview + lock highlight + scroll into view
function locateLine(id){
  S.locateLine=(S.locateLine===id)?null:id;
  if(S.locateLine)S.fdPreviewOpen=true;
  render();
  if(S.locateLine){
    var b=document.getElementById('psdoc-'+S.locateLine);
    if(b&&b.scrollIntoView)b.scrollIntoView({block:'center'});
  }
}

// ── CUSTOM RULES (B-3) ──────────────────────────────────────
// Rule type catalogue
var RULE_TYPES=[
  {key:'required', label:'Required (必填)', dim:'Existence', hint:'Field or document must be present', hasSev:true, fields:true},
  {key:'manual',   label:'Manual Check (人工核验)', dim:'Eyeball / Existence', hint:'Flag field for human sign-off', hasSev:false, fields:true},
  {key:'match',    label:'Match (字段比对)', dim:'File Consistency', hint:'Value must equal another field or application value', hasSev:true, fields:true},
  {key:'threshold',label:'Threshold (阈值)', dim:'Internal Logic', hint:'Numeric ≥ / ≤ / = target', hasSev:true, fields:true},
  {key:'recency',  label:'Recency (时效)', dim:'Business Validity', hint:'Date within N months of application_date', hasSev:true, fields:true},
  {key:'note',     label:'Custom Note (自定义提醒)', dim:'Custom', hint:'Free-text reminder for reviewer', hasSev:false, fields:false}
];
function openAddRule(fileId,editId){
  S.addRuleOpen=true; S.addRuleFileId=fileId; S.addRuleEditId=editId||null;
  render();
  // pre-fill if editing
  if(editId){
    var r=(S.customRules[fileId]||[]).find(function(x){return x.id===editId;});
    if(r){
      document.getElementById('ar-type').value=r.ruleType||'required';
      document.getElementById('ar-field').value=r.field||'';
      document.getElementById('ar-param').value=r.param||'';
      document.getElementById('ar-sev').value=r.sev||'warn';
      document.getElementById('ar-note').value=r.note||'';
      updateRuleTypeUI();
    }
  }
}
function closeAddRule(){S.addRuleOpen=false;render();}
function updateRuleTypeUI(){
  var t=document.getElementById('ar-type');if(!t)return;
  var key=t.value;
  var rt=RULE_TYPES.find(function(x){return x.key===key;})||RULE_TYPES[0];
  var ph=document.getElementById('ar-param-row');
  var sh=document.getElementById('ar-sev-row');
  var fh=document.getElementById('ar-field-row');
  var nh=document.getElementById('ar-note-row');
  if(ph)ph.style.display=(key==='match'||key==='threshold'||key==='recency')?'':'none';
  if(sh)sh.style.display=rt.hasSev?'':'none';
  if(fh)fh.style.display=rt.fields?'':'none';
  if(nh)nh.style.display=(key==='note')?'':'none';
  var hnt=document.getElementById('ar-hint');
  if(hnt)hnt.textContent=rt.hint;
  var paramLbl=document.getElementById('ar-param-lbl');
  if(paramLbl)paramLbl.textContent=key==='match'?'Compare field / value':key==='threshold'?'Threshold (≥ value)':key==='recency'?'Max months before application_date':'Parameter';
}
function saveCustomRule(){
  var type=document.getElementById('ar-type').value;
  var field=document.getElementById('ar-field')?document.getElementById('ar-field').value.trim():'';
  var param=document.getElementById('ar-param')?document.getElementById('ar-param').value.trim():'';
  var sevEl=document.querySelector('[name="ar-sev"]:checked');
  var sev=sevEl?sevEl.value:'warn';
  var note=document.getElementById('ar-note')?document.getElementById('ar-note').value.trim():'';
  var rt=RULE_TYPES.find(function(x){return x.key===type;})||RULE_TYPES[0];
  var title=field?field.replace(/_/g,' ')+(type==='required'?' Required':type==='manual'?' Manual Check':type==='match'?' Match':type==='threshold'?' Threshold':type==='recency'?' Recency':''):'Custom: '+note.slice(0,40);
  var cmp='';
  if(type==='match'&&param)cmp=field+' <span class="bad">≠</span> '+param+' — values must match';
  if(type==='threshold'&&param)cmp=field+' must be ≥ <b>'+param+'</b>';
  if(type==='recency'&&param)cmp=field+' must be within <b>'+param+' months</b> of application_date';
  if(type==='required')cmp=field+' must be present';
  if(type==='note')cmp='<em>'+note+'</em>';
  var acts=type==='manual'?['verifyall']:type==='note'?[]:['amend','replace'];
  var rec=type==='manual'?'verifyall':type==='match'||type==='threshold'||type==='recency'?'amend':'justify';
  var rule={id:S.addRuleEditId||('cr-'+Date.now()),title:title,sev:rt.hasSev?sev:'check',
    dim:rt.dim,kind:type,cmp:cmp,acts:acts,rec:rec,custom:true,ruleType:type,field:field,param:param,note:note};
  if(!S.customRules[S.addRuleFileId])S.customRules[S.addRuleFileId]=[];
  if(S.addRuleEditId){
    var idx=S.customRules[S.addRuleFileId].findIndex(function(x){return x.id===S.addRuleEditId;});
    if(idx>=0)S.customRules[S.addRuleFileId][idx]=rule;
  } else { S.customRules[S.addRuleFileId].push(rule); }
  S.addRuleOpen=false; render();
}
function deleteCustomRule(fileId,id){
  if(!S.customRules[fileId])return;
  S.customRules[fileId]=S.customRules[fileId].filter(function(r){return r.id!==id;});
  render();
}
// ── Justify & proceed (unified: replaces both Justification + Skip) ──
function openJustify(fileId,alertId){S.justifyTarget={fileId:fileId,alertId:alertId};render();setTimeout(function(){var i=document.getElementById('justify-inp');if(i)i.focus();},30);}
function closeJustify(){S.justifyTarget=null;render();}
function saveJustify(){
  var inp=document.getElementById('justify-inp');
  var note=inp?inp.value.trim():'';
  var t=S.justifyTarget;
  if(!t)return;
  // Hard Fail requires a note
  var allAlerts=(FILE_DETAIL[t.fileId]?FILE_DETAIL[t.fileId].alerts:[]).concat(S.customRules[t.fileId]||[]);
  var alert=allAlerts.find(function(a){return a.id===t.alertId;});
  if(alert&&alert.sev==='hard'&&!note){document.getElementById('justify-inp').style.borderColor='#dc2626';return;}
  if(!S.justifiedAlerts[t.fileId])S.justifiedAlerts[t.fileId]={};
  S.justifiedAlerts[t.fileId][t.alertId]=note||'(no note)';
  S.justifyTarget=null;render();
}
function undoJustify(fileId,alertId){
  if(S.justifiedAlerts[fileId])delete S.justifiedAlerts[fileId][alertId];
  render();
}
function renderJustifyModal(){
  var t=S.justifyTarget;
  if(!t)return '';
  var allAlerts=(FILE_DETAIL[t.fileId]?FILE_DETAIL[t.fileId].alerts:[]).concat(S.customRules[t.fileId]||[]);
  var alert=allAlerts.find(function(a){return a.id===t.alertId;})||{};
  var isHard=alert.sev==='hard';
  return '<div class="ov" style="z-index:80;"><div class="add-rule-modal" style="width:440px;">'

function startEdit(fileId,k,val){S.editingField={fileId:fileId,k:k,val:val};render();setTimeout(function(){var i=document.getElementById('inline-edit-input');if(i){i.focus();i.select();}},30);}
function commitEdit(){
  if(!S.editingField)return;
  var inp=document.getElementById('inline-edit-input');
  var newVal=inp?inp.value.trim():S.editingField.val;
  if(newVal!==S.editingField.val&&newVal!==''){
    if(!S.fieldOverrides[S.editingField.fileId])S.fieldOverrides[S.editingField.fileId]={};
    S.fieldOverrides[S.editingField.fileId][S.editingField.k]=newVal;
  }

}
function cancelEdit(){S.editingField=null;render();}

function fdRow(f,fileId){
  var override=(S.fieldOverrides[fileId]||{})[f.k];
  var checked=((S.fieldChecked[fileId]||{})[f.k])||f.done;
  var need=f.need&&!checked;
  var hl=S.locate&&S.locate.file===fileId&&S.locate.key===f.k;
  var isEditing=S.editingField&&S.editingField.fileId===fileId&&S.editingField.k===f.k;
  var c=(f.c==null?99:f.c);
  var displayVal=override||f.v||'';

  // Value cell
  var valCell;
  if(isEditing){
    valCell='<input id="inline-edit-input" class="field-inp" value="'+displayVal+'"'
      +' onkeydown="if(event.key===\'Enter\')commitEdit();if(event.key===\'Escape\')cancelEdit();"'
      +' onblur="commitEdit()">';
  } else if(override){
    valCell='<span class="field-amended"><span class="old-val">'+f.v+'</span> &rarr; <span class="new-val">'+override+'</span></span>';
  } else {
    // clickable to edit — subtle pointer + hover underline
    var emptyHint=(c===0&&!f.v)?'<span class="field-empty">click to enter</span>':'';
    valCell='<span class="field-val" onclick="startEdit(\''+fileId+'\',\''+f.k+'\',\''+displayVal+'\')">'+(displayVal||emptyHint)+'</span>';
  }

  // Confidence display: dot only if 100%, pct shown if < 100%, red if 0
  var confHtml;
  if(c===0){
    confHtml='<span class="conf-dot"><span class="dot-r"></span></span>';
  } else if(c>=100){
    confHtml='<span class="conf-dot"><span class="dot-g"></span></span>';
  } else {
    confHtml='<span class="conf-dot"><span class="dot-g"></span><span class="pct">'+c+'%</span></span>';
  }

  // Issue 3: unified "Verify" (not "Check")
  var rightCtrl='';
  if(need){
    rightCtrl='<button class="verify-btn" onclick="checkField(\''+fileId+'\',\''+f.k+'\')">Verify</button>';
  } else if(f.need&&checked){
    rightCtrl='<span class="verified-tag">&#10003; Verified</span>';
  }

  // ── CED Rule Category dropdown (EC/EPF only — payslip uses the separate Rule Config panel) ──
  var ruleCell='';
  var ruleOpts=isRuleModeFile(fileId)?null:FIELD_RULE_OPTS[f.k];
  if(ruleOpts&&ruleOpts.length){
    var isFormula=ruleOpts.length===1&&ruleOpts[0].indexOf('Formula')!==-1;
    var currentRule=(S.cedRuleOverrides[fileId]||{})[f.k]||FIELD_RULE_DEFAULTS[f.k]||ruleOpts[0];
    var isModified=!!(S.cedRuleOverrides[fileId]||{})[f.k];
    if(isFormula){
      ruleCell='<div class="ced-rule-cell"><span class="ced-rule-tag">'+ruleOpts[0]+'</span></div>';
    } else {
      var optHtml=ruleOpts.map(function(o){
        return '<option value="'+o+'"'+(currentRule===o?' selected':'')+'>'+o+'</option>';
      }).join('');
      ruleCell='<div class="ced-rule-cell">'
        +(isModified?'<span class="ced-rule-modified-dot"></span>':'')
        +'<select class="ced-rule-sel'+(isModified?' modified':'')+'" onchange="setCedRule(\''+fileId+'\',\''+f.k+'\',this.value)">'
          +optHtml
        +'</select>'
      +'</div>';
    }
  }

  return '<div class="fd-f fk-'+f.k+(need?' need-row':'')+(hl?' hl':'')+(isEditing?' editing':'')+'" id="fdf-'+f.k+'">'
    +'<div class="lbl">'+f.k+'</div>'
    +'<div class="val-wrap">'+valCell+'</div>'
    +ruleCell
    +'<div class="fd-right-ctrl">'+rightCtrl+confHtml+'</div>'
  +'</div>';
}

// Mock income calculation from field values + CED rule overrides
function cedCalcIncome(fileId){
  var d=FILE_DETAIL[fileId];if(!d)return null;
  var overrides=S.cedRuleOverrides[fileId]||{};
  var lines=[];
  d.groups.forEach(function(g){
    g.fields.forEach(function(f){
      var opts=FIELD_RULE_OPTS[f.k];
      if(!opts||!opts.length)return; // no rule = not an income field
      var rule=overrides[f.k]||FIELD_RULE_DEFAULTS[f.k]||opts[0];
      if(rule.indexOf('Formula')!==-1||rule.indexOf('Reference')!==-1||rule.indexOf('Exclude')!==-1)return;
      var raw=parseFloat((f.v||'').toString().replace(/[^0-9.]/g,''));
      if(isNaN(raw)||raw===0)return;
      var monthly=raw;
      if(rule.indexOf('÷12')!==-1)monthly=raw/12;
      lines.push({label:f.k,rule:rule,monthly:monthly,isOverride:!!(overrides[f.k])});
    });
  });
  return lines;
}

function renderRuleConfig(fileId){
  var pend=pendingRules(fileId);
  function ruleRow(it){
    var draft=ruleDraft(fileId,it.id);
    var applied=ruleApplied(fileId,it.id);
    var isPending=pend.indexOf(it.id)!==-1;
    var isCommitted=!!(S.ruleMap[fileId]||{})[it.id];
    var hot=S.locateLine===it.id;
    var isNew=it.custom&&!(S.ruleMap[fileId]||{})[it.id];
    var buckets=it.kind==='earning'?EARNING_BUCKETS:DEDUCTION_BUCKETS;
    var opts=buckets.map(function(b){return '<option value="'+b.key+'"'+(draft===b.key?' selected':'')+'>'+b.label+'</option>';}).join('');
    var aiHint=(applied!==it.ai)?'':'<span class="rc-ai">AI</span>';
    return '<div class="rc-row'+(hot?' hot':'')+(isPending?' pending':'')+(isNew?' rc-new':'')+'" id="rc-'+it.id+'"'
        +' onmouseenter="ruleHover(\''+fileId+'\',\''+it.id+'\')" onmouseleave="ruleUnhover(\''+it.id+'\')">'
      +'<span class="rc-loc" onclick="locateLine(\''+it.id+'\')" title="Locate in document">'+IC.locate+'</span>'
      +'<div class="rc-name">'+it.ms+'<span class="rc-en">'+it.en+'</span>'+(it.custom?'<span class="rc-newtag">新·Sales补录</span>':'')+'</div>'
      +'<div class="rc-map">'
        +(isPending?'<span class="li-mod-dot" title="Pending"></span>':(isCommitted?'<span class="li-mod-dot" style="background:#1f9d57;"></span>':''))
        +'<span class="rc-arrow">&rarr;</span>'
        +'<select class="ced-rule-sel'+(isPending?' modified':'')+(draft==='exclude'?' li-excl':'')+'" onchange="setRule(\''+fileId+'\',\''+it.id+'\',this.value)">'+opts+'</select>'
        +aiHint
      +'</div>'
    +'</div>';
  }
  var allLI=lineItemsAll(fileId);
  var earnRows=allLI.filter(function(x){return x.kind==='earning';}).map(ruleRow).join('');
  var dedRows=allLI.filter(function(x){return x.kind==='deduction';}).map(ruleRow).join('');
  var applyBar=pend.length
    ? '<div class="li-apply"><span class="li-apply-txt">&#9888; <b>'+pend.length+' rule change'+(pend.length>1?'s':'')+' pending</b> — the field values below update only after you apply.</span>'
        +'<button class="btn btn-pri btn-sm" onclick="confirmRuleChanges(\''+fileId+'\')">&#8635; Confirm &amp; Refresh</button></div>'
    : '';
  var log=S.incomeLog[fileId]||[];
  var logSec=log.length
    ? '<details class="rc-log"><summary>Change Log ('+log.length+') — audit-recorded</summary>'
        +log.map(function(e){return '<div class="li-log"><span class="li-log-t">'+e.t+'</span><span class="li-log-raw">'+e.raw+'</span><span class="li-log-chg">'+e.from+' &rarr; <b>'+e.to+'</b></span></div>';}).join('')
      +'</details>'
    : '';
  return '<div class="rc-panel">'
    +'<div class="rc-sub" style="padding:8px 18px 4px;">Map each payslip line to an income field &middot; hover a row to locate it in the document &middot; no amounts here</div>'
    +'<div class="rc-grp">EARNINGS</div>'+earnRows
    +'<div class="rc-grp">DEDUCTIONS</div>'+dedRows
    +applyBar+logSec
  +'</div>';
}

  return '<div class="li2-hint">Showing the document’s original Malay text; <span class="li2-en-key">grey = English</span>. Edit an amount if OCR misread it.</div>'+months+addBtn;

/* ── ③④ Computed fields with aggregation process + OCR reconciliation ── */
function renderComputed(fileId){
  return PAYSLIP_MONTHS.map(function(m,mIdx){
    var c=computeMonth(fileId,mIdx);
    function fieldRow(key,label){
      var items=bucketItems(fileId,mIdx,key);
      if(!items.length)return '';
      var process=items.length>1?'<span class="cp-proc">'+items.map(function(x){return x.type.replace(/ (Allowance|Contr\.|Employee).*/,'')+' '+money(x.amt);}).join(' + ')+'</span>':'';
      return '<div class="cp-row"><span class="cp-lbl">'+label+process+'</span><span class="cp-val">RM '+money(c[key])+'</span></div>';
    }
    function valRow(label,calc,ocr,ok){
      return '<div class="cp-row cp-val-row"><span class="cp-lbl">'+label+'</span>'
        +'<span class="cp-calc">RM '+money(calc)+'</span>'
        +'<span class="cp-vs">vs OCR</span><span class="cp-ocr">RM '+money(ocr)+'</span>'
        +(ok?'<span class="cp-ok">&#10003;</span>':'<span class="cp-bad">&#9888; mismatch</span>')
      +'</div>';
    }
    return '<div class="cp-month">'
      +'<div class="li2-mhd">'+m.month+'</div>'
      +fieldRow('earning_basic_salary','Basic Salary')
      +fieldRow('earning_total_allowances','Total Allowances')
      +fieldRow('earning_overtime_pay','Overtime')
      +fieldRow('earning_bonus_commission','Bonus / Commission')
      +fieldRow('earning_others','Other Income')
      +fieldRow('deduction_epf_employee','EPF (Employee)')
      +fieldRow('deduction_socso_eis','SOCSO / EIS')
      +fieldRow('deduction_pcb_tax','PCB / Tax')
      +fieldRow('deduction_other_deductions','Other Deduction')
      +'<div class="cp-recon">'
        +valRow('Gross (Σ all earnings)',c.grossAll,c.ocrGross,c.okGross)
        +valRow('Total Deductions (Σ all)',c.dedAll,c.ocrDed,c.okDed)
        +valRow('Net Pay',c.grossAll-c.dedAll,c.ocrNet,c.okNet)
      +'</div>'
      +'<div class="cp-income">Verifiable income (excl. policy items): <b>RM '+money(c.incomeGross)+'</b></div>'
    +'</div>';
  }).join('');
}
function scrollToSec(key){S.secOpen[key]=true;render();var el=document.getElementById('sec-'+key);if(el&&el.scrollIntoView)el.scrollIntoView({block:'start',behavior:'smooth'});}

function renderFileDetail(){
  var d=FILE_DETAIL[S.fileId]||FILE_DETAIL.ec;
  var resMap=S.alertResolved[S.fileId]||{};
  var sevRank={hard:0,warn:1,check:2};
  var custom=(S.customRules[S.fileId]||[]).map(function(r){return Object.assign({},r,{isCustom:true});});

  // Auto-inject Marginal Page Quality alert when this file has warn pages
  var blur=fileBlurSummary(S.fileId);
  var marginalAlerts=[];
  if(blur.warnPages.length){
    marginalAlerts.push({id:'marginal-quality',title:'Marginal page quality — Verify required',
      sev:'check',dim:'Image Quality',kind:'eyeball',
      cmp:'Page '+blur.warnPages.join(', ')+' had marginal sharpness. AI extracted values but accuracy is not guaranteed — every field must be human-verified before submission.',
      acts:['verifyall'],rec:'verifyall'});
  }
  var allAlerts=marginalAlerts.concat(d.alerts).concat(custom);
  var sorted=allAlerts.slice().sort(function(x,y){
    return ((resMap[x.id]?10:0)+(sevRank[x.sev]==null?3:sevRank[x.sev])) - ((resMap[y.id]?10:0)+(sevRank[y.sev]==null?3:sevRank[y.sev]));
  });
  var justMap=S.justifiedAlerts[S.fileId]||{};
  var nh=0,nw=0,nc=0,nj=0;
  allAlerts.forEach(function(a){
    if(resMap[a.id])return;
    if(justMap[a.id]){nj++;return;}
    if(a.sev==='hard')nh++;else if(a.sev==='warn')nw++;else nc++;
  });
  var unresolvedCount=nh+nw+nc;

  // ── Alerts summary chips (shown inside the collapsible alert body) ──
  var statusMsg=nh?'<span class="fd-sum-block">&#9940; Cannot submit — resolve or justify Hard Fails first</span>'
    :(nh===0&&nw===0&&nc===0&&allAlerts.length?'<span class="fd-sum-ok">&#10003; All alerts cleared</span>':'<span class="fd-sum-soft">Resolve or justify remaining items</span>');
  var summary='<div class="fd-sum">'
    +(nh?'<span class="fd-sum-chip red">'+nh+' Hard Fail</span>':'')
    +(nw?'<span class="fd-sum-chip org">'+nw+' Warning</span>':'')
    +(nc?'<span class="fd-sum-chip blue">'+nc+' Needs Check</span>':'')
    +(nj?'<span class="fd-sum-chip" style="background:#fff4e0;color:#b45309;">'+nj+' Justified</span>':'')
    +statusMsg
  +'</div>';

  // ── Fields content
  var locPage=(S.locate&&S.locate.file===S.fileId)?S.locate.page:1;
  // Check if OCR extracted almost nothing (>70% of fields are 0% confidence)
  var totalFields=0,zeroFields=0;
  d.groups.forEach(function(g){g.fields.forEach(function(f){totalFields++;if((f.c==null?99:f.c)===0)zeroFields++;});});
  var zeroBanner='';
  if(totalFields>2&&zeroFields/totalFields>0.6){
    zeroBanner='<div class="fd-zero-banner">'
      +'<strong>⚠ OCR could not extract this document</strong> — '+(zeroFields)+' of '+totalFields+' fields returned no data. '
      +'This may indicate the file is misclassified, the scan quality is too low, or the document type is unsupported.<br>'
      +'<div class="fd-z-act">'
        +'<button class="btn btn-sm" style="font-size:11.5px;">↺ Replace File</button>'
        +'<button class="btn btn-sm" style="font-size:11.5px;" onclick="switchFdTab(\'alerts\')">&#8593; Review Alerts</button>'
      +'</div>'
    +'</div>';
  }
  var lineMode=!!d.lineItemMode;
  var isIncomeFile=INCOME_FILE_IDS.indexOf(S.fileId)!==-1;
  var aEmpty=(allAlerts.length===0);

  // ── Alert ACTION CENTER (top, prominent): counts → routing + next-step + cards ──
  var issues=lineMode?payslipIssues(S.fileId):{missing:[],mismatch:[]};
  var nVerify=allAlerts.filter(function(a){return a.kind==='eyeball'&&!resMap[a.id]&&!justMap[a.id];}).length;
  var nCheck=nw+nc-nVerify;            // remaining warnings / checks (non-eyeball)
  var nMissing=issues.missing.length;
  var nMismatch=issues.mismatch.length;
  var totalIssues=nh+nVerify+nCheck+nMissing+nMismatch;
  function aChip(n,label,cls,target){
    if(!n)return '';
    return '<span class="ac-chip '+cls+'" onclick="scrollToSec(\''+target+'\')">'+n+' '+label+'</span>';
  }
  var itemsSec=lineMode?'items':'fields';
  // next-step priority: Hard → Missing → Mismatch → Verify → Check
  var next= nh?{t:'Resolve '+nh+' hard fail'+(nh>1?'s':''),s:itemsSec}
    : nMissing?{t:'Map '+nMissing+' missing required field'+(nMissing>1?'s':''),s:'map'}
    : nMismatch?{t:'Review '+nMismatch+' total that doesn’t reconcile',s:'comp'}
    : nVerify?{t:'Verify '+nVerify+' flagged field'+(nVerify>1?'s':''),s:itemsSec}
    : nCheck?{t:'Check '+nCheck+' field'+(nCheck>1?'s':''),s:itemsSec}
    : null;
  var alertCards=sorted.length?'<div class="ac-cards">'+sorted.map(function(a){return fdAlertCard(a,S.fileId);}).join('')+'</div>':'';

  // ── Step state machine (drives §3 cascade gating). lineMode has NO top nav —
  //    the 3 vertical "Step N" cards + their header badges carry progress & alert entry. ──
  var prc=lineMode?pendingRules(S.fileId).length:0;
  var s1Open=nh+nVerify+nCheck;            // ① Sales recognition/eyeball open items
  var s2Open=nMissing+prc;                 // ② CED rule-mapping open items
  // ③ is a GATED result light: grey 待定 until ①② clear, then green/red.
  // Suppresses mismatch noise that is merely a symptom of an unfinished ① or ②.
  var s3=(s1Open||s2Open)?'wait':(nMismatch?'error':'done');

  // non-lineMode files keep the compact action center (no 3-step model)
  var actionCenter='<div class="ac'+(totalIssues?'':' ac-clear')+'">'
    +'<div class="ac-bar">'
      +'<span class="ac-ic" style="color:'+(totalIssues?(nh?'#c0392b':'#d97706'):'#1f9d57')+';">'+IC.warn+'</span>'
      +'<span class="ac-ttl">'+(totalIssues?totalIssues+' item'+(totalIssues>1?'s':'')+' need attention':'All validation checks passed')+'</span>'
      +(nh?'<span class="ac-chip red" onclick="scrollToSec(\''+itemsSec+'\')">'+nh+' Hard Fail</span>':'')
      +aChip(nVerify,'Verify','blue',itemsSec)
      +aChip(nCheck,'Check','org',itemsSec)
      +(next?'<span class="ac-next" onclick="scrollToSec(\''+next.s+'\')">&#9654; Next: '+next.t+'</span>':'')
    +'</div>'
    +alertCards
  +'</div>';
  var topBar=lineMode?'':actionCenter;   // lineMode: no top nav, step cards carry everything

  // ── Preview (right column) ──
  var qPreview='<div class="fdq-preview">'
    +'<div class="fd-rtop">'
      +'<select class="sel" style="flex:1;min-width:80px;"><option>category</option><option>Applicant Income</option></select>'
      +'<select class="sel" style="flex:1;min-width:80px;"><option>File type</option><option>Payslip</option></select>'
      +'<button class="btn btn-pri btn-sm">Confirm</button>'
    +'</div>'
    +'<div class="fd-pdftb">'
      +'<input class="inp" style="width:38px;min-width:0;padding:3px 4px;text-align:center;" value="'+locPage+'"> <span class="muted" style="font-size:11.5px;">/ 3</span>'
      +'<button class="mini">&minus;</button><button class="mini">+</button>'
      +'<button class="mini" title="Rotate">&#8635;</button>'
      +'<span style="margin-left:auto;font-size:11.5px;color:var(--mut);">Fit page</span>'
    +'</div>'
    +'<div class="fd-doc">'+docMock(d.doc)+'</div>'
  +'</div>';

  // ── Left workspace ──
  var workspace;
  if(lineMode){
    var bounced=!!(S.salesBounce&&S.salesBounce[S.fileId]);
    // ── §1 Step-1 (Sales): show COMPLETE line items + one verify action. No disconnected alert cards. ──
    var salesItems=sorted.filter(function(a){return !resMap[a.id]&&!justMap[a.id];});
    var s1Badge=bounced?'<span class="sec-badge red">退回核实</span>'
      :(salesItems.length?'<span class="sec-badge org">待核 '+salesItems.length+'</span>':'<span class="sec-badge green">已核实</span>');
    var verifyBar;
    if(bounced){
      verifyBar='<div class="vf-bar vf-bounce">&#8617; <b>CED 已退回</b> — 加总值与工资单印刷值不符。请对照右侧原文核实下列金额，确认或修正后标记完成。'
        +'<div class="vf-acts"><button class="btn btn-pri btn-sm" onclick="clearBounce(\''+S.fileId+'\')">&#10003; 已核实金额，标记完成</button></div></div>';
    } else if(salesItems.length){
      var vlist=salesItems.map(function(a){return '<li>'+(a.title||a.dim||'Check')+(a.desc?' — <span class="vf-desc">'+a.desc+'</span>':'')+'</li>';}).join('');
      verifyBar='<div class="vf-bar vf-todo"><div class="vf-hd">&#128065; 待人工核实 '+salesItems.length+' 项 — 对照右侧原文逐行核对金额无误：</div>'
        +'<ul class="vf-list">'+vlist+'</ul>'
        +'<div class="vf-acts"><button class="btn btn-pri btn-sm" onclick="verifyAllSales(\''+S.fileId+'\')">&#10003; 全部已核实</button>'
        +'<button class="btn btn-sm" onclick="openJustify(\''+S.fileId+'\',\''+salesItems[0].id+'\')">忽略并备注</button></div></div>';
    } else {
      verifyBar='<div class="vf-bar vf-done">&#10003; 细项已人工核实 — Sales 已确认金额准确</div>';
    }
    var s1Body=verifyBar+renderLineItems(S.fileId);
    // ── §2 Step-2 (CED): rule gap — incl. NEW line-item types Sales补录 (cross-layer routed from ①). Amount edits never affect this. ──
    var nNew=newTypeGaps(S.fileId).length;
    var mapBadge=prc?'<span class="sec-badge org">'+prc+' 待应用</span>':(nMissing?'<span class="sec-badge org">缺口 '+nMissing+'</span>':'<span class="sec-badge green">规则完整</span>');
    var missBanner=(nMissing?'<div class="sec-banner org">&#9888; 规则缺口：<b>'+issues.missing.map(function(k){return k.replace(/_/g,' ');}).join(', ')+'</b> 尚无映射规则 — 在下方为对应细项指派字段。</div>':'')
      +(nNew?'<div class="sec-banner org">&#9888; <b>'+nNew+' 项 Sales 补录的新细项</b>待映射 — Sales 已补数据，请为其指派收入/扣减字段并「确认更新」。</div>':'');
    // ── §3 Step-3: GATED result. Grey 待定 while ①/② open; only a TRUE anomaly when both upstream clear → bounce to Sales. ──
    var mmBadge=bounced?'<span class="sec-badge red">已退回</span>'
      :(s3==='error'?'<span class="sec-badge red">'+nMismatch+' 不符</span>'
      :(s3==='done'?'<span class="sec-badge green">已校验</span>'
      :'<span class="sec-badge grey">待定</span>'));
    var mmBanner;
    if(s3==='wait')mmBanner='<div class="sec-banner grey">&#9203; 校验待定 — '+(s1Open?'等 Sales 完成 ① 细项核实':'等 CED 补全 ② 规则缺口')+'后，加总结果才可信，暂不告警。</div>';
    else if(s3==='error'){
      mmBanner='<div class="sec-banner red">&#9888; '+nMismatch+' 项加总与工资单印刷值不符。①②均已就绪 → 排除规则原因后，疑为 Sales 录入的某个金额有误。'
        +(bounced?'<br><b>已退回 Sales 核实，待其确认金额。</b>'
          :'<div class="vf-acts" style="margin-top:6px;"><button class="btn btn-sm" onclick="bounceToSales(\''+S.fileId+'\')">&#8617; 退回 Sales 核实金额</button></div>')
      +'</div>';
    }
    else mmBanner='<div class="sec-banner green">&#10003; 加总与工资单印刷值一致，校验通过。</div>';
    workspace=
      secCard('items','1','Step 1 · 细项核实','Source Line Items · Sales 负责',s1Badge, s1Body)
      +secCard('map','2','Step 2 · 字段映射','Line-item → Field · CED 负责',mapBadge, missBanner+renderRuleConfig(S.fileId))
      +secCard('comp','3','Step 3 · 加总校验','Computed &amp; Validation · vs 印刷值',mmBadge, mmBanner+renderComputed(S.fileId));
  } else {
    var renderGroups=d.groups;
    var groupsHtml=renderGroups.map(function(g){
      var hdr=(g.name&&g.name.length)?'<div class="fd-grp">'+g.name+(g.del?'<span class="del">Delete</span>':'')+'</div>':'';
      var rows=g.fields.map(function(f){return fdRow(f,S.fileId);}).join('');
      var add=g.addNew?'<div class="add-item">+ Add New Item</div>':'';
      return hdr+rows+add;
    }).join('');
    var fieldsHead='<div class="fd-fields-head"><span class="h-lbl">Field</span><span class="h-val">OCR Value</span>'
      +(isIncomeFile?'<span class="h-rule">Rule Classification &#9656;</span>':'')+'<span class="h-conf">Conf.</span></div>';
    workspace=secCard('fields','&#9707;','Fields','OCR-extracted values','', zeroBanner+fieldsHead+groupsHtml);
  }

  // ── Income total for footer ──
  var overrideCount=lineMode?Object.keys(S.ruleMap[S.fileId]||{}).length:Object.keys(S.cedRuleOverrides[S.fileId]||{}).length;
  var totalMonthly;
  if(lineMode){totalMonthly=payslipAvgIncome(S.fileId);}
  else{var calcLines=isIncomeFile?cedCalcIncome(S.fileId):null;totalMonthly=calcLines?calcLines.reduce(function(s,l){return s+l.monthly;},0):0;}

  return '<div class="ov ov-full"><div class="fd">'
    +'<div class="fd-top">'
      +'<button class="fd-back" onclick="closeFile()">&#8249;</button>'
      +'<div><div class="fd-title">'+d.name+'</div><div class="fd-crumb">'+d.crumb+'</div></div>'
      +'<div class="sp"></div>'
      +'<button class="btn btn-sm">&#8249; Prev</button>'
      +'<button class="btn btn-sm">Next &#8250;</button>'
    +'</div>'
    +topBar
    +'<div class="fd-work">'
      +'<div class="fd-wleft">'+workspace+'</div>'
      +qPreview
    +'</div>'
    // ── Footer ──
    +'<div class="fd-bottom">'
      +'<button class="btn btn-sm" onclick="openSync()">&#8635; Sync from OCR</button>'
      +'<button class="btn btn-sm">Save Draft</button>'
      +'<div style="margin-left:auto;display:flex;align-items:center;gap:10px;">'
        +(isIncomeFile
          ? '<span style="font-size:12px;color:#374151;">'+(lineMode?'Avg verifiable income (3 mo)':'Verifiable income')+': <b style="color:#1e3a8a;font-size:13px;">RM '+totalMonthly.toFixed(2)+'/mo</b>'
              +(overrideCount?' <span style="color:#1f9d57;font-size:11px;">('+overrideCount+' confirmed rule'+(overrideCount>1?'s':'')+')</span>':'')
              +'</span>'
            +(lineMode&&pendingRules(S.fileId).length
              ? '<button class="btn btn-pri btn-sm" disabled title="Confirm & Refresh pending rule changes first">&#10003; Confirm Classification</button>'
              : '<button class="btn btn-pri btn-sm">&#10003; Confirm Classification</button>')
          : '<button class="btn btn-sm">Save</button>'
            +'<button class="btn btn-pri btn-sm" '+(nh?'disabled title="Resolve all Hard Fails first"':'')+'>'+(nh?'&#9940; Submit':'Submit &#8594;')+'</button>')
      +'</div>'
    +'</div>'
  +'</div></div>';
}

/* ════════════════ OCR DATA SYNC ════════════════ */
function renderSync(){
  var rows=SYNC_ROWS.map(function(r){
    var st=r.st==='ok'?'<span class="sync-st-ok">SYNC OK</span>':'<span class="sync-st-cf">CONFLICT</span>';
    return '<tr>'
      +'<td><input type="checkbox" class="cbx" checked></td>'
      +'<td>'+r.f+'</td>'
      +'<td>'+r.cur+'</td>'
      +'<td>'+r.ocr+'</td>'
      +'<td style="text-align:right;">'+st+'</td>'
    +'</tr>';
  }).join('');
  return '<div class="ov" style="z-index:60;"><div class="sync">'
    +'<div class="sync-hd">'
      +'<div style="display:flex;align-items:flex-start;"><h3>OCR Data Sync</h3><button class="docs-x" style="margin-left:auto;" onclick="closeSync()">&times;</button></div>'
      +'<div class="sub">Comparing current value with detected document data.</div>'
      +'<div class="note">Selecting a checkbox means applying the OCR value to replace the current manual value.</div>'
    +'</div>'
    +'<div class="sync-bd">'
      +'<h4>Application Details</h4>'
      +'<table><thead><tr><th><input type="checkbox" class="cbx" checked></th><th>Field Name</th><th>Current Value</th><th>OCR Value</th><th style="text-align:right;">Status</th></tr></thead>'
      +'<tbody>'+rows+'</tbody></table>'
    +'</div>'
    +'<div class="sync-ft"><button class="btn" onclick="closeSync()">Cancel</button><button class="btn btn-pri" onclick="closeSync()">Merge Selected Fields</button></div>'
  +'</div></div>';
}

/* ════════════════ ADD RULE MODAL ════════════════ */
function renderAddRule(){
  var editing=!!S.addRuleEditId;
  var typeOpts=RULE_TYPES.map(function(r){return '<option value="'+r.key+'">'+r.label+'</option>';}).join('');
  return '<div class="ov" style="z-index:70;"><div class="add-rule-modal">'
    +'<div class="arm-hdr"><h3>'+(editing?'Edit Custom Rule':'Add Rule / Check')+'</h3><button class="docs-x" onclick="closeAddRule()">&times;</button></div>'
    +'<div class="arm-body">'
      +'<div class="arm-note">Custom rules are attached to <strong>this file only</strong> and visible to all reviewers. They run alongside system rules. You can edit or remove them at any time.</div>'
      +'<div class="arm-row">'
        +'<label class="arm-lbl">Rule Type</label>'
        +'<select id="ar-type" class="sel" style="width:100%;" onchange="updateRuleTypeUI()">'+typeOpts+'</select>'
        +'<div id="ar-hint" class="arm-hint">Field or document must be present</div>'
      +'</div>'
      +'<div class="arm-row" id="ar-field-row">'
        +'<label class="arm-lbl">Target Field</label>'
        +'<input id="ar-field" class="inp" style="width:100%;" placeholder="e.g. total_sales_price, customer_name">'
      +'</div>'
      +'<div class="arm-row" id="ar-param-row" style="display:none;">'
        +'<label id="ar-param-lbl" class="arm-lbl">Compare field / value</label>'
        +'<input id="ar-param" class="inp" style="width:100%;" placeholder="e.g. 3  /  id_no  /  application.customer_name">'
      +'</div>'
      +'<div class="arm-row" id="ar-sev-row">'
        +'<label class="arm-lbl">Severity</label>'
        +'<div class="arm-sevs">'
          +'<label class="arm-sev-opt"><input type="radio" name="ar-sev" value="hard"> <span class="sevtag sev-hard">Hard Fail</span></label>'
          +'<label class="arm-sev-opt"><input type="radio" name="ar-sev" value="warn" checked> <span class="sevtag sev-warn">Warning</span></label>'
        +'</div>'
        +'<div style="font-size:11px;color:#9aa1ab;margin-top:4px;">Hard Fail blocks submission. Warning allows justification.</div>'
      +'</div>'
      +'<div class="arm-row" id="ar-note-row" style="display:none;">'
        +'<label class="arm-lbl">Note (shown as alert message)</label>'
        +'<textarea id="ar-note" class="inp" style="width:100%;min-height:60px;resize:vertical;" placeholder="e.g. Please confirm the guarantor signature on page 3"></textarea>'
      +'</div>'
    +'</div>'
    +'<div class="arm-foot"><button class="btn" onclick="closeAddRule()">Cancel</button><button class="btn btn-pri" onclick="saveCustomRule()">'+(editing?'Save Changes':'Add Rule')+'</button></div>'
  +'</div></div>';
}

/* ════════════════ RENDER + ACTIONS ════════════════ */
function render(){
  var html=renderHost();
  if(S.docsOpen&&!S.fileOpen)html+=renderDocs();
  if(S.fileOpen)html+=renderFileDetail();
  if(S.syncOpen)html+=renderSync();
  if(S.addRuleOpen)html+=renderAddRule();
  if(S.justifyTarget)html+=renderJustifyModal();
  if(S.addLineTarget)html+=renderAddLineModal();
  if(S.qcOverrideTarget)html+=renderQcOverrideModal();
  if(S.qcDetailFor)html+=renderQcDetailModal();
  if(S.classifyOpen)html+=renderClassifyModal();
  if(S.replaceTarget)html+=renderReplacePagePanel();
  document.getElementById('app').innerHTML=html;
}
function openDocs(){S.docsOpen=true;render();}
function closeDocs(){S.docsOpen=false;render();}
function setDocsTab(t){S.docsTab=t;render();}
function setInnerTab(t){S.innerTab=t;render();}
function openFile(id){if(id){S.fileId=id;S.locate=null;S.locateLine=null;S.secOpen={};S.cedRecalcDone=false;if(S.ruleDraft)S.ruleDraft[id]={};}S.fileOpen=true;render();}
function closeFile(){S.fileOpen=false;render();}
function openSync(){S.syncOpen=true;render();}
function closeSync(){S.syncOpen=false;render();}

render();
</script>
</body>
</html>
