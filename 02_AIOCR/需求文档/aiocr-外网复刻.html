.sd-form{display:grid;grid-template-columns:1fr 1fr;gap:14px 22px;}
.sd-f label{display:block;font-size:12px;color:#4b5563;margin-bottom:5px;}
.sd-f label .req{color:#dc2626;}
.sd-nav-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:6px;font-size:12.5px;color:#374151;cursor:pointer;}
.sd-nav-item:hover{background:#f1f4f9;}
.sd-nav-item.active{background:#eaf1fe;color:var(--blue);font-weight:600;}
.sd-nav-sub{padding-left:22px;}
.sd-stat-ok{color:#1a7a43;}
.sd-stat-no{color:#dc2626;}
.sd-sum label{font-size:11.5px;color:#6b7280;}
.sd-sum-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--bd2);font-size:12.5px;}
.sd-sum-row .v{font-weight:600;color:#1f2937;}
.sd-footer{display:flex;align-items:center;gap:10px;justify-content:flex-end;background:#fff;border-top:1px solid var(--bd);padding:12px 18px;position:sticky;bottom:0;}
.sd-bigbtn{width:100%;padding:13px;font-size:14px;font-weight:700;border-radius:9px;border:1.5px solid var(--blue);background:#fff;color:var(--blue);cursor:pointer;margin-top:12px;}
.sd-bigbtn:hover{background:#eff4ff;}

function confirmRuleChanges(fileId){

// Recompute one month from the APPLIED rule mapping.
//   buckets        = income-classified sums (exclude dropped)
//   grossAll/dedAll= sum of ALL captured lines (for OCR reconciliation, step ④)
//   incomeGross    = sum of income buckets (exclude dropped) → verifiable income
function computeMonth(fileId,mIdx){
  var m=PAYSLIP_MONTHS[mIdx];var out={};
  EARNING_BUCKETS.forEach(function(b){out[b.key]=0;});
  DEDUCTION_BUCKETS.forEach(function(b){out[b.key]=0;});
  var grossAll=0,dedAll=0;
  lineItemsAll(fileId).forEach(function(it){
    var ov=(S.lineAmt[fileId]||{})[mIdx+'|'+it.type];
    var amt;
    if(it.custom){ if(ov==null)return; amt=ov; }        // back-filled line: amount comes ONLY from Sales entry, per month
    else { var base=(it.kind==='earning'?m.earn:m.ded)[it.type]; if(base==null)return; amt=(ov!=null?ov:base); }
    if(it.kind==='earning')grossAll+=amt;else dedAll+=amt;
    var bucket=ruleApplied(fileId,it.id);
    if(bucket==='exclude')return;
    out[bucket]=(out[bucket]||0)+amt;
  });
  var incomeGross=EARNING_BUCKETS.reduce(function(s,b){return b.key==='exclude'?s:s+(out[b.key]||0);},0);
  out.gross_salary=grossAll;                 // printed gross = all earnings
  out.deduction_total_deductions=dedAll;     // printed total deductions = all deductions
  out.net_pay_amount=grossAll-dedAll;        // printed net
  out.grossAll=grossAll; out.dedAll=dedAll; out.incomeGross=incomeGross;
  out.ocrGross=m.ocrGross; out.ocrDed=m.ocrDed; out.ocrNet=m.ocrNet;
  return out;
}

    var base=(it.kind==='earning'?PAYSLIP_MONTHS[mIdx].earn:PAYSLIP_MONTHS[mIdx].ded)[it.type];
    return base!=null && ruleApplied(fileId,it.id)===bucketKey;
  }).map(function(it){return {type:it.type,amt:lineAmtVal(fileId,mIdx,it)};});
}
function money(n){return (n==null?'':Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}));}
// 2-step income flow: both steps open by default — client wants the result visible without
// clicking through layers. Scheme only controls ORDER (see curScheme), not which is open.
function secDefaultOpen(k){
  if(k==='fields')return true;              // non-lineMode files: always open
  return k==='items'||k==='comp';
}
function secOpen(k){return (S.secOpen[k]===undefined)?secDefaultOpen(k):S.secOpen[k];}
function toggleSec(k){S.secOpen[k]=!secOpen(k);render();}
function setRole(r){S.role=r;S.secOpen={};render();}  // switching role resets section open-state to the role default
// Which step order to show — a design-option choice (Option 1 / Option 2), kept independent of S.role so
// demoing one against the other never silently changes alert visibility or edit rights.
// Defaults from role until the user explicitly picks one via the toggle.
function curScheme(){return S.stepScheme||(S.role==='ced'?'2':'1');}
function setScheme(s){S.stepScheme=s;S.secOpen={};render();}

// ── QUALITY DATA — attached to FILES directly, surfaced inside the file list ──
// File quality property: pass | warn | fail; issues = [{msg,tip}]; score; override note in S.qcOverrides
// ── CLASSIFICATIONS (replaces FILE_QC) ────────────────────────────
// Classification happens FIRST. Each file has segments by page range.
// Blur detection runs PER PAGE after classification confirmed.
// Per-page blur lets us flag specific pages even within a clean segment.
var CLASSIFICATION_COLORS={
  Mykad:'#2563eb','Driving License':'#1a7a43',Payslip:'#e0a800',
  'Individual Bank Statement':'#7c3aed','EPF Statement':'#7c3aed',
  VSO:'#e0a800','EC Form':'#7c3aed',Passport:'#dc2626','Form B':'#7c3aed'
};
function classifColor(t){return CLASSIFICATION_COLORS[t]||'#5b6470';}
var CLASSIFICATIONS={
  multidoc:{confirmed:true,totalPages:19,segments:[
    {type:'Mykad',range:'1-2',conf:99},
    {type:'Driving License',range:'3',conf:99},
    {type:'Payslip',range:'4-6',conf:50},
    {type:'Individual Bank Statement',range:'7-19',conf:50}
  ],pageBlur:{4:'warn',15:'fail'}}, // page 4 marginal, page 15 fail — shows all 3 tiers
  vso:{confirmed:false,totalPages:1,segments:[{type:'VSO',range:'1',conf:50}],pageBlur:{1:'fail'}},
  mykad:{confirmed:true,totalPages:2,segments:[{type:'Mykad',range:'1-2',conf:99}],pageBlur:{2:'warn'}}, // page 2 marginal
  epf:{confirmed:true,totalPages:1,segments:[{type:'EPF Statement',range:'1',conf:99}],pageBlur:{}},
  ec:{confirmed:true,totalPages:1,segments:[{type:'EC Form',range:'1',conf:99}],pageBlur:{}}
};
if(!S.qcOverrides)S.qcOverrides={};      // {fileId: noteText} — overrides blur block for a whole file

// Parse "1-3" or "5" into [start,end]
function parseRange(r){
  if(!r)return [0,0];
  var p=String(r).split('-');
  return [parseInt(p[0])||0, parseInt(p[1]||p[0])||0];
}
// Aggregate per-page blur to file-level summary, accounting for user actions.
// 'skipped' pages are subtracted from fail/warn (the user accepted the loss).
function fileBlurSummary(fileId){
  var c=CLASSIFICATIONS[fileId];
  if(!c)return {failPages:[],warnPages:[],skippedPages:[],overridden:false};
  var pb=c.pageBlur||{},skips=(S.pageSkipped||{})[fileId]||{};
  var fail=[],warn=[],skipped=[];
  Object.keys(pb).forEach(function(k){
    var p=parseInt(k);
    if(skips[p]){skipped.push(p);return;}
    if(pb[k]==='fail')fail.push(p);
    else if(pb[k]==='warn')warn.push(p);
  });
  [fail,warn,skipped].forEach(function(a){a.sort(function(x,y){return x-y;});});
  return {failPages:fail,warnPages:warn,skippedPages:skipped,overridden:!!(S.qcOverrides||{})[fileId]};
}
// Per-segment blur status (any blurry page in range → segment is flagged)
function segmentBlur(fileId,range){
  var c=CLASSIFICATIONS[fileId];if(!c||!c.pageBlur)return {status:'pass',pages:[]};
  var r=parseRange(range),fail=[],warn=[];
  for(var p=r[0];p<=r[1];p++){
    if(c.pageBlur[p]==='fail')fail.push(p);
    else if(c.pageBlur[p]==='warn')warn.push(p);
  }
  return {status:fail.length?'fail':warn.length?'warn':'pass',pages:fail.concat(warn)};
}

// ── Compat shim: fileQcStatus drives the existing detail modal / overrides flow ──
function fileQcStatus(fileId){
  var c=CLASSIFICATIONS[fileId];if(!c||!c.confirmed)return null;
  var blur=fileBlurSummary(fileId);
  if(blur.overridden)return {status:'override',score:32,issues:buildBlurIssues(blur)};
  if(blur.failPages.length)return {status:'fail',score:32,issues:buildBlurIssues(blur)};
  if(blur.warnPages.length)return {status:'warn',score:72,issues:buildBlurIssues(blur)};
  return {status:'pass',score:95};
}
function buildBlurIssues(blur){
  var iss=[];
  if(blur.failPages.length){
    iss.push({msg:'Page '+blur.failPages.join(', ')+(blur.failPages.length>1?' are':' is')+' blurry — text is not readable',
      tip:'Replace just these page(s), or re-scan the whole document at 300 DPI'});
  }
  if(blur.warnPages.length){
    iss.push({msg:'Page '+blur.warnPages.join(', ')+' marginal — OCR accuracy may be reduced',
      tip:'Retake with steady hands and even lighting if possible'});
  }
  return iss;
}
function qcStatusChip(fileId){
  var c=CLASSIFICATIONS[fileId];
  if(!c)return '';
  if(!c.confirmed)return '<span class="stage-pill sp-extracting" style="cursor:pointer;" onclick="openClassify(\''+fileId+'\')"><span class="sp-spin">⟳</span> Classifying…</span>';
  var blur=fileBlurSummary(fileId);
  if(blur.overridden)return '<span class="stage-pill" style="background:#fffbf0;color:#b45309;cursor:pointer;" onclick="openClassify(\''+fileId+'\')">&#9888; Quality overridden</span>';
  if(blur.failPages.length)return '<span class="stage-pill sp-failed" style="cursor:pointer;" onclick="openClassify(\''+fileId+'\')">&#10007; Page '+blur.failPages.join(',')+' blurry</span>';
  if(blur.warnPages.length)return '<span class="stage-pill" style="background:#fef9ec;color:#b45309;cursor:pointer;" onclick="openClassify(\''+fileId+'\')">&#9888; '+blur.warnPages.length+' marginal page'+(blur.warnPages.length>1?'s':'')+'</span>';
  return '';
}
function qcDescSummary(fileId){
  var c=CLASSIFICATIONS[fileId];if(!c)return '';
  if(!c.confirmed)return '<span style="font-size:11px;color:#1d4ed8;" onclick="openClassify(\''+fileId+'\')" class="lnk">Awaiting classification…</span>';
  var blur=fileBlurSummary(fileId);
  if(blur.overridden)return '<span class="muted" style="font-size:11px;">Overridden by user</span>';
  if(blur.failPages.length)return '<span style="font-size:11px;color:#c0392b;" onclick="openClassify(\''+fileId+'\')" class="lnk">Page '+blur.failPages.join(',')+' blurry &mdash; OCR skipped for these</span>';
  if(blur.warnPages.length)return '<span style="font-size:11px;color:#b45309;" onclick="openClassify(\''+fileId+'\')" class="lnk">Page '+blur.warnPages.join(',')+' marginal quality</span>';
  return '';
}

function renderClassifyModal(){
  var fileId=S.classifyFileId;
  if(!fileId)return '';
  var c=CLASSIFICATIONS[fileId];
  var file=FILES.find(function(f){return f.id===fileId;})||{name:fileId};
  if(!c)return '';

  // Build page → segment-index map for coloring
  var pageSeg={};
  c.segments.forEach(function(s,i){
    var r=parseRange(s.range);
    for(var p=r[0];p<=r[1];p++)pageSeg[p]=i;
  });

  // Page thumbnails — 3-tier visual + hover actions for blurry pages
  var skips=(S.pageSkipped||{})[fileId]||{};
  var thumbs='';
  for(var p=1;p<=c.totalPages;p++){
    var segIdx=pageSeg[p];
    var seg=segIdx!=null?c.segments[segIdx]:null;
    var color=seg?classifColor(seg.type):'#cfd5dd';
    var isSel=segIdx===S.classifSelectedSeg;
    var blur=(c.pageBlur||{})[p];
    var isSkipped=skips[p];
    // Tier badge
    var tierCls=isSkipped?'skipped':blur==='fail'?'fail':blur==='warn'?'warn':'';
    var blurBadge=isSkipped?'<div class="thumb-blur-badge skipped">Skipped</div>'
                  :blur==='fail'?'<div class="thumb-blur-badge fail">&#9888; Blurry</div>'
                  :blur==='warn'?'<div class="thumb-blur-badge warn">&#9888; Marginal</div>':'';
    // Persistent corner button (always visible) + larger hover panel for problem pages
    var pageActions='';
    if(blur||isSkipped){
      pageActions='<button class="thumb-corner-btn" title="Replace page '+p+'" onclick="openReplacePage(event,\''+fileId+'\','+p+')">&#8634;</button>'
        +'<div class="thumb-actions">'
          +'<button class="thumb-act" title="Replace this page" onclick="openReplacePage(event,\''+fileId+'\','+p+')">&#8634; Replace</button>'
          +(isSkipped
            ?'<button class="thumb-act" title="Un-skip" onclick="event.stopPropagation();unSkipPage(\''+fileId+'\','+p+')">Un-skip</button>'
            :'<button class="thumb-act" title="Skip this page" onclick="event.stopPropagation();skipPage(\''+fileId+'\','+p+')">Skip</button>')
        +'</div>';
    }
    thumbs+='<div class="cls-thumb tier-'+tierCls+(isSel?' selected':'')+(blur==='fail'&&!isSkipped?' has-blur':'')+(isSkipped?' is-skipped':'')+'" onclick="selectSegment('+(segIdx!=null?segIdx:0)+')" style="border-color:'+color+';">'
      +pageThumbMock(seg?seg.type:'',p)
      +blurBadge
      +pageActions
      +'<div class="cls-thumb-n'+(isSel?' active':'')+'">'+p+'</div>'
    +'</div>';
  }

  // Classification cards with 3-tier OCR outcome
  var cards=c.segments.map(function(s,i){
    var color=classifColor(s.type);
    var isSel=i===S.classifSelectedSeg;
    var conf=s.conf===null?'Manual':s.conf+'%';
    var confCol=s.conf===null?'#5b6470':s.conf>=90?'#1a7a43':'#e0a800';
    // Build tier-aware OCR-outcome line per segment, accounting for skipped pages
    var r=parseRange(s.range);
    var fail=[],warn=[],skipped=[];
    var segSkips=(S.pageSkipped||{})[fileId]||{};
    for(var pg=r[0];pg<=r[1];pg++){
      var b=(c.pageBlur||{})[pg];
      if(segSkips[pg])skipped.push(pg);
      else if(b==='fail')fail.push(pg);
      else if(b==='warn')warn.push(pg);
    }
    // Build action chips for any problem page (always-visible)
    function pageActChip(pageNum,kind){
      return '<span class="oc-page-chip '+kind+'">'
        +'page '+pageNum
        +'<button class="oc-act" title="Replace this page" onclick="event.stopPropagation();openReplacePage(event,\''+fileId+'\','+pageNum+')">&#8634; Replace</button>'
        +(kind==='skipped'
          ?'<button class="oc-act" title="Restore" onclick="event.stopPropagation();unSkipPage(\''+fileId+'\','+pageNum+')">Un-skip</button>'
          :'<button class="oc-act" title="Skip" onclick="event.stopPropagation();skipPage(\''+fileId+'\','+pageNum+')">Skip</button>')
      +'</span>';
    }
    var outcomeHtml='';
    if(fail.length){
      var failChips=fail.map(function(p){return pageActChip(p,'fail');}).join('');
      outcomeHtml='<div class="cls-outcome fail">'
        +'<div class="oc-row"><span class="oc-dot fail"></span><b>'+fail.length+' page'+(fail.length>1?'s':'')+' blurry</b> &mdash; OCR blocked on '+(fail.length>1?'these pages':'this page')+'</div>'
        +'<div class="oc-page-chips">'+failChips+'</div>'
      +'</div>';
    } else if(warn.length){
      var warnChips=warn.map(function(p){return pageActChip(p,'warn');}).join('');
      outcomeHtml='<div class="cls-outcome warn">'
        +'<div class="oc-row"><span class="oc-dot warn"></span><b>'+warn.length+' page'+(warn.length>1?'s':'')+' marginal</b> &mdash; OCR will run, every field must be Verified</div>'
        +'<div class="oc-page-chips">'+warnChips+'</div>'
      +'</div>';
    } else {
      outcomeHtml='<div class="cls-outcome pass"><span class="oc-dot pass"></span>All '+(r[1]-r[0]+1)+' page'+(r[1]>r[0]?'s':'')+' clear &mdash; OCR will run normally</div>';
    }
    if(skipped.length){
      var skipChips=skipped.map(function(p){return pageActChip(p,'skipped');}).join('');
      outcomeHtml+='<div class="cls-outcome neutral">'
        +'<div class="oc-row"><span class="oc-dot neutral"></span>'+skipped.length+' page'+(skipped.length>1?'s':'')+' skipped &mdash; fields left blank, user may fill manually</div>'
        +'<div class="oc-page-chips">'+skipChips+'</div>'
      +'</div>';
    }
    var rangeCell=(S.editSegIdx===i)
      ?'<input id="seg-range-inp" class="inp" style="padding:3px 7px;font-size:11.5px;width:80px;" value="'+s.range+'" onkeydown="if(event.key===\'Enter\')saveSegmentEdit();if(event.key===\'Escape\'){S.editSegIdx=null;render();}" onblur="saveSegmentEdit()">'
      :s.range;
    return '<div class="cls-card'+(isSel?' selected':'')+'" onclick="selectSegment('+i+')" style="border-color:'+color+';">'
      +'<div class="cls-card-row"><span class="cls-card-type">'+s.type+'</span><span class="cls-card-conf" style="color:'+confCol+';">'+conf+'</span></div>'
      +'<div class="cls-card-row" style="margin-top:8px;">'
        +'<span class="cls-card-range">Page Range: '+rangeCell+'</span>'
        +'<span class="cls-card-acts">'
          +'<a class="lnk" onclick="event.stopPropagation();modifySegment('+i+')">Modify</a>'
          +'<a class="lnk" onclick="event.stopPropagation();removeSegment('+i+')" style="margin-left:14px;color:#5b6470;">Remove</a>'
        +'</span>'
      +'</div>'
      +outcomeHtml
    +'</div>';
  }).join('');

  // Add panel (dashed) or button
  var typeOpts=Object.keys(CLASSIFICATION_COLORS).map(function(t){return '<option value="'+t+'">'+t+'</option>';}).join('');
  var addBlock=S.classifAddOpen
    ?'<div class="cls-add-panel">'
      +'<div class="cls-add-hdr">&#43; Add Manual Classification / Split Point</div>'
      +'<div style="margin:10px 0 4px;font-size:12px;color:#374151;">File Type</div>'
      +'<select id="cls-add-type" class="sel" style="width:100%;"><option value="--">-- Please Select --</option>'+typeOpts+'</select>'
      +'<div style="margin:10px 0 4px;font-size:12px;color:#374151;">Page Range (e.g. 1, 3-5, 8)</div>'
      +'<input id="cls-add-range" class="inp" style="width:100%;" placeholder="e.g. 4-6">'
      +'<div class="cls-add-actions">'
        +'<button class="btn btn-pri btn-sm" onclick="confirmAddClassif()">Confirm Add</button>'
        +'<button class="btn btn-sm" onclick="closeAddClassif()">Cancel</button>'
      +'</div>'
    +'</div>'
    :'<button class="cls-add-btn" onclick="openAddClassif()">&#43; Add Split Point / Classification</button>';

  // 3-tier summary bar — counts of Pass / Marginal / Fail (+ Skipped) at the top
  var blur=fileBlurSummary(fileId);
  var passCount=c.totalPages-blur.failPages.length-blur.warnPages.length-blur.skippedPages.length;
  var blurBar='<div class="cls-tier-bar">'
    +'<span class="tier-chip tier-pass"><span class="oc-dot pass"></span>'+passCount+' clear</span>'
    +(blur.warnPages.length?'<span class="tier-chip tier-warn"><span class="oc-dot warn"></span>'+blur.warnPages.length+' marginal &mdash; OCR + Verify required</span>':'')
    +(blur.failPages.length?'<span class="tier-chip tier-fail"><span class="oc-dot fail"></span>'+blur.failPages.length+' blurry &mdash; OCR blocked, action needed</span>':'')
    +(blur.skippedPages.length?'<span class="tier-chip tier-skipped">'+blur.skippedPages.length+' skipped</span>':'')
    +(blur.failPages.length?'<button class="justify-btn" style="margin-left:auto;padding:5px 10px;" onclick="overrideBlurFromClassify()">Proceed anyway for all &middot; Add note</button>':'')
  +'</div>';

  return '<div class="ov" style="z-index:85;"><div class="cls-modal">'
    +'<div class="cls-hdr">'
      +'<button class="fd-back" style="margin-right:10px;" onclick="closeClassify()">&#8249;</button>'

    +'<div class="cls-body">'
      +'<div class="cls-thumbs-panel">'
        +'<div class="cls-thumbs-hdr">File Preview: '+c.totalPages+' pages</div>'
        +'<div class="cls-thumbs-grid">'+thumbs+'</div>'
      +'</div>'
      +'<div class="cls-results-panel">'
        +'<div class="cls-results-hdr">AI Classification Result</div>'
        +'<div class="cls-cards">'+cards+'</div>'
        +addBlock
      +'</div>'
    +'</div>'
    +'<div class="cls-foot">'
      +'<button class="btn" onclick="closeClassify()">Cancel</button>'

function openQcOverride(fileId){

function saveQcOverride(){
  var inp=document.getElementById('qc-note-inp');

  if(!note){if(inp)inp.style.borderColor='#dc2626';return;}
  if(!S.qcOverrides)S.qcOverrides={};

}
function undoQcOverride(fileId){delete S.qcOverrides[fileId];render();}

function actIcons(f){

// Semantic status chip — color = meaning, not decoration
function stChip(fst,ost){
  var fstChip='<span class="muted">&mdash;</span>';
  if(fst){var m={'OCR Processed':{c:'sc-green',i:'✓'},'Upload Succeeded':{c:'sc-green',i:'✓'},'OCR Processing':{c:'sc-blue',i:'⟳'},'Queued':{c:'sc-grey',i:'·'}};var x=m[fst]||{c:'sc-grey',i:''};fstChip='<span class="status-chip '+x.c+'">'+x.i+' '+fst+'</span>';}
  var ostChip='<span class="muted">&mdash;</span>';
  if(ost){var n={'Validation Succeeded':{c:'sc-green',i:'✓'},'OCR Succeeded':{c:'sc-green',i:'✓'},'Validation Failed':{c:'sc-red',i:'✗'},'Validation passed':{c:'sc-green',i:'✓'},'Validation failed':{c:'sc-red',i:'✗'},'Validating':{c:'sc-amber',i:'⟳'},'Extracting text...':{c:'sc-blue',i:'⟳'}};var y=n[ost]||{c:'sc-amber',i:'⟳'};ostChip='<span class="status-chip '+y.c+'">'+y.i+' '+ost+'</span>';}
  return {fst:fstChip,ost:ostChip};
}
function renderOcrBanner(){
  // Count pending classifications & blocked-by-blur files
  var classifPending=Object.keys(CLASSIFICATIONS).filter(function(k){return !CLASSIFICATIONS[k].confirmed;}).length;
  var qcBlocked=Object.keys(CLASSIFICATIONS).filter(function(k){
    var c=CLASSIFICATIONS[k];if(!c.confirmed)return false;
    var b=fileBlurSummary(k);return b.failPages.length&&!b.overridden;
  }).length;
  if(S.ocrView!=='processing'){
    // Done state: if there are still blocks, show a slim banner; otherwise nothing
    if(qcBlocked){
      return '<div class="ocr-banner" style="background:#fdeceb;border-color:#f3bcb9;">'
        +'<div class="ocr-banner-icon">&#10007;</div>'
        +'<div class="ocr-banner-body">'
          +'<div class="ocr-banner-title" style="color:#c0392b;">'+qcBlocked+' file'+(qcBlocked>1?'s':'')+' blocked at quality check &mdash; AI recognition skipped</div>'
          +'<div class="ocr-banner-sub" style="color:#8b3a3a;">Open the file row to replace with a clearer copy, or proceed with a documented override (audit-logged).</div>'
        +'</div>'
      +'</div>';
    }
    return '';
  }
  // Processing state: 5-stage pipeline — Upload → Classify → Quality → OCR → Cross-Val
  var classifStageHtml=classifPending
    ?'<span class="ocr-stage active"><span class="sp-spin">⟳</span> Classifying &mdash; '+classifPending+' pending</span>'
    :'<span class="ocr-stage done">&#10003; Classified</span>';
  var qcStageHtml=classifPending
    ?'<span class="ocr-stage pend">Quality check</span>'
    :qcBlocked
    ?'<span class="ocr-stage" style="background:#fdeceb;color:#c0392b;font-weight:700;">&#10007; Quality &mdash; '+qcBlocked+' blocked</span>'
    :'<span class="ocr-stage done">&#10003; Quality check</span>';
  var ocrActive=!classifPending&&!qcBlocked;
  return '<div class="ocr-banner'+(qcBlocked?' ocr-banner-warn':'')+'">'
    +'<div class="ocr-banner-icon">'+(qcBlocked?'&#9888;':'⏳')+'</div>'
    +'<div class="ocr-banner-body">'
      +'<div class="ocr-banner-title">'+(qcBlocked?'Processing — some files need attention':classifPending?'Processing — '+classifPending+' file'+(classifPending>1?'s':'')+' awaiting classification':'Processing files in background — this usually takes 10–30 minutes')+'</div>'
      +'<div class="ocr-banner-sub">You can leave this page and return at any time. Processing will continue automatically.</div>'
      +'<div class="ocr-pipeline">'
        +'<span class="ocr-stage done">&#10003; Upload</span>'
        +'<span class="ocr-stage-arrow">›</span>'
        +classifStageHtml
        +'<span class="ocr-stage-arrow">›</span>'
        +qcStageHtml
        +'<span class="ocr-stage-arrow">›</span>'
        +'<span class="ocr-stage '+(ocrActive?'active':'pend')+'">'+(ocrActive?'<span class="sp-spin">⟳</span> ':'')+'OCR extraction</span>'
        +'<span class="ocr-stage-arrow">›</span>'
        +'<span class="ocr-stage pend">Cross-validation</span>'
      +'</div>'
      +'<div class="ocr-banner-hint">Started at 14:22 &nbsp;·&nbsp; <button class="btn btn-sm" style="padding:2px 8px;font-size:11px;" onclick="S.ocrView=\'done\';render();">Refresh status</button> &nbsp;·&nbsp; <a class="lnk" onclick="S.ocrView=\'done\';render();">Preview: jump to completed state</a></div>'
    +'</div>'
  +'</div>';
}
function renderFileList(){
  var rows=FILES.map(function(f){
    var typeCell='';
    if(f.typePills&&f.typePills.length){
      typeCell=f.typePills.map(function(p){
        return '<span class="type-pill">'+p.label+' ('+p.pages+')</span>';
      }).join('');
    } else if(f.type){
      typeCell='<span class="pill" style="background:#eef3fb;color:#2c5fa8;">'+f.type+'</span>';
    }
    // Pipeline stages: File Status = upstream stage (Quality / OCR), File OCR Status = downstream (Validation)
    var sc=stChip(f.fileStatus,f.ocrStatus);
    var classif=CLASSIFICATIONS[f.id];
    var pending=classif&&!classif.confirmed;
    var qcSt=fileQcStatus(f.id);
    var qcBlocked=qcSt&&qcSt.status==='fail';
    var qcOverridden=qcSt&&qcSt.status==='override';
    var qcWarn=qcSt&&qcSt.status==='warn';

    if(pending){
      // Step 1: classification not yet confirmed — block everything downstream
      sc.fst='<span class="stage-pill sp-extracting" style="cursor:pointer;" onclick="openClassify(\''+f.id+'\')"><span class="sp-spin">⟳</span> Classifying…</span>';
      sc.ost='<span class="muted">&mdash; pending classification</span>';
    } else if(S.ocrView==='processing'){
      if(qcBlocked){
        sc.fst='<span class="stage-pill sp-complete">&#10003; Classified</span><br>'+qcStatusChip(f.id);
        sc.ost='<span class="muted">&mdash; OCR skipped on blurry pages</span>';
      } else if(qcOverridden){
        sc.fst='<span class="stage-pill sp-extracting"><span class="sp-spin">⟳</span> Extracting text…</span><br>'+qcStatusChip(f.id);
        sc.ost='<span class="muted">&mdash;</span>';
      } else {
        var stages={'multidoc':'extracting','vso':'queued','mykad':'complete','epf':'complete','ec':'complete','xlsx':'complete','consent':'complete'};
        var st=stages[f.id]||'complete';
        var stChip2=st==='extracting'?'<span class="stage-pill sp-extracting"><span class="sp-spin">⟳</span> Extracting text…</span>'
                :st==='queued'?'<span class="stage-pill sp-queued">· Queued</span>'
                :'<span class="stage-pill sp-complete">✓ OCR done</span>';
        sc.fst=qcWarn?(stChip2+'<br>'+qcStatusChip(f.id)):stChip2;
        sc.ost=st==='complete'?'<span class="stage-pill sp-validating">⟳ Validating…</span>':'<span class="muted">&mdash;</span>';
      }
    } else {
      if(qcBlocked){
        sc.fst='<span class="stage-pill sp-complete">&#10003; Classified</span><br>'+qcStatusChip(f.id);
        sc.ost='<span class="muted">&mdash; OCR skipped on blurry pages</span>';
      } else if(qcOverridden||qcWarn){
        sc.fst=(sc.fst||'')+'<br>'+qcStatusChip(f.id);
      }
    }
    // Description cell now carries Quality info when it matters
    var qcSummary=qcDescSummary(f.id);
    var descCell=qcSummary||'<span class="aic" title="Add justification note" style="cursor:pointer;">'+IC.edit+'</span>';
    return '<tr>'
      +'<td><input type="checkbox" class="cbx"></td>'
      +'<td><div class="fn">'+f.name+'</div><div class="muted" style="font-size:10.5px;">('+f.size+')</div></td>'
      +'<td>'+f.subject+'</td>'
      +'<td><a class="lnk">'+f.cat+'</a></td>'  // blue = clickable only
      +'<td class="type-pills-cell">'+typeCell+'</td>'
      +'<td style="text-align:center;font-size:12px;color:#5b6470;">'+f.ocr+'</td>'
      +'<td>'+sc.fst+'</td>'
      +'<td>'+sc.ost+'</td>'
      +'<td style="text-align:center;">'+descCell+'</td>'
      +'<td class="muted" style="font-size:11px;">'+f.time+'</td>'
      +'<td class="muted" style="font-size:11px;">'+f.src+'</td>'
      +'<td>'+actIcons(f)+'</td>'
    +'</tr>';
  }).join('');
  return renderOcrBanner()
    +'<div class="filters">'
      +'<input class="inp" placeholder="Search values">'
      +'<select class="sel"><option>Subject</option></select>'
      +'<select class="sel"><option>Category</option></select>'
      +'<select class="sel"><option>File Status</option></select>'
      +'<button class="btn btn-pri btn-sm">'+IC.search+' Search</button>'
      +'<button class="btn btn-sm">'+IC.refresh+' Reset Filters</button>'
      +'<button class="btn btn-sm" disabled>'+IC.dl+' Download</button>'
      +'<button class="btn btn-sm">'+IC.refresh+' Refresh</button>'
    +'</div>'
    +'<table>'
      +'<thead><tr>'
        +'<th><input type="checkbox" class="cbx"></th><th>File Name</th><th>Subject</th><th>Category</th><th>File Type</th><th>OCR Flag</th><th>File Status</th><th>File OCR Status</th><th>Description</th><th>Upload Time &#8645;</th><th>Source</th><th>Action</th>'
      +'</tr></thead>'
      +'<tbody>'+rows+'</tbody>'
    +'</table>'
    +'<div class="fl-foot">'
      +'<div class="pager"><span>&lsaquo;</span><span class="pg-num">1</span><span>&rsaquo;</span><span>10 / page &#9662;</span></div>'
      +'<div style="display:flex;gap:10px;">'
        +'<button class="btn" onclick="closeDocs()">Back To List</button>'
        +'<button class="btn btn-pri" '+(S.ocrView==='processing'?'disabled title="Wait for processing to complete"':'')+'>'
          +(S.ocrView==='processing'?'⏳ Processing…':'Submit for Verification (Application)')
        +'</button>'
      +'</div>'
    +'</div>';
}
function renderCrossVal(){
  var withIssues=CROSSVAL.filter(function(r){return r.rules&&r.rules.length;}).length;
  var rows=CROSSVAL.map(function(r){
    var cnt=r.rules?r.rules.length:0;
    var countCell=cnt?'<span class="alert-cnt">'+cnt+'</span>':'<span class="alert-ok-badge">'+IC.ckcirc+'</span>';
    var rulesCell=cnt?'<div class="alert-rules">'+r.rules.map(function(x){return '<div>'+x+'</div>';}).join('')+'</div>':'';

/* ── Income Verification: CED's income classification workspace ── */
function setIncomeDecision(fileId,label,decision){
  if(!S.incomeDecisions[fileId])S.incomeDecisions[fileId]={};
  if(S.incomeDecisions[fileId][label]===decision){
    delete S.incomeDecisions[fileId][label]; // toggle off
  } else {
    S.incomeDecisions[fileId][label]=decision;
  }
  render();
}
function renderIncomeVerification(){
  // Tally totals
  var autoPassed=0, pending=0, counted=0, excluded=0;
  INCOME_VERIFY_FILES.forEach(function(f){
    f.items.forEach(function(it){
      var dec=(S.incomeDecisions[f.fileId]||{})[it.label]||(it.decision);
      if(dec==='auto')autoPassed++;
      else if(dec==='count')counted++;
      else if(dec==='exclude')excluded++;
      else pending++;
    });
  });
  var totalItems=autoPassed+pending+counted+excluded;
  var verifiedItems=autoPassed+counted+excluded;
  var summaryBar='<div class="iv-summary-bar">'
    +'<div class="iv-sum-cell"><div class="iv-sum-label">Income Files</div><div class="iv-sum-val">'+INCOME_VERIFY_FILES.length+'</div><div class="iv-sum-sub">Applicant Income type</div></div>'
    +'<div class="iv-sum-cell"><div class="iv-sum-label">Auto-Verified</div><div class="iv-sum-val" style="color:#1a7a43;">'+autoPassed+'</div><div class="iv-sum-sub">AI confidence ≥ 90%</div></div>'
    +'<div class="iv-sum-cell"><div class="iv-sum-label">Pending Review</div><div class="iv-sum-val" style="color:'+(pending?'#b45309':'#1a7a43')+';">'+pending+'</div><div class="iv-sum-sub">'+(pending?'CED action required':'All reviewed')+'</div></div>'
    +'<div class="iv-sum-cell"><div class="iv-sum-label">Verified by CED</div><div class="iv-sum-val">'+verifiedItems+' / '+totalItems+'</div><div class="iv-sum-sub">items reviewed</div></div>'
  +'</div>';
  var notice=pending
    ? '<div class="iv-notice">&#9888; <strong>'+pending+' item(s) need CED review</strong> — these income fields had low AI confidence or no extracted value. Click <strong>Count</strong> to include in verifiable income, or <strong>Exclude</strong> if not applicable per CED policy. The Proceed button is locked until all items are reviewed.</div>'
    : '<div class="iv-notice" style="background:#e6f4ea;border-color:#9bd5ab;color:#1a5c2e;">&#10003; <strong>All income items reviewed.</strong> Proceed to approve or request additional documents.</div>';

  var fileCards=INCOME_VERIFY_FILES.map(function(f){
    var pendingInFile=f.items.filter(function(it){
      var dec=(S.incomeDecisions[f.fileId]||{})[it.label]||(it.decision);
      return !dec||dec==='null'||dec===null;
    }).length;
    var hd='<div class="iv-file-hd">'
      +'<span class="iv-file-badge">'+f.fileType+'</span>'
      +'<span class="iv-file-name">'+f.fileName+'</span>'
      +'<span style="font-size:11.5px;color:var(--mut);">'+f.subject+'</span>'
      +(pendingInFile?'<span class="fd-ltab-badge" style="margin-left:8px;">'+pendingInFile+' pending</span>':'<span class="fd-ltab-badge ok" style="margin-left:8px;">&#10003;</span>')
    +'</div>';
    var headerRow='<div class="iv-item" style="background:#fafbfc;font-size:11px;font-weight:700;color:#6b7280;padding:6px 16px;">'
      +'<div style="flex:2;">Field</div>'
      +'<div style="flex:1.2;">Category</div>'
      +'<div style="flex:1.5;">OCR Value</div>'
      +'<div style="flex:1;">Confidence</div>'
      +'<div style="flex:1;text-align:center;">Status</div>'
      +'<div style="flex:1.5;text-align:right;">CED Decision</div>'
    +'</div>';
    var itemRows=f.items.map(function(it){
      var dec=(S.incomeDecisions[f.fileId]||{})[it.label]||(it.decision);
      var isPending=!dec||dec===null;
      // Confidence bar
      var pct=it.aiConf;
      var fillCls=pct>=90?'hi':pct>=60?'mid':'lo';
      var confHtml=pct>0
        ?('<div class="iv-conf-wrap"><div class="iv-conf-bar"><div class="iv-conf-fill '+fillCls+'" style="width:'+pct+'%;"></div></div><span class="iv-conf-pct">'+pct+'%</span></div>')
        :'<span class="muted" style="font-size:11px;">No data</span>';
      // Status badge
      var badge=dec==='auto'?'<span class="iv-badge-auto">Auto ✓</span>'
        :dec==='count'?'<span class="iv-badge-counted">Counted</span>'
        :dec==='exclude'?'<span class="iv-badge-excluded">Excluded</span>'
        :'<span class="iv-badge-pending">Pending</span>';
      // Action buttons
      var btnCount='<button class="iv-btn'+(dec==='count'?' active':'')+'" onclick="setIncomeDecision(\''+f.fileId+'\',\''+it.label+'\',\'count\')">Count</button>';
      var btnExcl='<button class="iv-btn excl'+(dec==='exclude'?' active':'')+'" onclick="setIncomeDecision(\''+f.fileId+'\',\''+it.label+'\',\'exclude\')">Exclude</button>';
      var acts=dec==='auto'
        ?('<button class="iv-btn" onclick="setIncomeDecision(\''+f.fileId+'\',\''+it.label+'\',\'exclude\')">Override</button>')
        :btnCount+btnExcl;
      return '<div class="iv-item'+(isPending?' need-row':'')+'">'
        +'<div class="iv-item-label">'+it.label+'</div>'
        +'<div class="iv-item-cat">'+it.cat+'</div>'
        +'<div class="iv-item-val'+(it.aiVal?'':' empty')+'">'+(it.aiVal||'Not extracted')+'</div>'
        +'<div class="iv-conf-wrap" style="flex:1;">'+confHtml+'</div>'
        +'<div class="iv-status">'+badge+'</div>'
        +'<div class="iv-acts">'+acts+'</div>'
      +'</div>';
    }).join('');
    return '<div class="iv-file-card">'+hd+headerRow+itemRows+'</div>';
  }).join('');

  var footer='<div class="iv-footer">'
    +'<span class="muted" style="font-size:12px;">Income Verification is recorded under your CED ID and audit-logged.</span>'
    +'<div style="display:flex;gap:8px;">'
      +'<button class="btn btn-sm">Request Additional Docs</button>'
      +'<button class="btn btn-pri btn-sm" '+(pending?'disabled title="Review all pending items first"':'')+'>&#10003; Confirm Income &amp; Proceed</button>'
    +'</div>'
  +'</div>';
  return summaryBar+notice+fileCards+footer;
}

/* ════════════════ FILE DETAIL ════════════════ */
function actBtn(key,fileId,alertId,rec){
  var label=ACT_LABEL[key],isRec=key===rec;
  // Replace Document is always primary blue (destructive but intended action)
  // Verify All is also always primary
  var forceRec=(key==='replace'||key==='verifyall');
  var cls='fd-abtn'+((isRec||forceRec)?' fd-abtn-rec':'');
  if(key==='verifyall')return '<button class="'+cls+'" onclick="verifyAll(\''+fileId+'\',\''+alertId+'\')">'+label+'</button>';
  return '<button class="'+cls+'" onclick="resolveAlertAct(\''+fileId+'\',\''+alertId+'\',\''+key+'\')">'+label+'</button>';
}
// Resolve a consistency / existence alert via one of its action buttons (Amend, Replace, Adopt…)
function resolveAlertAct(fileId,alertId,how){
  if(!S.alertResolved[fileId])S.alertResolved[fileId]={};
  S.alertResolved[fileId][alertId]={how:how};
  var msg=how==='replace'?'Replacement document requested.'
    :how==='amend'?'Scanned value amended and saved.'
    :how==='adopt'?'Reference value adopted.'
    :'Resolved.';
  showToast(msg,'ok');
  render();
}
function sevMeta(s){return s==='hard'?{t:'Hard Fail',c:'sev-hard'}:s==='warn'?{t:'Warning',c:'sev-warn'}:{t:'Needs Check',c:'sev-check'};}
function guidanceLine(a){
  if(a.kind==='eyeball')return '<strong>Verify All</strong> — manually confirm the flagged fields against the physical document. AI cannot verify these automatically. If verification is not possible, use <strong>Justify &amp; proceed</strong>.';
  if(a.kind==='exist')return 'OCR did not detect this field. Open the source document to check &mdash; if it exists, <strong>Amend</strong> to enter the value manually. If genuinely absent, <strong>Justify &amp; proceed</strong>.';
  return 'AI misread the value → <strong>Amend</strong> to correct. Document non-compliant → <strong>Replace Document</strong>. Issue acceptable with a reason → <strong>Justify &amp; proceed</strong>.';
}
function fdAlertCard(a,fileId){
  // ── Justified state ──
  var justified=(S.justifiedAlerts[fileId]||{})[a.id];
  if(justified!==undefined){
    return '<div class="fd-alert justified">'
      +'<div class="fd-alert-top"><span class="sevtag sev-just">Justified</span><span class="dimtag">'+a.dim+'</span>'+(a.isCustom?'<span class="customtag">&#9998; Custom</span>':'<span class="systag">System</span>')+'</div>'
      +'<div class="fd-alert-ttl">'+a.title+'</div>'
      +(justified?'<div class="just-note">&#128221; '+justified+'</div>':'<div class="just-note" style="color:#9aa1ab;font-style:italic;">No note provided.</div>')
      +'<div class="fd-alert-acts"><button class="fd-abtn" onclick="undoJustify(\''+fileId+'\',\''+a.id+'\')">&#8635; Undo</button></div>'
    +'</div>';
  }
  // ── Resolved state ──
  var resolved=(S.alertResolved[fileId]||{})[a.id];
  var sm=sevMeta(a.sev);
  var acts=a.acts.map(function(k){return actBtn(k,fileId,a.id,a.rec);}).join('');
  // Justify — always tertiary (text-link style)
  var justifyBtn='<button class="justify-btn" onclick="openJustify(\''+fileId+'\',\''+a.id+'\')">'+(a.sev==='hard'?'Justify (note required)':'Justify &amp; proceed')+'</button>';
  if(resolved){
    var how=resolved.how==='adopt'?('Adopted reference <b>'+resolved.note+'</b>'):
      resolved.how==='replace'?'Replacement requested':
      resolved.note?('Corrected: '+resolved.note):'Resolved';
    return '<div class="fd-alert resolved">'
      +'<div class="fd-alert-top"><span class="sevtag sev-ok">&#10003; Resolved</span><span class="dimtag">'+a.dim+'</span></div>'
      +'<div class="fd-alert-ttl">'+a.title+'</div>'
      +'<div class="fd-resolved-how">'+how+'</div>'
      +'<div class="fd-alert-acts"><button class="fd-abtn" onclick="reopenAlert(\''+fileId+'\',\''+a.id+'\')">&#8635; Undo</button></div>'
    +'</div>';
  }
  // ── Active state — compact card, expands on hover ──
  // Linked fields: chips that highlight the field rows on hover + locate on click
  var linkedFields=a.fields||(a.locate?[a.locate]:[]);
  var chips=linkedFields.length
    ? linkedFields.map(function(k){return '<span class="al-fld">'+k+'</span>';}).join('')
    : '';
  var alIcon=a.kind==='eyeball'?IC.eye:IC.warn;
  var iconColor=a.sev==='hard'?'#c0392b':a.sev==='warn'?'#d97706':'#2563eb';
  var desc=a.desc||(a.kind==='eyeball'?'The following fields require manual verification against the original document.'
    :a.kind==='exist'?'OCR did not detect this field in the document.'
    :'The value extracted by OCR does not match the reference.');
  // Expanded actions: primary + Note + Flag Rule
  var noteBtn='<button class="al-btn" onclick="openJustify(\''+fileId+'\',\''+a.id+'\')">'+IC.doc+' Note</button>';
  var flagBtn='<button class="al-btn" onclick="openAddRule(\''+fileId+'\',null)">'+IC.warn+' Flag Rule</button>';
  return '<div class="al-card al-'+a.sev+'">'
    +'<div class="al-head">'
      +'<span class="al-ic" style="color:'+iconColor+';">'+alIcon+'</span>'
      +'<span class="al-ttl">'+a.title+'</span>'
      +'<span class="al-chips">'+chips+'</span>'
    +'</div>'
    +'<div class="al-desc">'+desc+'</div>'
    +(a.cmp?'<div class="al-expand"><div class="al-cmp">'+a.cmp+'</div></div>':'')
    +'<div class="al-acts">'+acts+noteBtn+flagBtn+'</div>'
  +'</div>';
}

  render();

// Verify a single global eyeball item (employer name, IC, etc.)
// Render-independent micro-feedback toast (lives outside #app so render() won't wipe it)
function showToast(msg,kind){
  var host=document.getElementById('toast-host');if(!host)return;
  var t=document.createElement('div');t.className='toast'+(kind?' toast-'+kind:'');
  t.innerHTML=(kind==='ok'?'<span class="tk">&#10003;</span>':'')+msg;
  host.appendChild(t);
  setTimeout(function(){t.classList.add('show');},10);
  setTimeout(function(){t.classList.add('hide');},2600);
  setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t);},2950);
}
// Brief green pulse on a row, then settle back to normal style
function pulse(key){
  S.flash=S.flash||{};S.flash[key]=true;render();
  setTimeout(function(){if(S.flash)delete S.flash[key];render();},850);
}
// When every global field + every flagged line item is verified, clear the Step-1 eyeball alert
function checkSalesComplete(fileId){
  var allGlobal=eyeItems().every(function(ei){return (S.eyeVerified[fileId]||{})[ei.id];});
  var allLines=true;
  RULE_ITEMS.forEach(function(it){
    if(!it.eyeCheck)return;
    if(!(S.lineVerified[fileId]||{})['0|'+it.type])allLines=false;   // most recent period only
  });
  if(allGlobal&&allLines){
    if(!S.alertResolved[fileId])S.alertResolved[fileId]={};
    S.alertResolved[fileId]['pseye']=true;
    S.alertResolved[fileId]['marginal-quality']=true;
    showToast('All items verified — file is ready to route to CED.','ok');
  }
}
function verifyEyeItem(fileId,itemId){
  if(!S.eyeVerified[fileId])S.eyeVerified[fileId]={};
  S.eyeVerified[fileId][itemId]=true;
  checkSalesComplete(fileId);
  pulse('doc|'+itemId);
}
function verifyLineRow(fileId,mIdx,type){
  if(!S.lineVerified[fileId])S.lineVerified[fileId]={};
  S.lineVerified[fileId][mIdx+'|'+type]=true;
  checkSalesComplete(fileId);
  pulse(mIdx+'|'+type);
}

// Rule type catalogue
var RULE_TYPES=[
  {key:'required', label:'Required', dim:'Existence', hint:'Field or document must be present', hasSev:true, fields:true},
  {key:'manual',   label:'Manual Check', dim:'Eyeball / Existence', hint:'Flag field for human sign-off', hasSev:false, fields:true},
  {key:'match',    label:'Match', dim:'File Consistency', hint:'Value must equal another field or application value', hasSev:true, fields:true},
  {key:'threshold',label:'Threshold', dim:'Internal Logic', hint:'Numeric ≥ / ≤ / = target', hasSev:true, fields:true},
  {key:'recency',  label:'Recency', dim:'Business Validity', hint:'Date within N months of application_date', hasSev:true, fields:true},
  {key:'note',     label:'Custom Note', dim:'Custom', hint:'Free-text reminder for reviewer', hasSev:false, fields:false}
];
function openAddRule(fileId,editId){
  S.addRuleOpen=true; S.addRuleFileId=fileId; S.addRuleEditId=editId||null;
  render();
  // pre-fill if editing
  if(editId){
    var r=(S.customRules[fileId]||[]).find(function(x){return x.id===editId;});
    if(r){
      document.getElementById('ar-type').value=r.ruleType||'required';
      document.getElementById('ar-field').value=r.field||'';
      document.getElementById('ar-param').value=r.param||'';
      document.getElementById('ar-sev').value=r.sev||'warn';
      document.getElementById('ar-note').value=r.note||'';
      updateRuleTypeUI();
    }
  }
}
function closeAddRule(){S.addRuleOpen=false;render();}
function updateRuleTypeUI(){
  var t=document.getElementById('ar-type');if(!t)return;
  var key=t.value;
  var rt=RULE_TYPES.find(function(x){return x.key===key;})||RULE_TYPES[0];
  var ph=document.getElementById('ar-param-row');
  var sh=document.getElementById('ar-sev-row');
  var fh=document.getElementById('ar-field-row');
  var nh=document.getElementById('ar-note-row');
  if(ph)ph.style.display=(key==='match'||key==='threshold'||key==='recency')?'':'none';
  if(sh)sh.style.display=rt.hasSev?'':'none';
  if(fh)fh.style.display=rt.fields?'':'none';
  if(nh)nh.style.display=(key==='note')?'':'none';
  var hnt=document.getElementById('ar-hint');
  if(hnt)hnt.textContent=rt.hint;
  var paramLbl=document.getElementById('ar-param-lbl');
  if(paramLbl)paramLbl.textContent=key==='match'?'Compare field / value':key==='threshold'?'Threshold (≥ value)':key==='recency'?'Max months before application_date':'Parameter';
}
function saveCustomRule(){
  var type=document.getElementById('ar-type').value;
  var field=document.getElementById('ar-field')?document.getElementById('ar-field').value.trim():'';
  var param=document.getElementById('ar-param')?document.getElementById('ar-param').value.trim():'';
  var sevEl=document.querySelector('[name="ar-sev"]:checked');
  var sev=sevEl?sevEl.value:'warn';
  var note=document.getElementById('ar-note')?document.getElementById('ar-note').value.trim():'';
  var rt=RULE_TYPES.find(function(x){return x.key===type;})||RULE_TYPES[0];
  var title=field?field.replace(/_/g,' ')+(type==='required'?' Required':type==='manual'?' Manual Check':type==='match'?' Match':type==='threshold'?' Threshold':type==='recency'?' Recency':''):'Custom: '+note.slice(0,40);
  var cmp='';
  if(type==='match'&&param)cmp=field+' <span class="bad">≠</span> '+param+' — values must match';
  if(type==='threshold'&&param)cmp=field+' must be ≥ <b>'+param+'</b>';
  if(type==='recency'&&param)cmp=field+' must be within <b>'+param+' months</b> of application_date';
  if(type==='required')cmp=field+' must be present';
  if(type==='note')cmp='<em>'+note+'</em>';
  var acts=type==='manual'?['verifyall']:type==='note'?[]:['amend','replace'];
  var rec=type==='manual'?'verifyall':type==='match'||type==='threshold'||type==='recency'?'amend':'justify';
  var rule={id:S.addRuleEditId||('cr-'+Date.now()),title:title,sev:rt.hasSev?sev:'check',
    dim:rt.dim,kind:type,cmp:cmp,acts:acts,rec:rec,custom:true,ruleType:type,field:field,param:param,note:note};
  if(!S.customRules[S.addRuleFileId])S.customRules[S.addRuleFileId]=[];
  if(S.addRuleEditId){
    var idx=S.customRules[S.addRuleFileId].findIndex(function(x){return x.id===S.addRuleEditId;});
    if(idx>=0)S.customRules[S.addRuleFileId][idx]=rule;
  } else { S.customRules[S.addRuleFileId].push(rule); }
  S.addRuleOpen=false; render();
}
function deleteCustomRule(fileId,id){
  if(!S.customRules[fileId])return;
  S.customRules[fileId]=S.customRules[fileId].filter(function(r){return r.id!==id;});
  render();
}
// ── Justify & proceed (unified: replaces both Justification + Skip) ──
function openJustify(fileId,alertId){S.justifyTarget={fileId:fileId,alertId:alertId};render();setTimeout(function(){var i=document.getElementById('justify-inp');if(i)i.focus();},30);}
function closeJustify(){S.justifyTarget=null;render();}
function saveJustify(){
  var inp=document.getElementById('justify-inp');
  var note=inp?inp.value.trim():'';
  var t=S.justifyTarget;
  if(!t)return;
  // Hard Fail requires a note
  var allAlerts=(FILE_DETAIL[t.fileId]?FILE_DETAIL[t.fileId].alerts:[]).concat(S.customRules[t.fileId]||[]);
  var alert=allAlerts.find(function(a){return a.id===t.alertId;});
  if(alert&&alert.sev==='hard'&&!note){document.getElementById('justify-inp').style.borderColor='#dc2626';return;}
  if(!S.justifiedAlerts[t.fileId])S.justifiedAlerts[t.fileId]={};
  S.justifiedAlerts[t.fileId][t.alertId]=note||'(no note)';
  S.justifyTarget=null;render();
}
function undoJustify(fileId,alertId){
  if(S.justifiedAlerts[fileId])delete S.justifiedAlerts[fileId][alertId];
  render();
}
function renderJustifyModal(){
  var t=S.justifyTarget;
  if(!t)return '';
  var allAlerts=(FILE_DETAIL[t.fileId]?FILE_DETAIL[t.fileId].alerts:[]).concat(S.customRules[t.fileId]||[]);
  var alert=allAlerts.find(function(a){return a.id===t.alertId;})||{};

      +'<div class="arm-row"><label class="arm-lbl">Justification note'+(isHard?' <span style="color:#dc2626;">*required</span>':'')+'</label>'
        +'<textarea id="justify-inp" class="inp" style="width:100%;min-height:80px;resize:vertical;" placeholder="e.g. Customer confirmed correct — ID number mismatch is due to old IC number still in system. Physical document verified."></textarea>'
      +'</div>'
    +'</div>'
    +'<div class="arm-foot"><button class="btn" onclick="closeJustify()">Cancel</button><button class="btn btn-pri" onclick="saveJustify()">Justify &amp; proceed</button></div>'

// ── Inline field edit ──────────────────────────────────────────
function startEdit(fileId,k,val){S.editingField={fileId:fileId,k:k,val:val};render();setTimeout(function(){var i=document.getElementById('inline-edit-input');if(i){i.focus();i.select();}},30);}
function commitEdit(){
  if(!S.editingField)return;
  var inp=document.getElementById('inline-edit-input');
  var newVal=inp?inp.value.trim():S.editingField.val;
  if(newVal!==S.editingField.val&&newVal!==''){
    if(!S.fieldOverrides[S.editingField.fileId])S.fieldOverrides[S.editingField.fileId]={};
    S.fieldOverrides[S.editingField.fileId][S.editingField.k]=newVal;
  }
  S.editingField=null;render();
}
function cancelEdit(){S.editingField=null;render();}

function fdRow(f,fileId){
  var override=(S.fieldOverrides[fileId]||{})[f.k];
  var checked=((S.fieldChecked[fileId]||{})[f.k])||f.done;
  var need=f.need&&!checked;
  var hl=S.locate&&S.locate.file===fileId&&S.locate.key===f.k;
  var isEditing=S.editingField&&S.editingField.fileId===fileId&&S.editingField.k===f.k;
  var c=(f.c==null?99:f.c);
  var displayVal=override||f.v||'';

  // Value cell
  var valCell;
  if(isEditing){
    valCell='<input id="inline-edit-input" class="field-inp" value="'+displayVal+'"'
      +' onkeydown="if(event.key===\'Enter\')commitEdit();if(event.key===\'Escape\')cancelEdit();"'
      +' onblur="commitEdit()">';
  } else if(override){
    valCell='<span class="field-amended"><span class="old-val">'+f.v+'</span> &rarr; <span class="new-val">'+override+'</span></span>';
  } else {
    // clickable to edit — subtle pointer + hover underline
    var emptyHint=(c===0&&!f.v)?'<span class="field-empty">click to enter</span>':'';
    valCell='<span class="field-val" onclick="startEdit(\''+fileId+'\',\''+f.k+'\',\''+displayVal+'\')">'+(displayVal||emptyHint)+'</span>';
  }

  // Confidence display: dot only if 100%, pct shown if < 100%, red if 0
  var confHtml;
  if(c===0){
    confHtml='<span class="conf-dot"><span class="dot-r"></span></span>';
  } else if(c>=100){
    confHtml='<span class="conf-dot"><span class="dot-g"></span></span>';
  } else {
    confHtml='<span class="conf-dot"><span class="dot-g"></span><span class="pct">'+c+'%</span></span>';
  }

  // Issue 3: unified "Verify" (not "Check")
  var rightCtrl='';
  if(need){
    rightCtrl='<button class="verify-btn" onclick="checkField(\''+fileId+'\',\''+f.k+'\')">Verify</button>';
  } else if(f.need&&checked){
    rightCtrl='<span class="verified-tag">&#10003; Verified</span>';
  }

  // ── CED Rule Category dropdown (EC/EPF only — payslip uses the separate Rule Config panel) ──
  var ruleCell='';
  var ruleOpts=isRuleModeFile(fileId)?null:FIELD_RULE_OPTS[f.k];
  if(ruleOpts&&ruleOpts.length){
    var isFormula=ruleOpts.length===1&&ruleOpts[0].indexOf('Formula')!==-1;
    var currentRule=(S.cedRuleOverrides[fileId]||{})[f.k]||FIELD_RULE_DEFAULTS[f.k]||ruleOpts[0];
    var isModified=!!(S.cedRuleOverrides[fileId]||{})[f.k];
    if(isFormula){
      ruleCell='<div class="ced-rule-cell"><span class="ced-rule-tag">'+ruleOpts[0]+'</span></div>';
    } else {
      var optHtml=ruleOpts.map(function(o){
        return '<option value="'+o+'"'+(currentRule===o?' selected':'')+'>'+o+'</option>';
      }).join('');
      ruleCell='<div class="ced-rule-cell">'
        +(isModified?'<span class="ced-rule-modified-dot"></span>':'')
        +'<select class="ced-rule-sel'+(isModified?' modified':'')+'" onchange="setCedRule(\''+fileId+'\',\''+f.k+'\',this.value)">'
          +optHtml
        +'</select>'
      +'</div>';
    }
  }

  return '<div class="fd-f fk-'+f.k+(need?' need-row':'')+(hl?' hl':'')+(isEditing?' editing':'')+'" id="fdf-'+f.k+'">'
    +'<div class="lbl">'+f.k+'</div>'
    +'<div class="val-wrap">'+valCell+'</div>'
    +ruleCell
    +'<div class="fd-right-ctrl">'+rightCtrl+confHtml+'</div>'
  +'</div>';
}

function setCedRule(fileId,fieldKey,value){
  if(!S.cedRuleOverrides[fileId])S.cedRuleOverrides[fileId]={};
  S.cedRuleOverrides[fileId][fieldKey]=value;
  S.cedRecalcDone=false; // mark recalc needed
  render();
}
// CED recalculate: mark as done (in real system this would trigger backend recalc)
function cedRecalculate(){S.cedRecalcDone=true;render();}
// Mock income calculation from field values + CED rule overrides
function cedCalcIncome(fileId){
  var d=FILE_DETAIL[fileId];if(!d)return null;
  var overrides=S.cedRuleOverrides[fileId]||{};
  var lines=[];
  d.groups.forEach(function(g){
    g.fields.forEach(function(f){
      var opts=FIELD_RULE_OPTS[f.k];
      if(!opts||!opts.length)return; // no rule = not an income field
      var rule=overrides[f.k]||FIELD_RULE_DEFAULTS[f.k]||opts[0];
      if(rule.indexOf('Formula')!==-1||rule.indexOf('Reference')!==-1||rule.indexOf('Exclude')!==-1)return;
      var raw=parseFloat((f.v||'').toString().replace(/[^0-9.]/g,''));
      if(isNaN(raw)||raw===0)return;
      var monthly=raw;
      if(rule.indexOf('÷12')!==-1)monthly=raw/12;
      lines.push({label:f.k,rule:rule,monthly:monthly,isOverride:!!(overrides[f.k])});
    });
  });
  return lines;
}
function verifyAll(fileId,alertId){
  if(!S.alertResolved[fileId])S.alertResolved[fileId]={};
  S.alertResolved[fileId][alertId]=true;
  if(!S.fieldChecked[fileId])S.fieldChecked[fileId]={};
  (FILE_DETAIL[fileId].groups||[]).forEach(function(g){g.fields.forEach(function(f){if(f.need)S.fieldChecked[fileId][f.k]=true;});});
  render();
}
// Step-1 Sales: resolve ONLY eyeball-kind alerts (human-verify of line items).
// Non-eyeball alerts (hard-fail / consistency) stay open and must be resolved separately.
function verifyAllSales(fileId){
  if(!S.alertResolved[fileId])S.alertResolved[fileId]={};
  (FILE_DETAIL[fileId].alerts||[]).forEach(function(a){
    if(a.kind==='eyeball')S.alertResolved[fileId][a.id]=true;
  });
  S.alertResolved[fileId]['marginal-quality']=true;
  // Mark every global field + every flagged line item as verified in one action
  if(!S.eyeVerified[fileId])S.eyeVerified[fileId]={};
  eyeItems().forEach(function(ei){S.eyeVerified[fileId][ei.id]=true;});
  if(!S.lineVerified[fileId])S.lineVerified[fileId]={};
  RULE_ITEMS.forEach(function(it){
    if(!it.eyeCheck)return;
    S.lineVerified[fileId]['0|'+it.type]=true;   // most recent period only
  });
  // pulse all the rows that were just confirmed
  S.flash=S.flash||{};
  eyeItems().forEach(function(ei){S.flash['doc|'+ei.id]=true;});
  RULE_ITEMS.forEach(function(it){if(it.eyeCheck)S.flash['0|'+it.type]=true;});
  render();
  setTimeout(function(){S.flash={};render();},760);
  showToast('All items verified — file is ready to route to CED.','ok');
}
// Step-1 Sales: back-fill a line item OCR missed entirely (data gap). Name + kind here; amounts entered per-month inline.
// presetKey (optional): a required income field the user is filling in (e.g. 'earning_overtime_pay')
function openAddLine(fileId,presetKey,mIdx){ S.addLineTarget=fileId; S.addLinePreset=presetKey||null; S.addLineBucket=null; S.addLineKind=null; S.addLineMIdx=(mIdx!=null?mIdx:0); render(); setTimeout(function(){var i=document.getElementById('al-name');if(i)i.focus();},30); }
// Step-2: add a brand-new line item straight into a category (bucket preset, kind locked to it).
function openAddToCat(fileId,bucketKey,kind){ S.addLineTarget=fileId; S.addLineBucket=bucketKey; S.addLineKind=kind; S.addLinePreset=null; S.addLineMIdx=0; render(); setTimeout(function(){var i=document.getElementById('al-name');if(i)i.focus();},30); }
function closeAddLine(){ S.addLineTarget=null; S.addLinePreset=null; S.addLineBucket=null; S.addLineKind=null; S.addLineMIdx=null; render(); }
function saveAddLine(){
  var f=S.addLineTarget; if(!f)return;
  var preset=S.addLinePreset, bucket=S.addLineBucket;
  var ms=(document.getElementById('al-name').value||'').trim();
  var en=(document.getElementById('al-en').value||'').trim();
  var kind=bucket?S.addLineKind:document.getElementById('al-kind').value;
  if(!ms){document.getElementById('al-name').style.borderColor='#dc2626';return;}
  if(!S.customLines[f])S.customLines[f]=[];
  var id='c'+(Date.now().toString().slice(-6));
  var mIdx=S.addLineMIdx!=null?S.addLineMIdx:0;
  // Category-add → map straight to that bucket; missing-field → map to that field; else a default bucket
  var ai=bucket?bucket:(preset?preset:(kind==='earning'?'earning_others':'deduction_other_deductions'));
  S.customLines[f].push({id:id,type:id,ms:ms,en:en||ms,kind:kind,custom:true,ai:ai,mIdx:mIdx});
  // Auto-insert the mapping rule so it lands in the right category immediately — still adjustable later
  if(!S.ruleMap[f])S.ruleMap[f]={}; S.ruleMap[f][id]=ai;
  // Filling a required field closes its "missing" prompt immediately
  if(preset){ if(!S.justifiedAlerts[f])S.justifiedAlerts[f]={}; S.justifiedAlerts[f]['miss:'+preset]='Added as line item'; }
  S.addLineTarget=null; S.addLinePreset=null; S.addLineBucket=null; S.addLineKind=null; S.addLineMIdx=null;
  if(bucket){S.secOpen.comp=true;}else{S.secOpen.items=true;}
  // flash the new row
  S.flash=S.flash||{};
  S.flash[mIdx+'|'+id]=true;
  render();
  setTimeout(function(){S.flash={};render();},900);
  showToast(ms+' added to '+(bucket?bucketLabel(kind,bucket):(PAYSLIP_MONTHS[mIdx]?PAYSLIP_MONTHS[mIdx].month:'this period'))+'. Enter its amount per period.','ok');
}
function removeCustomLine(fileId,id){
  S.customLines[fileId]=(S.customLines[fileId]||[]).filter(function(c){return c.id!==id;});
  // clear its per-month amounts + any rule mapping
  if(S.lineAmt[fileId])Object.keys(S.lineAmt[fileId]).forEach(function(k){if(k.split('|')[1]===id)delete S.lineAmt[fileId][k];});
  if(S.ruleMap[fileId])delete S.ruleMap[fileId][id];
  if(S.ruleDraft[fileId])delete S.ruleDraft[fileId][id];
  render();
}

function checkField(fileId,k){
  if(!S.fieldChecked[fileId])S.fieldChecked[fileId]={};
  S.fieldChecked[fileId][k]=true;
  var d=FILE_DETAIL[fileId],all=true;
  d.groups.forEach(function(g){g.fields.forEach(function(f){if(f.need&&!S.fieldChecked[fileId][f.k])all=false;});});
  if(all)d.alerts.forEach(function(a){if(a.kind==='eyeball'){if(!S.alertResolved[fileId])S.alertResolved[fileId]={};S.alertResolved[fileId][a.id]=true;}});
  render();
}

      +'</details>'

  return '<div class="rc-panel">'
    +'<div class="rc-sub" style="padding:8px 18px 4px;">Rules are per item type, not per month &mdash; each type is configured once and applies to all pay periods. Hover a row to highlight it in the document.</div>'
