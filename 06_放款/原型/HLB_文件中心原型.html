<title>Document Center</title>

<style>
/* ═══ Ant Design v5 tokens ═══ */
:root{
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans',sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --primary:#1677ff; --primary-hover:#4096ff; --primary-active:#0958d9;
  --primary-bg:#e6f4ff; --primary-border:#91caff;
  --text:rgba(0,0,0,.88); --text-2:rgba(0,0,0,.65); --text-3:rgba(0,0,0,.45); --text-4:rgba(0,0,0,.25);
  --border:#d9d9d9; --border-2:#f0f0f0;
  --bg:#fff; --bg-layout:#f5f5f5; --fill-alter:#fafafa; --fill-q:rgba(0,0,0,.02);
  --success:#52c41a; --success-bg:#f6ffed; --success-border:#b7eb8f; --success-text:#389e0d;
  --warning:#faad14; --warning-bg:#fffbe6; --warning-border:#ffe58f; --warning-text:#d48806;
  --error:#ff4d4f;   --error-bg:#fff2f0;   --error-border:#ffccc7;   --error-text:#cf1322;
  --r:6px; --r-sm:4px; --r-lg:8px;
  --shadow:0 6px 16px 0 rgba(0,0,0,.08),0 3px 6px -4px rgba(0,0,0,.12),0 9px 28px 8px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg-layout);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5714;-webkit-font-smoothing:antialiased}
button,select,input{font-family:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--primary);outline-offset:1px}

/* ═══ Ant primitives ═══ */
.ant-btn{height:32px;padding:4px 15px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5714;transition:all .2s;white-space:nowrap}
.ant-btn:hover:not(:disabled){border-color:var(--primary-hover);color:var(--primary-hover)}
.ant-btn:disabled{color:var(--text-4);border-color:var(--border);background:var(--fill-q)}
.ant-btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.ant-btn-primary:hover:not(:disabled){background:var(--primary-hover);border-color:var(--primary-hover);color:#fff}
.ant-btn-primary:disabled{background:var(--fill-q);border-color:var(--border);color:var(--text-4)}
.ant-btn-dangerous{color:var(--error);border-color:var(--border)}
.ant-btn-dangerous:hover:not(:disabled){color:var(--error);border-color:var(--error)}
.ant-btn-sm{height:24px;padding:0 7px;font-size:12px;border-radius:var(--r-sm)}
.ant-btn-link{border-color:transparent;background:transparent;color:var(--primary);padding:0 4px;height:auto}
.ant-btn-text{border-color:transparent;background:transparent;padding:4px 8px}
.ant-btn-text:hover:not(:disabled){background:rgba(0,0,0,.06);color:var(--text)}
.ant-select,.ant-input{height:32px;padding:4px 11px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg);color:var(--text);font-size:14px}
.ant-select:hover,.ant-input:hover{border-color:var(--primary-hover)}
.i{width:16px;height:16px;flex:none;display:inline-block;vertical-align:-3px}
.ant-tag{display:inline-block;height:22px;padding:0 7px;font-size:12px;line-height:20px;border:1px solid var(--border-2);border-radius:var(--r-sm);background:var(--fill-alter);color:var(--text-2);white-space:nowrap}
.ant-tag-blue{background:var(--primary-bg);border-color:var(--primary-border);color:var(--primary-active)}
.ant-tag-green{background:var(--success-bg);border-color:var(--success-border);color:var(--success-text)}
.ant-tag-gold{background:var(--warning-bg);border-color:var(--warning-border);color:var(--warning-text)}
.ant-tag-red{background:var(--error-bg);border-color:var(--error-border);color:var(--error-text)}
.ant-badge-count{display:inline-block;min-width:20px;height:20px;padding:0 6px;font-size:12px;line-height:20px;text-align:center;border-radius:10px;background:var(--fill-alter);color:var(--text-2);font-variant-numeric:tabular-nums}
.ant-badge-count.on{background:var(--primary-bg);color:var(--primary-active)}
.ant-badge-count.err{background:var(--error);color:#fff}

/* ═══ demo bar ═══ */
.demo{position:fixed;top:0;left:0;right:0;z-index:1200;background:#001529;color:rgba(255,255,255,.85);padding:7px 16px;display:flex;gap:12px;align-items:center;font-size:12px;flex-wrap:wrap;height:36px}
.demo .lb{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:rgba(255,255,255,.45);text-transform:uppercase}
.demo .seg{display:inline-flex;border:1px solid rgba(255,255,255,.2);border-radius:var(--r-sm);overflow:hidden}
.demo .seg button{background:transparent;border:0;color:rgba(255,255,255,.7);padding:3px 10px;font-size:12px}
.demo .seg button[aria-pressed="true"]{background:var(--primary);color:#fff}
.demo .hint{color:rgba(255,255,255,.55);line-height:1.4}
.demo .why{margin-left:auto;color:rgba(255,255,255,.35);font-size:11px}

/* ═══ page behind ═══ */
.behind{padding:16px;padding-top:52px;filter:saturate(.15);opacity:.45;pointer-events:none}
.behind div{background:#fff;border:1px solid var(--border-2);border-radius:var(--r);margin-bottom:12px}
.behind .b1{height:38px}.behind .b2{height:170px}.behind .b3{height:220px}

/* ═══ modal ═══ */
.ant-modal-mask{position:fixed;top:36px;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:1000}
.ant-modal-wrap{position:fixed;top:36px;left:0;right:0;bottom:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:10px}
.ant-modal{width:100%;max-width:1840px;height:100%}
.ant-modal-content{background:var(--bg);border-radius:var(--r-lg);box-shadow:var(--shadow);height:100%;display:flex;flex-direction:column;overflow:hidden;position:relative}
.ant-modal-close{position:absolute;top:12px;right:14px;width:22px;height:22px;border:0;background:transparent;color:var(--text-3);font-size:16px;line-height:1;border-radius:var(--r-sm);z-index:5}
.ant-modal-close:hover{background:rgba(0,0,0,.06);color:var(--text)}
.ant-modal-header{padding:0 16px;border-bottom:1px solid var(--border-2);flex:none}
.ant-modal-body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.ant-modal-footer{padding:9px 16px;border-top:1px solid var(--border-2);flex:none;display:flex;align-items:center;gap:8px}

.header-tabs{display:flex;gap:32px}
.header-tabs button{background:transparent;border:0;padding:12px 0;font-size:14px;color:var(--text);position:relative}
.header-tabs button[aria-pressed="true"]{color:var(--primary);font-weight:500}
.header-tabs button[aria-pressed="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--primary)}

/* ═══ layout: rail + main ═══ */
.ocr-modal-content{flex:1;min-height:0;display:grid;grid-template-columns:212px minmax(0,1fr)}
.ocr-modal-content.rail-collapsed{grid-template-columns:52px minmax(0,1fr)}
.rail-collapsed .subject-rail{padding:12px 6px}
.rail-collapsed .subj-item .sub{display:none}
.rail-collapsed .rail-h{justify-content:center;margin:0 0 8px}
.rail-collapsed .subj-item{grid-template-columns:1fr;justify-items:center;padding:6px 2px;gap:3px}
.rail-collapsed .subj-item .mk{grid-row:auto}
.rail-collapsed .subj-item .r1{flex-direction:column;gap:0;align-items:center}
.rail-collapsed .subj-item .nm{display:none}
.rail-collapsed .subj-item .ct{font-size:10px}
.rail-toggle{background:transparent;border:0;color:var(--text-3);padding:2px 5px;border-radius:var(--r-sm);font-size:12px;line-height:1}
.rail-toggle:hover{background:rgba(0,0,0,.06);color:var(--primary)}
@media(max-width:900px){.ocr-modal-content{grid-template-columns:1fr}}
.subject-rail{border-right:1px solid var(--border-2);background:var(--fill-alter);padding:10px 10px 14px;
  overflow-y:auto;min-height:0;display:flex;flex-direction:column}
.subject-rail .rail-h{display:flex;justify-content:flex-end;margin:0 0 4px}
.subj-item{width:100%;text-align:left;background:transparent;border:1px solid transparent;
  border-radius:var(--r);padding:7px 9px;margin-bottom:3px;transition:all .2s;
  display:grid;grid-template-columns:26px minmax(0,1fr);gap:9px;align-items:center}
.subj-item:hover{background:rgba(0,0,0,.045)}
.subj-item[aria-pressed="true"]{background:var(--bg);border-color:var(--primary-border);
  box-shadow:0 1px 2px rgba(16,24,40,.05)}
.subj-item .mk{grid-row:1/span 2;align-self:start;width:26px;height:26px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.02em;color:var(--text-2);background:#fff;border:1px solid var(--border-2)}
.subj-item .mk.ico{color:var(--text-3);background:transparent;border-color:transparent}
.subj-item .mk .i{width:15px;height:15px}
.subj-item[aria-pressed="true"] .mk{background:var(--primary-bg);border-color:var(--primary-border);
  color:var(--primary-active)}
.subj-item[aria-pressed="true"] .mk.ico{background:transparent;border-color:transparent}
.subj-item .r1{display:flex;justify-content:space-between;align-items:baseline;gap:8px;min-width:0}
.subj-item .nm{font-size:13.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subj-item[aria-pressed="true"] .nm{color:var(--primary-active);font-weight:600}
.subj-item .ct{font-family:var(--mono);font-size:12px;color:var(--text-3);white-space:nowrap;
  font-variant-numeric:tabular-nums;flex:none}
.subj-item.scope .nm{color:var(--text-2)}
.subj-item.foot{margin-top:auto;position:relative}
.subj-item.foot::before{content:"";position:absolute;left:9px;right:9px;top:-9px;height:1px;background:var(--border-2)}
.subj-item .ct.ok{color:var(--success-text)} .subj-item .ct.bad{color:var(--error-text)}
.subj-item .sub{grid-column:2;font-size:11.5px;color:var(--text-3);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subj-item.gone .nm{color:var(--text-3)}
.rail-div{height:1px;background:var(--border-2);margin:8px 4px 9px}

/* the only vertical scroll container; children keep natural height */
.ocr-main{min-width:0;min-height:0;overflow-y:auto;overflow-x:hidden;scroll-padding-top:56px}
.file-list-table tbody tr{scroll-margin-top:56px}

/* ═══ upload section ═══ */
.upload-section{padding:12px 16px;border-bottom:1px solid var(--border-2)}
.upload-section.empty{padding:0;border-bottom:0}
.upload-ctx b{font-weight:600}
.section-header{display:flex;align-items:baseline;gap:12px;margin-bottom:9px;flex-wrap:wrap}
.section-title{font-size:14px;font-weight:600;color:var(--text)}
.section-subtitle{font-size:12px;color:var(--text-3)}
.upload-ctx{margin-left:auto;font-size:12px}
.upload-ctx b{color:var(--primary);font-weight:600}
.upload-ctx.none{color:var(--warning-text)}
.upload-grid{display:grid;gap:12px}
.upload-grid--two{grid-template-columns:1fr 1fr;align-items:stretch}
.upload-card{display:flex;flex-direction:column;border:1px solid var(--border-2);border-radius:var(--r);
  padding:11px 12px 10px;background:var(--bg)}
.upload-card.ai{border-color:var(--primary-border);background:linear-gradient(180deg,#f5faff,#fff 62px)}
.upload-card.manual{background:var(--fill-q)}
.ent-tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;padding:1px 5px;border-radius:3px;
  border:1px solid;flex:none}
.ent-tag.ai{color:var(--primary-active);background:var(--primary-bg);border-color:var(--primary-border)}
.ent-tag.manual{color:var(--text-3);background:var(--fill-alter);border-color:var(--border)}
.ent-note{font-size:11.5px;color:var(--text-3);margin-left:auto;text-align:right}
.type-hint{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:9px}
.tchip{font-size:11px;color:var(--text-2);background:var(--fill-alter);border:1px solid var(--border-2);
  border-radius:10px;padding:1px 8px;white-space:nowrap}
.upload-card.ai .tchip{background:#fff;border-color:var(--primary-border);color:var(--primary-active)}
.tmore{font-size:11px;color:var(--primary);background:transparent;border:0;padding:1px 4px;cursor:pointer}
.tmore:hover{text-decoration:underline}
.dl-grp{font-size:11px;font-family:var(--mono);letter-spacing:.07em;color:var(--text-3);
  margin:15px 0 7px;text-transform:uppercase}
.dl-grp:first-child{margin-top:0}
.dl-row{display:flex;align-items:center;gap:10px;padding:6px 2px;border-bottom:1px solid var(--border-2);font-size:13px}
.dl-row:last-child{border-bottom:0}
.dl-row .nm{flex:1;min-width:0}
.dl-none{padding:22px;text-align:center;color:var(--text-3);font-size:13px}
.upload-card .uploader-box{flex:1;min-height:92px}
@media(max-width:820px){.upload-grid--two{grid-template-columns:1fr}}
.upload-card-header{margin-bottom:8px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.upload-card-title{font-size:13px;color:var(--text-2)}
.info-icon{color:var(--text-4);font-size:12px}
.uploader-box{border:1px dashed var(--border);border-radius:var(--r);background:var(--fill-alter);padding:14px 10px;text-align:center;transition:border-color .2s;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.uploader-box:hover{border-color:var(--primary)}
.uploader-box.non-ai{border-color:var(--border);background:var(--fill-q)}
/* The AI entry closed off: still shown, so it is clear it was considered and ruled out */
.upload-card.disabled{opacity:.55;background:var(--fill-q);border-color:var(--border-2)}
.upload-card.disabled.ai{background:var(--fill-q)}
.uploader-box.dis{border-style:dashed;background:transparent;cursor:not-allowed}
.uploader-box.dis:hover{border-color:var(--border)}
.upload-icon{color:var(--text-3);display:block;margin-bottom:6px;line-height:0}
.upload-icon .i{width:22px;height:22px;stroke-width:1.2}
.info-icon .i{width:13px;height:13px}
.action-btn .i{width:15px;height:15px}
.lockcell{display:inline-flex;color:var(--text-3)}
.ant-modal-close .i{width:15px;height:15px}
.viewer-bar .zc{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;
  border:1px solid var(--border-2);border-radius:var(--r-sm);color:var(--text-2);cursor:pointer}
.viewer-bar .zc .i{width:13px;height:13px}
.upload-prompt{font-size:13px;color:var(--text-2)}
.browse-link{color:var(--primary)}
.upload-examples{font-size:12px;color:var(--text-3);margin-top:4px;line-height:1.5}
.upload-section.disabled .uploader-box{opacity:.45;border-style:dashed;pointer-events:none}
.upload-lock{border:1px dashed var(--warning-border);background:var(--warning-bg);border-radius:var(--r);padding:8px 12px;font-size:12px;color:var(--warning-text);margin-bottom:9px;line-height:1.5}

/* ── version chain, defects, inline category ── */
.ver-chip{font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--text-3);
  border:1px solid var(--border-2);border-radius:2px;padding:0 4px;margin-left:6px;vertical-align:1px}
.ver-chip.new{color:var(--primary-active);border-color:var(--primary-border);background:var(--primary-bg)}
.cat-sel{width:100%;max-width:150px;height:26px;padding:0 6px;font-size:12.5px;border:1px solid transparent;
  border-radius:var(--r-sm);background:transparent;color:var(--text-2);
  appearance:none;text-overflow:ellipsis}
.cat-sel:hover:not(:disabled){border-color:var(--border);background:var(--bg)}
.cat-sel:focus{border-color:var(--primary);background:var(--bg);outline:none}
.cat-sel:disabled{color:var(--text-2);opacity:1}
.d-st{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;padding:1px 6px;border-radius:2px;border:1px solid}
.d-st.open{color:var(--error-text);background:var(--error-bg);border-color:var(--error-border)}
.d-st.responded{color:var(--primary-active);background:var(--primary-bg);border-color:var(--primary-border)}
.d-st.closed{color:var(--success-text);background:var(--success-bg);border-color:var(--success-border)}
.d-why{font-size:12px;color:var(--text-3);margin-top:2px;line-height:1.5}
.d-src{font-size:11px;font-family:var(--mono);color:var(--text-3)}
.stage-note{display:flex;align-items:center;gap:10px;padding:9px 12px;margin-bottom:12px;font-size:12.5px;
  border-radius:var(--r);border:1px solid var(--primary-border);background:var(--primary-bg);color:var(--primary-active)}
.stage-note .i{width:15px;height:15px;flex:none}
.stage-note b{font-weight:600}
.vh{border:1px solid var(--border-2);border-radius:var(--r);padding:10px 12px;margin-bottom:12px;background:var(--fill-alter)}
.vh-h{font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:7px}
.vh-r{display:flex;gap:9px;align-items:baseline;font-size:12px;color:var(--text-3);padding:3px 0;line-height:1.5}
.vh-r b{font-family:var(--mono);font-size:11px;color:var(--text-2);flex:none}
.vh-r.cur b{color:var(--primary-active)}

/* ═══ file list ═══ */
.file-list-section{padding:0 16px 16px}
.list-tabs{display:flex;gap:28px;border-bottom:1px solid var(--border-2);position:sticky;top:0;background:var(--bg);z-index:4}
.list-tabs button{background:transparent;border:0;padding:12px 0;font-size:14px;color:var(--text);position:relative;display:flex;align-items:center;gap:8px}
.list-tabs button[aria-pressed="true"]{color:var(--primary);font-weight:500}
.list-tabs button[aria-pressed="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--primary)}
.filter-bar{display:flex;gap:8px;align-items:center;padding:12px 0;flex-wrap:wrap}
.filter-inputs{display:flex;gap:8px;flex-wrap:wrap}
.filter-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.filter-actions .sel-n{font-size:12px;color:var(--text-3)}
.table-container{overflow-x:auto;border:1px solid var(--border-2);border-radius:var(--r)}
.file-list-table{border-collapse:collapse;width:100%;min-width:1300px;table-layout:fixed}
.subject-cell,.category-cell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filename-text{overflow-wrap:anywhere}
.file-list-table td,.file-list-table th{overflow:hidden}
.filename-cell{min-width:190px}
.file-list-table th{background:var(--fill-alter);text-align:left;font-size:12px;font-weight:600;color:var(--text-2);padding:9px 12px;border-bottom:1px solid var(--border-2);white-space:nowrap}
.file-list-table td{padding:7px 12px;border-bottom:1px solid var(--border-2);vertical-align:middle;font-size:13px}
.file-list-table tbody tr:last-child td{border-bottom:0}
.file-list-table tbody tr:hover{background:var(--fill-alter)}
.file-list-table tbody tr.selected{background:#f0f7ff}
.filename-text{color:var(--text)}
.description-text{font-size:12px;color:var(--text-3)}
.file-type-tag{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.is-ai-cell{font-family:var(--mono);font-size:12px;color:var(--text-2)}
.time-cell{font-family:var(--mono);font-size:12px;color:var(--text-3);white-space:nowrap}
.actions-cell{white-space:nowrap}
.action-btn{background:transparent;border:0;color:var(--text-3);padding:4px 6px;border-radius:var(--r-sm);line-height:0}
.action-btn:hover:not(:disabled){background:rgba(0,0,0,.06);color:var(--primary)}
.action-btn.delete-btn:hover:not(:disabled){color:var(--error)}
.action-btn:disabled{color:var(--text-4)}
.rule-line{font-size:12px;line-height:1.6}
.rule-line.open{color:var(--error-text)} .rule-line.done{color:var(--success-text)}
.empty-state{padding:48px;text-align:center;color:var(--text-3);font-size:14px}
.file-list-footer-actions{margin-left:auto;display:flex;gap:8px}
.foot-note{font-size:12px;color:var(--text-3)}
.tracks{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.trk{display:inline-flex;align-items:baseline;gap:3px;font-size:12px;color:var(--text-3);
  border:1px solid var(--border-2);border-radius:var(--r-sm);padding:2px 9px;background:var(--fill-alter)}
.trk b{font-family:var(--mono);font-size:12.5px;color:var(--text);font-variant-numeric:tabular-nums}
.trk i{font-style:normal;color:var(--text-4)}
.trk.ok{border-color:var(--success-border);background:var(--success-bg)}
.trk.ok b{color:var(--success-text)}
.trk.busy{border-color:var(--primary-border);background:var(--primary-bg)}
.trk.busy b{color:var(--primary-active)}
.trk em{font-style:normal;font-size:11px;color:var(--primary-active);margin-left:5px}
.trk-open{font-size:12px;color:var(--text-3)}

/* ═══ detail view ═══ */
.detail{position:fixed;top:36px;left:0;right:0;bottom:0;background:var(--bg-layout);z-index:1100;display:flex;flex-direction:column}
.detail.hidden{display:none}
.detail-header{background:var(--bg);border-bottom:1px solid var(--border-2);padding:12px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.detail-header .t{font-size:16px;font-weight:600}
.detail-header .bc{font-size:12px;color:var(--text-3)}
.detail-header .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.detail-body{flex:1;display:grid;grid-template-columns:400px minmax(0,1fr);min-height:0}
@media(max-width:900px){.detail-body{grid-template-columns:1fr;overflow-y:auto}}
.detail-panel{border-right:1px solid var(--border-2);background:var(--bg);overflow-y:auto;padding:16px}
.detail-viewer{background:#eceef1;overflow:auto;padding:24px;display:flex;flex-direction:column;align-items:center}

/* A.11 Manual Check */
.mc-grp{font-size:12px;font-weight:600;color:var(--text-2);background:var(--fill-alter);
  border:1px solid var(--border-2);border-radius:var(--r-sm);padding:6px 10px;margin:14px 0 8px;
  display:flex;align-items:center;gap:8px}
.mc-grp.cur{border-color:var(--primary-border);color:var(--primary-active)}
.mc-cur{margin-left:auto;font-size:10.5px;font-family:var(--mono);background:var(--primary);color:#fff;
  padding:1px 6px;border-radius:2px;font-weight:400}
.routed{font-size:10px;font-family:var(--mono);color:var(--text-3);
  border:1px solid var(--border);border-radius:2px;padding:0 4px;margin-left:6px}
.mc-seg{margin-left:auto;font-size:11px;color:var(--text-3)}
.mc-doc{width:100%;max-width:720px;margin:0 auto 22px}
.mc-doc-h{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--text-2);
  background:rgba(255,255,255,.75);border:1px solid var(--border-2);border-radius:var(--r-sm);
  padding:7px 12px;margin-bottom:8px;position:sticky;top:0;z-index:2;backdrop-filter:blur(4px)}
.mc-doc-h span{margin-left:auto;font-weight:400;color:var(--text-3);font-family:var(--mono);font-size:11px}
.panel-sect{font-size:12px;font-weight:600;color:var(--text-2);margin:0 0 10px;display:flex;align-items:center;gap:8px;letter-spacing:.02em}
.panel-sect::after{content:"";flex:1;height:1px;background:var(--border-2)}
.panel-sect.err{color:var(--error-text)}
.alert-item{border:1px solid var(--border-2);border-left:3px solid var(--border);border-radius:0 var(--r) var(--r) 0;padding:11px 12px;margin-bottom:8px;background:var(--bg)}
.alert-item.machine{border-left-color:var(--error)}
.alert-item.eyeball{border-left-color:var(--warning)}
.alert-item.resolved{border-left-color:var(--success);background:var(--fill-q)}
.alert-item .ah{display:flex;gap:8px;align-items:baseline;margin-bottom:4px}
.alert-item .rid{flex:none}
.alert-item .rid{font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:var(--r-sm);background:rgba(0,0,0,.06);color:var(--text-2)}
.alert-item .rn{font-weight:600;font-size:13px}
.alert-item .rd{font-size:12px;color:var(--text-2);margin-bottom:10px;line-height:1.6}
.alert-item .acts{display:flex;gap:6px;flex-wrap:wrap}
.alert-item .res{font-size:12px;color:var(--success-text);font-family:var(--mono)}
.ro-note{font-size:11px;color:var(--text-3);align-self:center}
.alert-item .acts .mc-on{background:var(--success-bg);border-color:var(--success-border);color:var(--success-text);font-weight:600}
.alert-item .acts .mc-off{background:var(--error-bg);border-color:var(--error-border);color:var(--error-text);font-weight:600}
/* A defect was raised and the alert stays. Two separate facts, shown as two. */
.alert-item .res.keep{color:var(--warning-text);background:var(--warning-bg);
  border:1px solid var(--warning-border);border-radius:var(--r-sm);
  padding:4px 8px;margin-bottom:8px;display:inline-block;font-size:11px}
.passall{display:flex;align-items:center;gap:10px;justify-content:space-between;
  padding:9px 11px;margin-bottom:10px;background:var(--fill-q);
  border:1px solid var(--border-2);border-radius:var(--r);font-size:12px;color:var(--text-2)}
/* defect dialog */
.dlab{display:block;font-size:12px;color:var(--text-2);margin:12px 0 4px}
.dlab .dsub{color:var(--text-3);font-weight:400}
/* Defect Type is a dropdown, as it has always been; it just takes more than one now. */
.msel{position:relative}
.msel-b{display:flex;align-items:center;gap:8px;width:100%;text-align:left;cursor:pointer}
.msel-b::after{content:"\2304";margin-left:auto;color:var(--text-3);flex:none;line-height:1}
.msel-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msel-t.ph{color:var(--text-4)}
.msel-n{flex:none;font-family:var(--mono);font-size:11px;padding:0 6px;border-radius:9px;
  background:var(--primary-bg);color:var(--primary-active)}
.msel-p{display:none;position:absolute;z-index:20;top:calc(100% + 4px);left:0;right:0;
  max-height:220px;overflow-y:auto;background:#fff;border:1px solid var(--border);
  border-radius:var(--r);box-shadow:var(--shadow);padding:4px}
.msel.open .msel-p{display:block}
.msel.open .msel-b{border-color:var(--primary)}
.msel .msel-o{display:flex;gap:9px;align-items:center;padding:6px 9px;margin:0;
  border-radius:var(--r-sm);font-size:13px;color:var(--text-2);cursor:pointer}
.msel .msel-o:hover{background:var(--fill-alter)}
.msel .msel-o.on{color:var(--text)}
.mbx{width:16px;height:16px;flex:none;border:1px solid var(--border);border-radius:3px;
  display:inline-flex;align-items:center;justify-content:center;font-size:11px;background:#fff}
.mbx.on{background:var(--primary);border-color:var(--primary);color:#fff}
/* the file type a defect fixes is not a choice */
.lockrow{display:flex;align-items:center;gap:10px;margin:12px 0;font-size:12px}
.lockrow .lk{color:var(--text-2);flex:none;width:66px}
.lockrow select{width:220px}
.lockrow .lkn{color:var(--text-3);font-size:11px}
/* Picking what the re-check finds belongs next to the upload it describes, not in
   a global switch that silently changes what the next click does. */
.ocpick{margin-top:14px;padding:11px 12px;border:1px dashed var(--border);
  border-radius:var(--r);background:var(--fill-q)}
.ocp-h{font-size:11px;font-family:var(--mono);letter-spacing:.06em;color:var(--text-3);
  text-transform:uppercase}
.ocp-row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.ocp{border:1px solid var(--border);border-radius:var(--r-sm);background:#fff;
  padding:3px 9px;font-size:12px;color:var(--text-2);cursor:pointer}
.ocp:hover{border-color:var(--primary);color:var(--primary)}
.ocp.on{background:var(--primary);border-color:var(--primary);color:#fff}
.ocp-d{font-size:12px;color:var(--text-2);margin-top:8px;line-height:1.55}
.ocp-n{font-size:11px;color:var(--text-3);margin-top:5px}
.demo .ctx{font-size:12px;color:#fff;background:rgba(255,255,255,.14);
  border-radius:var(--r-sm);padding:2px 10px}
.field-row{display:flex;justify-content:space-between;gap:10px;padding:7px 8px;border-bottom:1px solid var(--border-2);font-size:12px}
.field-row:last-child{border-bottom:0}
.field-row .k{color:var(--text-2)}
.field-row .v{font-family:var(--mono);font-size:12px;text-align:right;word-break:break-all}
.field-row .c{font-family:var(--mono);font-size:11px;min-width:36px;text-align:right}
.confidence-high{color:var(--success-text)} .confidence-low{color:var(--error-text)}
.field-group{font-size:11px;color:var(--text-3);background:var(--fill-alter);padding:5px 8px;margin-top:8px;font-family:var(--mono)}
.classify-box{border:1px solid var(--border-2);border-radius:var(--r);padding:14px;background:var(--fill-alter);margin-bottom:14px}
.classify-box label{display:block;font-size:12px;color:var(--text-2);margin:10px 0 4px}
.classify-box select{width:100%}
.pnote{font-size:12px;color:var(--text-2);background:var(--fill-alter);border-left:3px solid var(--border);padding:10px 12px;border-radius:0 var(--r-sm) var(--r-sm) 0;margin-bottom:12px;line-height:1.6}
.pnote.warn{border-left-color:var(--warning)}
.pnote.info{border-left-color:var(--primary)}
.pnote.ok{border-left-color:var(--success)}

/* ═══ document facsimile ═══ */
.doc-page{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15);width:min(900px,100%);min-height:600px;padding:48px 52px;font-size:13px;color:#262626}
.doc-page.card{width:min(560px,100%);min-height:340px;background:linear-gradient(150deg,#dbe8f2,#c3d8e8);padding:30px;border-radius:12px}
.doc-h{text-align:center;font-weight:700;font-size:16px;letter-spacing:.04em;margin-bottom:6px}
.doc-s{text-align:center;color:#8c8c8c;font-size:12px;margin-bottom:24px}
.doc-r{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f0f0;gap:24px}
.doc-r .k{color:#595959} .doc-r .v{font-weight:600;text-align:right}
.doc-r.hl{background:var(--fill-alter);margin:0 -10px;padding:8px 10px}
.doc-l{height:9px;background:#f0f0f0;border-radius:2px;margin:10px 0}
.doc-sig{margin-top:34px;display:flex;justify-content:space-between;gap:32px}
.doc-sig div{flex:1;border-top:1px solid #bfbfbf;padding-top:6px;font-size:11px;color:#8c8c8c;text-align:center}
.ic-h{font-weight:700;font-size:14px;letter-spacing:.08em;color:#15395b}
.ic-n{font-family:var(--mono);font-size:22px;letter-spacing:.06em;margin:16px 0 6px;color:#0f2f4d}
.ic-m{font-size:15px;font-weight:600;color:#0f2f4d}
.ic-a{font-size:12px;color:#37587a;margin-top:8px;line-height:1.7}
.ic-c{width:48px;height:36px;background:linear-gradient(135deg,#d8b95f,#b8932f);border-radius:6px;margin-top:20px}
.viewer-bar{background:#fff;border:1px solid var(--border-2);border-radius:var(--r);padding:6px 12px;margin-bottom:16px;font-size:12px;color:var(--text-2);display:flex;gap:16px;align-items:center;width:min(900px,100%)}

/* ═══ sub-modal ═══ */
.sub-mask{position:fixed;top:36px;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:1300;display:flex;align-items:center;justify-content:center;padding:20px}
.sub-mask.hidden{display:none}
.sub-modal{background:var(--bg);border-radius:var(--r-lg);width:min(620px,100%);max-height:86vh;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.sub-modal .h{padding:16px 24px;border-bottom:1px solid var(--border-2);font-size:16px;font-weight:600}
.sub-modal .b{padding:20px 24px;overflow-y:auto}
.sub-modal .f{padding:12px 24px;border-top:1px solid var(--border-2);display:flex;gap:8px;justify-content:flex-end}
.miss-group{border:1px solid var(--border-2);border-radius:var(--r);margin-bottom:10px}
.miss-group .gh{background:var(--fill-alter);padding:8px 12px;font-weight:600;font-size:13px;display:flex;justify-content:space-between}
.miss-group ul{margin:0;padding:10px 12px 12px 28px} .miss-group li{font-size:13px;color:var(--text-2);margin-bottom:4px}
.sub-modal table{width:100%;border-collapse:collapse;font-size:13px}
.sub-modal table th{background:var(--fill-alter);text-align:left;padding:8px;font-weight:600}
.sub-modal table td{padding:8px;border-top:1px solid var(--border-2)}

.ant-message{position:fixed;top:48px;left:50%;transform:translateX(-50%);z-index:1400;opacity:0;transition:opacity .2s;pointer-events:none}
.ant-message.on{opacity:1}
.ant-message span{display:inline-block;background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:9px 16px;font-size:14px;color:var(--text)}

 // The two halves of one upload. Two documents, two defects, two uploads - the file
 // is the unit, so a scan holding two file types is never answered in one go.
 {no:'6',fid:'d27',cat:'CUSTOMER INFO',rules:['N02'],types:['MyKad expired'],
  cr:'MyKad in the combined scan expired 03-2026',src:'System',st:'open',hist:[]},
 {no:'7',fid:'d28',cat:'COLLATERAL',rules:['V15'],types:['Road tax expired'],

 // Raised by CRA by hand: no rule, no document. Answered by a direct upload.

  cr:'CED conditional approval letter is not in the case \u2014 upload it to the file list',
  src:'User',st:'open',hist:[]}
];
let DEFECTS=DEF0.map(d=>Object.assign({},d,{rules:d.rules.slice(),types:d.types.slice(),hist:[]}));
let DSEQ=DEF0.length;
const defFile=d=>DATA.dis.find(f=>f.id===d.fid);
const defForFile=id=>DEFECTS.find(d=>d.fid===id);
const myDefects=()=>DEFECTS;
const defOpen=()=>DEFECTS.filter(d=>d.st==='open').length;
const defResponded=()=>DEFECTS.filter(d=>d.st==='responded').length;
const defTypes=d=>(d.types||[]).join(' \u00b7 ');

/* Defect types available in the dialog. The engine pre-fills them from the failed
   rule; CRA can tick more, because one document usually has more than one problem. */
const DTYPES=['Insurance sum insured insufficient','Policy period insufficient',
 'MyKad expired','Road tax expired','Supporting document missing',
 'Hirer and/or witnessed wrongly dated','Hirer name mismatch','Signature incomplete / not witnessed',
 'Vehicle invoice outside the delivery window','Loan amount is wrong','Chassis no. mismatch',
 'Scan quality insufficient','Document out of validity period','Wrong document uploaded'];
// What the engine proposes when a given alert is turned into a defect.
const RULEMAP={
 I33:{cat:'INSURANCE',ty:'Insurance sum insured insufficient'},
 A155:{cat:'AGREEMENT - MASTER',ty:'Hirer and/or witnessed wrongly dated'},
 A156:{cat:'AGREEMENT - MASTER',ty:'Hirer name mismatch'},
 A153:{cat:'AGREEMENT - GUARANTOR',ty:'Hirer and/or witnessed wrongly dated'},
 I67:{cat:'INVOICE - VEHICLE',ty:'Vehicle invoice outside the delivery window'},
 S52:{cat:'SECOND SCHEDULE PART I',ty:'Loan amount is wrong'},
 S53:{cat:'SECOND SCHEDULE PART I',ty:'Loan amount is wrong'},
 A157:{cat:'AGREEMENT - MASTER',ty:'Signature incomplete / not witnessed'},
 N02:{cat:'CUSTOMER INFO',ty:'MyKad expired'},
 V15:{cat:'COLLATERAL',ty:'Road tax expired'}
};
const DCATS=['AGREEMENT - MASTER','AGREEMENT - GUARANTOR','INSURANCE','INVOICE - VEHICLE',
 'SECOND SCHEDULE PART I','COLLATERAL','CUSTOMER INFO','FACILITY','GUARANTOR','OTHERS'];
// A returned case reopens exactly the file slots its open defects name.
const scopedIds=()=>new Set(DEFECTS.filter(d=>d.st==='open'&&d.fid).map(d=>d.fid));
function scopedFor(subj){
  const ids=scopedIds();
  return DATA.dis.filter(f=>ids.has(f.id)&&(subj==null||f.sj===subj));
}
const focusDef=()=>DEFECTS.find(x=>x.no===S.focus)||null;
const focusFile=()=>{const d=focusDef(); return d?defFile(d):null;};
const curFocusName=()=>{const d=focusDef(); const f=d&&defFile(d);
  return f?f.nm:(d?'no document yet':'—');};
/* The host calls this when a desk opens the File Center. CRA arrives at the whole
   case; Sales arrives at one defect, and the screen narrows to it. Nothing about
   the view is chosen here - it is inherited from where the click came from. */
function setView(view,def){
  if(view==='draft'){
    // before submission the case is still Sales's own; nothing is scoped yet
    S.role='sales'; S.cs='draft'; S.focus=null; S.tab='fl'; S.subj='primary';
  }else if(view==='sales'){
    S.role='sales'; S.cs='returned'; S.focus=def&&def.defect||null;
    /* A defect CRA raised by hand has no rule and no document behind it, so it is
       not in this ledger yet. Adopt what the desk handed over rather than showing
       Sales an empty screen for a defect they were just told to answer. */
    // The desk also names the document. Trust that over the number - the two ledgers
    // are seeded separately and the document is what Sales came here to fix.
    if(def&&def.file&&def.file!=='\u2014'){
      const bn=DATA.dis.find(f=>f.nm===def.file), dl=bn&&defForFile(bn.id);
      if(dl) S.focus=dl.no;
    }
    // opened standalone, with no door to inherit from: stand on the first open
    // defect, because "Sales fixing a defect" is not a state without one
    if(!S.focus&&S.stage==='dis'){const d0=DEFECTS.find(x=>x.st==='open'&&x.fid); if(d0)S.focus=d0.no;}
    if(S.focus&&!DEFECTS.some(x=>x.no===S.focus))
      DEFECTS.push({no:S.focus,fid:null,cat:def.cat||'OTHERS',rules:[],
        types:(def.types||[]).slice(),cr:def.cr||'',src:'User',st:'open',hist:[]});
    const ff=focusFile();
    S.tab='fl'; S.subj=ff?ff.sj:'all';
  }else{
    S.role='cra'; S.focus=null;
    S.cs=DEFECTS.some(d=>d.st==='responded')?'recheck':'review';
    S.tab='fl'; S.subj='all';
  }
  S.sel.clear(); S.dt=null; $('detail').classList.add('hidden'); smClose(); render();
  // Sales came in to answer one defect, so open that document straight away.
  if(view==='sales'&&S.focus&&DEFECTS.some(d=>d.no===S.focus&&d.st==='open')) askReplace(S.focus);
}
const all=()=>DATA[S.stage];
const live=()=>all().filter(f=>!f.del);
const byId=i=>all().find(f=>f.id===i);
const tabs3=()=>S.stage==='dis';
const curSubj=()=>SUBJ[S.stage].find(x=>x.id===S.subj);
// FSD 2.7.5: system documents belong to an entity and are shown under that
// role's entry, with the creator recorded as System.
const subjNm=f=>{const x=SUBJ[S.stage].find(y=>y.id===f.sj); return x?x.nm:'\u2014';};
const canUpload=()=>!!P().up && S.subj!=='all' && S.subj!=='deleted' && !!curSubj();
const uploadLocked=()=>P().up==='scoped';
/* A file is being read "through a defect" once it has been replaced and its defect
   is still on the books. That is what narrows the rule panel in round 2. */
const viaDefect=f=>!!(f&&f.ver>1&&defForFile(f.id));
// Round 2 shows only the rules of the file type the defect names.
const mcRules=f=>viaDefect(f)?MC.rules.filter(r=>r.file===f.nm):MC.rules;
const MCF=f=>[...new Set(mcRules(f).map(r=>r.file))];

function inTab(f,t){
  if(t==='fl') return true;
  if(!f.cls) return false;
  if(t==='cv') return f.ch==='ocr';
  if(t==='mc') return f.ch==='manual' && MC_FILES().includes(f.nm);
  return false;
}
function openCount(f){ return f.ch==='manual'?MC.rules.filter(r=>r.file===f.nm&&!MC.res[r.id]).length:f.alerts.filter(a=>!a.res).length; }
function statusKey(f){
  if(!f.cls) return 'pending';
  if(f.src==='system'&&f.ao==='internal') return 'skip';
  return openCount(f)?'issue':'done';
}
function rows(){
  if(S.subj==='deleted') return all().filter(f=>f.del);
  let r=live().filter(f=>inTab(f,S.tab));
  // Walked in from a defect: every page is about the document it names.
  const ff=S.focus?focusFile():null;
  if(ff) return r.filter(f=>f.id===ff.id);
  if(S.subj!=='all') r=r.filter(f=>f.sj===S.subj);
  if(S.fType) r=r.filter(f=>f.ty===S.fType);
  if(S.fStatus) r=r.filter(f=>statusKey(f)===S.fStatus);
  return r;
}
const tabCount=t=>live().filter(f=>inTab(f,t)&&(S.subj==='all'||S.subj==='deleted'||f.sj===S.subj)).length;
const tabIssues=t=>live().filter(f=>inTab(f,t)&&(S.subj==='all'||S.subj==='deleted'||f.sj===S.subj)&&openCount(f)>0).length;

/* ═══════ RENDER ═══════ */
const $=i=>document.getElementById(i);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){
  /* Which view you are in is decided by the door you came through - the CRA
     workbench or a defect on the Sales one - not by a switch up here. Two desks
     with two jobs; showing both sets of controls at once is what made the state
     hard to read. */
  $('viewCtx').textContent=S.focus
    ? `Sales · answering defect #${S.focus} — ${curFocusName()}`
    : S.cs==='draft' ? 'Sales · uploading before submission'
    : (S.role==='sales'?'Sales · returned case':'CRA · reviewing the case');
  const door=S.cs==='draft'?'draft':(S.role==='sales'?'sales':'cra');
  [...$('viewSeg').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===door));
  $('permHint').textContent=P().l;
  [...$('stageTabs').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.stage===S.stage));
  renderRail(); renderUpload(); renderTabs(); renderFilter(); renderTable(); renderFooter();
}

/* The rail holds three kinds of entry, and that is the structure worth showing:
   a scope (All Files), the parties who own documents, and an archive (Deleted).
   Parties carry a monogram because identity is what distinguishes them; the two
   scopes carry a muted icon instead. Position does the grouping - Deleted sits at
   the foot of the rail - so no headings or extra rules are needed. */
const monogram=nm=>nm.replace('Guarantor ','G').replace('Main Applicant','MA')
  .replace('Seller','SL').replace('Case Level','CL');

function renderRail(){
  const col=S.railCollapsed, ct=S.tab;
  let h=`<div class="rail-h">
      <button class="rail-toggle" data-railtoggle="1" title="${col?'Expand':'Collapse'}">${col?'\u00bb':'\u00ab'}</button></div>`;
  h+=`<button class="subj-item scope" data-subj="all" aria-pressed="${S.subj==='all'}" title="All Files">
        <span class="mk ico">${I('grid')}</span>
        <span class="r1"><span class="nm">All Files</span>
          <span class="ct">${live().filter(f=>inTab(f,ct)).length}</span></span></button>
      <div class="rail-div"></div>`;
  SUBJ[S.stage].forEach(s=>{
    const n=live().filter(f=>f.sj===s.id&&inTab(f,ct)).length;
    // FSD 2.7.4 records three mandatory-file scopes that are not aligned, so a
    // required denominator here would assert a number the system cannot back.
    h+=`<button class="subj-item ${s.gone?'gone':''}" data-subj="${s.id}"
          aria-pressed="${S.subj===s.id}" title="${s.nm}">
          <span class="mk">${monogram(s.nm)}</span>
          <span class="r1"><span class="nm">${s.nm}</span><span class="ct">${n}</span></span>
          ${s.sub?`<span class="sub">${s.sub}</span>`:''}</button>`;
  });
  h+=`<button class="subj-item scope foot" data-subj="deleted"
        aria-pressed="${S.subj==='deleted'}" title="Deleted">
        <span class="mk ico">${I('trash')}</span>
        <span class="r1"><span class="nm">Deleted</span>
          <span class="ct">${all().filter(f=>f.del).length}</span></span></button>`;

  $('rail').innerHTML=h;
  document.querySelector('.ocr-modal-content').className='ocr-modal-content'+(col?' rail-collapsed':'');
}

/* The File Center is one screen with three pages, whichever door you came
   through. Scoping and permissions change; the structure does not, or the same
   place looks like a different product depending on how you got there.
   The rule pages still need a subject picked - under All Files they would have
   to reconcile every entity's rules in one view. */
function renderTabs(){
  const T=[{k:'fl',n:'File List'}];
  if(P().see && S.subj!=='all' && S.subj!=='deleted'){
    T.push({k:'cv',n:'Cross-Validation Results'});
    if(tabs3()) T.push({k:'mc',n:'Manual Check Results'});
  }
  if(!T.some(t=>t.k===S.tab)) S.tab='fl';
  $('listTabs').innerHTML=T.map(t=>{
    let n=0,err=0;
    if(t.k!=='fl'){ n=tabCount(t.k); err=tabIssues(t.k); }
    else n=tabCount(t.k);
    return `<button data-tab="${t.k}" aria-pressed="${S.tab===t.k}">${t.n}
      <span class="ant-badge-count ${err?'err':(S.tab===t.k?'on':'')}">${err||n}</span></button>`;
  }).join('');
}

function renderFilter(){
  /* Walking in from a defect narrows every page to the document it names.
     Saying so - and offering the way back out - is what keeps a short list from
     reading like a wrong one. */
  if(S.focus){
    const f=focusFile();
    $('filterBar').innerHTML=`<span class="foot-note"><b>Defect #${esc(S.focus)}
        \u00b7 ${f?esc(f.nm):'no document yet'}</b> \u2014 opened from the Sales Workbench. ${f
          ?`This screen is scoped to that document. Replacing it re-runs every rule in the
            Case, not just this one.`
          :`It names no document, so nothing is scoped: the upload adds a document to the
            file list and no rule is rerun.`}</span>
      <span class="filter-actions">
        ${f?'<button class="ant-btn" data-allfiles="1">Show the whole case</button>':''}</span>`;
    return;
  }
  if(S.subj==='deleted'){ $('filterBar').innerHTML=`<span class="foot-note">Deleted files are kept as records only. They cannot be previewed or restored.</span>`; return; }
  const p=P(),n=S.sel.size;
  const types=[...new Set(live().filter(f=>inTab(f,S.tab)).map(f=>f.ty))].filter(t=>t!=='—');
  const sts=[['pending','Pending Classification'],['issue','Pending Action'],['done','Passed'],['skip','No Validation']];
  $('filterBar').innerHTML=
   `<div class="filter-inputs">

      <button class="ant-btn" data-act="reset">Reset Filters</button>
    </div>

      <span class="sel-n">Selected ${n}</span>
      <button class="ant-btn" data-act="reassign" ${n&&(p.cls||p.up)?'':'disabled'}>Change Subject</button>
      <button class="ant-btn ant-btn-dangerous" data-act="del" ${n&&p.del?'':'disabled'}>Delete</button>
      <button class="ant-btn" data-act="dl" ${n?'':'disabled'}>Download</button>

function statusCell(f){
  if(!f.cls) return f.low?'<span class="ant-tag ant-tag-red">Type Not Recognised</span>':'<span class="ant-tag ant-tag-gold">Pending Classification</span>';
  if(f.src==='system'&&f.ao==='internal') return '<span class="ant-tag">No Validation</span>';
  const o=openCount(f);
  if(!o) return '<span class="ant-tag ant-tag-green">Passed</span>';
  if(S.role==='sales') return '<span class="ant-tag ant-tag-blue">In Review</span>';
  if(f.ch==='manual') return `<span class="ant-tag ant-tag-gold">Manual Check ${o}</span>`;
  const e=f.alerts.filter(a=>!a.res).every(a=>a.k==='e');
  return `<span class="ant-tag ${e?'ant-tag-gold':'ant-tag-red'}">${e?'Manual Check ':'Alert '}${o}</span>`;
}

/* The way to answer a defect sits on the document it names, in the list where
   that document lives - not on a separate to-do page that would be a second
   defect ledger by another name. */

  if(P().up!=='scoped') return '';
  const d=DEFECTS.find(x=>x.fid===f.id&&x.st==='open');
  return d?`<button class="ant-btn ant-btn-primary ant-btn-sm" data-repl="${esc(d.no)}"
    title="Defect #${esc(d.no)}">Replace</button>`:'';
}

function renderFooter(){
  const p=P(), can=p.cls||p.rule||p.up;
  if(S.tab==='fl'){
    /* Sales answering a defect has one way to be finished with this screen: send
       the document back. The defect ledger itself lives on the Sales Workbench,
       which is where the case is handed over. */
    const act = S.focus
      ? `<button class="ant-btn ant-btn-primary" data-repl="${esc(S.focus)}">${
          focusFile()?'Replace The Named Document':'Upload The Missing Document'}</button>`
      : `<button class="ant-btn ant-btn-primary submit-btn" id="btnSubmit" ${can?'':'disabled'}>Submit for Verification (${S.stage==='app'?'Application':'Disbursement'})</button>`;
    $('footer').innerHTML=`<span class="foot-note">${S.focus
        ? `Answering defect #${esc(S.focus)} \u00b7 the rest of the case is read-only`

/* ═══════ DETAIL ═══════ */
function openDt(i){S.dt=i;$('detail').classList.remove('hidden');renderDt();}
function closeDt(){S.dt=null;$('detail').classList.add('hidden');render();}
const dtList=()=>rows();

function renderDt(){
  const f=byId(S.dt); if(!f) return closeDt();
  const s=SUBJ[S.stage].find(x=>x.id===f.sj), L=dtList(), i=L.findIndex(x=>x.id===f.id), p=P();
  $('dtTitle').textContent=f.nm;
  $('dtCrumb').textContent=`${subjNm(f)} \u203a ${f.cat} \u203a ${f.ty==='\u2014'?'Unclassified':f.ty}`;
  $('dtPos').textContent=(i+1)+' / '+L.length;
  $('dtPrev').disabled=i<=0; $('dtNext').disabled=i>=L.length-1;

function panel(f,p){
  let h='';
  // The superseded versions stay retrievable, with the alerts CRA saw still on
  // them - that record is what makes freezing the entry unnecessary.
  if(f.vers.length){
    h+=`<div class="vh"><div class="vh-h">Version chain \u00b7 superseded copies are kept, never modified</div>`;
    f.vers.forEach(v=>{ h+=`<div class="vh-r"><b>v${v.ver}</b><span>${esc(v.up)} \u00b7 ${esc(v.by)}
      \u00b7 ${esc(v.rs)}${v.alerts.length?` \u00b7 carried ${v.alerts.length} alert(s)`:''}</span></div>`; });
    h+=`<div class="vh-r cur"><b>v${f.ver}</b><span>${esc(f.up)} \u00b7 current</span></div></div>`;
  }
  if(f.src==='system')
    h+=f.ao==='external'
      ? `<div class="pnote info"><b>System archived \u00b7 External return</b><br>Returned from e-acceptance / biometric devices. Signature completeness and version are validated. Cannot be deleted.</div>`
      : `<div class="pnote ok"><b>System archived \u00b7 System-generated</b><br>Generated from a template. Rule validation is skipped. Cannot be deleted.</div>`;
  if(!f.cls){
    if(f.low) h+=`<div class="pnote warn"><b>Low overall confidence \u00b7 file type may not match</b><br>Confirm the classification first \u2014 it determines which field template is applied.</div>`;
    h+=`<div class="classify-box">
      <label>Category</label><select class="ant-select">${CATS(S.stage).map(c=>`<option ${c===f.cat?'selected':''}>${c}</option>`).join('')}</select>
      <label>File Type</label><select class="ant-select" id="clsTy">${TYPES.map(t=>`<option ${t===f.ty?'selected':''}>${t}</option>`).join('')}</select>
      <div style="margin-top:12px"><button class="ant-btn ant-btn-primary ant-btn-sm" id="btnCls" ${p.cls?'':'disabled'}>Confirm Classification</button></div>
      <div class="description-text" style="margin-top:8px">On confirmation the file moves to ${f.ch==='ocr'?'Cross-Validation Results':'Manual Check Results'}</div>
      ${p.cls?'':'<div class="description-text" style="margin-top:6px">This role cannot confirm classification.</div>'}</div>`;
  }
  /* Round 1 shows the whole Case rule set: nothing is scoped yet, and CRA is reading
     across files. Round 2 is the opposite - the defect names one file type, so the
     panel shows only that type's rules and hides the ones already concluded.
     Narrower is not less safe here: the Case-wide rerun still happens, it is just
     read on the Workbench side rather than by Sales. */
  if(f.cls&&f.ch==='manual'){
    const scoped=viaDefect(f), o=mcRules(f).filter(r=>!MC.res[r.id]).length;
    h+=scoped
      ? `<div class="pnote info"><b>Scoped to ${esc(f.ty)}</b><br>
          Only the rules for the file type this defect names. Rules already concluded on other
          documents are not repeated here \u2014 the Case-wide rerun is reported in the Workbench.</div>
         <p class="panel-sect ${o?'err':''}">EXPERT RULES \u00b7 ${esc(f.ty)} \u00b7 ${o?o+' pending':'all reviewed'}</p>`
      : `<div class="pnote"><b>${MC.rules.length} manual rule(s) for this case</b><br>
          ${MC.caseTotal} total \u2212 ${MC.ocrHandled} handled by OCR = ${MC.rules.length}
          (${MC.rules.filter(r=>r.routed).length} routed here from the non-AI upload entry)</div>
         <div class="passall"><span>Reviewed every rule on this page?</span>
           <button class="ant-btn ant-btn-sm" data-passall="1" ${p.rule?'':'disabled'}>Pass All (${o})</button></div>
         <p class="panel-sect ${o?'err':''}">EXPERT RULES \u00b7 ${o?o+' pending':'all reviewed'}</p>`;
    MCF(f).forEach(fn=>{
      const cur=fn===f.nm;
      h+=`<div class="mc-grp ${cur?'cur':''}">${fn}${cur?'<span class="mc-cur">Previewing</span>':''}</div>`;
      mcRules(f).filter(r=>r.file===fn).forEach(r=>{
        const res=MC.res[r.id], d=defForFile(f.id);
        h+=`<div class="alert-item ${res==='fail'?'machine':(res?'resolved':'eyeball')}">
          <div class="ah"><span class="rid">${r.id}</span><span class="rn">${r.nm}</span>
            ${r.routed?'<span class="routed">ROUTED</span>':''}</div><div class="rd">${r.d}</div>`;
        if(res==='fail'&&r.def) h+=`<div class="res keep">Defect #${esc(r.def)} logged · result kept</div>`;
        h+=`<div class="acts">
            <button class="ant-btn ant-btn-sm ${res==='pass'?'mc-on':''}" data-mc="pass" data-r="${r.id}" ${p.rule?'':'disabled'}>Pass</button>
            <button class="ant-btn ant-btn-sm ${res==='fail'?'mc-off':''}" data-mc="fail" data-r="${r.id}" ${p.rule?'':'disabled'}>Fail</button>
            ${p.rule?'':'<span class="ro-note">CRA concludes this</span>'}
            ${res==='fail'&&p.rule?`<button class="ant-btn ant-btn-sm ant-btn-primary" data-mkdef="${esc(f.id)}" data-mr="${esc(r.id)}">
              ${d?`Update Defect #${esc(d.no)}`:'Create Defect'}</button>`:''}</div>`;
        h+=`</div>`;
      });
    });
  }
  if(f.cls&&f.ch==='ocr'&&f.alerts.length){
    /* Two kinds of rule live in the same engine and only one of them may become a
       defect. OCR's self-checks say whether the document could be read; expert rules
       say whether the case is in order. Splitting them here is what stops a read
       problem from being sent to Sales as a document problem. */
    const grps=[
      {q:0,t:'EXPERT RULE ALERTS',n:''},
      {q:1,t:'OCR SELF-CHECK \u00b7 DOCUMENT QUALITY',
       n:'OCR\u2019s own read checks. They report how the document scanned, not what the case owes, so no defect is raised from here.'}];
    grps.forEach(g=>{
    const idx=f.alerts.map((a,i)=>i).filter(i=>!!f.alerts[i].q===!!g.q);
    if(!idx.length) return;
    const o=idx.filter(i=>!f.alerts[i].res).length;
    h+=`<p class="panel-sect ${o&&!g.q?'err':''}">${g.t} \u00b7 ${o?o+' pending':'all handled'}</p>`;
    if(g.n) h+=`<div class="pnote">${g.n}</div>`;
    idx.forEach(i=>{
      const a=f.alerts[i];
      h+=`<div class="alert-item ${a.res?'resolved':(a.k==='e'?'eyeball':'machine')}"><div class="ah"><span class="rid">${a.id}</span><span class="rn">${a.nm}</span></div><div class="rd">${a.d}</div>`;
      // The defect is logged and the alert stays. They answer different questions -
      // "is this document readable" and "who owes what" - so clearing one must not
      // clear the other. It is why OCR has to be able to save while an alert stands.
      if(a.def) h+=`<div class="res keep">Defect #${esc(a.def)} logged \u00b7 alert kept as the evidence</div>`;
      h+=a.res?`<div class="res">&#10003; ${a.res}</div>`
        :a.k==='e'
          ?`<div class="acts"><button class="ant-btn ant-btn-sm" data-al="pass" data-i="${i}" ${p.rule?'':'disabled'}>Pass</button>
            <button class="ant-btn ant-btn-sm ant-btn-dangerous" data-al="fail" data-i="${i}" ${p.rule?'':'disabled'}>Fail</button>
            ${a.q?'':defBtn(f,i,p)}
            <button class="ant-btn ant-btn-link ant-btn-sm" data-al="loc" data-i="${i}">Check image \u2192</button></div>`
          :`<div class="acts">${a.q?'':defBtn(f,i,p)}
            <button class="ant-btn ant-btn-sm" data-al="just" data-i="${i}" ${p.rule?'':'disabled'}>Justification</button>
            <button class="ant-btn ant-btn-sm" data-al="repl" data-i="${i}" ${p.rule?'':'disabled'}>Replace Document</button>
            <button class="ant-btn ant-btn-link ant-btn-sm" data-al="loc" data-i="${i}">Check image \u2192</button></div>`;
      h+=`</div>`;
    });
    });
  }
  if(f.cls&&f.ch==='ocr'&&!f.alerts.length&&f.src!=='system')
    h+=`<div class="pnote ok"><b>All rules passed</b></div>`;
  if(f.fields.length){
    h+=`<p class="panel-sect">FIELDS</p>`;
    f.fields.forEach(x=>{h+=x.g?`<div class="field-group">${x.g}</div>`
      :`<div class="field-row"><span class="k">${x.n}</span><span class="v">${x.v}</span>
         <span class="c ${x.c>=90?'confidence-high':'confidence-low'}">${x.c}%</span></div>`;});
  }
  return h;
}

function saveDef(){
  const f=byId(DD.fid), cat=$('ddCat').value, cr=($('ddCr').value||'').trim();
  if(!DD.types.length){msg('Pick at least one defect type');return;}
  let d=DD.ex&&DEFECTS.find(x=>x.no===DD.ex), no;
  if(d){
    d.hist.push({was:d.types.slice(),at:new Date().toTimeString().slice(0,5)});
    d.types=DD.types.slice(); d.rules=DD.rules.slice(); d.cat=cat;
    d.cr=(d.cr?d.cr+' | ':'')+(cr||`Updated from the latest rules: ${DD.rules.join(', ')||'—'}`);
    d.st='open'; no=d.no;
  }else{
    no=String(++DSEQ);
    DEFECTS.push({no,fid:DD.fid,cat,rules:DD.rules.slice(),types:DD.types.slice(),
      cr:cr||f.nm,src:'System',st:'open',hist:[]});
  }
  // The alert is marked as evidenced, never as resolved.
  if(DD.man) MC.rules.forEach(r=>{if(DD.rules.includes(r.id))r.def=no;});
  else f.alerts.forEach(a=>{if(!a.res&&!a.q)a.def=no;});
  smClose(); renderDt(); render();
  /* The defect is raised here and read in the Workbench, so the two screens have to
     be looking at one ledger. In the combined build this event is what carries it
     across; standalone, nothing listens and the page behaves exactly as before. */
  document.dispatchEvent(new CustomEvent('defect:raised',{detail:{
    no,file:f.nm,cat,types:d?d.types.slice():DD.types.slice(),
    rules:DD.rules.slice(),cr:(d?d.cr:cr||f.nm),update:!!DD.ex}}));
  msg(`Defect #${no} ${DD.ex?'updated':'created'} · alert kept · read it in the CRA Workbench`);
}

/* The four agreed outcomes of a replacement. Which one fires is a demo choice, not
   something the user picks in production - there the rules decide. */
const OUTCOMES={
 a:{nm:'a \u00b7 rule still not solved',d:'The replacement still breaks the same rule. The defect stands as it is.'},
 b:{nm:'b \u00b7 rule solved',d:'No alert, no fail. The defect can be verified on CRA submission.'},
 c:{nm:'c \u00b7 solved, new rule hit',d:'The old rule clears and a different one fails. The defect is rewritten, not replaced.'},
 d:{nm:'d \u00b7 partly solved, new rule hit',d:'One rule clears, one stands, another appears. Same handling as c.'}
};
// A rule that reads this document and one other. Replacing either can move it.
const XRULE={id:'S53',nm:'Balance payable reconciles with the HP Agreement',
  d:'Balance originally payable no longer reconciles against the replaced agreement (98,000.00 vs 96,500.00)',
  a:'d5',b:'d1'};

function replaceDoc(no){
  const d=DEFECTS.find(x=>x.no===no), f=d&&defFile(d); if(!f) return;
  const oc=S.oc||'a';
  const at=new Date().toLocaleString('en-GB',{day:'2-digit',month:'2-digit',year:'2-digit',
    hour:'2-digit',minute:'2-digit'}).replace(',','');
  f.vers.push({ver:f.ver,up:f.up,by:f.src==='system'?'System':'SalesOfficer1',
    alerts:f.alerts.slice(),rs:`Superseded for defect #${d.no}`});
  f.ver++; f.up=at; f.cls=1; f.low=0; f.desc=`Re-extracted from v${f.ver}`;

  // A manually checked document has no engine alerts - its conclusions are the eye
  // marks, and a new version has to be re-read, so they are cleared rather than kept.
  const man=f.ch==='manual';
  if(man){
    MC.rules.filter(r=>r.file===f.nm).forEach(r=>{delete MC.res[r.id];r.def=null;});
  }else{
    const keep=f.alerts.filter((a,i)=>oc==='a'||(oc==='d'&&i>0));
    const add=[];
    if(oc==='c'||oc==='d') add.push({id:'A156',k:'m',nm:'Hirer name differs from the NRIC',
      d:'Replacement reads TAN WEI MIN, NRIC reads TAN WEI MING'});
    f.alerts=keep.concat(add);
    f.alerts.forEach(a=>{a.res=null;a.def=null;});
  }

  /* Revalidation covers the Case, not the file. It is the only way a cross-document
     rule can be caught - S52 reads this agreement as well as the 2nd Schedule, so
     replacing this one moves a rule sitting on a file nobody touched. */
  S.reval=1; S.xhit=null;
  const partner=f.id===XRULE.a?byId(XRULE.b):null;
  render();
  setTimeout(()=>{
    S.reval=0;
    if(partner&&(oc==='c'||oc==='d')&&!partner.alerts.some(x=>x.id===XRULE.id)){
      partner.alerts.push({id:XRULE.id,k:'m',nm:XRULE.nm,d:XRULE.d,xf:f.id});
      S.xhit={on:partner.nm,by:f.nm};
    }
    // The defect follows the latest rules on its own document. It is never closed and
    // reopened - the number, the category and anything CRA typed all survive.
    const still=f.alerts.map(a=>a.id);
    if(man){
      d.st='responded';
      d.cr=(d.cr?d.cr+' | ':'')+'New version uploaded \u2014 the manual rules for this file type need re-reading';
    }else if(!still.length){
      d.st='responded';
      d.cr=(d.cr?d.cr+' | ':'')+'Replacement carries no alert and no fail \u2014 awaiting CRA verification';
    }else{
      const dropped=(d.rules||[]).filter(r=>!still.includes(r));
      if(dropped.length||still.some(r=>!(d.rules||[]).includes(r))){
        d.hist.push({was:(d.types||[]).slice(),at:at.slice(-5)});
        d.rules=still.slice();
        d.types=[...new Set(still.map(r=>(RULEMAP[r]||{}).ty).filter(Boolean))];
        if(!d.types.length)d.types=['Wrong document uploaded'];
        d.cr=(d.cr?d.cr+' | ':'')+`Revalidated: ${dropped.length?'cleared '+dropped.join(', ')+'; ':''}now ${still.join(', ')}`;
      }
      d.st='responded';
    }
    // The cross-document hit lands on the document that was replaced - it is the one
    // that changed, and the only one Sales is allowed to touch next round.
    if(S.xhit){
      d.rules=[...new Set((d.rules||[]).concat([XRULE.id]))];
      d.types=[...new Set((d.types||[]).concat([(RULEMAP[XRULE.id]||{}).ty]))];
      d.cr+=` | Cross-document: ${XRULE.id} moved on ${S.xhit.on} because this file changed`;
    }
    render();
    /* The rerun happened in front of this document, but its consequences are read
       on the workbench. Telling it which file came back is what turns the demo
       into one loop instead of two screens that each claim a different round. */
    document.dispatchEvent(new CustomEvent('case:revalidated',{detail:{
      file:f.nm,defect:d.no,outcome:oc,cross:S.xhit?S.xhit.on:''}}));
    msg(`All rules re-run across the Case \u00b7 ${f.nm} v${f.ver}`+
        (S.xhit?` \u00b7 ${XRULE.id} also moved on ${S.xhit.on}`:''));
  },1600);
  smClose(); render();
  msg(`${f.nm} v${f.ver} uploaded \u00b7 revalidating every rule in the Case\u2026`);
}
/* Sales enters through the defect and sees a narrowed world: this document, this
   file type, nothing else. The type is not a choice - it is what the defect names. */
function askReplace(no){
  S.repl=no;

  // No document behind the defect means there is nothing to replace and nothing for
  // AI to read against - that line goes straight to the file list.
  if(d&&!defFile(d)) drawNewUpload(); else drawReplace();
}

// not revalidated - there is no rule behind it to rerun.

  const d=DEFECTS.find(x=>x.no===no); if(!d||defFile(d)) return;

/* ═══════ SUB-MODAL / MESSAGE ═══════ */
function sm(t,b,f){$('smTitle').textContent=t;$('smBody').innerHTML=b;
  $('smFoot').innerHTML=f||'<button class="ant-btn" data-cl="1">Close</button>';$('subMask').classList.remove('hidden');}
function smClose(){$('subMask').classList.add('hidden');}
let mt;function msg(m){const e=$('msg');e.firstElementChild.textContent=m;e.classList.add('on');clearTimeout(mt);mt=setTimeout(()=>e.classList.remove('on'),2000);}
const roleNm=()=>({sales:'Sales',cra:'CRA'})[S.role];

/* Deleting is manual and the customer owns the consequence - the system never removes
   a superseded file on its own. What it does guarantee is that both sides stay in step:
   the subfiles OCR split out, the rule conclusions hanging off them, and any defect
   pointing at the file all go with it. A rule left pointing at a file that no longer
   exists is worse than the file. */
function askDelete(ids){
  const fs=ids.map(byId).filter(Boolean);
  const subs=fs.reduce((n,f)=>n+(f.ch==='ocr'&&f.cls?Math.max(1,(f.tyc?2:1)):0),0);
  const rules=fs.reduce((n,f)=>n+f.alerts.length+MC.rules.filter(r=>r.file===f.nm).length,0);
  const defs=fs.map(f=>defForFile(f.id)).filter(Boolean);
  sm('Delete Files',
    `<div class="pnote info"><b>${fs.length}</b> file(s) will be deleted.<br><br>Deleted files move to <b>Deleted</b> in the left rail, keeping the deleter, timestamp and reason. They are kept as records only and <b>cannot be restored</b>.</div>
     <div class="pnote warn"><b>Deleted on both sides.</b><br>
       ${subs} OCR subfile(s) and ${rules} rule conclusion(s) are removed with the file, so nothing
       is left pointing at a document that no longer exists.
       ${defs.length?`<br><b>Defect ${defs.map(d=>'#'+d.no).join(', ')}</b> ${defs.length>1?'lose':'loses'} the document
         ${defs.length>1?'they name':'it names'} — reopen ${defs.length>1?'them':'it'} against the replacement.`:''}</div>
     <label style="font-size:12px;color:var(--text-2)">Reason (optional)</label>
     <input class="ant-input" id="delRs" style="width:100%;margin-top:4px" placeholder="e.g. Customer resubmitted the latest month">`,
    `<button class="ant-btn" data-cl="1">Cancel</button>
     <button class="ant-btn ant-btn-primary" data-dodel='${JSON.stringify(ids)}'>Confirm Delete</button>`);
}
/* One submission for both tracks. It never requires the Case to be complete -
   it submits what is concluded and says what is left, so an interrupted session
   resumes with nothing lost. */
function submitRules(){
  const t=trackState();
  if(!t.open){ msg(`Rule results submitted \u00b7 ${t.done}/${t.all} concluded`); return; }
  sm('Submit Rule Results',
    `<div class="pnote warn"><b>${t.open} rule(s) are still open.</b><br>
       Submitting now records the conclusions you have made so far. The open rules stay open and can be concluded later.</div>
     <table><tr><th>Track</th><th>Concluded</th><th>Open</th><th>Where</th></tr>
      <tr><td>OCR</td><td>${t.od} / ${t.ot}</td><td>${t.ot-t.od}</td><td>Cross-Validation Results</td></tr>
      <tr><td>Manual</td><td>${t.md} / ${t.mt}</td><td>${t.mt-t.md}</td><td>Manual Check Results</td></tr></table>`,
    `<button class="ant-btn" data-cl="1">Keep working</button>
     <button class="ant-btn ant-btn-primary" data-cl="1" data-tst="Rule results submitted \u00b7 open rules left for later">Submit anyway</button>`);
}
/* Which entry a document belongs to is a lookup question, not something to
   memorise. Search answers it directly; the grouped list is there to browse. */
function docListBody(q){
  const k=(q||'').trim().toLowerCase();
  const hit=n=>!k||n.toLowerCase().includes(k);
  const row=(n,ocr)=>`<div class="dl-row"><span class="nm">${esc(n)}</span>
    <span class="ant-tag ${ocr?'ant-tag-blue':''}">${ocr?'AI Scanning':'Non AI Scanning'}</span></div>`;
  let h='',n=0;
  DOCLIST.forEach(([g,items])=>{
    const f=items.filter(hit); if(!f.length)return; n+=f.length;
    h+=`<div class="dl-grp">${esc(g)}</div>`+f.map(x=>row(x,1)).join('');
  });
  MANUAL_DOCS.forEach(([g,items])=>{
    const f=items.filter(hit); if(!f.length)return; n+=f.length;
    h+=`<div class="dl-grp">${esc(g)}</div>`+f.map(x=>row(x,0)).join('');
  });
  return n?h:`<div class="dl-none">No document type matches “${esc(q)}”.<br>
    Anything outside the OCR File List goes to <b>Non AI Scanning</b>.</div>`;
}
function openDocList(){
  sm('Where does this document go?',

     <div id="dlBody">${docListBody('')}</div>`,

/* ═══════ EVENTS ═══════ */
document.addEventListener('input',e=>{
  if(e.target.id==='dlq'){ $('dlBody').innerHTML=docListBody(e.target.value); }
});
document.addEventListener('change',e=>{
  if(e.target.id==='fType'){S.fType=e.target.value;renderTable();}
  if(e.target.id==='fStatus'){S.fStatus=e.target.value;renderTable();}
  // The category decides which field template applies, so it stays the
  // uploader's call rather than something the entry has to guess up front.
  if(e.target.dataset.cat){
    const f=byId(e.target.dataset.cat); if(!f)return;
    f.cat=e.target.value; renderRail(); renderTable();
    msg(`${f.nm} moved to ${f.cat}`);
  }
});

document.addEventListener('click',e=>{
  const t=e.target.closest('button,input[type=checkbox],[data-dty]'); if(!t) return;

  if(t.dataset.railtoggle){S.railCollapsed=!S.railCollapsed;render();return;}
  if(t.dataset.view){setView(t.dataset.view);return;}
  if(t.dataset.ocpick){S.oc=t.dataset.ocpick;drawReplace();return;}
  if(t.dataset.allfiles){S.focus=null;S.tab='fl';render();
    msg('Showing every document on the case');return;}
  if(t.dataset.repl){askReplace(t.dataset.repl);return;}
  if(t.dataset.donew){uploadNew(t.dataset.donew);return;}
  if(t.dataset.dorepl){replaceDoc(t.dataset.dorepl);return;}
  if(t.dataset.wrongf){wrongFile(t.dataset.wrongf);return;}
  if(t.dataset.mkdef){openDefDlg(t.dataset.mkdef,t.dataset.ai||0);return;}
  if(t.dataset.dtyopen){keepDef();DD.pick=!DD.pick;drawDefDlg();return;}
  if(t.dataset.dty){const v=t.dataset.dty,i=DD.types.indexOf(v);
    keepDef(); i>-1?DD.types.splice(i,1):DD.types.push(v);
    DD.pick=1; drawDefDlg();return;}
  if(t.dataset.dodef){saveDef();return;}
  if(t.dataset.passall){
    const f=byId(S.dt),n=mcRules(f).filter(r=>!MC.res[r.id]).length;
    mcRules(f).forEach(r=>{if(!MC.res[r.id])MC.res[r.id]='pass';});
    renderDt();render();msg(`${n} rule(s) passed in one action`);return;}
  if(t.dataset.stage){S.stage=t.dataset.stage;S.tab='fl';S.subj='all';S.sel.clear();S.fType=S.fStatus='';render();return;}
  if(t.dataset.tab){S.tab=t.dataset.tab;S.sel.clear();S.fType=S.fStatus='';if(S.subj==='deleted')S.subj='all';render();return;}
  if(t.dataset.subj){S.subj=t.dataset.subj;S.sel.clear();
    if((S.subj==='all'||S.subj==='deleted')&&S.tab!=='fl'){S.tab='fl';S.fType=S.fStatus='';}
    render();return;}
  if(t.dataset.chk){const i=t.dataset.chk;S.sel.has(i)?S.sel.delete(i):S.sel.add(i);render();return;}
  if(t.dataset.open){openDt(t.dataset.open);return;}
  if(t.dataset.del1){askDelete([t.dataset.del1]);return;}

  if(t.dataset.act){
    const a=t.dataset.act,n=S.sel.size;
    if(a==='doclist'){openDocList();return;}
    if(a==='toCRA'){S.cs='recheck';S.role='cra';render();
      msg('Case returned to CRA \u00b7 verify and close the defects in the Workbench');return;}
    if(a==='reset'){S.fType=S.fStatus='';render();return;}
    if(a==='refresh'){msg('Refreshed');return;}
    if(a==='del'){askDelete([...S.sel]);return;}
    if(a==='dl'){msg(`${n} file(s) downloaded`);return;}
    if(a==='reassign'){
      sm('Change Subject',
        `<div class="pnote info">Move the selected <b>${n}</b> file(s) to another Subject. Classification confirmations and extraction results are kept.</div>
         <label style="font-size:12px;color:var(--text-2)">Target Subject</label>
         <select class="ant-select" id="tgtSubj" style="width:100%;margin-top:4px">
         ${SUBJ[S.stage].map(s=>`<option value="${s.id}">${s.nm}</option>`).join('')}</select>`,
        `<button class="ant-btn" data-cl="1">Cancel</button><button class="ant-btn ant-btn-primary" data-doreassign="1">Confirm Change</button>`);
      return;
    }
  }

  if(t.dataset.dodel){
    const ids=JSON.parse(t.dataset.dodel);
    const rs=($('delRs')&&$('delRs').value.trim())||'No reason given';
    const at=new Date().toLocaleString('en-GB',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}).replace(',','');
    let cas=0;
    ids.forEach(i=>{const f=byId(i);if(!f)return;
      f.del={by:roleNm()+' · '+(S.role==='sales'?'SalesOfficer1':'v_kangyi'),at,rs};
      // Cascade: the rule conclusions and the defect link go with the file, on both sides.
      cas+=f.alerts.length; f.alerts=[];
      MC.rules.filter(r=>r.file===f.nm).forEach(r=>{cas++;delete MC.res[r.id];r.def=null;});
      const d=defForFile(i); if(d){d.fid=null;d.cr=(d.cr?d.cr+' | ':'')+'Document deleted — reopen against the replacement';}
    });
    S.sel.clear();smClose();render();
    msg(`${ids.length} file(s) deleted · ${cas} rule conclusion(s) removed with them`);return;
  }
  if(t.dataset.doreassign){
    const v=$('tgtSubj').value;let n=0;
    S.sel.forEach(i=>{const f=byId(i);if(f){f.sj=v;n++;}});
    S.sel.clear();smClose();render();msg(`Subject changed for ${n} file(s)`);return;
  }

  if(t.id==='dtBack'){closeDt();return;}
  if(t.id==='dtPrev'||t.id==='dtNext'){
    const L=dtList(),i=L.findIndex(x=>x.id===S.dt),j=t.id==='dtPrev'?i-1:i+1;
    if(L[j]){S.dt=L[j].id;renderDt();}return;
  }
  if(t.id==='dtSave'){msg('Saved');return;}
  if(t.id==='dtSync'){
    /* Write-back takes the latest version of a document, and only if that document
       carries no open defect. If either fails nothing is written for it - the values
       are not quietly taken from the superseded copy. The block names the defect,
       because closing it is what brings the fields back. */
    const cf=byId(S.dt), cd=cf&&defForFile(cf.id);
    if(cd&&cd.st!=='closed'){
      sm('OCR Data Sync',
        `<div class="pnote warn"><b>Nothing is written back for this document.</b><br>
          <b>${esc(cf.nm)}</b> still has defect <b>#${esc(cd.no)}</b> open
          (${esc(defTypes(cd))}). Write-back takes the latest version of a document
          <b>and</b> requires it to be defect-free — so these fields stay as they are.</div>
         <div class="pnote info">The previous version is <b>not</b> used as a fallback.
          Close defect #${esc(cd.no)} in the Workbench and the fields become available again.</div>`,
        `<button class="ant-btn ant-btn-primary" data-cl="1">Close</button>`);
      return;
    }
    sm('OCR Data Sync',
      `<div class="pnote info">Reading <b>${esc(cf?cf.nm:'this document')}</b> v${cf?cf.ver:1} — latest version, no open defect.</div>
       <div class="pnote warn">Selecting a checkbox means applying the OCR value to replace the current value.</div>
       <table><tr><th>Field</th><th>Current Value</th><th>OCR Value</th><th>Status</th></tr>
        <tr><td><input type="checkbox"> Customer Name</td><td>FX</td><td>QQQ</td><td style="color:var(--warning-text)">CONFLICT</td></tr>
        <tr><td><input type="checkbox" checked> Address Line 1</td><td>(Empty)</td><td>16 ES TAMAN UDA MURNI</td><td style="color:var(--text-3)">SYNC OK</td></tr>
        <tr><td><input type="checkbox" checked> Postcode</td><td>(Empty)</td><td>16400</td><td style="color:var(--text-3)">SYNC OK</td></tr></table>`,
      `<button class="ant-btn" data-cl="1">Cancel</button><button class="ant-btn ant-btn-primary" data-cl="1" data-tst="Selected fields merged">Merge Selected Fields</button>`);
    return;
  }
  if(t.id==='btnCls'){
    const f=byId(S.dt),sel=$('clsTy');
    f.ty=sel?sel.value:f.ty;f.low=0;f.tyc='';f.cls=1;f.desc='Classification Confirmed';
    if(f.fields.length===1&&f.fields[0].c===0)
      f.fields=f.ty==='MyKad'?[{n:'id_no',v:'900101105123',c:99},{n:'name',v:'TAN WEI MING',c:98},{n:'address',v:'29 JALAN DURIAN, KL',c:95}]
        :[{n:'document_no',v:'—',c:0}];
    msg(`Classification confirmed \u00b7 moved to ${f.ch==='ocr'?'Cross-Validation':'Manual Check'} Results`);
    renderDt();render();return;
  }
  if(t.dataset.al){
    const f=byId(S.dt),a=f.alerts[+t.dataset.i],k=t.dataset.al;
    if(k==='loc'){msg('Image scrolled to the location defined by this rule');return;}
    a.res={pass:'Passed',fail:'Failed \u00b7 returned to Sales',just:'Justification recorded',repl:'Replace Document requested'}[k]+' \u00b7 '+roleNm();
    renderDt();render();return;
  }
  if(t.dataset.mc){
    const r=MC.rules.find(x=>x.id===t.dataset.r), k=t.dataset.mc;
    if(MC.res[r.id]===k) delete MC.res[r.id]; else MC.res[r.id]=k;
    if(MC.res[r.id]!=='fail') r.def=null;
    renderDt();render();
    msg(MC.res[r.id]?`${r.id} marked as ${k==='pass'?'Pass':'Fail'}`:`${r.id} cleared`);
    return;
  }
  if(t.id==='btnReval'){
    // FSD 2.8.3 - reruns every rule in the Case. Manual marking stays available
    // throughout; only submission waits, so no stale OCR conclusion gets persisted.
    S.reval=1;renderFooter();msg('Revalidating all files in the Case\u2026');
    setTimeout(()=>{S.reval=0;render();msg('Revalidation complete \u00b7 OCR results refreshed');},2200);
    return;
  }
  if(t.id==='btnSubmit'){
    if(S.stage==='app'&&S.tab==='fl'&&P().up){missing();return;}
    if(S.tab==='fl'){
      if(S.cs==='draft'){S.cs='review';S.role='cra';render();
        msg('Submitted \u00b7 extraction and rule validation started, case now with CRA');return;}
      msg('Classification submitted \u00b7 extraction and rule validation started');return;
    }
    submitRules();return;
  }
  if(t.dataset.gomiss){smClose();S.tab='fl';S.subj='primary';S.fStatus='pending';render();msg('Filtered to files pending classification');return;}
  if(t.dataset.cl){if(t.dataset.tst)msg(t.dataset.tst);smClose();return;}
});

document.addEventListener('click',e=>{
  if(DD&&DD.pick&&!e.target.closest('.msel')){keepDef();DD.pick=0;drawDefDlg();}
},true);
$('subMask').addEventListener('click',e=>{if(e.target===$('subMask'))smClose();});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('subMask').classList.contains('hidden'))smClose();else if(S.dt)closeDt();}
});

$('mClose').innerHTML=I('close');
/* Standalone the file can still be driven by hand; inside the combined build the
   host owns the view, so the switch stays out of the way. */
if(window.parent===window) $('viewSeg').hidden=false;
window.addEventListener('message',e=>{
  const d=e.data||{};
  if(d.fcView) setView(d.fcView.view,d.fcView);
});
render();
})();
</script>
