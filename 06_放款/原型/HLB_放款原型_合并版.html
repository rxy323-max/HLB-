/* One submission for both tracks. It never requires the Case to be complete -
   it submits what is concluded and says what is left, so an interrupted session
   resumes with nothing lost. */
function submitRules(){
  const t=trackState();
  if(!t.open){ msg(`Rule results submitted \u00b7 ${t.done}/${t.all} concluded`); return; }
  sm('Submit Rule Results',
    `<div class="pnote warn"><b>${t.open} rule(s) are still open.</b><br>
       Submitting now records the conclusions you have made so far. The open rules stay open and can be concluded later.</div>
     <table><tr><th>Track</th><th>Concluded</th><th>Open</th><th>Where</th></tr>
      <tr><td>OCR</td><td>${t.od} / ${t.ot}</td><td>${t.ot-t.od}</td><td>Cross-Validation Results</td></tr>
      <tr><td>Manual</td><td>${t.md} / ${t.mt}</td><td>${t.mt-t.md}</td><td>Manual Check Results</td></tr></table>`,
    `<button class="ant-btn" data-cl="1">Keep working</button>
     <button class="ant-btn ant-btn-primary" data-cl="1" data-tst="Rule results submitted \u00b7 open rules left for later">Submit anyway</button>`);
}
/* Which entry a document belongs to is a lookup question, not something to
   memorise. Search answers it directly; the grouped list is there to browse. */
function docListBody(q){
  const k=(q||'').trim().toLowerCase();
  const hit=n=>!k||n.toLowerCase().includes(k);
  const row=(n,ocr)=>`<div class="dl-row"><span class="nm">${esc(n)}</span>
    <span class="ant-tag ${ocr?'ant-tag-blue':''}">${ocr?'AI Scanning':'Non AI Scanning'}</span></div>`;
  let h='',n=0;
  DOCLIST.forEach(([g,items])=>{
    const f=items.filter(hit); if(!f.length)return; n+=f.length;
    h+=`<div class="dl-grp">${esc(g)}</div>`+f.map(x=>row(x,1)).join('');
  });
  MANUAL_DOCS.forEach(([g,items])=>{
    const f=items.filter(hit); if(!f.length)return; n+=f.length;
    h+=`<div class="dl-grp">${esc(g)}</div>`+f.map(x=>row(x,0)).join('');
  });
  return n?h:`<div class="dl-none">No document type matches “${esc(q)}”.<br>
    Anything outside the OCR File List goes to <b>Non AI Scanning</b>.</div>`;
}
function openDocList(){
  sm('Where does this document go?',
    `<input class="ant-input" id="dlq" style="width:100%" placeholder="Search a document type, e.g. payslip">
     <div class="description-text" style="margin:8px 0 4px">${OCR_COUNT} types are read automatically by AI Scanning. Everything else goes to Non AI Scanning.</div>
     <div id="dlBody">${docListBody('')}</div>`,
    `<button class="ant-btn ant-btn-primary" data-cl="1">Close</button>`);
  const q=$('dlq'); if(q){q.focus();}
}
function missing(){
  sm('Completeness Check',
    `<div class="pnote info">The required list is computed at submission, once the vehicle type, guarantor arrangement and identity type are known.</div>
     <div class="miss-group"><div class="gh"><span>Main Applicant</span><span style="color:var(--error-text)">2 missing</span></div>
       <ul><li>Driving License \u2014 not uploaded</li><li>MyKad \u2014 uploaded but <b>type not confirmed</b> (mykad.png still pending in File List)</li></ul></div>
     <div class="miss-group"><div class="gh"><span>Guarantor 1</span><span style="color:var(--error-text)">1 missing</span></div>
       <ul><li>Guarantor EPF Statement \u2014 not uploaded</li></ul></div>`,
    `<button class="ant-btn" data-cl="1">Later</button><button class="ant-btn ant-btn-primary" data-gomiss="1">Handle Now</button>`);
}

/* ═══════ EVENTS ═══════ */
document.addEventListener('input',e=>{
  if(e.target.id==='dlq'){ $('dlBody').innerHTML=docListBody(e.target.value); }
});
document.addEventListener('change',e=>{
  if(e.target.id==='fType'){S.fType=e.target.value;renderTable();}
  if(e.target.id==='fStatus'){S.fStatus=e.target.value;renderTable();}
  // The category decides which field template applies, so it stays the
  // uploader's call rather than something the entry has to guess up front.
  if(e.target.dataset.cat){
    const f=byId(e.target.dataset.cat); if(!f)return;
    f.cat=e.target.value; renderRail(); renderTable();
    msg(`${f.nm} moved to ${f.cat}`);
  }
});

document.addEventListener('click',e=>{
  const t=e.target.closest('button,input[type=checkbox]'); if(!t) return;

  if(t.dataset.railtoggle){S.railCollapsed=!S.railCollapsed;render();return;}
  if(t.dataset.role){S.role=t.dataset.role;S.sel.clear();render();if(S.dt)renderDt();return;}
  if(t.dataset.cs){S.cs=t.dataset.cs;S.sel.clear();render();if(S.dt)renderDt();return;}
  if(t.dataset.repl){askReplace(t.dataset.repl);return;}
  if(t.dataset.dorepl){replaceDoc(t.dataset.dorepl);return;}
  if(t.dataset.verify){
    const d=DEFECTS.find(x=>x.no===t.dataset.verify);
    d.st='closed'; render(); msg(`Defect #${d.no} verified and closed`); return;
  }
  if(t.dataset.waive){
    const d=DEFECTS.find(x=>x.no===t.dataset.waive);
    sm('Waive Defect',
      `<div class="pnote warn">The rule stays failed. Waiving records why it is acceptable, and the
         reason goes into the audit trail alongside the failed rule.</div>
       <label style="font-size:12px;color:var(--text-2)">Justification <span style="color:var(--error-text)">*</span></label>
       <textarea class="ant-input" id="wvR" style="width:100%;height:80px;margin-top:4px;padding:8px 11px"
         placeholder="e.g. CED approved the shortfall on 18-08-2026"></textarea>`,
      `<button class="ant-btn" data-cl="1">Cancel</button>
       <button class="ant-btn ant-btn-primary" data-dowaive="${d.no}">Waive</button>`);
    return;
  }
  if(t.dataset.dowaive){
    const d=DEFECTS.find(x=>x.no===t.dataset.dowaive);
    const r=($('wvR')&&$('wvR').value.trim())||'';
    if(!r){msg('A justification is required');return;}
    d.st='closed'; d.cr=d.cr+' \u00b7 Waived: '+r;
    smClose(); render(); msg(`Defect #${d.no} waived and closed`); return;
  }
  if(t.dataset.stage){S.stage=t.dataset.stage;S.tab='fl';S.subj='all';S.sel.clear();S.fType=S.fStatus='';render();return;}
  if(t.dataset.tab){S.tab=t.dataset.tab;S.sel.clear();S.fType=S.fStatus='';if(S.subj==='deleted')S.subj='all';render();return;}
  if(t.dataset.subj){S.subj=t.dataset.subj;S.sel.clear();
    if((S.subj==='all'||S.subj==='deleted')&&S.tab!=='fl'){S.tab='fl';S.fType=S.fStatus='';}
    render();return;}
  if(t.dataset.chk){const i=t.dataset.chk;S.sel.has(i)?S.sel.delete(i):S.sel.add(i);render();return;}
  if(t.dataset.open){openDt(t.dataset.open);return;}
  if(t.dataset.del1){askDelete([t.dataset.del1]);return;}

  if(t.dataset.act){
    const a=t.dataset.act,n=S.sel.size;
    if(a==='doclist'){openDocList();return;}
    if(a==='toSales'){S.cs='returned';S.role='sales';render();
      msg(`${defOpen()} defect(s) returned to Sales \u00b7 only the documents they name are unlocked`);return;}
    if(a==='toCRA'){S.cs='recheck';S.role='cra';render();
      msg('Case returned to CRA for verification');return;}
    if(a==='done'){S.cs='review';S.role='cra';S.tab='fl';render();
      msg('Re-check complete \u00b7 case back with CRA');return;}
    if(a==='reset'){S.fType=S.fStatus='';render();return;}
    if(a==='refresh'){msg('Refreshed');return;}
    if(a==='del'){askDelete([...S.sel]);return;}
    if(a==='dl'){msg(`${n} file(s) downloaded`);return;}
    if(a==='reassign'){
      sm('Change Subject',
        `<div class="pnote info">Move the selected <b>${n}</b> file(s) to another Subject. Classification confirmations and extraction results are kept.</div>
         <label style="font-size:12px;color:var(--text-2)">Target Subject</label>
         <select class="ant-select" id="tgtSubj" style="width:100%;margin-top:4px">
         ${SUBJ[S.stage].map(s=>`<option value="${s.id}">${s.nm}</option>`).join('')}</select>`,
        `<button class="ant-btn" data-cl="1">Cancel</button><button class="ant-btn ant-btn-primary" data-doreassign="1">Confirm Change</button>`);
      return;
    }
  }

  if(t.dataset.dodel){
    const ids=JSON.parse(t.dataset.dodel);
    const rs=($('delRs')&&$('delRs').value.trim())||'No reason given';
    const at=new Date().toLocaleString('en-GB',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}).replace(',','');
    ids.forEach(i=>{const f=byId(i);if(f)f.del={by:roleNm()+' · '+(S.role==='sales'?'SalesOfficer1':'v_kangyi'),at,rs};});
    S.sel.clear();smClose();render();msg(`${ids.length} file(s) deleted`);return;
  }
  if(t.dataset.doreassign){
    const v=$('tgtSubj').value;let n=0;
    S.sel.forEach(i=>{const f=byId(i);if(f){f.sj=v;n++;}});
    S.sel.clear();smClose();render();msg(`Subject changed for ${n} file(s)`);return;
  }

  if(t.id==='dtBack'){closeDt();return;}
  if(t.id==='dtPrev'||t.id==='dtNext'){
    const L=dtList(),i=L.findIndex(x=>x.id===S.dt),j=t.id==='dtPrev'?i-1:i+1;
    if(L[j]){S.dt=L[j].id;renderDt();}return;
  }
  if(t.id==='dtSave'){msg('Saved');return;}
  if(t.id==='dtSync'){
    sm('OCR Data Sync',
      `<div class="pnote warn">Selecting a checkbox means applying the OCR value to replace the current value.</div>
       <table><tr><th>Field</th><th>Current Value</th><th>OCR Value</th><th>Status</th></tr>
        <tr><td><input type="checkbox"> Customer Name</td><td>FX</td><td>QQQ</td><td style="color:var(--warning-text)">CONFLICT</td></tr>
        <tr><td><input type="checkbox" checked> Address Line 1</td><td>(Empty)</td><td>16 ES TAMAN UDA MURNI</td><td style="color:var(--text-3)">SYNC OK</td></tr>
        <tr><td><input type="checkbox" checked> Postcode</td><td>(Empty)</td><td>16400</td><td style="color:var(--text-3)">SYNC OK</td></tr></table>`,
      `<button class="ant-btn" data-cl="1">Cancel</button><button class="ant-btn ant-btn-primary" data-cl="1" data-tst="Selected fields merged">Merge Selected Fields</button>`);
    return;
  }
  if(t.id==='btnCls'){
    const f=byId(S.dt),sel=$('clsTy');
    f.ty=sel?sel.value:f.ty;f.low=0;f.tyc='';f.cls=1;f.desc='Classification Confirmed';
    if(f.fields.length===1&&f.fields[0].c===0)
      f.fields=f.ty==='MyKad'?[{n:'id_no',v:'900101105123',c:99},{n:'name',v:'TAN WEI MING',c:98},{n:'address',v:'29 JALAN DURIAN, KL',c:95}]
        :[{n:'document_no',v:'—',c:0}];
    msg(`Classification confirmed \u00b7 moved to ${f.ch==='ocr'?'Cross-Validation':'Manual Check'} Results`);
    renderDt();render();return;
  }
  if(t.dataset.al){
    const f=byId(S.dt),a=f.alerts[+t.dataset.i],k=t.dataset.al;
    if(k==='loc'){msg('Image scrolled to the location defined by this rule');return;}
    a.res={pass:'Passed',fail:'Failed \u00b7 returned to Sales',just:'Justification recorded',repl:'Replace Document requested'}[k]+' \u00b7 '+roleNm();
    renderDt();render();return;
  }
  if(t.dataset.mc){
    const r=MC.rules.find(x=>x.id===t.dataset.r), k=t.dataset.mc;
    if(MC.res[r.id]===k) delete MC.res[r.id]; else MC.res[r.id]=k;
    renderDt();render();
    msg(MC.res[r.id]?`${r.id} marked as ${k==='pass'?'Pass':'Fail'}`:`${r.id} cleared`);
    return;
  }
  if(t.id==='btnReval'){
    // FSD 2.8.3 - reruns every rule in the Case. Manual marking stays available
    // throughout; only submission waits, so no stale OCR conclusion gets persisted.
    S.reval=1;renderFooter();msg('Revalidating all files in the Case\u2026');
    setTimeout(()=>{S.reval=0;render();msg('Revalidation complete \u00b7 OCR results refreshed');},2200);
    return;
  }
  if(t.id==='btnSubmit'){
    if(S.stage==='app'&&S.tab==='fl'&&P().up){missing();return;}
    if(S.tab==='fl'){
      if(S.cs==='draft'){S.cs='review';S.role='cra';render();
        msg('Submitted \u00b7 extraction and rule validation started, case now with CRA');return;}
      msg('Classification submitted \u00b7 extraction and rule validation started');return;
    }
    submitRules();return;
  }
  if(t.dataset.gomiss){smClose();S.tab='fl';S.subj='primary';S.fStatus='pending';render();msg('Filtered to files pending classification');return;}
  if(t.dataset.cl){if(t.dataset.tst)msg(t.dataset.tst);smClose();return;}
});

$('subMask').addEventListener('click',e=>{if(e.target===$('subMask'))smClose();});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('subMask').classList.contains('hidden'))smClose();else if(S.dt)closeDt();}
});

$('mClose').innerHTML=I('close');
render();
})();

<script>
(function(){
  "use strict";
  var HERE = 'fc';

  /* Put the cross-prototype switch inside the existing demo bar rather than
     floating it over the page, so it reads as part of the same chrome. */
  var bar = document.querySelector('.demo');
  if (bar) {
    var nav = document.createElement('span');
    nav.className = 'xnav';
    nav.innerHTML =
      '<button data-xnav="wb"' + (HERE === 'wb' ? ' aria-current="true"' : '') + '>CRA Workbench</button>' +
      '<button data-xnav="fc"' + (HERE === 'fc' ? ' aria-current="true"' : '') + '>Document Center</button>';
    var why = bar.querySelector('.why');
    if (why) bar.insertBefore(nav, why); else bar.appendChild(nav);
  }
  if (why0()) why0().textContent = 'Prototype build ' + '2026-09-01';
  function why0(){ return bar && bar.querySelector('.why'); }

  function go(to){ if (to !== HERE) parent.postMessage({ nav: to }, '*'); }

  /* Capture phase, so the prototype's own handler never runs for these -
     otherwise the workbench would toast "Opening File Center" and stay put. */
  document.addEventListener('click', function(e){
    var x = e.target.closest('[data-xnav]');
    if (x) { e.preventDefault(); e.stopPropagation(); go(x.dataset.xnav); return; }
    var t = e.target.closest('#mClose, .file-list-footer-actions .back-btn');
    if (t) { e.preventDefault(); e.stopPropagation(); go('wb'); }
  }, true);
}());
<\/script>

<script>
(function(){
  "use strict";
  var frames = { wb: document.getElementById('fr-wb'), fc: document.getElementById('fr-fc') };
  var loaded = {};

  function source(k){
    // undo the closing-tag escaping applied at build time
    return document.getElementById('src-' + k).textContent.replace(/<\\\/script>/g, '<\/script>');
  }

  function show(k){
    if (!loaded[k]) { frames[k].srcdoc = source(k); loaded[k] = 1; }
    Object.keys(frames).forEach(function(n){ frames[n].hidden = (n !== k); });
    try { history.replaceState(null, '', '#' + k); } catch (e) {}
    var f = frames[k];
    // focus the visible frame so keyboard shortcuts land in the right document
    setTimeout(function(){ try { f.contentWindow.focus(); } catch (e) {} }, 0);
  }

  window.addEventListener('message', function(e){
    var to = e.data && e.data.nav;
    if (to === 'wb' || to === 'fc') show(to);
  });

  var start = (location.hash || '').replace('#', '');
  show(start === 'fc' ? 'fc' : 'wb');
  frames.wb.addEventListener('load', function(){
    var b = document.getElementById('boot'); if (b) b.remove();
  });
}());
</script>
