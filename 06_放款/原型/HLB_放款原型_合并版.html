<script type="text/html" id="src-wb"><!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html{-webkit-text-size-adjust:100%}*{box-sizing:border-box}
body{margin:0;background:#fafafa;font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif}
img{max-width:100%}[hidden]{display:none!important}
button,select,input,textarea{font-size:inherit;line-height:inherit;color:inherit}
.xnav{display:inline-flex;border:1px solid rgba(255,255,255,.22);border-radius:4px;overflow:hidden;margin-left:14px}
.xnav button{background:transparent;border:0;color:rgba(255,255,255,.62);
  padding:3px 11px;font-size:11.5px;cursor:pointer;font-family:inherit;white-space:nowrap}
.xnav button:hover{color:#fff}
.xnav button[aria-current="true"]{background:#1677ff;color:#fff}
</style></head><body>
<title>CRA 工作台原型</title>

<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --primary:#1677ff;--primary-hover:#4096ff;--primary-bg:#e6f4ff;--primary-border:#91caff;--primary-deep:#0958d9;
  --ink:rgba(0,0,0,.88);--ink-2:rgba(0,0,0,.65);--ink-3:rgba(0,0,0,.45);--ink-4:rgba(0,0,0,.25);
  --line:#d9d9d9;--line-2:#f0f0f0;--bg:#fff;--page:#f5f5f5;--alt:#fafafa;
  --ok:#389e0d;--ok-bg:#f6ffed;--ok-line:#b7eb8f;
  --warn:#d48806;--warn-bg:#fffbe6;--warn-line:#ffe58f;
  --err:#cf1322;--err-bg:#fff2f0;--err-line:#ffccc7;
  --r:8px;--r-sm:4px;--r-md:6px;
  --sh:0 1px 2px rgba(16,24,40,.05);
  --sh-lg:0 8px 24px rgba(16,24,40,.12),0 2px 6px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font-family:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--primary);outline-offset:1px}

.btn{height:32px;padding:0 15px;border:1px solid #d6d9de;border-radius:var(--r-md);background:#fff;color:var(--ink);font-size:13.5px;white-space:nowrap;transition:.15s}
.btn:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
.btn:disabled{color:var(--ink-4);background:#f7f8f9;border-color:var(--line)}
.btn-pri{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-pri:hover:not(:disabled){background:var(--primary-hover);border-color:var(--primary-hover);color:#fff}
.btn-pri:disabled{background:#f0f1f3;border-color:var(--line);color:var(--ink-4)}
.btn-sm{height:26px;padding:0 10px;font-size:12.5px}
.btn-txt{border-color:transparent;background:transparent;color:var(--primary);padding:0 6px;height:auto}
.i{width:16px;height:16px;flex:none;display:inline-block;vertical-align:-3px}
.tag{display:inline-block;height:22px;padding:0 8px;font-size:12px;line-height:20px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--alt);color:var(--ink-2);white-space:nowrap}
.tag-ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.tag-warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.tag-err{background:var(--err-bg);border-color:var(--err-line);color:var(--err)}
.tag-blue{background:var(--primary-bg);border-color:var(--primary-border);color:var(--primary-deep)}

.demo{position:fixed;top:0;left:0;right:0;height:34px;z-index:300;background:#0d1424;color:rgba(255,255,255,.8);padding:6px 16px;display:flex;gap:11px;align-items:center;font-size:11.5px}
.demo .lb{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:rgba(255,255,255,.4);text-transform:uppercase}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.18);border-radius:var(--r-sm);overflow:hidden}
.seg button{background:transparent;border:0;color:rgba(255,255,255,.65);padding:2px 12px;font-size:11.5px}
.seg button[aria-pressed="true"]{background:var(--primary);color:#fff}
.demo .why{margin-left:auto;color:rgba(255,255,255,.3);font-size:10.5px}

.app{position:fixed;top:34px;left:0;right:0;bottom:0;display:flex;flex-direction:column;background:var(--page)}
.topbar{height:52px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:0;padding:0 20px 0 0;flex:none}
.brand{width:76px;display:flex;align-items:center;justify-content:center;color:var(--primary)}
.brand .i{width:20px;height:20px}
.tbtn{height:34px;display:flex;align-items:center;padding:0 16px;font-size:13.5px;color:var(--ink-2);border-radius:var(--r-md);margin-right:6px}
.tbtn.on{background:var(--primary-bg);color:var(--primary-deep);font-weight:500}
.topbar .who{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:13px;color:var(--ink-2)}
.topbar .who .clk{font-variant-numeric:tabular-nums;color:var(--ink)}
.topbar .rf{width:34px;height:34px;border:1px solid var(--line);border-radius:var(--r-md);background:#fff;color:var(--ink-3);font-size:15px}
.topbar .tb-sync{height:30px;display:inline-flex;align-items:center;gap:7px}
.topbar .tb-sync .i{width:14px;height:14px}

.body{flex:1;min-height:0;display:grid;grid-template-columns:76px 268px minmax(0,1fr) 300px}
@media(max-width:1400px){.body{grid-template-columns:76px 240px minmax(0,1fr) 268px}}
@media(max-width:1100px){.body{grid-template-columns:76px minmax(0,1fr)}.rail,.side{display:none}}

.icons{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:6px}
.icons i{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--ink-4);border-radius:var(--r-md)}
.icons i .i{width:18px;height:18px}
.icons i:hover{background:var(--alt);color:var(--ink-2)}
.icons i.on{color:var(--primary);background:var(--primary-bg)}
.icons .sp{flex:1}

.rail{padding:14px 12px;overflow-y:auto}
.navcard{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:14px 0 10px;margin-bottom:12px}
.navcard .nh{display:flex;align-items:center;gap:10px;padding:0 16px 12px;font-size:15px;font-weight:600;color:var(--ink)}
.navcard h6{margin:12px 16px 4px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.navcard button{display:flex;width:100%;text-align:left;background:transparent;border:0;border-left:3px solid transparent;padding:6px 16px 6px 20px;font-size:13px;color:var(--ink-2);align-items:center;gap:8px}
.navcard button:hover{background:var(--alt);color:var(--ink)}
.navcard button.on{background:var(--primary-bg);border-left-color:var(--primary);color:var(--primary-deep);font-weight:500}
.navcard .n{margin-left:auto;font-family:var(--mono);font-size:10.5px;padding:0 6px;border-radius:9px;background:var(--line-2);color:var(--ink-2);flex:none}
.navcard .n.err{background:var(--err);color:#fff}
.navcard .n.ok{background:var(--ok-bg);color:var(--ok)}
.linkcard{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.linkcard a{font-size:13.5px;color:var(--primary);cursor:pointer}
.linkcard a.off{color:var(--ink-4);cursor:default}

.main{overflow-y:auto;padding:16px 18px 24px;scroll-behavior:smooth}
.seclabel{font-size:12px;font-weight:600;color:var(--ink-3);letter-spacing:.09em;text-transform:uppercase;margin:20px 0 10px 6px}
.seclabel:first-child{margin-top:2px}

.mod{background:#fff;border-radius:var(--r);box-shadow:var(--sh);margin-bottom:12px;overflow:hidden;scroll-margin-top:12px}
.mod-h{display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;border:0;background:#fff;padding:14px 18px;text-align:left;cursor:pointer;user-select:none}
.mod-h:hover{background:var(--alt)}
.mod-h .car{color:var(--ink-3);width:14px;flex:none;display:flex}
.mod-h .car .i{width:14px;height:14px}
.mod-h .mi{color:var(--primary);flex:none;display:flex}
.mod-h .mt{font-size:15.5px;font-weight:600;color:var(--ink)}
.mod-h .mr{margin-left:auto;display:flex;gap:10px;align-items:center;flex:none}
.mod-h .badge{font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:9px}
.mod-h .badge.err{background:var(--err-bg);color:var(--err);border:1px solid var(--err-line)}
.mod-h .badge.ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line)}
.mod-h .new{font-size:9.5px;font-family:var(--mono);background:var(--primary-bg);color:var(--primary-deep);border:1px solid var(--primary-border);padding:0 5px;border-radius:3px;letter-spacing:.04em}
.mod-b{border-top:1px solid var(--line-2);padding:16px 18px 18px}
.mod.stub .mod-h{color:var(--ink-2)}

.tot{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.tot .t{font-size:14px;color:var(--ink-2)}
.tot .t b{color:var(--primary);font-weight:600}
.tot .r{margin-left:auto;display:flex;gap:8px}

table{border-collapse:collapse;width:100%}
th{background:var(--alt);text-align:left;font-size:12.5px;font-weight:600;color:var(--ink-2);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line-2);font-size:13px;vertical-align:middle;color:var(--ink-2)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--alt)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md)}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--ink-3);font-size:12.5px}
.sub-row{color:var(--ink-3);font-size:11px}
.nodata{padding:44px;text-align:center;color:var(--ink-4);font-size:13px;
  display:flex;flex-direction:column;align-items:center;gap:8px}
.nodata .i{width:28px;height:28px;opacity:.5;stroke-width:1.1}

/* Verification Summary */
.vs-top{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px}
.vs-top .st{font-size:15px;font-weight:600}
.vs-top .st.ok{color:var(--ok)}.vs-top .st.warn{color:var(--warn)}.vs-top .st.wait{color:var(--primary-deep)}
.vs-top .sd{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.vs-top .r{margin-left:auto;display:flex;gap:8px;align-items:center;flex:none}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}
@media(max-width:1250px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kp{border:1px solid var(--line);border-radius:var(--r-md);padding:11px 13px;background:var(--alt)}
.kp .v{font-family:var(--mono);font-size:21px;font-weight:600;line-height:1.1;color:var(--ink)}
.kp .v.ok{color:var(--ok)}.kp .v.err{color:var(--err)}
.kp .k{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.kp .ks{display:block;font-size:10.5px;color:var(--warn);font-family:var(--mono);margin-top:2px}
.rrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:8px}
.rrow:last-child{margin-bottom:0}
.rrow .n{flex:1;min-width:0;font-size:13px}
.rrow .s{display:block;font-size:11.5px;color:var(--ink-3);margin-top:1px}
.rrow .r{flex:none;display:flex;gap:8px;align-items:center}
.batchbar{display:flex;align-items:center;gap:12px;padding:9px 12px;margin-top:12px;background:var(--warn-bg);
  border:1px solid var(--warn-line);border-radius:var(--r-md);font-size:12.5px;color:var(--warn)}
.batchbar button{margin-left:auto}

/* File Check List */
.chk-h{font-size:14px;color:var(--ink-2);margin-bottom:14px}
.chk-h b{color:var(--ink);font-weight:600}
.chk-grp{font-size:13.5px;font-weight:600;color:var(--ink);margin:16px 0 10px}
.chk-grp:first-of-type{margin-top:0}
.chk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 18px}
@media(max-width:1250px){.chk-grid{grid-template-columns:repeat(2,1fr)}}
.ck{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.ck .bx{width:16px;height:16px;border:1px solid #c9ced6;border-radius:3px;flex:none;margin-top:2px;
  display:flex;align-items:center;justify-content:center;font-size:11px;background:#fff}
.ck.on .bx{background:var(--primary);border-color:var(--primary);color:#fff}
.ck.on{color:var(--ink)}
.ck.auto .bx{background:var(--ok);border-color:var(--ok);color:#fff}
.ck.dis{opacity:.55;cursor:not-allowed}

/* Data Maintenance fields */
.fgrp{font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.04em;text-transform:uppercase;margin:4px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.fgrp+.fgrid{margin-bottom:18px}
.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 22px}
@media(max-width:1250px){.fgrid{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:12.5px;color:var(--ink-2)}
.fld .req{color:var(--err);margin-left:3px}
.fin{height:32px;border:1px solid #d6d9de;border-radius:var(--r-md);padding:0 11px;font-size:13px;background:#fff;color:var(--ink);width:100%}
.fin:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 2px rgba(22,119,255,.08)}
.fin.bad{border-color:var(--err);background:var(--err-bg)}
.fin::placeholder{color:var(--ink-4)}
.fhint{font-size:11px;color:var(--ink-3);font-family:var(--mono)}
.fhint.diff{color:var(--warn)}

/* side panel */
.side{padding:14px 12px 14px 0;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.sc{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.sc .sh{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600;margin-bottom:12px}
.sc .cnt{font-family:var(--mono);font-size:12px;padding:1px 8px;border-radius:9px;background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line)}
.fl{display:flex;gap:9px;align-items:center;padding:5px 0;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.fl .bx{width:16px;height:16px;border:1px solid #c9ced6;border-radius:3px;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;background:#fff}
.fl.on .bx{background:var(--primary);border-color:var(--primary);color:#fff}
.fl.on{color:var(--ink);font-weight:500}
.yn{display:flex;align-items:center;justify-content:space-between;padding:8px 0;font-size:13.5px;color:var(--ink-2)}
.ynseg{display:inline-flex;background:#f0f1f3;border-radius:var(--r-md);padding:2px}
.ynseg button{border:0;background:transparent;font-size:12.5px;padding:3px 14px;border-radius:var(--r-sm);color:var(--ink-3)}
.ynseg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:var(--sh);font-weight:500}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:5px 0}
.kv .k{color:var(--ink-3);flex:none}
.kv .v{text-align:right;color:var(--ink);font-weight:500}
.sdiv{height:1px;background:var(--line-2);margin:10px 0}

.foot{height:58px;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 20px;flex:none}
.foot select{height:32px;border:1px solid #d6d9de;border-radius:var(--r-md);padding:0 8px;font-size:13px;color:var(--ink-2);background:#fff}
.foot .r{margin-left:auto;display:flex;gap:10px}
.foot .fn{font-size:12.5px;color:var(--ink-3)}

.mask{position:fixed;top:34px;left:0;right:0;bottom:0;background:rgba(15,20,30,.45);z-index:400;display:flex;align-items:center;justify-content:center;padding:24px}
.mask.hidden{display:none}
.modal{background:#fff;border-radius:10px;width:min(880px,100%);max-height:88vh;display:flex;flex-direction:column;box-shadow:var(--sh-lg)}
.modal.sm{width:min(560px,100%)}
.modal .mh{padding:18px 26px 14px;font-size:19px;font-weight:600;display:flex;align-items:flex-start}
.modal .mh .x{margin-left:auto;border:0;background:transparent;font-size:18px;color:var(--ink-3);line-height:1;padding:2px 4px}
.modal .msub{padding:0 26px;font-size:13px;color:var(--ink-2);margin-top:-8px}
.modal .mwarn{padding:6px 26px 0;font-size:12.5px;color:#c0392b}
.modal .mb{padding:16px 26px;overflow:auto}
.modal .mf{padding:14px 26px 18px;display:flex;gap:10px;justify-content:flex-end;align-items:center}
.modal .mf .lf{margin-right:auto;font-size:12.5px;color:var(--ink-3)}

/* OCR Data Sync */
.sync-g{font-size:15px;font-weight:600;margin:18px 0 8px}
.sync-g:first-child{margin-top:0}
.syn{width:100%;min-width:600px;border-collapse:separate;border-spacing:0}
.syn th{background:#eef4ff;font-size:12.5px;color:var(--ink-2);padding:11px 14px;border:0;font-weight:500}
.syn td{padding:10px 14px;border:0;border-top:1px solid var(--line-2);font-size:13px}
.syn tr.sel td{background:#eaf2ff}
.syn tr.na td{opacity:.5}
.syn .st{font-size:11.5px;font-family:var(--mono);color:var(--ink-3);letter-spacing:.03em}
.syn .st.cf{color:var(--warn)}
.bx{width:17px;height:17px;border:1px solid #c9ced6;border-radius:3px;display:inline-flex;align-items:center;
  justify-content:center;font-size:11px;background:#fff;cursor:pointer;vertical-align:middle}
.bx.on{background:var(--primary);border-color:var(--primary);color:#fff}
.bx.dis{background:#f2f3f5;cursor:not-allowed;border-style:dashed}
.emptyv{color:var(--ink-4);font-style:italic}

/* Add Defect */
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px 26px}
@media(max-width:640px){.dgrid{grid-template-columns:1fr}}
.dfield label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:6px}
.dfield .req{color:var(--err)}
.dsel,.ddate{width:100%;height:36px;border:1px solid #d6d9de;border-radius:var(--r-md);padding:0 11px;font-size:13.5px;background:#fff;color:var(--ink)}
.ddate:disabled{background:#f4f5f7;color:var(--ink-3)}
.dchk{display:flex;gap:9px;align-items:center;font-size:13.5px;color:var(--ink-2);cursor:pointer;height:36px}
.dta{width:100%;min-height:110px;border:1px solid #d6d9de;border-radius:var(--r-md);padding:10px 12px;font-size:13.5px;resize:vertical}
.dcount{text-align:right;font-size:12px;color:var(--ink-3);margin-top:4px}
.dfull{grid-column:1/-1}

/* File Center rule modal */
.fcx .mh{background:#f2f7ff;border-radius:10px 10px 0 0}
.fcb{font-family:var(--mono);font-size:10px;letter-spacing:.06em;background:var(--primary);color:#fff;
  padding:2px 7px;border-radius:3px;margin-right:10px;vertical-align:middle;font-weight:400}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid #d6d9de;border-radius:var(--r-md);
  padding:13px 15px;cursor:pointer;background:#fff;margin-bottom:10px}
.opt:hover{border-color:var(--primary)}

const usedJust=()=>RULES.filter(r=>r.act==='just').length;
const rulesOK=()=>rFail().length===0&&rPend().length===0;
const hasDefect=r=>DEFECTS.some(d=>d.rule===r.id);
// FSD 3.11.3 Step 3 - a defect counts as resolved only once rectified and verified
const openDefects=()=>DEFECTS.filter(d=>!(d.rect&&d.ver)).length;
const unlinked=()=>rFail().filter(r=>!hasDefect(r));

function fState(f){const s=(f.sys||'').trim(),o=(f.ocr||'').trim();
  if(!o)return 'noocr'; if(!s)return 'fill'; return s===o?'same':'diff';}
const fMissing=()=>FIELDS.filter(f=>f.req&&!(f.sys||'').trim());
const fFilled=()=>FIELDS.filter(f=>(f.sys||'').trim()).length;
const ckOn=()=>CHECK.filter(c=>c.on).length;
const ckMand=()=>CHECK.filter(c=>c.g==='Mandatory');
const ckMandOn=()=>ckMand().filter(c=>c.on).length;
const craDone=()=>!!(FLAGS.find(f=>f.k==='CRA Completed')||{}).on;
// FSD 3.11.2 - Next is never hard-blocked by unresolved defects or unconfirmed
// rules. The only gate is the BAU "CRA Completed" indicator.
const canNext=()=>craDone();

function pullRules(){
  const n=rPend().length; rPend().forEach(r=>{r.pass=1;r.st='';});
  S.pullAt=new Date().toTimeString().slice(0,5);
  return n?`${n} rule(s) re-extracted, conclusion updated`:'No change in rule conclusions';
}
// FSD 3.9.7 method 3: aligns System-source defects with the latest rule results.
// Creates the missing ones, drops System ones whose rule now passes, never touches User ones.
function syncSystemDefects(){
  const gone=DEFECTS.filter(d=>d.src==='System'&&d.rule&&!rFail().some(r=>r.id===d.rule));
  gone.forEach(d=>DEFECTS.splice(DEFECTS.indexOf(d),1));
  const made=unlinked().map(r=>mkDefect(r,'System')).filter(Boolean);
  return {added:made.length,removed:gone.length,changed:made.length>0||gone.length>0};
}
function mkDefect(r,src){
  if(hasDefect(r))return null;
  S.dseq++;
  DEFECTS.push({no:String(S.dseq),rule:r.id,code:r.dc,cat:r.dcat,type:r.dty,file:r.file,
    sr:'',cr:r.issue||r.nm,src:src||'System',rect:0,ver:0,cd:'30-08-2026 09:02:31'});
  return S.dseq;
}
// FSD 4.1.2 - four ordered gates. Gate 1 routes to manual maintenance;
// gates 2-4 route to the Authorizer. The distinction matters: they are not
// the same destination, so the prototype must not collapse them into one.
function eligibility(){
  const fo=FLAGS.filter(f=>f.on&&f.stp);
  const g1=[  // FSD 4.1.1 a-h, the scenario restrictions
    {ok:1,nm:'Individual customer',d:''},
    {ok:1,nm:'New car',d:''},
    {ok:1,nm:'Single beneficiary, matching the dealer record',d:''},
    {ok:1,nm:'No payoff',d:''},
    {ok:!fo.length,nm:'No non-standard case flag',d:fo.map(f=>f.k).join(', ')},
    {ok:!!S.noGtee,nm:'No guarantor',d:'Guarantor LIM AH KOW present'},
    {ok:1,nm:'Not a floor-stock dealer',d:''},
    {ok:AGE_DAYS<=AGE_CAP,nm:`Within ${AGE_CAP} days of first approval`,d:`${AGE_DAYS} days`}
  ];
  const g2=[
    {ok:ckMandOn()===ckMand().length,nm:'All mandatory documents checked',
     d:`${ckMand().length-ckMandOn()} unchecked`},
    {ok:fMissing().length===0,nm:'All required information captured',
     d:`${fMissing().length} field(s) empty`}
  ];
  const g3=[{ok:openDefects()===0,nm:'No unresolved defect',d:`${openDefects()} unresolved`}];
  const g4=[{ok:!!S.stpSwitch,nm:'STP switch is ON',d:'Switch is OFF'}];
  const gates=[
    {n:1,label:'Application scenario suitable for STP',items:g1,route:'maint'},
    {n:2,label:'Mandatory files and information obtained',items:g2,route:'auth'},
    {n:3,label:'Unresolved defects at zero',items:g3,route:'auth'},
    {n:4,label:'STP switch',items:g4,route:'auth'}
  ];
  const failed=gates.find(g=>!g.items.every(i=>i.ok));
  const items=gates.flatMap(g=>g.items);
  return {gates,items,ok:!failed,failed:failed||null,
          route:failed?failed.route:'stp',
          blockers:failed?failed.items.filter(i=>!i.ok):[]};
}

/* OCR Data Sync */
const syncable=f=>fState(f)!=='noocr';
function openSync(){
  FIELDS.forEach(f=>{if(S.sync.sel[f.k]===undefined){const st=fState(f);S.sync.sel[f.k]=(st==='same'||st==='fill')?1:0;}});
  S.dlg='sync'; openM('','OCR Data Sync','Comparing manual entry with detected document data.',
    'Selecting a checkbox means applying the OCR value to replace the current manual value.');
  drawSync();
}
function drawSync(){
  const grps=[...new Set(FIELDS.map(f=>f.g))];
  let h='';
  grps.forEach(g=>{
    const gf=FIELDS.filter(f=>f.g===g&&syncable(f));
    const all=gf.length&&gf.every(f=>S.sync.sel[f.k]);
    h+=`<div class="sync-g">${g}</div><div class="tw" style="border:0"><table class="syn">
      <thead><tr><th style="width:44px"><span class="bx ${all?'on':''}" data-gsel="${esc(g)}">${all?'✓':''}</span></th>
        <th style="width:210px">Field Name</th><th style="width:200px">Current (Manual)</th>
        <th>OCR Value</th><th style="width:100px;text-align:right">Status</th></tr></thead><tbody>`;
    FIELDS.filter(f=>f.g===g).forEach(f=>{
      const st=fState(f),on=!!S.sync.sel[f.k];
      if(st==='noocr'){
        h+=`<tr class="na"><td><span class="bx dis"></span></td><td>${esc(f.k)}</td>
          <td>${(f.sys||'').trim()?esc(f.sys):'<span class="emptyv">(Empty)</span>'}</td>
          <td><span class="emptyv">—</span></td><td style="text-align:right"><span class="st">NO OCR</span></td></tr>`;
      }else{
        h+=`<tr class="${on?'sel':''}"><td><span class="bx ${on?'on':''}" data-sel="${esc(f.k)}">${on?'✓':''}</span></td>
          <td>${esc(f.k)}</td>
          <td>${(f.sys||'').trim()?esc(f.sys):'<span class="emptyv">(Empty)</span>'}</td>
          <td>${esc(f.ocr)}</td>
          <td style="text-align:right"><span class="st ${st==='diff'?'cf':''}">${st==='diff'?'CONFLICT':'SYNC OK'}</span></td></tr>`;
      }
    });
    h+='</tbody></table></div>';
  });
  const n=FIELDS.filter(f=>syncable(f)&&S.sync.sel[f.k]).length;
  $('mB').innerHTML=h;
  $('mF').innerHTML=`<span class="lf">${n} field(s) selected</span>
    <button class="btn" data-act="mx">Cancel</button>
    <button class="btn btn-pri" data-act="dosync">Apply</button>`;
}
function doSync(){
  let n=0; FIELDS.forEach(f=>{if(syncable(f)&&S.sync.sel[f.k]&&(f.ocr||'').trim()){f.sys=f.ocr;n++;}});
  closeM();render();toast(`${n} field(s) updated from OCR`);
}

      <input class="ddate" value="30-08-2026 09:02:31" disabled></div>
    <div class="dfield dfull"><label>Sales Remark</label>
      <textarea class="dta" id="aSr" maxlength="500" placeholder="Enter Sales Remark">${esc(a.sr)}</textarea>
      <div class="dcount"><span id="aSrN">${a.sr.length}</span> / 500</div></div>
    <div class="dfield dfull"><label>CRA Remark</label>
      <textarea class="dta" id="aCr" maxlength="500" placeholder="Enter CRA Remark">${esc(a.cr)}</textarea>
      <div class="dcount"><span id="aCrN">${a.cr.length}</span> / 500</div></div>
  </div>`;
  $('mF').innerHTML=`<button class="btn" data-act="mx">Cancel</button>
    <button class="btn btn-pri" data-act="doadd">OK</button>`;
}
function doAdd(){
  const cat=$('aCat').value, ty=$('aTy').value;
  if(!cat||!ty){toast('Defect Category and Type are required');return;}
  S.dseq++;
  DEFECTS.push({no:String(S.dseq),rule:'',code:'—',cat,type:ty,file:'—',
    sr:$('aSr').value.trim(),cr:$('aCr').value.trim(),src:'User',
    rect:S.addDef.rect?1:0,ver:S.addDef.ver?1:0,cd:'30-08-2026 09:02:31'});
  closeM();S.open.def=1;render();toast('Defect #'+S.dseq+' created (Source: User)');
}

/* File Center rule handling */
function openFix(id){
  const r=RULES.find(x=>x.id===id); if(!r) return;
  S.dlg={id,pick:null,who:'self',note:'',bad:0};
  openM('fcx','<span class="fcb">FILE CENTER</span>Rule Handling'); drawFix();
}
function drawFix(){
  const d=S.dlg,r=RULES.find(x=>x.id===d.id);
  $('modal').className='modal fcx';
  $('mB').innerHTML=`<div class="pre"><span class="lb">RULE</span><b class="mono">${r.id}</b> ${esc(r.nm)}
      <div class="muted" style="margin-top:3px">${esc(r.file)}</div></div>
    ${r.issue?`<div class="pre"><span class="lb">REASON</span>${esc(r.issue)}</div>`:''}
    <div class="opt ${d.pick==='amend'?'on':''}" data-pick="amend"><span class="rb"></span>
      <span><span class="on2">Amend the OCR result</span>
        ${d.pick==='amend'?`<div class="sub2">
          <div class="dfield"><label>Corrected value <span class="req">*</span></label>
          <input class="fin" id="mAmend" value="${esc(d.note)}" placeholder="Enter the value read from the document"></div>
        </div>`:''}</span></div>
    <div class="opt ${d.pick==='file'?'on':''}" data-pick="file"><span class="rb"></span>
      <span><span class="on2">Replace document</span>
        ${d.pick==='file'?`<div class="sub2">
          <label><input type="radio" name="who" ${d.who==='self'?'checked':''} data-who="self"><span>CRA replaces it now</span></label>
          <label><input type="radio" name="who" ${d.who==='sales'?'checked':''} data-who="sales"><span>Return to Sales to replace</span></label>
        </div>`:''}</span></div>
    <div class="opt ${d.pick==='just'?'on':''}" data-pick="just"><span class="rb"></span>
      <span><span class="on2">Justification</span></span></div>
    ${(d.pick==='just'||(d.pick==='file'&&d.who==='sales'))
      ? `<div class="dfield" style="margin-top:12px"><label>${d.pick==='just'?'Justification reason':'Note to Sales'} <span class="req">*</span></label>
         <textarea class="dta" id="mNote" style="min-height:80px;border-color:${d.bad?'var(--err)':'#d6d9de'}">${esc(d.note)}</textarea></div>`:''}`;
  $('mF').innerHTML=`<button class="btn" data-act="mx">Cancel</button>
    <button class="btn btn-pri" ${d.pick?'':'disabled'} data-act="dofix">Confirm</button>`;
}
function doFix(){
  const d=S.dlg,r=RULES.find(x=>x.id===d.id);
  const ta=$('mNote'); if(ta)d.note=ta.value.trim();
  const am=$('mAmend'); if(am)d.note=am.value.trim();
  const needsNote = d.pick==='just' || d.pick==='amend' || (d.pick==='file'&&d.who==='sales');
  if(needsNote&&!d.note){d.bad=1;drawFix();toast(d.pick==='amend'?'Enter the corrected value':'A note is required');return;}
  // FSD 3.9.5 - all three methods count as rectification; the rule becomes Passed.
  if(d.pick==='amend'){r.pass=1;r.act='amend';toast('Value amended — rule re-evaluated as passed');}
  else if(d.pick==='just'){r.pass=1;r.act='just';toast('Justified — rule marked as passed');}
  else{r.st='pending';r.act='file';
    toast(d.who==='self'?'Document replaced — re-extraction in progress':'Returned to Sales for replacement');}
  closeM();render();
  if(r.pass&&DEFECTS.some(x=>x.rule===r.id&&x.src==='System'))
    setTimeout(()=>toast('Its System defect can now be cleared via Sync System Defects'),1500);
}

/* Next */
function openNext(){
  S.dlg='next';S.phase='check';S.route=null;
  openM('sm','Submit'); drawNext();
  setTimeout(()=>{ if(S.dlg!=='next')return;
    const ul=unlinked();
    if(ul.length){S.phase='warn';S.blocks=ul;drawNext();return;}
    goSave();},700);
}
function goSave(){
  S.phase='save';drawNext();
  setTimeout(()=>{ if(S.dlg!=='next')return;
    const e=eligibility();
    S.route={ok:e.ok,route:e.route,gate:e.failed,
             reasons:e.blockers.map(i=>i.nm+(i.d?' — '+i.d:''))};
    S.phase='done';drawNext();},700);
}
function drawNext(){
  $('modal').className='modal';
  const step=n=>`<div class="steps">${['1 Pre-submit check','2 Save','3 STP eligibility','4 Route']
    .map((s,i)=>i+1<=n?`<b>${s}</b>`:s).join('  ·  ')}</div>`;
  if(S.phase==='check'||S.phase==='save'){
    const sv=S.phase==='save';
    $('mB').innerHTML=`<div class="run"><div class="spin"></div>
      <div><div class="t">${sv?'Saving and evaluating STP eligibility…':'Checking rules against defect records…'}</div>
      <div class="d">${sv?'Maintenance content saved, then eligibility rules run':'Comparing via the rule–defect mapping'}</div></div></div>${step(sv?2:1)}`;
    $('mF').innerHTML=''; return;
  }
  if(S.phase==='warn'){
    $('mB').innerHTML=`<div class="route warn">${I('alert')}
      <span><div class="t">${S.blocks.length} rule(s) not passed without a defect record</div>
      <div class="d">Registering them as defects is your call — this check does not block submission.</div></span></div>
      <div class="rsn"><div class="l">UNLINKED RULES</div>
        ${S.blocks.map(r=>`<div class="ri"><b class="mono">${r.id}</b><span>${esc(r.nm)} — ${esc(r.dc)}</span></div>`).join('')}</div>${step(1)}`;
    $('mF').innerHTML=`<button class="btn" data-act="backfix">Go back</button>
      <button class="btn" data-act="warndef">Create all and continue</button>
      <button class="btn btn-pri" data-act="anyway">Submit anyway</button>`;
    return;
  }
  const r=S.route;
  if(!r.ok && r.route==='maint'){
    $('mB').innerHTML=`<div class="route auth">${I('exchange')}<span>
        <div class="t">Not an STP scenario</div>
        <div class="d">Gate 1 of 4 did not pass, so the Case goes to Disbursement Information
          Maintenance for manual handling — it does <b>not</b> go to the Authorizer.</div></span></div>
      <div class="rsn"><div class="l">GATE 1 · APPLICATION SCENARIO</div>
        ${r.reasons.map(x=>`<div class="ri"><span>${esc(x)}</span></div>`).join('')}</div>
      <div class="flow"><span class="a">ROUTE</span>CRA ${I('arrowRight')} <b>Disbursement Information Maintenance</b></div>`+step(4);
    $('mF').innerHTML=`<button class="btn btn-pri" data-act="confirm">Got it</button>`;
    return;
  }
  $('mB').innerHTML=(r.ok
    ? `<div class="route stp">${I('bolt')}<span><div class="t">Eligible for STP</div>
       <div class="d">Authorizer is skipped. Submitting triggers the disbursement interface directly.</div></span></div>
       <div class="flow"><span class="a">ROUTE</span>CRA ${I('arrowRight')} <b>Disbursement Interface</b></div>`
    : `<div class="route auth">${I('exchange')}<span><div class="t">Routed to Authorizer</div>
       <div class="d">Gate ${r.gate?r.gate.n:''} of 4 did not pass: ${r.gate?esc(r.gate.label):''}.</div>
       <div class="d">This case is not eligible for STP and needs manual authorisation.</div></span></div>
       <div class="rsn"><div class="l">NOT ELIGIBLE BECAUSE</div>
         ${r.reasons.map(x=>`<div class="ri"><span>${esc(x)}</span></div>`).join('')}</div>
       <div class="flow"><span class="a">ROUTE</span>CRA ${I('arrowRight')} <b>Authorizer</b> ${I('arrowRight')} Disbursement Interface</div>`)+step(4);
  $('mF').innerHTML=`<button class="btn" data-act="mx">Back</button>
    <button class="btn btn-pri" data-act="confirm">${r.ok?'Confirm Disbursement':'Confirm Submit'}</button>`;
}

function toast(t){const m=$('msg');m.querySelector('span').textContent=t;m.classList.add('on');
  clearTimeout(m._t);m._t=setTimeout(()=>m.classList.remove('on'),2300);}

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='aSr'){S.addDef.sr=t.value;$('aSrN').textContent=t.value.length;}
  if(t.id==='aCr'){S.addDef.cr=t.value;$('aCrN').textContent=t.value.length;}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.fld){
    const f=FIELDS.find(x=>x.k===t.dataset.fld); if(!f)return;
    f.sys=t.value.trim(); renderRail(); renderFoot();
    t.classList.toggle('bad',!!(f.req&&!f.sys)); return;
  }
});
document.addEventListener('click',e=>{
  const t=e.target.closest('button,a,label,[data-sel],[data-gsel],[data-who],[data-pick],[data-tog]');
  if(!t) return;
  if(t.dataset.who){S.dlg.who=t.dataset.who;S.dlg.bad=0;drawFix();return;}
  if(t.dataset.sw!==undefined){S.stpSwitch=t.dataset.sw==='1';render();return;}
  if(t.dataset.scn){S.scn=t.dataset.scn;reset(t.dataset.scn);render();return;}
  if(t.dataset.go){const k=t.dataset.go;S.nav=k;S.open[k]=1;render();
    const el=$('m-'+k); if(el)el.scrollIntoView({block:'start'}); return;}
  if(t.dataset.tog){const k=t.dataset.tog;S.open[k]=!S.open[k];S.nav=k;render();return;}
  if(t.dataset.link==='fc'){toast('Opening File Center');return;}
  if(t.dataset.act==='expand'){S.expand=!S.expand;render();return;}
  if(t.dataset.flag!==undefined){FLAGS[+t.dataset.flag].on=FLAGS[+t.dataset.flag].on?0:1;renderSide();renderFoot();return;}
  if(t.dataset.yn){const[k,v]=t.dataset.yn.split('|');S[k]=v;renderSide();return;}
  if(t.dataset.ck){const c=CHECK.find(x=>x.k===t.dataset.ck);c.on=c.on?0:1;render();return;}

  if(t.dataset.act==='refresh'){
    if(S.busy)return; S.busy=1;renderMain();
    setTimeout(()=>{S.busy=0;const m=pullRules();render();toast(m);},800); return;
  }
  if(t.dataset.mkdef){const r=RULES.find(x=>x.id===t.dataset.mkdef);const n=mkDefect(r,'System');
    render();toast(n?'Defect #'+n+' created':'This rule already has a defect');return;}
  if(t.dataset.act==='defall'){const m=unlinked().map(r=>mkDefect(r,'System')).filter(Boolean);
    render();toast(m.length+' defect(s) created');return;}
  if(t.dataset.act==='syncdef'){const r=syncSystemDefects();render();
    toast(r.changed?`${r.added} created, ${r.removed} removed · User-source defects untouched`
                   :'System defects already aligned');return;}
  if(t.dataset.act==='adddef'){openAdd();return;}
  if(t.dataset.atg){S.addDef[t.dataset.atg]=S.addDef[t.dataset.atg]?0:1;
    S.addDef.sr=$('aSr').value;S.addDef.cr=$('aCr').value;
    S.addDef.cat=$('aCat').value;S.addDef.ty=$('aTy').value;drawAdd();return;}
  if(t.dataset.act==='doadd'){doAdd();return;}
  if(t.dataset.rect){DEFECTS.find(x=>x.no===t.dataset.rect).rect=1;render();toast('Marked as rectified');return;}
  if(t.dataset.ver){DEFECTS.find(x=>x.no===t.dataset.ver).ver=1;render();toast('Verified');return;}

  if(t.dataset.fix){openFix(t.dataset.fix);return;}
  if(t.dataset.pick){S.dlg.pick=t.dataset.pick;S.dlg.bad=0;
    const ta=$('mNote'); if(ta)S.dlg.note=ta.value; drawFix();return;}
  if(t.dataset.act==='dofix'){doFix();return;}

  if(t.dataset.act==='sync'){openSync();return;}
  if(t.dataset.sel){S.sync.sel[t.dataset.sel]=!S.sync.sel[t.dataset.sel];drawSync();return;}
  if(t.dataset.gsel){const g=t.dataset.gsel,gf=FIELDS.filter(f=>f.g===g&&syncable(f));
    const all=gf.every(f=>S.sync.sel[f.k]); gf.forEach(f=>S.sync.sel[f.k]=all?0:1); drawSync();return;}
  if(t.dataset.act==='dosync'){doSync();return;}

  if(t.dataset.act==='next'){openNext();return;}
  if(t.dataset.act==='backfix'){closeM();S.open.vsum=1;S.expand=1;render();
    const el=$('m-vsum'); if(el)el.scrollIntoView({block:'start'}); return;}
  if(t.dataset.act==='warndef'){S.blocks.forEach(r=>mkDefect(r,'System'));renderRail();goSave();return;}
  if(t.dataset.act==='anyway'){goSave();return;}
  if(t.dataset.act==='confirm'){const ok=S.route.ok;closeM();render();
    toast(ok?'Disbursement interface triggered':'Submitted to Authorizer');return;}
  if(t.dataset.act==='mx'){closeM();renderFoot();return;}
});

  $('syncIc').innerHTML=I('sync');
  $('rfBtn').innerHTML=I('refresh');
  const rail=['grid','fileText','table','list','chart','checkSquare','book','docs'];
  $('iconRail').innerHTML=rail.map((n,i)=>`<i class="${i===0?'on':''}">${I(n)}</i>`).join('')

}

<script>
(function(){
  "use strict";
  var HERE = 'wb';

  /* Put the cross-prototype switch inside the existing demo bar rather than
     floating it over the page, so it reads as part of the same chrome. */
  var bar = document.querySelector('.demo');
  if (bar) {
    var nav = document.createElement('span');
    nav.className = 'xnav';
    nav.innerHTML =
      '<button data-xnav="wb"' + (HERE === 'wb' ? ' aria-current="true"' : '') + '>CRA Workbench</button>' +
      '<button data-xnav="fc"' + (HERE === 'fc' ? ' aria-current="true"' : '') + '>Document Center</button>';
    var why = bar.querySelector('.why');
    if (why) bar.insertBefore(nav, why); else bar.appendChild(nav);
  }
  if (why0()) why0().textContent = 'Prototype build ' + '2026-09-01';
  function why0(){ return bar && bar.querySelector('.why'); }

  function go(to){ if (to !== HERE) parent.postMessage({ nav: to }, '*'); }

  /* Capture phase, so the prototype's own handler never runs for these -
     otherwise the workbench would toast "Opening File Center" and stay put. */
  document.addEventListener('click', function(e){
    var x = e.target.closest('[data-xnav]');
    if (x) { e.preventDefault(); e.stopPropagation(); go(x.dataset.xnav); return; }
    var t = e.target.closest('[data-link="fc"]');
    if (t) { e.preventDefault(); e.stopPropagation(); go('fc'); }
  }, true);
}());

.ant-modal-mask{position:fixed;top:36px;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:1000}
.ant-modal-wrap{position:fixed;top:36px;left:0;right:0;bottom:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:10px}
.ant-modal{width:100%;max-width:1840px;height:100%}
.ant-modal-content{background:var(--bg);border-radius:var(--r-lg);box-shadow:var(--shadow);height:100%;display:flex;flex-direction:column;overflow:hidden;position:relative}
.ant-modal-close{position:absolute;top:12px;right:14px;width:22px;height:22px;border:0;background:transparent;color:var(--text-3);font-size:16px;line-height:1;border-radius:var(--r-sm);z-index:5}
.ant-modal-close:hover{background:rgba(0,0,0,.06);color:var(--text)}
.ant-modal-header{padding:0 16px;border-bottom:1px solid var(--border-2);flex:none}
.ant-modal-body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.ant-modal-footer{padding:9px 16px;border-top:1px solid var(--border-2);flex:none;display:flex;align-items:center;gap:8px}

.header-tabs{display:flex;gap:32px}
.header-tabs button{background:transparent;border:0;padding:12px 0;font-size:14px;color:var(--text);position:relative}
.header-tabs button[aria-pressed="true"]{color:var(--primary);font-weight:500}
.header-tabs button[aria-pressed="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--primary)}

/* ═══ layout: rail + main ═══ */
.ocr-modal-content{flex:1;min-height:0;display:grid;grid-template-columns:212px minmax(0,1fr)}
.ocr-modal-content.rail-collapsed{grid-template-columns:52px minmax(0,1fr)}
.rail-collapsed .subject-rail{padding:12px 6px}
.rail-collapsed .subj-item .sub{display:none}
.rail-collapsed .rail-h{justify-content:center;margin:0 0 8px}
.rail-collapsed .subj-item{grid-template-columns:1fr;justify-items:center;padding:6px 2px;gap:3px}
.rail-collapsed .subj-item .mk{grid-row:auto}
.rail-collapsed .subj-item .r1{flex-direction:column;gap:0;align-items:center}
.rail-collapsed .subj-item .nm{display:none}
.rail-collapsed .subj-item .ct{font-size:10px}
.rail-toggle{background:transparent;border:0;color:var(--text-3);padding:2px 5px;border-radius:var(--r-sm);font-size:12px;line-height:1}
.rail-toggle:hover{background:rgba(0,0,0,.06);color:var(--primary)}
@media(max-width:900px){.ocr-modal-content{grid-template-columns:1fr}}
.subject-rail{border-right:1px solid var(--border-2);background:var(--fill-alter);padding:10px 10px 14px;
  overflow-y:auto;min-height:0;display:flex;flex-direction:column}
.subject-rail .rail-h{display:flex;justify-content:flex-end;margin:0 0 4px}
.subj-item{width:100%;text-align:left;background:transparent;border:1px solid transparent;
  border-radius:var(--r);padding:7px 9px;margin-bottom:3px;transition:all .2s;
  display:grid;grid-template-columns:26px minmax(0,1fr);gap:9px;align-items:center}
.subj-item:hover{background:rgba(0,0,0,.045)}
.subj-item[aria-pressed="true"]{background:var(--bg);border-color:var(--primary-border);
  box-shadow:0 1px 2px rgba(16,24,40,.05)}
.subj-item .mk{grid-row:1/span 2;align-self:start;width:26px;height:26px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.02em;color:var(--text-2);background:#fff;border:1px solid var(--border-2)}
.subj-item .mk.ico{color:var(--text-3);background:transparent;border-color:transparent}
.subj-item .mk .i{width:15px;height:15px}
.subj-item[aria-pressed="true"] .mk{background:var(--primary-bg);border-color:var(--primary-border);
  color:var(--primary-active)}
.subj-item[aria-pressed="true"] .mk.ico{background:transparent;border-color:transparent}
.subj-item .r1{display:flex;justify-content:space-between;align-items:baseline;gap:8px;min-width:0}
.subj-item .nm{font-size:13.5px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subj-item[aria-pressed="true"] .nm{color:var(--primary-active);font-weight:600}
.subj-item .ct{font-family:var(--mono);font-size:12px;color:var(--text-3);white-space:nowrap;
  font-variant-numeric:tabular-nums;flex:none}
.subj-item.scope .nm{color:var(--text-2)}
.subj-item.foot{margin-top:auto;position:relative}
.subj-item.foot::before{content:"";position:absolute;left:9px;right:9px;top:-9px;height:1px;background:var(--border-2)}
.subj-item .ct.ok{color:var(--success-text)} .subj-item .ct.bad{color:var(--error-text)}
.subj-item .sub{grid-column:2;font-size:11.5px;color:var(--text-3);margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subj-item.gone .nm{color:var(--text-3)}
.rail-div{height:1px;background:var(--border-2);margin:8px 4px 9px}

/* the only vertical scroll container; children keep natural height */
.ocr-main{min-width:0;min-height:0;overflow-y:auto;overflow-x:hidden;scroll-padding-top:56px}
.file-list-table tbody tr{scroll-margin-top:56px}

/* ═══ upload section ═══ */
.upload-section{padding:12px 16px;border-bottom:1px solid var(--border-2)}
.upload-section.empty{padding:0;border-bottom:0}
.upload-ctx b{font-weight:600}
.section-header{display:flex;align-items:baseline;gap:12px;margin-bottom:9px;flex-wrap:wrap}
.section-title{font-size:14px;font-weight:600;color:var(--text)}
.section-subtitle{font-size:12px;color:var(--text-3)}
.upload-ctx{margin-left:auto;font-size:12px}
.upload-ctx b{color:var(--primary);font-weight:600}
.upload-ctx.none{color:var(--warning-text)}
.upload-grid{display:grid;gap:12px}
.upload-grid--two{grid-template-columns:1fr 1fr;align-items:stretch}
.upload-card{display:flex;flex-direction:column;border:1px solid var(--border-2);border-radius:var(--r);
  padding:11px 12px 10px;background:var(--bg)}
.upload-card.ai{border-color:var(--primary-border);background:linear-gradient(180deg,#f5faff,#fff 62px)}
.upload-card.manual{background:var(--fill-q)}
.ent-tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;padding:1px 5px;border-radius:3px;
  border:1px solid;flex:none}
.ent-tag.ai{color:var(--primary-active);background:var(--primary-bg);border-color:var(--primary-border)}
.ent-tag.manual{color:var(--text-3);background:var(--fill-alter);border-color:var(--border)}
.ent-note{font-size:11.5px;color:var(--text-3);margin-left:auto;text-align:right}
.type-hint{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:9px}
.tchip{font-size:11px;color:var(--text-2);background:var(--fill-alter);border:1px solid var(--border-2);
  border-radius:10px;padding:1px 8px;white-space:nowrap}
.upload-card.ai .tchip{background:#fff;border-color:var(--primary-border);color:var(--primary-active)}
.tmore{font-size:11px;color:var(--primary);background:transparent;border:0;padding:1px 4px;cursor:pointer}
.tmore:hover{text-decoration:underline}
.dl-grp{font-size:11px;font-family:var(--mono);letter-spacing:.07em;color:var(--text-3);
  margin:15px 0 7px;text-transform:uppercase}
.dl-grp:first-child{margin-top:0}
.dl-row{display:flex;align-items:center;gap:10px;padding:6px 2px;border-bottom:1px solid var(--border-2);font-size:13px}
.dl-row:last-child{border-bottom:0}
.dl-row .nm{flex:1;min-width:0}
.dl-none{padding:22px;text-align:center;color:var(--text-3);font-size:13px}
.upload-card .uploader-box{flex:1;min-height:92px}
@media(max-width:820px){.upload-grid--two{grid-template-columns:1fr}}
.upload-card-header{margin-bottom:8px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.upload-card-title{font-size:13px;color:var(--text-2)}
.info-icon{color:var(--text-4);font-size:12px}
.uploader-box{border:1px dashed var(--border);border-radius:var(--r);background:var(--fill-alter);padding:14px 10px;text-align:center;transition:border-color .2s;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.uploader-box:hover{border-color:var(--primary)}
.uploader-box.non-ai{border-color:var(--border);background:var(--fill-q)}
.upload-icon{color:var(--text-3);display:block;margin-bottom:6px;line-height:0}
.upload-icon .i{width:22px;height:22px;stroke-width:1.2}
.info-icon .i{width:13px;height:13px}
.action-btn .i{width:15px;height:15px}
.lockcell{display:inline-flex;color:var(--text-3)}
.ant-modal-close .i{width:15px;height:15px}
.viewer-bar .zc{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;
  border:1px solid var(--border-2);border-radius:var(--r-sm);color:var(--text-2);cursor:pointer}
.viewer-bar .zc .i{width:13px;height:13px}
.upload-prompt{font-size:13px;color:var(--text-2)}
.browse-link{color:var(--primary)}
.upload-examples{font-size:12px;color:var(--text-3);margin-top:4px;line-height:1.5}
.upload-section.disabled .uploader-box{opacity:.45;border-style:dashed;pointer-events:none}
.upload-lock{border:1px dashed var(--warning-border);background:var(--warning-bg);border-radius:var(--r);padding:8px 12px;font-size:12px;color:var(--warning-text);margin-bottom:9px;line-height:1.5}

/* ── version chain, defects, inline category ── */
.ver-chip{font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--text-3);
  border:1px solid var(--border-2);border-radius:2px;padding:0 4px;margin-left:6px;vertical-align:1px}
.ver-chip.new{color:var(--primary-active);border-color:var(--primary-border);background:var(--primary-bg)}
.cat-sel{width:100%;max-width:150px;height:26px;padding:0 6px;font-size:12.5px;border:1px solid transparent;
  border-radius:var(--r-sm);background:transparent;color:var(--text-2);
  appearance:none;text-overflow:ellipsis}
.cat-sel:hover:not(:disabled){border-color:var(--border);background:var(--bg)}
.cat-sel:focus{border-color:var(--primary);background:var(--bg);outline:none}
.cat-sel:disabled{color:var(--text-2);opacity:1}
.d-st{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;padding:1px 6px;border-radius:2px;border:1px solid}
.d-st.open{color:var(--error-text);background:var(--error-bg);border-color:var(--error-border)}
.d-st.responded{color:var(--primary-active);background:var(--primary-bg);border-color:var(--primary-border)}
.d-st.closed{color:var(--success-text);background:var(--success-bg);border-color:var(--success-border)}
.d-why{font-size:12px;color:var(--text-3);margin-top:2px;line-height:1.5}
.d-src{font-size:11px;font-family:var(--mono);color:var(--text-3)}
.stage-note{display:flex;align-items:center;gap:10px;padding:9px 12px;margin-bottom:12px;font-size:12.5px;
  border-radius:var(--r);border:1px solid var(--primary-border);background:var(--primary-bg);color:var(--primary-active)}
.stage-note .i{width:15px;height:15px;flex:none}
.stage-note b{font-weight:600}
.vh{border:1px solid var(--border-2);border-radius:var(--r);padding:10px 12px;margin-bottom:12px;background:var(--fill-alter)}
.vh-h{font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:7px}
.vh-r{display:flex;gap:9px;align-items:baseline;font-size:12px;color:var(--text-3);padding:3px 0;line-height:1.5}
.vh-r b{font-family:var(--mono);font-size:11px;color:var(--text-2);flex:none}
.vh-r.cur b{color:var(--primary-active)}

/* ═══ file list ═══ */
.file-list-section{padding:0 16px 16px}
.list-tabs{display:flex;gap:28px;border-bottom:1px solid var(--border-2);position:sticky;top:0;background:var(--bg);z-index:4}
.list-tabs button{background:transparent;border:0;padding:12px 0;font-size:14px;color:var(--text);position:relative;display:flex;align-items:center;gap:8px}
.list-tabs button[aria-pressed="true"]{color:var(--primary);font-weight:500}
.list-tabs button[aria-pressed="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--primary)}
.filter-bar{display:flex;gap:8px;align-items:center;padding:12px 0;flex-wrap:wrap}
.filter-inputs{display:flex;gap:8px;flex-wrap:wrap}
.filter-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.filter-actions .sel-n{font-size:12px;color:var(--text-3)}
.table-container{overflow-x:auto;border:1px solid var(--border-2);border-radius:var(--r)}
.file-list-table{border-collapse:collapse;width:100%;min-width:1300px;table-layout:fixed}
.subject-cell,.category-cell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filename-text{overflow-wrap:anywhere}
.file-list-table td,.file-list-table th{overflow:hidden}
.filename-cell{min-width:190px}
.file-list-table th{background:var(--fill-alter);text-align:left;font-size:12px;font-weight:600;color:var(--text-2);padding:9px 12px;border-bottom:1px solid var(--border-2);white-space:nowrap}
.file-list-table td{padding:7px 12px;border-bottom:1px solid var(--border-2);vertical-align:middle;font-size:13px}
.file-list-table tbody tr:last-child td{border-bottom:0}
.file-list-table tbody tr:hover{background:var(--fill-alter)}
.file-list-table tbody tr.selected{background:#f0f7ff}
.filename-text{color:var(--text)}
.description-text{font-size:12px;color:var(--text-3)}
.file-type-tag{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.is-ai-cell{font-family:var(--mono);font-size:12px;color:var(--text-2)}
.time-cell{font-family:var(--mono);font-size:12px;color:var(--text-3);white-space:nowrap}
.actions-cell{white-space:nowrap}
.action-btn{background:transparent;border:0;color:var(--text-3);padding:4px 6px;border-radius:var(--r-sm);line-height:0}
.action-btn:hover:not(:disabled){background:rgba(0,0,0,.06);color:var(--primary)}
.action-btn.delete-btn:hover:not(:disabled){color:var(--error)}
.action-btn:disabled{color:var(--text-4)}
.rule-line{font-size:12px;line-height:1.6}
.rule-line.open{color:var(--error-text)} .rule-line.done{color:var(--success-text)}
.empty-state{padding:48px;text-align:center;color:var(--text-3);font-size:14px}
.file-list-footer-actions{margin-left:auto;display:flex;gap:8px}
.foot-note{font-size:12px;color:var(--text-3)}
.tracks{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.trk{display:inline-flex;align-items:baseline;gap:3px;font-size:12px;color:var(--text-3);
  border:1px solid var(--border-2);border-radius:var(--r-sm);padding:2px 9px;background:var(--fill-alter)}
.trk b{font-family:var(--mono);font-size:12.5px;color:var(--text);font-variant-numeric:tabular-nums}
.trk i{font-style:normal;color:var(--text-4)}
.trk.ok{border-color:var(--success-border);background:var(--success-bg)}
.trk.ok b{color:var(--success-text)}
.trk.busy{border-color:var(--primary-border);background:var(--primary-bg)}
.trk.busy b{color:var(--primary-active)}
.trk em{font-style:normal;font-size:11px;color:var(--primary-active);margin-left:5px}
.trk-open{font-size:12px;color:var(--text-3)}

/* ═══ detail view ═══ */
.detail{position:fixed;top:36px;left:0;right:0;bottom:0;background:var(--bg-layout);z-index:1100;display:flex;flex-direction:column}
.detail.hidden{display:none}
.detail-header{background:var(--bg);border-bottom:1px solid var(--border-2);padding:12px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.detail-header .t{font-size:16px;font-weight:600}
.detail-header .bc{font-size:12px;color:var(--text-3)}
.detail-header .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.detail-body{flex:1;display:grid;grid-template-columns:400px minmax(0,1fr);min-height:0}
@media(max-width:900px){.detail-body{grid-template-columns:1fr;overflow-y:auto}}
.detail-panel{border-right:1px solid var(--border-2);background:var(--bg);overflow-y:auto;padding:16px}
.detail-viewer{background:#eceef1;overflow:auto;padding:24px;display:flex;flex-direction:column;align-items:center}

/* A.11 Manual Check */
.mc-grp{font-size:12px;font-weight:600;color:var(--text-2);background:var(--fill-alter);
  border:1px solid var(--border-2);border-radius:var(--r-sm);padding:6px 10px;margin:14px 0 8px;
  display:flex;align-items:center;gap:8px}
.mc-grp.cur{border-color:var(--primary-border);color:var(--primary-active)}
.mc-cur{margin-left:auto;font-size:10.5px;font-family:var(--mono);background:var(--primary);color:#fff;
  padding:1px 6px;border-radius:2px;font-weight:400}
.routed{font-size:10px;font-family:var(--mono);color:var(--text-3);
  border:1px solid var(--border);border-radius:2px;padding:0 4px;margin-left:6px}
.mc-seg{margin-left:auto;font-size:11px;color:var(--text-3)}
.mc-doc{width:100%;max-width:720px;margin:0 auto 22px}
.mc-doc-h{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--text-2);
  background:rgba(255,255,255,.75);border:1px solid var(--border-2);border-radius:var(--r-sm);
  padding:7px 12px;margin-bottom:8px;position:sticky;top:0;z-index:2;backdrop-filter:blur(4px)}
.mc-doc-h span{margin-left:auto;font-weight:400;color:var(--text-3);font-family:var(--mono);font-size:11px}
.panel-sect{font-size:12px;font-weight:600;color:var(--text-2);margin:0 0 10px;display:flex;align-items:center;gap:8px;letter-spacing:.02em}
.panel-sect::after{content:"";flex:1;height:1px;background:var(--border-2)}
.panel-sect.err{color:var(--error-text)}
.alert-item{border:1px solid var(--border-2);border-left:3px solid var(--border);border-radius:0 var(--r) var(--r) 0;padding:11px 12px;margin-bottom:8px;background:var(--bg)}
.alert-item.machine{border-left-color:var(--error)}
.alert-item.eyeball{border-left-color:var(--warning)}
.alert-item.resolved{border-left-color:var(--success);background:var(--fill-q)}
.alert-item .ah{display:flex;gap:8px;align-items:baseline;margin-bottom:4px}
.alert-item .rid{flex:none}
.alert-item .rid{font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:var(--r-sm);background:rgba(0,0,0,.06);color:var(--text-2)}
.alert-item .rn{font-weight:600;font-size:13px}
.alert-item .rd{font-size:12px;color:var(--text-2);margin-bottom:10px;line-height:1.6}
.alert-item .acts{display:flex;gap:6px;flex-wrap:wrap}
.alert-item .res{font-size:12px;color:var(--success-text);font-family:var(--mono)}
.alert-item .acts .mc-on{background:var(--success-bg);border-color:var(--success-border);color:var(--success-text);font-weight:600}
.alert-item .acts .mc-off{background:var(--error-bg);border-color:var(--error-border);color:var(--error-text);font-weight:600}
.field-row{display:flex;justify-content:space-between;gap:10px;padding:7px 8px;border-bottom:1px solid var(--border-2);font-size:12px}
.field-row:last-child{border-bottom:0}
.field-row .k{color:var(--text-2)}
.field-row .v{font-family:var(--mono);font-size:12px;text-align:right;word-break:break-all}
.field-row .c{font-family:var(--mono);font-size:11px;min-width:36px;text-align:right}
.confidence-high{color:var(--success-text)} .confidence-low{color:var(--error-text)}
.field-group{font-size:11px;color:var(--text-3);background:var(--fill-alter);padding:5px 8px;margin-top:8px;font-family:var(--mono)}
.classify-box{border:1px solid var(--border-2);border-radius:var(--r);padding:14px;background:var(--fill-alter);margin-bottom:14px}
.classify-box label{display:block;font-size:12px;color:var(--text-2);margin:10px 0 4px}
.classify-box select{width:100%}
.pnote{font-size:12px;color:var(--text-2);background:var(--fill-alter);border-left:3px solid var(--border);padding:10px 12px;border-radius:0 var(--r-sm) var(--r-sm) 0;margin-bottom:12px;line-height:1.6}
.pnote.warn{border-left-color:var(--warning)}
.pnote.info{border-left-color:var(--primary)}
.pnote.ok{border-left-color:var(--success)}

/* ═══ document facsimile ═══ */
.doc-page{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15);width:min(900px,100%);min-height:600px;padding:48px 52px;font-size:13px;color:#262626}
.doc-page.card{width:min(560px,100%);min-height:340px;background:linear-gradient(150deg,#dbe8f2,#c3d8e8);padding:30px;border-radius:12px}
.doc-h{text-align:center;font-weight:700;font-size:16px;letter-spacing:.04em;margin-bottom:6px}
.doc-s{text-align:center;color:#8c8c8c;font-size:12px;margin-bottom:24px}
.doc-r{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f0f0;gap:24px}
.doc-r .k{color:#595959} .doc-r .v{font-weight:600;text-align:right}
.doc-r.hl{background:var(--fill-alter);margin:0 -10px;padding:8px 10px}
.doc-l{height:9px;background:#f0f0f0;border-radius:2px;margin:10px 0}

/* A Case has one rule set. It splits into two tracks only by how each rule gets
   concluded - by the engine (Cross Validation) or by eye (Manual Check). So the
   footer reports both tracks on both pages, and submission is a single Case-level
   action rather than two page-level ones.
   The two tracks have very different latency: revalidation is an async batch over
   every file in the Case (FSD 2.8.3), manual marking is immediate. They therefore
   must not share a lock - only the moment of submission is shared. */
const ocrAlerts=()=>live().filter(f=>f.ch==='ocr'&&f.cls).flatMap(f=>f.alerts);

function trackState(){
  // OCR concludes most of its rules by itself; only the alerting ones wait on CRA.
  const ot=MC.ocrHandled, od=ot-ocrOpen();
  const mt=MC.rules.length, md=mcDone();
  return {ot,od,mt,md,open:(ot-od)+(mt-md),all:ot+mt,done:od+md};
}

    let act='<span class="description-text">\u2014</span>';
    if(mode==='respond'&&d.st==='open'&&f)
      act=`<button class="ant-btn ant-btn-primary ant-btn-sm" data-repl="${d.no}">Replace Document</button>`;
    else if(mode==='respond'&&d.st==='responded')
      act='<span class="description-text">Awaiting CRA</span>';
    else if(mode==='verify'&&d.st==='responded')
      act=`<button class="ant-btn ant-btn-primary ant-btn-sm" data-verify="${d.no}">Verify</button>`;
    else if(mode==='verify'&&d.st==='open')
      act='<span class="description-text">Not rectified</span>';
    else if(mode==='manage'&&d.st!=='closed')
      act=`<button class="ant-btn ant-btn-sm" data-waive="${d.no}">Waive with reason</button>`;
    return `<tr><td class="time-cell">${esc(d.no)}</td>
      <td><span class="ant-tag ${d.src==='System'?'ant-tag-blue':''}">${d.src}</span></td>
      <td class="d-src">${esc(d.rule||'\u2014')}</td>
      <td class="description-text">${esc(d.cat)}</td>
      <td><div>${esc(d.ty)}</div><div class="d-why">${esc(d.cr)}</div></td>

      <td><span class="d-st ${d.st}">${st}</span></td>
      <td class="actions-cell">${act}</td></tr>`;
  }).join('');
}

function panel(f,p){
  let h='';
  // The superseded versions stay retrievable, with the alerts CRA saw still on
  // them - that record is what makes freezing the entry unnecessary.
  if(f.vers.length){
    h+=`<div class="vh"><div class="vh-h">Version chain \u00b7 superseded copies are kept, never modified</div>`;
    f.vers.forEach(v=>{ h+=`<div class="vh-r"><b>v${v.ver}</b><span>${esc(v.up)} \u00b7 ${esc(v.by)}
      \u00b7 ${esc(v.rs)}${v.alerts.length?` \u00b7 carried ${v.alerts.length} alert(s)`:''}</span></div>`; });
    h+=`<div class="vh-r cur"><b>v${f.ver}</b><span>${esc(f.up)} \u00b7 current</span></div></div>`;
  }
  if(f.src==='system')
    h+=f.ao==='external'
      ? `<div class="pnote info"><b>System archived \u00b7 External return</b><br>Returned from e-acceptance / biometric devices. Signature completeness and version are validated. Cannot be deleted.</div>`
      : `<div class="pnote ok"><b>System archived \u00b7 System-generated</b><br>Generated from a template. Rule validation is skipped. Cannot be deleted.</div>`;
  if(!f.cls){
    if(f.low) h+=`<div class="pnote warn"><b>Low overall confidence \u00b7 file type may not match</b><br>Confirm the classification first \u2014 it determines which field template is applied.</div>`;
    h+=`<div class="classify-box">
      <label>Category</label><select class="ant-select">${CATS(S.stage).map(c=>`<option ${c===f.cat?'selected':''}>${c}</option>`).join('')}</select>
      <label>File Type</label><select class="ant-select" id="clsTy">${TYPES.map(t=>`<option ${t===f.ty?'selected':''}>${t}</option>`).join('')}</select>
      <div style="margin-top:12px"><button class="ant-btn ant-btn-primary ant-btn-sm" id="btnCls" ${p.cls?'':'disabled'}>Confirm Classification</button></div>
      <div class="description-text" style="margin-top:8px">On confirmation the file moves to ${f.ch==='ocr'?'Cross-Validation Results':'Manual Check Results'}</div>
      ${p.cls?'':'<div class="description-text" style="margin-top:6px">This role cannot confirm classification.</div>'}</div>`;
  }
  // A.11 left panel always shows the whole case rule set, independent of the previewed file
  if(f.cls&&f.ch==='manual'){
    const o=mcOpen();
    h+=`<div class="pnote"><b>${MC.rules.length} manual rule(s) for this case</b><br>
      ${MC.caseTotal} total \u2212 ${MC.ocrHandled} handled by OCR = ${MC.rules.length}
      (${MC.rules.filter(r=>r.routed).length} routed here from the non-AI upload entry)</div>
      <p class="panel-sect ${o?'err':''}">EXPERT RULES \u00b7 ${o?o+' pending':'all reviewed'}</p>`;
    MC_FILES().forEach(fn=>{
      const cur=fn===f.nm;
      h+=`<div class="mc-grp ${cur?'cur':''}">${fn}${cur?'<span class="mc-cur">Previewing</span>':''}</div>`;
      MC.rules.filter(r=>r.file===fn).forEach(r=>{
        const res=MC.res[r.id];
        h+=`<div class="alert-item ${res?'resolved':'eyeball'}">
          <div class="ah"><span class="rid">${r.id}</span><span class="rn">${r.nm}</span>
            ${r.routed?'<span class="routed">ROUTED</span>':''}</div><div class="rd">${r.d}</div>`;
        h+=`<div class="acts">
            <button class="ant-btn ant-btn-sm ${res==='pass'?'mc-on':''}" data-mc="pass" data-r="${r.id}" ${p.rule?'':'disabled'}>Pass</button>
            <button class="ant-btn ant-btn-sm ${res==='fail'?'mc-off':''}" data-mc="fail" data-r="${r.id}" ${p.rule?'':'disabled'}>Fail</button></div>`;
        h+=`</div>`;
      });
    });
  }
  if(f.cls&&f.ch==='ocr'&&f.alerts.length){
    const o=f.alerts.filter(a=>!a.res).length;
    h+=`<p class="panel-sect ${o?'err':''}">VALIDATION ALERTS \u00b7 ${o?o+' pending':'all handled'}</p>`;
    f.alerts.forEach((a,i)=>{
      h+=`<div class="alert-item ${a.res?'resolved':(a.k==='e'?'eyeball':'machine')}"><div class="ah"><span class="rid">${a.id}</span><span class="rn">${a.nm}</span></div><div class="rd">${a.d}</div>`;
      h+=a.res?`<div class="res">&#10003; ${a.res}</div>`
        :a.k==='e'
          ?`<div class="acts"><button class="ant-btn ant-btn-sm" data-al="pass" data-i="${i}" ${p.rule?'':'disabled'}>Pass</button>
            <button class="ant-btn ant-btn-sm ant-btn-dangerous" data-al="fail" data-i="${i}" ${p.rule?'':'disabled'}>Fail</button>
            <button class="ant-btn ant-btn-link ant-btn-sm" data-al="loc" data-i="${i}">Check image \u2192</button></div>`
          :`<div class="acts"><button class="ant-btn ant-btn-sm" data-al="just" data-i="${i}" ${p.rule?'':'disabled'}>Justification</button>
            <button class="ant-btn ant-btn-sm" data-al="repl" data-i="${i}" ${p.rule?'':'disabled'}>Replace Document</button>
            <button class="ant-btn ant-btn-link ant-btn-sm" data-al="loc" data-i="${i}">Check image \u2192</button></div>`;
      h+=`</div>`;
    });
  }
  if(f.cls&&f.ch==='ocr'&&!f.alerts.length&&f.src!=='system')
    h+=`<div class="pnote ok"><b>All rules passed</b></div>`;
  if(f.fields.length){
    h+=`<p class="panel-sect">FIELDS</p>`;
    f.fields.forEach(x=>{h+=x.g?`<div class="field-group">${x.g}</div>`
      :`<div class="field-row"><span class="k">${x.n}</span><span class="v">${x.v}</span>
         <span class="c ${x.c>=90?'confidence-high':'confidence-low'}">${x.c}%</span></div>`;});
  }
  return h;
}

/* A.11 right pane: mixed upload -> one window stacking all files; per-file upload -> one window each */
function viewerMC(f){
  const names=MC_FILES(), mix=isMixed(f);
  const bar=`<div class="viewer-bar"><span class="time-cell">${mix?names.length+' files':'1 / '+f.pages}</span>
    <span class="zc">\u2212</span><span class="zc">+</span><span class="zc">${I('refresh')}</span>
    <span class="mc-seg">${mix?'Mixed upload \u00b7 all files in one window':'Per-file upload \u00b7 one window per file'}</span></div>`;
  if(!mix) return bar+docBody(f);
  return bar+names.map(fn=>{
    const t=live().find(x=>x.nm===fn)||f;
    return `<div class="mc-doc" id="mcdoc-${fn.replace(/[^\w]/g,'_')}">
      <div class="mc-doc-h">${fn}<span>${MC.rules.filter(r=>r.file===fn).length} rule(s)</span></div>
      ${docBody(t)}</div>`;
  }).join('');
}
function viewer(f){
  if(f.ch==='manual'&&f.cls) return viewerMC(f);

/* Replacing never edits a file. v1 is pushed onto the version chain with the
   alerts CRA saw still attached to it, and v2 arrives clean and re-extracted -
   which is why the rule can re-conclude by itself instead of by assertion. */
function replaceDoc(no){
  const d=DEFECTS.find(x=>x.no===no), f=d&&defFile(d); if(!f) return;
  const at=new Date().toLocaleString('en-GB',{day:'2-digit',month:'2-digit',year:'2-digit',
    hour:'2-digit',minute:'2-digit'}).replace(',','');
  f.vers.push({ver:f.ver,up:f.up,by:f.src==='system'?'System':'SalesOfficer1',
    alerts:f.alerts,rs:`Superseded for defect #${d.no}`});
  f.ver++; f.up=at; f.alerts=[]; f.cls=1; f.low=0;
  f.desc=`Re-extracted from v${f.ver}`;
  d.st='responded';
  smClose(); render();
  msg(`${f.nm} v${f.ver} uploaded \u00b7 rule ${d.rule||'\u2014'} re-evaluated, awaiting CRA verification`);
}
function askReplace(no){
  const d=DEFECTS.find(x=>x.no===no), f=d&&defFile(d); if(!f) return;
  sm('Replace Document',
    `<div class="pnote info">Defect <b>#${esc(d.no)}</b> \u00b7 ${esc(d.ty)}<br>${esc(d.cr)}</div>
     <div class="vh"><div class="vh-h">Version chain</div>
       <div class="vh-r"><b>v${f.ver}</b><span>${esc(f.up)} \u00b7 current \u2014 will be superseded, not modified</span></div>
       <div class="vh-r cur"><b>v${f.ver+1}</b><span>your upload \u00b7 goes through AI Scanning as normal</span></div></div>
     <div class="uploader-box"><span class="upload-icon">${I('upload')}</span>
       <div class="upload-prompt">Drag &amp; drop <b>${esc(f.nm)}</b>, or <span class="browse-link">browse</span></div>
       <div class="upload-examples">PDF, JPG, JPEG, PNG</div></div>`,
    `<button class="ant-btn" data-cl="1">Cancel</button>
     <button class="ant-btn ant-btn-primary" data-dorepl="${esc(d.no)}">Simulate Upload</button>`);
}
