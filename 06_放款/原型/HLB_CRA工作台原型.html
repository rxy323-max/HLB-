<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<style>
/* standalone compat reset - single file, open directly in a browser */
html{-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:#fafafa;font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
button,select,input,textarea{font-size:inherit;line-height:inherit;color:inherit}
</style>
<title>CRA Workbench</title>
</head>
<body>

<style>
:root{
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --primary:#1677ff;--primary-hover:#4096ff;--primary-bg:#e8f1ff;--primary-border:#a3c9ff;--primary-deep:#0958d9;
  --ink:#1f2430;--ink-2:#5a6473;--ink-3:#8c93a0;--ink-4:#b6bcc7;
  --line:#e8eaee;--line-2:#f2f3f5;--bg:#fff;--page:#f4f5f7;--alt:#fafbfc;
  --ok:#389e0d;--ok-bg:#eaf7e6;--ok-line:#b7e0a4;
  --warn:#d48806;--warn-bg:#fff8e6;--warn-line:#ffdf9b;
  --err:#d4380d;--err-bg:#fff1ee;--err-line:#ffbfae;
  --r:8px;--r-sm:4px;--r-md:6px;
  --sh:0 1px 2px rgba(16,24,40,.05);
  --sh-lg:0 8px 24px rgba(16,24,40,.12),0 2px 6px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,select,input,textarea{font-family:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--primary);outline-offset:1px}

.btn{height:32px;padding:0 15px;border:1px solid #d6d9de;border-radius:var(--r-md);background:#fff;color:var(--ink);font-size:13.5px;white-space:nowrap;transition:.15s}
.btn:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
.btn:disabled{color:var(--ink-4);background:#f7f8f9;border-color:var(--line)}
.btn-pri{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-pri:hover:not(:disabled){background:var(--primary-hover);border-color:var(--primary-hover);color:#fff}
.btn-pri:disabled{background:#f0f1f3;border-color:var(--line);color:var(--ink-4)}
.btn-sm{height:26px;padding:0 10px;font-size:12.5px}
.btn-txt{border-color:transparent;background:transparent;color:var(--primary);padding:0 6px;height:auto}
.tag{display:inline-block;height:22px;padding:0 8px;font-size:12px;line-height:20px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--alt);color:var(--ink-2);white-space:nowrap}
.tag-ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.tag-warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.tag-err{background:var(--err-bg);border-color:var(--err-line);color:var(--err)}
.tag-blue{background:var(--primary-bg);border-color:var(--primary-border);color:var(--primary-deep)}

.demo{position:fixed;top:0;left:0;right:0;height:34px;z-index:300;background:#0d1424;color:rgba(255,255,255,.8);padding:6px 16px;display:flex;gap:11px;align-items:center;font-size:11.5px}
.demo .lb{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:rgba(255,255,255,.4);text-transform:uppercase}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.18);border-radius:var(--r-sm);overflow:hidden}
.seg button{background:transparent;border:0;color:rgba(255,255,255,.65);padding:2px 12px;font-size:11.5px}
.seg button[aria-pressed="true"]{background:var(--primary);color:#fff}
.demo .why{margin-left:auto;color:rgba(255,255,255,.3);font-size:10.5px}

.app{position:fixed;top:34px;left:0;right:0;bottom:0;display:flex;flex-direction:column;background:var(--page)}
.topbar{height:52px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:0;padding:0 20px 0 0;flex:none}
.brand{width:76px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#c8102e}
.tbtn{height:34px;display:flex;align-items:center;padding:0 16px;font-size:13.5px;color:var(--ink-2);border-radius:var(--r-md);margin-right:6px}
.tbtn.on{background:var(--primary-bg);color:var(--primary-deep);font-weight:500}
.topbar .who{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:13px;color:var(--ink-2)}
.topbar .who .clk{font-variant-numeric:tabular-nums;color:var(--ink)}
.topbar .rf{width:34px;height:34px;border:1px solid var(--line);border-radius:var(--r-md);background:#fff;color:var(--ink-3);font-size:15px}

.body{flex:1;min-height:0;display:grid;grid-template-columns:76px 268px minmax(0,1fr) 300px}
@media(max-width:1400px){.body{grid-template-columns:76px 240px minmax(0,1fr) 268px}}
@media(max-width:1100px){.body{grid-template-columns:76px minmax(0,1fr)}.rail,.side{display:none}}

.icons{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:6px}
.icons i{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--ink-4);font-style:normal;font-size:17px;border-radius:var(--r-md)}
.icons i:hover{background:var(--alt);color:var(--ink-2)}
.icons i.on{color:var(--primary);background:var(--primary-bg)}
.icons .sp{flex:1}

.rail{padding:14px 12px;overflow-y:auto}
.navcard{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:14px 0 10px;margin-bottom:12px}
.navcard .nh{display:flex;align-items:center;gap:10px;padding:0 16px 12px;font-size:15px;font-weight:600;color:var(--ink)}
.navcard h6{margin:12px 16px 4px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.navcard button{display:flex;width:100%;text-align:left;background:transparent;border:0;border-left:3px solid transparent;padding:6px 16px 6px 20px;font-size:13px;color:var(--ink-2);align-items:center;gap:8px}
.navcard button:hover{background:var(--alt);color:var(--ink)}
.navcard button.on{background:var(--primary-bg);border-left-color:var(--primary);color:var(--primary-deep);font-weight:500}
.navcard .n{margin-left:auto;font-family:var(--mono);font-size:10.5px;padding:0 6px;border-radius:9px;background:var(--line-2);color:var(--ink-2);flex:none}
.navcard .n.err{background:var(--err);color:#fff}
.navcard .n.ok{background:var(--ok-bg);color:var(--ok)}
.linkcard{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.linkcard a{font-size:13.5px;color:var(--primary);cursor:pointer}
.linkcard a.off{color:var(--ink-4);cursor:default}

.main{overflow-y:auto;padding:16px 18px 24px;scroll-behavior:smooth}
.seclabel{font-size:12px;font-weight:600;color:var(--ink-3);letter-spacing:.09em;text-transform:uppercase;margin:20px 0 10px 6px}
.seclabel:first-child{margin-top:2px}

.mod{background:#fff;border-radius:var(--r);box-shadow:var(--sh);margin-bottom:12px;overflow:hidden;scroll-margin-top:12px}
.mod-h{display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;border:0;background:#fff;padding:14px 18px;text-align:left;cursor:pointer;user-select:none}
.mod-h:hover{background:var(--alt)}
.mod-h .car{color:var(--ink-3);font-size:12px;width:12px;flex:none;transition:transform .15s}
.mod-h .mi{font-size:15px;color:var(--ink-3);flex:none;line-height:1}
.mod-h .mt{font-size:15.5px;font-weight:600;color:var(--ink)}
.mod-h .mr{margin-left:auto;display:flex;gap:10px;align-items:center;flex:none}
.mod-h .badge{font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:9px}
.mod-h .badge.err{background:var(--err-bg);color:var(--err);border:1px solid var(--err-line)}
.mod-h .badge.ok{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line)}
.mod-h .new{font-size:9.5px;font-family:var(--mono);background:#722ed1;color:#fff;padding:1px 5px;border-radius:3px;letter-spacing:.04em}
.mod-b{border-top:1px solid var(--line-2);padding:16px 18px 18px}
.mod.stub .mod-h{color:var(--ink-2)}

.tot{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.tot .t{font-size:14px;color:var(--ink-2)}
.tot .t b{color:var(--primary);font-weight:600}
.tot .r{margin-left:auto;display:flex;gap:8px}

table{border-collapse:collapse;width:100%}
th{background:var(--alt);text-align:left;font-size:12.5px;font-weight:600;color:var(--ink-2);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line-2);font-size:13px;vertical-align:middle;color:var(--ink-2)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--alt)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md)}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--ink-3);font-size:12.5px}
.sub-row{color:var(--ink-3);font-size:11px}
.nodata{padding:44px;text-align:center;color:var(--ink-4)}
.nodata .ic{font-size:34px;opacity:.35;display:block;margin-bottom:6px}

/* Verification Summary */
.vs-top{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px}
.vs-top .st{font-size:15px;font-weight:600}
.vs-top .st.ok{color:var(--ok)}.vs-top .st.warn{color:var(--warn)}.vs-top .st.wait{color:var(--primary-deep)}
.vs-top .sd{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.vs-top .r{margin-left:auto;display:flex;gap:8px;align-items:center;flex:none}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}
@media(max-width:1250px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kp{border:1px solid var(--line);border-radius:var(--r-md);padding:11px 13px;background:var(--alt)}
.kp .v{font-family:var(--mono);font-size:21px;font-weight:600;line-height:1.1;color:var(--ink)}
.kp .v.ok{color:var(--ok)}.kp .v.err{color:var(--err)}
.kp .k{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.kp .ks{display:block;font-size:10.5px;color:var(--warn);font-family:var(--mono);margin-top:2px}
.rrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:8px}
.rrow:last-child{margin-bottom:0}
.rrow .n{flex:1;min-width:0;font-size:13px}
.rrow .s{display:block;font-size:11.5px;color:var(--ink-3);margin-top:1px}
.rrow .r{flex:none;display:flex;gap:8px;align-items:center}
.batchbar{display:flex;align-items:center;gap:12px;padding:9px 12px;margin-bottom:10px;background:var(--warn-bg);
  border:1px solid var(--warn-line);border-radius:var(--r-md);font-size:12.5px;color:var(--warn)}
.batchbar button{margin-left:auto}

/* File Check List */
.chk-h{font-size:14px;color:var(--ink-2);margin-bottom:14px}
.chk-h b{color:var(--ink);font-weight:600}
.chk-grp{font-size:13.5px;font-weight:600;color:var(--ink);margin:16px 0 10px}
.chk-grp:first-of-type{margin-top:0}
.chk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 18px}
@media(max-width:1250px){.chk-grid{grid-template-columns:repeat(2,1fr)}}
.ck{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.ck .bx{width:16px;height:16px;border:1px solid #c9ced6;border-radius:3px;flex:none;margin-top:2px;
  display:flex;align-items:center;justify-content:center;font-size:11px;background:#fff}
.ck.on .bx{background:var(--primary);border-color:var(--primary);color:#fff}
.ck.on{color:var(--ink)}
.ck.auto .bx{background:var(--ok);border-color:var(--ok);color:#fff}
.ck.dis{opacity:.55;cursor:not-allowed}

/* Data Maintenance fields */
.fgrp{font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.04em;text-transform:uppercase;margin:4px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.fgrp+.fgrid{margin-bottom:18px}
.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 22px}
@media(max-width:1250px){.fgrid{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:12.5px;color:var(--ink-2)}
.fld .req{color:var(--err);margin-left:3px}
.fin{height:32px;border:1px solid #d6d9de;border-radius:var(--r-md);padding:0 11px;font-size:13px;background:#fff;color:var(--ink);width:100%}
.fin:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 2px rgba(22,119,255,.08)}
.fin.bad{border-color:var(--err);background:var(--err-bg)}
.fin::placeholder{color:var(--ink-4)}
.fhint{font-size:11px;color:var(--ink-3);font-family:var(--mono)}
.fhint.diff{color:var(--warn)}

/* side panel */
.side{padding:14px 12px 14px 0;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.sc{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.sc .sh{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:600;margin-bottom:12px}
.sc .cnt{font-family:var(--mono);font-size:12px;padding:1px 8px;border-radius:9px;background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line)}
.fl{display:flex;gap:9px;align-items:center;padding:5px 0;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.fl .bx{width:16px;height:16px;border:1px solid #c9ced6;border-radius:3px;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;background:#fff}
.fl.on .bx{background:var(--primary);border-color:var(--primary);color:#fff}
.fl.on{color:var(--ink);font-weight:500}
.yn{display:flex;align-items:center;justify-content:space-between;padding:8px 0;font-size:13.5px;color:var(--ink-2)}
.ynseg{display:inline-flex;background:#f0f1f3;border-radius:var(--r-md);padding:2px}
.ynseg button{border:0;background:transparent;font-size:12.5px;padding:3px 14px;border-radius:var(--r-sm);color:var(--ink-3)}
.ynseg button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:var(--sh);font-weight:500}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:5px 0}
.kv .k{color:var(--ink-3);flex:none}
.kv .v{text-align:right;color:var(--ink);font-weight:500}
.sdiv{height:1px;background:var(--line-2);margin:10px 0}

.foot{height:58px;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 20px;flex:none}
.foot select{height:32px;border:1px solid #d6d9de;border-radius:var(--r-md);padding:0 8px;font-size:13px;color:var(--ink-2);background:#fff}
.foot .r{margin-left:auto;display:flex;gap:10px}
.foot .fn{font-size:12.5px;color:var(--ink-3)}

.mask{position:fixed;top:34px;left:0;right:0;bottom:0;background:rgba(15,20,30,.45);z-index:400;display:flex;align-items:center;justify-content:center;padding:24px}
.mask.hidden{display:none}
.modal{background:#fff;border-radius:10px;width:min(880px,100%);max-height:88vh;display:flex;flex-direction:column;box-shadow:var(--sh-lg)}
.modal.sm{width:min(560px,100%)}
.modal .mh{padding:18px 26px 14px;font-size:19px;font-weight:600;display:flex;align-items:flex-start}
.modal .mh .x{margin-left:auto;border:0;background:transparent;font-size:18px;color:var(--ink-3);line-height:1;padding:2px 4px}
.modal .msub{padding:0 26px;font-size:13px;color:var(--ink-2);margin-top:-8px}
.modal .mwarn{padding:6px 26px 0;font-size:12.5px;color:#c0392b}
.modal .mb{padding:16px 26px;overflow:auto}
.modal .mf{padding:14px 26px 18px;display:flex;gap:10px;justify-content:flex-end;align-items:center}
.modal .mf .lf{margin-right:auto;font-size:12.5px;color:var(--ink-3)}

/* OCR Data Sync */
.sync-g{font-size:15px;font-weight:600;margin:18px 0 8px}
.sync-g:first-child{margin-top:0}
.syn{width:100%;min-width:600px;border-collapse:separate;border-spacing:0}
.syn th{background:#eef4ff;font-size:12.5px;color:var(--ink-2);padding:11px 14px;border:0;font-weight:500}
.syn td{padding:10px 14px;border:0;border-top:1px solid var(--line-2);font-size:13px}
.syn tr.sel td{background:#eaf2ff}
.syn tr.na td{opacity:.5}
.syn .st{font-size:11.5px;font-family:var(--mono);color:var(--ink-3);letter-spacing:.03em}
.syn .st.cf{color:var(--warn)}
.bx{width:17px;height:17px;border:1px solid #c9ced6;border-radius:3px;display:inline-flex;align-items:center;
  justify-content:center;font-size:11px;background:#fff;cursor:pointer;vertical-align:middle}
.bx.on{background:var(--primary);border-color:var(--primary);color:#fff}
.bx.dis{background:#f2f3f5;cursor:not-allowed;border-style:dashed}
.emptyv{color:var(--ink-4);font-style:italic}

/* Add Defect */
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px 26px}
@media(max-width:640px){.dgrid{grid-template-columns:1fr}}
.dfield label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:6px}
.dfield .req{color:var(--err)}
.dsel,.ddate{width:100%;height:36px;border:1px solid #d6d9de;border-radius:var(--r-md);padding:0 11px;font-size:13.5px;background:#fff;color:var(--ink)}
.ddate:disabled{background:#f4f5f7;color:var(--ink-3)}
.dchk{display:flex;gap:9px;align-items:center;font-size:13.5px;color:var(--ink-2);cursor:pointer;height:36px}
.dta{width:100%;min-height:110px;border:1px solid #d6d9de;border-radius:var(--r-md);padding:10px 12px;font-size:13.5px;resize:vertical}
.dcount{text-align:right;font-size:12px;color:var(--ink-3);margin-top:4px}
.dfull{grid-column:1/-1}

/* File Center rule modal */
.fcx .mh{background:#f2f7ff;border-radius:10px 10px 0 0}
.fcb{font-family:var(--mono);font-size:10px;letter-spacing:.06em;background:var(--primary);color:#fff;
  padding:2px 7px;border-radius:3px;margin-right:10px;vertical-align:middle;font-weight:400}
.opt{display:flex;gap:11px;align-items:flex-start;border:1px solid #d6d9de;border-radius:var(--r-md);
  padding:13px 15px;cursor:pointer;background:#fff;margin-bottom:10px}
.opt:hover{border-color:var(--primary)}
.opt.on{border-color:var(--primary);background:var(--primary-bg)}
.opt .rb{width:16px;height:16px;border:1px solid #c9ced6;border-radius:50%;flex:none;margin-top:2px;display:flex;align-items:center;justify-content:center}
.opt.on .rb{border-color:var(--primary)}
.opt.on .rb::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--primary)}
.opt .on2{font-size:14px;font-weight:500;color:var(--ink)}
.sub2{display:flex;flex-direction:column;gap:8px;margin:10px 0 0 27px;padding-left:13px;border-left:2px solid var(--line)}
.sub2 label{display:flex;gap:9px;align-items:center;font-size:13px;color:var(--ink-2);cursor:pointer}
.pre{background:var(--alt);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;font-size:13px;margin-bottom:10px}
.pre .lb{font-size:10.5px;font-family:var(--mono);color:var(--ink-3);letter-spacing:.06em;display:block;margin-bottom:3px}

/* Next */
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
.run{display:flex;gap:15px;align-items:center;padding:8px 2px}
.run .t{font-size:15px;font-weight:600}
.run .d{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.route{display:flex;gap:14px;align-items:flex-start;border:1px solid;border-radius:var(--r-md);padding:17px 19px}
.route.stp{border-color:var(--ok-line);background:var(--ok-bg)}
.route.auth{border-color:var(--warn-line);background:var(--warn-bg)}
.route.warn{border-color:var(--warn-line);background:var(--warn-bg)}
.route .ic{font-size:24px;line-height:1;flex:none}
.route .t{font-size:17px;font-weight:600}
.route.stp .t{color:var(--ok)}.route.auth .t,.route.warn .t{color:var(--warn)}
.route .d{font-size:13.5px;color:var(--ink-2);margin-top:5px}

let RULES=[],FIELDS=[],CHECK=[],DEFECTS=[];

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function reset(scn){
  RULES=R0.map(r=>Object.assign({},r,{st:''}));
  FIELDS=F0.map(f=>Object.assign({},f));
  CHECK=CK0.map(c=>Object.assign({},c,{on:0}));
  DEFECTS=[];S.sync={sel:{}};S.route=null;S.busy=0;S.pullAt='';S.dseq=0;S.expand=0;
  S.noGtee = scn==='stp'?1:0;
  FLAGS.forEach(f=>{f.on=(scn==='manual'&&f.k==='FBR')?1:0;});
}

const rTotal=()=>RULES.length;
const rPass=()=>RULES.filter(r=>r.pass).length;
const rPend=()=>RULES.filter(r=>!r.pass&&r.st==='pending');
const rFail=()=>RULES.filter(r=>!r.pass&&r.st!=='pending');
const rSettled=()=>rTotal()-rPend().length;
const usedJust=()=>RULES.filter(r=>r.act==='just').length;
const rulesOK=()=>rFail().length===0&&rPend().length===0;
const hasDefect=r=>DEFECTS.some(d=>d.rule===r.id);
const unlinked=()=>rFail().filter(r=>!hasDefect(r));

function fState(f){const s=(f.sys||'').trim(),o=(f.ocr||'').trim();
  if(!o)return 'noocr'; if(!s)return 'fill'; return s===o?'same':'diff';}
const fMissing=()=>FIELDS.filter(f=>f.req&&!(f.sys||'').trim());
const fFilled=()=>FIELDS.filter(f=>(f.sys||'').trim()).length;
const ckOn=()=>CHECK.filter(c=>c.on).length;
const ckMand=()=>CHECK.filter(c=>c.g==='Mandatory');
const ckMandOn=()=>ckMand().filter(c=>c.on).length;
const canNext=()=>fMissing().length===0 && ckMandOn()===ckMand().length;

function pullRules(){
  const n=rPend().length; rPend().forEach(r=>{r.pass=1;r.st='';});
  S.pullAt=new Date().toTimeString().slice(0,5);
  return n?`${n} rule(s) re-extracted, conclusion updated`:'No change in rule conclusions';
}
function mkDefect(r,src){
  if(hasDefect(r))return null;
  S.dseq++;
  DEFECTS.push({no:String(S.dseq),rule:r.id,code:r.dc,cat:r.dcat,type:r.dty,file:r.file,
    sr:'',cr:r.issue||r.nm,src:src||'System',rect:0,ver:0,cd:'30-08-2026 09:02:31'});
  return S.dseq;
}
function eligibility(){
  const fo=FLAGS.filter(f=>f.on&&f.stp);
  const items=[
    {ok:!fo.length,nm:'No non-standard case flags',d:fo.map(f=>f.k).join(', ')},
    {ok:!!S.noGtee,nm:'No guarantor',d:'Guarantor LIM AH KOW present'},
    {ok:1,nm:'Customer type is Individual',d:''},
    {ok:1,nm:'Product code in STP whitelist',d:''},
    {ok:1,nm:'Panel dealer',d:''},
    {ok:1,nm:'Loan amount within cap',d:''},
    {ok:rulesOK(),nm:'All rules passed',d:rFail().length+' not passed'},
    {ok:DEFECTS.length===0,nm:'No defect record',d:DEFECTS.length+' defect(s)'},
    {ok:usedJust()===0,nm:'No justification used',d:usedJust()+' justified'},
    {ok:AGE_DAYS<=AGE_CAP,nm:`Case age within ${AGE_CAP} days`,d:`${AGE_DAYS} days`}
  ];
  return {items,ok:items.every(i=>i.ok),blockers:items.filter(i=>!i.ok)};
}

const NAV=[

  ['Data Maintenance',[['appsum','Application Summary'],['hirer','Hirer/Guarantor Info'],['fac','Facility Information'],

];

function renderRail(){
  let h=`<div class="navcard"><div class="nh">☰ Navigation</div>`;
  NAV.forEach(([g,items])=>{
    h+=`<h6>${g}</h6>`;
    items.forEach(([k,nm,kind])=>{
      let c='';
      if(kind==='v') c=`<span class="n ${rulesOK()?'ok':'err'}">${rulesOK()?'✓':rFail().length}</span>`;
      if(kind==='d') c=`<span class="n ${DEFECTS.length?'err':''}">${DEFECTS.length}</span>`;
      if(kind==='c') c=`<span class="n ${ckMandOn()===ckMand().length?'ok':''}">${ckOn()}/${CHECK.length}</span>`;
      h+=`<button data-go="${k}" class="${S.nav===k?'on':''}"><span>${nm}</span>${c}</button>`;
    });
  });
  h+=`</div><div class="linkcard"><a data-link="fc">Attachment</a><a>CRA Report</a><a class="off">E-acceptance</a></div>`;
  $('rail').innerHTML=h;
}

function mod(k,icon,title,body,right,badge,isnew){
  const o=!!S.open[k];
  return `<div class="mod ${body?'':'stub'}" id="m-${k}">

      <span class="car">${o?'⌄':'›'}</span><span class="mi">${icon}</span><span class="mt">${title}</span>
      ${isnew?'<span class="new">NEW</span>':''}${badge||''}
      <span class="mr">${right||''}</span></div>
    ${o&&body?`<div class="mod-b">${body}</div>`:''}</div>`;
}

function vsumBody(){
  const fl=rFail(),pd=rPend(),ok=rulesOK(),ul=unlinked().length;
  const kpi=(v,k,cls,sub)=>`<div class="kp"><div class="v ${cls||''}">${v}</div>
    <div class="k">${k}${sub?`<span class="ks">${sub}</span>`:''}</div></div>`;
  const st=ok?'All rules passed':(fl.length?`${fl.length} rule(s) not passed`:`${pd.length} re-extracting`);
  return `<div class="vs-top">
      <span><div class="st ${ok?'ok':(fl.length?'warn':'wait')}">${st}</div>
        <div class="sd">Rule opinions archived at ${S.archAt} in File Center${S.pullAt?` · Last refresh ${S.pullAt}`:''}</div></span>
      <span class="r">
        <button class="btn btn-sm" data-act="refresh" ${S.busy?'disabled':''}>${S.busy?'Refreshing…':'⟳ Refresh Rules'}</button>
        <button class="btn btn-sm btn-pri" data-link="fc">Open File Center</button></span>
    </div>
    <div class="kpis">
      ${kpi(`${ckMandOn()}/${ckMand().length}`,'Mandatory Docs',ckMandOn()>=ckMand().length?'ok':'err')}
      ${kpi(UPLOADED,'Uploaded Files')}
      ${kpi(rTotal(),'Total Rules')}
      ${kpi(rSettled(),'Concluded','',pd.length?`${pd.length} in progress`:'')}
      ${kpi(rPass(),'Passed','ok')}
      ${kpi(fl.length,'Not Passed',fl.length?'err':'',ul?`${ul} without defect`:'')}
    </div>
    <button class="btn btn-sm" data-act="expand">${S.expand?'Collapse detail':'View detail'}</button>
    ${S.expand?`<div style="margin-top:14px">
      ${ul>1?`<div class="batchbar"><span>${ul} rule(s) not passed without a defect record</span>
        <button class="btn btn-sm" data-act="defall">Create All (${ul})</button></div>`:''}
      ${[...fl,...pd].length?[...fl,...pd].map(r=>{
        const p=r.st==='pending',d=DEFECTS.find(x=>x.rule===r.id);
        return `<div class="rrow"><span class="n"><b class="mono">${r.id}</b> ${esc(r.nm)}
          <span class="s">${esc(r.file)}${r.issue?' · '+esc(r.issue):''}</span></span>
          <span class="r"><span class="tag ${p?'tag-blue':'tag-err'}">${p?'In progress':'Not passed'}</span>
          ${p?'':(d?`<span class="tag tag-warn mono">Defect #${d.no}</span><button class="btn btn-sm" data-go="def">View</button>`
                  :`<button class="btn btn-sm" data-mkdef="${r.id}">Create Defect</button>`)}
          <button class="btn btn-sm" data-fix="${r.id}" ${p?'disabled':''}>Open in File Center</button></span></div>`;
      }).join(''):`<div class="muted">All ${rTotal()} rules passed.</div>`}
    </div>`:''}`;
}

function defBody(){

  return `<div class="tot"><span class="t">Total: <b>${DEFECTS.length}</b> defect(s)${unlinked().length?` · ${unlinked().length} rule(s) still unlinked`:''}</span>
    <span class="r"><button class="btn btn-pri btn-sm" data-act="adddef">Add Defect</button></span></div>
  <div class="tw"><table style="min-width:1080px"><thead><tr><th style="width:56px">NO.</th><th style="width:80px">SOURCE</th>
    <th style="width:76px">RULE</th><th style="width:110px">DEFECT CODE</th><th style="width:180px">CATEGORY</th>
    <th style="width:190px">TYPE</th><th style="width:90px">RECTIFIED</th><th style="width:80px">VERIFIED</th>
    <th style="width:150px">CRA REMARK</th><th style="width:120px">ACTION</th></tr></thead>

    <td class="mono">${esc(d.rule||'—')}</td><td class="mono">${esc(d.code||'—')}</td>
    <td style="font-size:12px">${esc(d.cat)}</td><td style="font-size:12px">${esc(d.type)}</td>
    <td>${d.rect?'<span class="tag tag-ok">Y</span>':'<span class="tag tag-err">N</span>'}</td>
    <td>${d.ver?'<span class="tag tag-ok">Y</span>':'<span class="tag">N</span>'}</td>
    <td style="font-size:12px">${esc(d.cr)}</td>
    <td>${d.rect&&d.ver?'<span class="muted">Closed</span>'
      :d.rect?`<button class="btn btn-sm" data-ver="${d.no}">Verify</button>`
      :`<button class="btn btn-sm" data-rect="${d.no}">Rectify</button>`}</td></tr>`).join('')}
  </tbody></table></div>`;
}

function chkBody(){
  const grps=['Mandatory','Conditional','Optional'];
  return `<div class="chk-h">Checked: <b>${ckOn()} / ${CHECK.length}</b>
    ${ckMandOn()<ckMand().length?` · <span style="color:var(--err)">${ckMand().length-ckMandOn()} mandatory outstanding</span>`:''}</div>
    ${grps.map(g=>`<div class="chk-grp">${g}</div><div class="chk-grid">
      ${CHECK.filter(c=>c.g===g).map(c=>`<label class="ck ${c.on?'on':''}" data-ck="${esc(c.k)}">
        <span class="bx">${c.on?'✓':''}</span><span>${esc(c.k)}</span></label>`).join('')}
    </div>`).join('')}`;
}

function dmBody(grp){
  const gs=[].concat(grp);
  const fs=FIELDS.filter(f=>gs.includes(f.g));
  if(!fs.length) return `<div class="muted">Not implemented in this prototype.</div>`;
  const sub=gs.length>1;
  const block=g=>`${sub?`<div class="fgrp">${esc(g)}</div>`:''}<div class="fgrid">${FIELDS.filter(f=>f.g===g).map(f=>{
    const miss=f.req&&!(f.sys||'').trim(), st=fState(f);
    return `<div class="fld"><label>${esc(f.k)}${f.req?'<span class="req"> *</span>':''}</label>
      <input class="fin ${miss?'bad':''}" data-fld="${esc(f.k)}" value="${esc(f.sys)}" placeholder="${miss?'Required':''}">
      <span class="fhint ${st==='diff'?'diff':''}">${(f.ocr||'').trim()
        ? 'OCR: '+esc(f.ocr)+(st==='diff'?'  (differs)':'') : 'OCR: —'}</span></div>`;
  }).join('')}</div>`;
  return gs.map(block).join('')+
  `<div style="margin-top:14px"><button class="btn btn-sm btn-pri" data-act="sync">Sync from OCR</button></div>`;
}

function renderMain(){
  let h='';
  NAV.forEach(([g,items])=>{
    h+=`<div class="seclabel">${g}</div>`;
    items.forEach(([k,nm])=>{
      if(k==='vsum'){
        const b=rulesOK()?`<span class="badge ok">✓</span>`:`<span class="badge err">${rFail().length}</span>`;
        h+=mod(k,'◈','Verification Summary',vsumBody(),
          `<button class="btn btn-sm" data-tog="vsum">${S.open.vsum?'Collapse':'Expand'}</button>`,b,1);
      }else if(k==='def'){
        h+=mod(k,'⚠','Defect List',defBody(),
          `<button class="btn btn-sm" data-tog="def">${S.open.def?'Collapse':'Expand'}</button>`,
          DEFECTS.length?`<span class="badge err">${DEFECTS.length}</span>`:'');
      }else if(k==='chk'){
        h+=mod(k,'☑','File Check List',chkBody(),
          `<button class="btn btn-sm" data-tog="chk">${S.open.chk?'Collapse':'Expand'}</button>`,
          ckMandOn()<ckMand().length?`<span class="badge err">${ckMand().length-ckMandOn()}</span>`:`<span class="badge ok">✓</span>`);
      }else{
        const map={fis:'Collateral Info',fac:'Facility Information',dealer:'Seller Info',hirer:'Hirer Info'};
        const grp={fis:['Collateral Info','Insurance Info'],fac:'Facility Info',dealer:'Seller Info',hirer:'Hirer Info'}[k];
        const icons={appsum:'▤',hirer:'⚇',fac:'▥',dealer:'▣',fis:'◈',appr:'✓',
          dsum:'▤',tmaint:'✎',treview:'▦',mdlog:'☰',tlog:'▧',tools:'⚙'};
        const right = k==='dealer'?'<span class="btn btn-txt" style="font-size:13px">⟳ Re-query</span>':'';
        h+=mod(k,icons[k]||'▤',nm,grp?dmBody(grp):'',right);
      }
    });
  });
  $('main').innerHTML=h;
}

function renderSide(){
  let h=`<div class="sc"><div class="sh"><span>LOU Renewal</span><span class="cnt">16</span></div>`;
  FLAGS.forEach((f,i)=>{h+=`<label class="fl ${f.on?'on':''}" data-flag="${i}"><span class="bx">${f.on?'✓':''}</span><span>${f.k}</span></label>`;});
  h+=`<div class="sdiv"></div>
    <div class="yn"><span>Customer Deleted</span><span class="ynseg">
      <button data-yn="custDel|Yes" aria-pressed="${S.custDel==='Yes'}">Yes</button>
      <button data-yn="custDel|No" aria-pressed="${S.custDel==='No'}">No</button></span></div>
    <div class="yn"><span>Full Maintenance</span><span class="ynseg">
      <button data-yn="fullMt|Yes" aria-pressed="${S.fullMt==='Yes'}">Yes</button>
      <button data-yn="fullMt|No" aria-pressed="${S.fullMt==='No'}">No</button></span></div>
    <div class="yn"><span>CRA Remark</span><span class="btn btn-txt">Edit</span></div>
    <div class="muted">—</div></div>`;
  h+=`<div class="sc">
    ${[['App. Ref. No.','BKI/HP/2026/Y0063327'],['Product Code','FINP'],
       ['Status','Pending Checking and Maintenance'],['Applicant Name','TAN WEI MING'],
       ['Guarantor',S.noGtee?'—':'LIM AH KOW'],['Case Age',AGE_DAYS+' days']]
      .map(([k,v])=>`<div class="kv"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('')}
    <div style="text-align:center;color:var(--ink-4);margin-top:8px">⌄</div></div>`;
  $('side').innerHTML=h;
}

function renderFoot(){
  const ok=canNext(),left=[];
  if(fMissing().length) left.push(`${fMissing().length} required field(s) empty`);
  if(ckMandOn()<ckMand().length) left.push(`${ckMand().length-ckMandOn()} mandatory doc(s) unchecked`);
  const note=S.route?(S.route.ok?'Disbursement triggered via STP':'Routed to Authorizer'):(ok?'':left.join(' · '));
  $('foot').innerHTML=`<select><option>-Select-</option><option>Reassign</option><option>Hold</option></select>
    <span class="fn">${note}</span>
    <span class="r"><button class="btn">Save</button><button class="btn">Exit Application</button>
      <button class="btn">To CRA Defect</button><button class="btn">To Sales Defect</button>
      <button class="btn btn-pri" data-act="next" ${ok?'':'disabled'}
        title="${ok?'Submit':'Complete required content first'}">Next</button></span>`;
}

/* ═══ MODALS ═══ */
function openM(cls,title,sub,warn){
  $('modal').className='modal'+(cls?' '+cls:'');
  $('mT').innerHTML=title+'<button class="x" data-act="mx">✕</button>';
  $('mSub').innerHTML=(sub?`<div class="msub">${sub}</div>`:'')+(warn?`<div class="mwarn">${warn}</div>`:'');
  $('mask').classList.remove('hidden');
}
function closeM(){$('mask').classList.add('hidden');S.dlg=null;}

/* OCR Data Sync */
const syncable=f=>fState(f)!=='noocr';
function openSync(){
  FIELDS.forEach(f=>{if(S.sync.sel[f.k]===undefined){const st=fState(f);S.sync.sel[f.k]=(st==='same'||st==='fill')?1:0;}});
  S.dlg='sync'; openM('','OCR Data Sync','Comparing manual entry with detected document data.',
    'Selecting a checkbox means applying the OCR value to replace the current manual value.');
  drawSync();
}
function drawSync(){
  const grps=[...new Set(FIELDS.map(f=>f.g))];
  let h='';
  grps.forEach(g=>{
    const gf=FIELDS.filter(f=>f.g===g&&syncable(f));
    const all=gf.length&&gf.every(f=>S.sync.sel[f.k]);
    h+=`<div class="sync-g">${g}</div><div class="tw" style="border:0"><table class="syn">
      <thead><tr><th style="width:44px"><span class="bx ${all?'on':''}" data-gsel="${esc(g)}">${all?'✓':''}</span></th>
        <th style="width:210px">Field Name</th><th style="width:200px">Current (Manual)</th>
        <th>OCR Value</th><th style="width:100px;text-align:right">Status</th></tr></thead><tbody>`;
    FIELDS.filter(f=>f.g===g).forEach(f=>{
      const st=fState(f),on=!!S.sync.sel[f.k];
      if(st==='noocr'){
        h+=`<tr class="na"><td><span class="bx dis"></span></td><td>${esc(f.k)}</td>
          <td>${(f.sys||'').trim()?esc(f.sys):'<span class="emptyv">(Empty)</span>'}</td>
          <td><span class="emptyv">—</span></td><td style="text-align:right"><span class="st">NO OCR</span></td></tr>`;
      }else{
        h+=`<tr class="${on?'sel':''}"><td><span class="bx ${on?'on':''}" data-sel="${esc(f.k)}">${on?'✓':''}</span></td>
          <td>${esc(f.k)}</td>
          <td>${(f.sys||'').trim()?esc(f.sys):'<span class="emptyv">(Empty)</span>'}</td>
          <td>${esc(f.ocr)}</td>
          <td style="text-align:right"><span class="st ${st==='diff'?'cf':''}">${st==='diff'?'CONFLICT':'SYNC OK'}</span></td></tr>`;
      }
    });
    h+='</tbody></table></div>';
  });
  const n=FIELDS.filter(f=>syncable(f)&&S.sync.sel[f.k]).length;
  $('mB').innerHTML=h;
  $('mF').innerHTML=`<span class="lf">${n} field(s) selected</span>
    <button class="btn" data-act="mx">Cancel</button>
    <button class="btn btn-pri" data-act="dosync">Apply</button>`;
}
function doSync(){
  let n=0; FIELDS.forEach(f=>{if(syncable(f)&&S.sync.sel[f.k]&&(f.ocr||'').trim()){f.sys=f.ocr;n++;}});
  closeM();render();toast(`${n} field(s) updated from OCR`);
}

/* Add Defect */
function openAdd(){
  S.dlg='add'; S.addDef={cat:'',ty:'',rect:0,ver:0,sr:'',cr:''};
  openM('sm','Add Defect'); drawAdd();
}
function drawAdd(){
  const a=S.addDef;
  $('modal').className='modal';
  $('mB').innerHTML=`<div class="dgrid">
    <div class="dfield"><label>Defect Category <span class="req">*</span></label>
      <select class="dsel" id="aCat"><option value=""></option>
        ${DCATS.map(c=>`<option ${a.cat===c?'selected':''}>${c}</option>`).join('')}</select></div>
    <div class="dfield"><label>Defect Type <span class="req">*</span></label>
      <select class="dsel" id="aTy"><option value=""></option>
        ${[...new Set(R0.map(r=>r.dty))].map(t=>`<option ${a.ty===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div>
    <div class="dfield"><label>Rectified</label>
      <label class="dchk" data-atg="rect"><span class="bx ${a.rect?'on':''}">${a.rect?'✓':''}</span>Mark as Rectified</label></div>
    <div class="dfield"><label>Verified</label>
      <label class="dchk" data-atg="ver"><span class="bx ${a.ver?'on':''}">${a.ver?'✓':''}</span>Mark as Verified</label></div>
    <div class="dfield"><label>Rectified Date</label>
      <input class="ddate" placeholder="Select date" ${a.rect?'':'disabled'} value="${a.rect?'30-08-2026':''}"></div>
    <div class="dfield"><label>Verified Date</label>
      <input class="ddate" placeholder="Select date" ${a.ver?'':'disabled'} value="${a.ver?'30-08-2026':''}"></div>
    <div class="dfield dfull" style="max-width:50%"><label>Create Date <span class="req">*</span></label>
      <input class="ddate" value="30-08-2026 09:02:31" disabled></div>
    <div class="dfield dfull"><label>Sales Remark</label>
      <textarea class="dta" id="aSr" maxlength="500" placeholder="Enter Sales Remark">${esc(a.sr)}</textarea>
      <div class="dcount"><span id="aSrN">${a.sr.length}</span> / 500</div></div>
    <div class="dfield dfull"><label>CRA Remark</label>
      <textarea class="dta" id="aCr" maxlength="500" placeholder="Enter CRA Remark">${esc(a.cr)}</textarea>
      <div class="dcount"><span id="aCrN">${a.cr.length}</span> / 500</div></div>
  </div>`;
  $('mF').innerHTML=`<button class="btn" data-act="mx">Cancel</button>
    <button class="btn btn-pri" data-act="doadd">OK</button>`;
}
function doAdd(){
  const cat=$('aCat').value, ty=$('aTy').value;
  if(!cat||!ty){toast('Defect Category and Type are required');return;}
  S.dseq++;
  DEFECTS.push({no:String(S.dseq),rule:'',code:'—',cat,type:ty,file:'—',
    sr:$('aSr').value.trim(),cr:$('aCr').value.trim(),src:'User',
    rect:S.addDef.rect?1:0,ver:S.addDef.ver?1:0,cd:'30-08-2026 09:02:31'});
  closeM();S.open.def=1;render();toast('Defect #'+S.dseq+' created (Source: User)');
}

/* File Center rule handling */
function openFix(id){
  const r=RULES.find(x=>x.id===id); if(!r) return;
  S.dlg={id,pick:null,who:'self',note:'',bad:0};
  openM('fcx','<span class="fcb">FILE CENTER</span>Rule Handling'); drawFix();
}
function drawFix(){
  const d=S.dlg,r=RULES.find(x=>x.id===d.id);
  $('modal').className='modal fcx';
  $('mB').innerHTML=`<div class="pre"><span class="lb">RULE</span><b class="mono">${r.id}</b> ${esc(r.nm)}
      <div class="muted" style="margin-top:3px">${esc(r.file)}</div></div>
    ${r.issue?`<div class="pre"><span class="lb">REASON</span>${esc(r.issue)}</div>`:''}
    <div class="opt ${d.pick==='file'?'on':''}" data-pick="file"><span class="rb"></span>
      <span><span class="on2">Replace document</span>
        ${d.pick==='file'?`<div class="sub2">
          <label><input type="radio" name="who" ${d.who==='self'?'checked':''} data-who="self"><span>CRA replaces it now</span></label>
          <label><input type="radio" name="who" ${d.who==='sales'?'checked':''} data-who="sales"><span>Return to Sales to replace</span></label>
        </div>`:''}</span></div>
    <div class="opt ${d.pick==='just'?'on':''}" data-pick="just"><span class="rb"></span>
      <span><span class="on2">Justification</span></span></div>
    ${(d.pick==='just'||(d.pick==='file'&&d.who==='sales'))
      ? `<div class="dfield" style="margin-top:12px"><label>${d.pick==='just'?'Justification reason':'Note to Sales'} <span class="req">*</span></label>
         <textarea class="dta" id="mNote" style="min-height:80px;border-color:${d.bad?'var(--err)':'#d6d9de'}">${esc(d.note)}</textarea></div>`:''}`;
  $('mF').innerHTML=`<button class="btn" data-act="mx">Cancel</button>
    <button class="btn btn-pri" ${d.pick?'':'disabled'} data-act="dofix">Confirm</button>`;
}
function doFix(){
  const d=S.dlg,r=RULES.find(x=>x.id===d.id);
  const ta=$('mNote'); if(ta)d.note=ta.value.trim();
  if((d.pick==='just'||(d.pick==='file'&&d.who==='sales'))&&!d.note){d.bad=1;drawFix();toast('A note is required');return;}
  if(d.pick==='just'){r.pass=1;r.act='just';toast('Justified — rule marked as passed');}
  else{r.st='pending';r.act='file';
    toast(d.who==='self'?'Document replaced — re-extraction in progress':'Returned to Sales for replacement');}
  closeM();render();
}

/* Next */
function openNext(){
  S.dlg='next';S.phase='check';S.route=null;
  openM('sm','Submit'); drawNext();
  setTimeout(()=>{ if(S.dlg!=='next')return;
    const ul=unlinked();
    if(ul.length){S.phase='warn';S.blocks=ul;drawNext();return;}
    goSave();},700);
}
function goSave(){
  S.phase='save';drawNext();
  setTimeout(()=>{ if(S.dlg!=='next')return;
    const e=eligibility();
    S.route={ok:e.ok,reasons:e.blockers.map(i=>i.nm+(i.d?' ('+i.d+')':''))};
    S.phase='done';drawNext();},700);
}
function drawNext(){
  $('modal').className='modal';
  const step=n=>`<div class="steps">${['① Pre-submit check','② Save','③ STP eligibility','④ Route']
    .map((s,i)=>i+1<=n?`<b>${s}</b>`:s).join('  ·  ')}</div>`;
  if(S.phase==='check'||S.phase==='save'){
    const sv=S.phase==='save';
    $('mB').innerHTML=`<div class="run"><div class="spin"></div>
      <div><div class="t">${sv?'Saving and evaluating STP eligibility…':'Checking rules against defect records…'}</div>
      <div class="d">${sv?'Maintenance content saved, then eligibility rules run':'Comparing via the rule–defect mapping'}</div></div></div>${step(sv?2:1)}`;
    $('mF').innerHTML=''; return;
  }
  if(S.phase==='warn'){
    $('mB').innerHTML=`<div class="route warn"><span class="ic">⚠</span>
      <span><div class="t">${S.blocks.length} rule(s) not passed without a defect record</div>
      <div class="d">Registering them as defects is your call — this check does not block submission.</div></span></div>
      <div class="rsn"><div class="l">UNLINKED RULES</div>
        ${S.blocks.map(r=>`<div class="i">· <b class="mono">${r.id}</b> ${esc(r.nm)} — ${esc(r.dc)}</div>`).join('')}</div>${step(1)}`;
    $('mF').innerHTML=`<button class="btn" data-act="backfix">Go back</button>
      <button class="btn" data-act="warndef">Create all and continue</button>
      <button class="btn btn-pri" data-act="anyway">Submit anyway</button>`;
    return;
  }
  const r=S.route;
  $('mB').innerHTML=(r.ok
    ? `<div class="route stp"><span class="ic">⚡</span><span><div class="t">Eligible for STP</div>
       <div class="d">Authorizer is skipped. Submitting triggers the disbursement interface directly.</div></span></div>
       <div class="flow"><span class="a">ROUTE</span>CRA　→　<b>Disbursement Interface</b></div>`
    : `<div class="route auth"><span class="ic">⇄</span><span><div class="t">Routed to Authorizer</div>
       <div class="d">This case is not eligible for STP and needs manual authorisation.</div></span></div>
       <div class="rsn"><div class="l">NOT ELIGIBLE BECAUSE</div>
         ${r.reasons.map(x=>`<div class="i">· ${esc(x)}</div>`).join('')}</div>
       <div class="flow"><span class="a">ROUTE</span>CRA　→　<b>Authorizer</b>　→　Disbursement Interface</div>`)+step(4);
  $('mF').innerHTML=`<button class="btn" data-act="mx">Back</button>
    <button class="btn btn-pri" data-act="confirm">${r.ok?'Confirm Disbursement':'Confirm Submit'}</button>`;
}

function toast(t){const m=$('msg');m.querySelector('span').textContent=t;m.classList.add('on');
  clearTimeout(m._t);m._t=setTimeout(()=>m.classList.remove('on'),2300);}

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='aSr'){S.addDef.sr=t.value;$('aSrN').textContent=t.value.length;}
  if(t.id==='aCr'){S.addDef.cr=t.value;$('aCrN').textContent=t.value.length;}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.fld){
    const f=FIELDS.find(x=>x.k===t.dataset.fld); if(!f)return;
    f.sys=t.value.trim(); renderRail(); renderFoot();
    t.classList.toggle('bad',!!(f.req&&!f.sys)); return;
  }
});
document.addEventListener('click',e=>{
  const t=e.target.closest('button,a,label,[data-sel],[data-gsel],[data-who],[data-pick],[data-tog]');
  if(!t) return;
  if(t.dataset.who){S.dlg.who=t.dataset.who;S.dlg.bad=0;drawFix();return;}
  if(t.dataset.scn){S.scn=t.dataset.scn;reset(t.dataset.scn);render();return;}
  if(t.dataset.go){const k=t.dataset.go;S.nav=k;S.open[k]=1;render();
    const el=$('m-'+k); if(el)el.scrollIntoView({block:'start'}); return;}
  if(t.dataset.tog){const k=t.dataset.tog;S.open[k]=!S.open[k];S.nav=k;render();return;}
  if(t.dataset.link==='fc'){toast('Opening File Center');return;}
  if(t.dataset.act==='expand'){S.expand=!S.expand;render();return;}
  if(t.dataset.flag!==undefined){FLAGS[+t.dataset.flag].on=FLAGS[+t.dataset.flag].on?0:1;renderSide();return;}
  if(t.dataset.yn){const[k,v]=t.dataset.yn.split('|');S[k]=v;renderSide();return;}
  if(t.dataset.ck){const c=CHECK.find(x=>x.k===t.dataset.ck);c.on=c.on?0:1;render();return;}

  if(t.dataset.act==='refresh'){
    if(S.busy)return; S.busy=1;renderMain();
    setTimeout(()=>{S.busy=0;const m=pullRules();render();toast(m);},800); return;
  }
  if(t.dataset.mkdef){const r=RULES.find(x=>x.id===t.dataset.mkdef);const n=mkDefect(r,'System');
    render();toast(n?'Defect #'+n+' created':'This rule already has a defect');return;}
  if(t.dataset.act==='defall'){const m=unlinked().map(r=>mkDefect(r,'System')).filter(Boolean);
    render();toast(m.length+' defect(s) created');return;}
  if(t.dataset.act==='adddef'){openAdd();return;}
  if(t.dataset.atg){S.addDef[t.dataset.atg]=S.addDef[t.dataset.atg]?0:1;
    S.addDef.sr=$('aSr').value;S.addDef.cr=$('aCr').value;
    S.addDef.cat=$('aCat').value;S.addDef.ty=$('aTy').value;drawAdd();return;}
  if(t.dataset.act==='doadd'){doAdd();return;}
  if(t.dataset.rect){DEFECTS.find(x=>x.no===t.dataset.rect).rect=1;render();toast('Marked as rectified');return;}
  if(t.dataset.ver){DEFECTS.find(x=>x.no===t.dataset.ver).ver=1;render();toast('Verified');return;}

  if(t.dataset.fix){openFix(t.dataset.fix);return;}
  if(t.dataset.pick){S.dlg.pick=t.dataset.pick;S.dlg.bad=0;
    const ta=$('mNote'); if(ta)S.dlg.note=ta.value; drawFix();return;}
  if(t.dataset.act==='dofix'){doFix();return;}

  if(t.dataset.act==='sync'){openSync();return;}
  if(t.dataset.sel){S.sync.sel[t.dataset.sel]=!S.sync.sel[t.dataset.sel];drawSync();return;}
  if(t.dataset.gsel){const g=t.dataset.gsel,gf=FIELDS.filter(f=>f.g===g&&syncable(f));
    const all=gf.every(f=>S.sync.sel[f.k]); gf.forEach(f=>S.sync.sel[f.k]=all?0:1); drawSync();return;}
  if(t.dataset.act==='dosync'){doSync();return;}

  if(t.dataset.act==='next'){openNext();return;}
  if(t.dataset.act==='backfix'){closeM();S.open.vsum=1;S.expand=1;render();
    const el=$('m-vsum'); if(el)el.scrollIntoView({block:'start'}); return;}
  if(t.dataset.act==='warndef'){S.blocks.forEach(r=>mkDefect(r,'System'));renderRail();goSave();return;}
  if(t.dataset.act==='anyway'){goSave();return;}
  if(t.dataset.act==='confirm'){const ok=S.route.ok;closeM();render();
    toast(ok?'Disbursement interface triggered':'Submitted to Authorizer');return;}
  if(t.dataset.act==='mx'){closeM();renderFoot();return;}
});

reset('manual'); render();
})();
</script>
